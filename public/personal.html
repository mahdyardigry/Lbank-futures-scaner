<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Personal MA20 Radar</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#080c12;
  color:#e8eef7;
  font-family:Tahoma,Arial,sans-serif;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.header{
  padding:18px 14px;
  background:linear-gradient(135deg,#101925,#0b111a);
  border-bottom:1px solid #202c3a;
}

.header h1{
  margin:0 0 8px;
  font-size:21px;
}

.header p{
  margin:0;
  color:#91a0b3;
  font-size:12px;
}

.toolbar{
  padding:12px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  background:#0b1119;
  border-bottom:1px solid #20202b;
}

.toolbar button{
  border:1px solid #273548;
  background:#111a25;
  color:#dce7f5;
  padding:9px 13px;
  border-radius:9px;
}

.toolbar button.active{
  background:#174e35;
  border-color:#2ca968;
}

.status{
  padding:10px 13px;
  font-size:12px;
  color:#9caabd;
  border-bottom:1px solid #1b2532;
}

.status strong{
  color:#5ee69b;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:12px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:10px 0;
}

.section-title h2{
  margin:0;
  font-size:16px;
}

.counter{
  color:#8d9aae;
  font-size:12px;
}

.signals{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:10px;
}

.empty{
  padding:35px 15px;
  text-align:center;
  background:#0d141e;
  border:1px dashed #293747;
  border-radius:12px;
  color:#7f8da0;
}

.signal{
  background:#0d141e;
  border:1px solid #263344;
  border-radius:13px;
  padding:13px;
  position:relative;
  overflow:hidden;
}

.signal.long{
  border-color:#1f8d59;
}

.signal.short{
  border-color:#a14343;
}

.signal.current{
  box-shadow:0 0 0 2px #f0b84b33;
}

.signal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.symbol{
  font-size:18px;
  font-weight:bold;
}

.badge{
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.badge.long{
  background:#123e2b;
  color:#62e6a1;
}

.badge.short{
  background:#4a1d1d;
  color:#ff8c8c;
}

.badge.wait{
  background:#302a16;
  color:#e6c76c;
}

.signal-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.metric{
  background:#101923;
  border-radius:8px;
  padding:8px;
}

.metric small{
  display:block;
  color:#758397;
  font-size:10px;
  margin-bottom:4px;
}

.metric b{
  font-size:13px;
}

.ma{
  color:#67c7ff;
}

.time{
  color:#9caabd;
  font-size:11px;
  margin-top:10px;
}

.signal-actions{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.signal-actions button{
  flex:1;
  border:1px solid #29394d;
  background:#121d29;
  color:#e8eef7;
  padding:9px;
  border-radius:8px;
}

.signal-actions button:hover{
  background:#192838;
}

#deepPanel{
  display:none;
  position:fixed;
  inset:0;
  z-index:50;
  background:#070b10ee;
  overflow:auto;
}

.deep{
  max-width:1100px;
  margin:20px auto;
  padding:12px;
}

.deep-head{
  background:#0d141e;
  border:1px solid #293748;
  border-radius:13px;
  padding:14px;
  position:sticky;
  top:8px;
  z-index:3;
}

.deep-head-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.close{
  background:#3a1d1d;
  color:#ffaaaa;
  border:1px solid #6d3535;
  border-radius:8px;
  padding:8px 12px;
}

.deep-title{
  font-size:19px;
  font-weight:bold;
}

.deep-sub{
  color:#8290a2;
  font-size:11px;
  margin-top:5px;
}

.deep-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:10px;
  margin-top:10px;
}

.panel{
  background:#0d141e;
  border:1px solid #263445;
  border-radius:12px;
  padding:12px;
}

.panel h3{
  margin:0 0 10px;
  font-size:14px;
  color:#dbe6f3;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:6px 0;
  border-bottom:1px solid #18222e;
  font-size:12px;
}

.row:last-child{
  border-bottom:0;
}

.label{
  color:#7f8c9e;
}

.value{
  text-align:left;
  direction:ltr;
}

.reason{
  background:#111c28;
  border-radius:7px;
  padding:7px;
  margin:5px 0;
  font-size:11px;
  color:#bdc9d7;
}

.wall{
  padding:8px;
  background:#111a24;
  border-radius:8px;
  margin:5px 0;
  font-size:11px;
}

.loading{
  text-align:center;
  padding:35px;
  color:#8b99aa;
}

.toast{
  position:fixed;
  left:12px;
  bottom:12px;
  z-index:100;
  background:#152131;
  border:1px solid #32455b;
  border-radius:10px;
  padding:10px 13px;
  display:none;
  max-width:330px;
  font-size:12px;
}

@media(max-width:600px){
  .deep{
    margin:5px auto;
  }

  .deep-head{
    top:0;
    border-radius:8px;
  }

  .signals{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="header">
  <h1>🎯 رادار شخصی MA20</h1>
  <p>شکار برخورد قیمت با MA20 تایم‌فریم ۱ دقیقه</p>
</div>

<div class="toolbar">
  <button id="startBtn" class="active" onclick="startRadar()">▶ شروع رادار</button>
  <button onclick="stopRadar()">⏸ توقف</button>
  <button onclick="scanNow()">🔄 بررسی دستی</button>
  <button onclick="clearSignals()">🗑 پاک کردن سیگنال‌ها</button>
  <button id="soundBtn" onclick="toggleSound()">🔊 صدا روشن</button>
</div>

<div class="status">
  وضعیت:
  <strong id="statusText">در حال آماده‌سازی...</strong>
  <span id="lastScan"></span>
</div>

<div class="container">

  <div class="section-title">
    <h2>🚨 سیگنال‌های MA20 یک‌دقیقه</h2>
    <span class="counter" id="signalCount">0 سیگنال</span>
  </div>

  <div id="signals" class="signals">
    <div class="empty">
      هنوز سیگنال جدیدی دریافت نشده است.<br>
      رادار برخورد MA20 در حال انتظار است.
    </div>
  </div>

</div>

<div id="deepPanel">
  <div class="deep">

    <div class="deep-head">
      <div class="deep-head-row">
        <div>
          <div class="deep-title" id="deepTitle">تحلیل عمیق</div>
          <div class="deep-sub" id="deepSub"></div>
        </div>

        <button class="close" onclick="closeDeep()">✕ بستن</button>
      </div>
    </div>

    <div id="deepContent">
      <div class="loading">در حال دریافت تحلیل...</div>
    </div>

  </div>
</div>

<div id="toast" class="toast"></div>

<script>

/* =========================================================
CONFIG
========================================================= */

const WORKER =
  "https://soft-flower-2790.29mah12.workers.dev";

const SCAN_URL =
  WORKER + "/api/scan";

const ANALYZE_URL =
  WORKER + "/api/analyze";

const SCAN_INTERVAL = 15000;

/*
  سیگنال‌هایی که قبلاً دیده شده‌اند.
  باعث می‌شود یک سیگنال در اسکن بعدی
  دوباره به عنوان سیگنال جدید ثبت نشود.
*/
const seenSignals = new Set();

/*
  سیگنال‌های فعال روی صفحه.
*/
const signals = new Map();

/*
  سیگنالی که فعلاً کاربر در حال بررسی آن است.
*/
let currentSignalId = null;

let radarTimer = null;
let running = false;
let soundEnabled = true;

let offset = 0;

/* =========================================================
DOM
========================================================= */

const $ = id =>
  document.getElementById(id);

/* =========================================================
TIME
========================================================= */

function timeText(ts){
  const d = ts ? new Date(ts) : new Date();

  return d.toLocaleTimeString(
    "fa-IR",
    {
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit"
    }
  );
}

/* =========================================================
NUMBER
========================================================= */

function num(v,digits=4){

  if(v===null||v===undefined||
     v===""||Number.isNaN(Number(v))){
    return "-";
  }

  const n=Number(v);

  return n.toLocaleString(
    "en-US",
    {
      maximumFractionDigits:digits
    }
  );
}

function pct(v){

  if(v===null||v===undefined||
     Number.isNaN(Number(v))){
    return "-";
  }

  return Number(v).toFixed(2)+"%";
}

/* =========================================================
STATUS
========================================================= */

function setStatus(text,good=false){

  $("statusText").textContent=text;

  $("statusText").style.color =
    good ? "#5ee69b" : "#e6c76c";
}

/* =========================================================
TOAST
========================================================= */

let toastTimer;

function toast(text){

  const el=$("toast");

  el.textContent=text;
  el.style.display="block";

  clearTimeout(toastTimer);

  toastTimer=setTimeout(()=>{
    el.style.display="none";
  },3500);
}

/* =========================================================
SOUND
========================================================= */

function beep(){

  if(!soundEnabled)return;

  try{

    const Ctx =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!Ctx)return;

    const ctx=new Ctx();

    const osc=ctx.createOscillator();
    const gain=ctx.createGain();

    osc.type="sine";

    osc.frequency.setValueAtTime(
      740,
      ctx.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
      1040,
      ctx.currentTime+0.18
    );

    gain.gain.setValueAtTime(
      0.0001,
      ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.22,
      ctx.currentTime+0.02
    );

    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      ctx.currentTime+0.35
    );

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();

    osc.stop(
      ctx.currentTime+0.36
    );

  }catch(e){}
}

function toggleSound(){

  soundEnabled=!soundEnabled;

  $("soundBtn").textContent =
    soundEnabled
      ?"🔊 صدا روشن"
      :"🔇 صدا خاموش";

  if(soundEnabled){
    beep();
  }
}

/* =========================================================
MA20 SIGNAL FILTER
========================================================= */

/*
  فقط برخورد MA20 یک دقیقه.
  MA20 تایم‌فریم 1 دقیقه از Worker:
  tf["1"].touchMA20

  و برای جلوگیری از نمایش سیگنال‌های ضعیف،
  ترجیحاً باید MA دارای جهت و برخورد واقعی باشد.
*/

function extractMA20Signal(item){

  const tf=item?.timeframes?.["1"];

  if(!tf || tf.error)return null;

  if(!tf.touchMA20)return null;

  const price=Number(tf.price||item.price);
  const ma20=Number(tf.ma20);

  if(!price || !ma20)return null;

  let direction="WAIT";

  /*
    اگر قیمت بالای MA20 باشد و MA رو به بالا باشد:
    LONG

    اگر قیمت زیر MA20 باشد و MA رو به پایین باشد:
    SHORT
  */

  if(
    price>=ma20 &&
    tf.maSlope==="UP"
  ){
    direction="LONG";
  }

  if(
    price<=ma20 &&
    tf.maSlope==="DOWN"
  ){
    direction="SHORT";
  }

  /*
    اگر خود Worker سیگنال عمیق قطعی دارد،
    از آن استفاده می‌کنیم.
  */

  if(item.direction==="LONG"){
    direction="LONG";
  }

  if(item.direction==="SHORT"){
    direction="SHORT";
  }

  const event=
    item.convertedMA1m?.events
      ?.find(x =>
        x.source==="1m" &&
        x.ma==="MA20"
      )||null;

  const type=
    event?.type||
    (
      tf.touchMA20
        ?"TOUCH"
        :"NONE"
    );

  return{
    symbol:item.symbol,
    category:item.category||"linear",

    direction,

    price,
    ma20,

    distancePct:
      (price-ma20)/ma20*100,

    maSlope:tf.maSlope,

    trend:tf.trend,

    type,

    rejection:
      event?.rejection||false,

    crossUp:
      event?.crossUp||false,

    crossDown:
      event?.crossDown||false,

    volumeConfirmed:
      event?.volumeConfirmed||
      tf.volume?.spike||
      false,

    score:item.score||0,

    longScore:item.longScore||0,

    shortScore:item.shortScore||0,

    hunt:tf.hunt||null,

    timestamp:
      tf.timestamp||
      item.generatedAt||
      Date.now(),

    deep:item
  };
}

/* =========================================================
SIGNAL ID
========================================================= */

function signalId(s){

  /*
    نماد + زمان کندل + جهت
    باعث می‌شود همان کندل دوباره ثبت نشود.
  */

  return [
    s.symbol,
    s.timestamp,
    s.direction,
    s.type
  ].join("_");
}

/* =========================================================
ADD SIGNAL
========================================================= */

function addSignal(s){

  const id=signalId(s);

  if(seenSignals.has(id)){
    return false;
  }

  seenSignals.add(id);

  signals.set(id,{
    id,
    ...s,
    receivedAt:Date.now(),
    active:true
  });

  beep();

  renderSignals();

  toast(
    `🚨 سیگنال جدید ${s.symbol} — ${
      s.direction==="LONG"
        ?"LONG"
        :s.direction==="SHORT"
          ?"SHORT"
          :"برخورد MA20"
    }`
  );

  return true;
}

/* =========================================================
RENDER SIGNALS
========================================================= */

function renderSignals(){

  const box=$("signals");

  if(!signals.size){

    box.innerHTML=`
      <div class="empty">
        هنوز سیگنال جدیدی دریافت نشده است.<br>
        رادار برخورد MA20 در حال انتظار است.
      </div>
    `;

    $("signalCount").textContent="0 سیگنال";

    return;
  }

  const arr=[
    ...signals.values()
  ].sort(
    (a,b)=>b.receivedAt-a.receivedAt
  );

  box.innerHTML=
    arr.map(s=>{

      const dirClass=
        s.direction==="LONG"
          ?"long"
          :s.direction==="SHORT"
            ?"short"
            :"";

      const badgeClass=
        s.direction==="LONG"
          ?"long"
          :s.direction==="SHORT"
            ?"short"
            :"wait";

      const directionText=
        s.direction==="LONG"
          ?"🟢 LONG"
          :s.direction==="SHORT"
            ?"🔴 SHORT"
            :"🟡 MA20";

      const typeText={
        TOUCH:"برخورد",
        REJECTION:"برگشت از MA20",
        BREAK:"شکست MA20"
      }[s.type]||"برخورد MA20";

      return`

        <div
          class="signal ${dirClass} ${
            currentSignalId===s.id
              ?"current"
              :""
          }"
        >

          <div class="signal-head">

            <div class="symbol">
              ${escapeHtml(s.symbol)}
            </div>

            <div class="badge ${badgeClass}">
              ${directionText}
            </div>

          </div>

          <div class="signal-grid">

            <div class="metric">
              <small>قیمت</small>
              <b>${num(s.price)}</b>
            </div>

            <div class="metric">
              <small>MA20 یک دقیقه</small>
              <b class="ma">${num(s.ma20)}</b>
            </div>

            <div class="metric">
              <small>فاصله از MA20</small>
              <b>${pct(s.distancePct)}</b>
            </div>

            <div class="metric">
              <small>نوع برخورد</small>
              <b>${typeText}</b>
            </div>

            <div class="metric">
              <small>شیب MA20</small>
              <b>${s.maSlope||"-"}</b>
            </div>

            <div class="metric">
              <small>حجم</small>
              <b>
                ${
                  s.volumeConfirmed
                    ?"تأیید"
                    :"عادی"
                }
              </b>
            </div>

          </div>

          <div class="time">
            🕒 دریافت:
            ${timeText(s.receivedAt)}
            |
            کندل:
            ${timeText(s.timestamp)}
          </div>

          <div class="signal-actions">

            <button
              onclick="openDeep('${encodeURIComponent(s.symbol)}','${s.category}','${s.id}')"
            >
              🔬 تحلیل عمیق
            </button>

            <button
              onclick="focusSignal('${s.id}')"
            >
              🎯 انتخاب
            </button>

          </div>

        </div>
      `;

    }).join("");

  $("signalCount").textContent =
    `${arr.length} سیگنال`;
}

/* =========================================================
ESCAPE
========================================================= */

function escapeHtml(v){

  return String(v??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* =========================================================
FOCUS
========================================================= */

function focusSignal(id){

  currentSignalId=id;

  renderSignals();

  const cards=
    document.querySelectorAll(".signal");

  const index=
    [...signals.values()]
      .sort(
        (a,b)=>b.receivedAt-a.receivedAt
      )
      .findIndex(x=>x.id===id);

  if(cards[index]){
    cards[index].scrollIntoView({
      behavior:"smooth",
      block:"center"
    });
  }
}

/* =========================================================
SCAN
========================================================= */

async function scanNow(){

  if(!running){
    setStatus("در حال بررسی دستی...",false);
  }

  try{

    const url=
      SCAN_URL+
      "?offset="+
      encodeURIComponent(offset);

    const r=await fetch(url,{
      cache:"no-store"
    });

    if(!r.ok){
      throw new Error(
        "HTTP "+r.status
      );
    }

    const data=await r.json();

    if(!data.ok){

      throw new Error(
        data.error||
        "خطای نامشخص Worker"
      );
    }

    offset=
      Number(data.nextOffset)||0;

    /*
      فقط نتایجی که MA20 یک دقیقه
      برخورد کرده را استخراج می‌کنیم.
    */

    let found=0;

    for(const item of data.results||[]){

      const signal=
        extractMA20Signal(item);

      if(!signal)continue;

      if(addSignal(signal)){
        found++;
      }
    }

    $("lastScan").textContent=
      ` | آخرین بررسی: ${timeText()}`;

    if(running){

      setStatus(
        found
          ?`🟢 ${found} سیگنال جدید`
          :"🟡 اسکن انجام شد؛ سیگنال جدیدی نبود",
        found>0
      );

    }else{

      setStatus(
        found
          ?`🟢 ${found} سیگنال پیدا شد`
          :"🟡 بررسی انجام شد"
      );

    }

  }catch(e){

    console.error(e);

    setStatus(
      "❌ خطا: "+e.message
    );

    toast(
      "خطا در اتصال به Worker: "+
      e.message
    );
  }
}

/* =========================================================
START / STOP
========================================================= */

function startRadar(){

  if(running)return;

  running=true;

  $("startBtn").classList.add("active");

  setStatus(
    "🟢 رادار فعال است",
    true
  );

  scanNow();

  radarTimer=setInterval(
    scanNow,
    SCAN_INTERVAL
  );
}

function stopRadar(){

  running=false;

  $("startBtn").classList.remove("active");

  if(radarTimer){

    clearInterval(radarTimer);

    radarTimer=null;
  }

  setStatus(
    "⏸ رادار متوقف شد"
  );
}

/* =========================================================
CLEAR
========================================================= */

function clearSignals(){

  signals.clear();

  seenSignals.clear();

  currentSignalId=null;

  renderSignals();

  toast(
    "سیگنال‌های صفحه پاک شدند."
  );
}

/* =========================================================
DEEP ANALYSIS
========================================================= */

async function openDeep(
  encodedSymbol,
  category,
  id
){

  const symbol=
    decodeURIComponent(encodedSymbol);

  currentSignalId=id;

  $("deepPanel").style.display="block";

  document.body.style.overflow="hidden";

  $("deepTitle").textContent=
    `🔬 تحلیل عمیق ${symbol}`;

  $("deepSub").textContent=
    "در حال دریافت داده‌های Bybit...";

  $("deepContent").innerHTML=
    `<div class="loading">
      ⏳ در حال دریافت تحلیل عمیق...
    </div>`;

  try{

    const url=
      ANALYZE_URL+
      "?symbol="+
      encodeURIComponent(symbol)+
      "&category="+
      encodeURIComponent(category||"linear");

    const r=await fetch(url,{
      cache:"no-store"
    });

    if(!r.ok){

      throw new Error(
        "HTTP "+r.status
      );
    }

    const data=await r.json();

    if(!data.ok){

      throw new Error(
        data.error||
        "تحلیل دریافت نشد"
      );
    }

    $("deepSub").textContent=
      `قیمت: ${num(data.price)} | امتیاز: ${data.score}/100`;

    $("deepContent").innerHTML=
      buildDeep(data);

  }catch(e){

    console.error(e);

    $("deepContent").innerHTML=
      `
      <div class="panel">
        <h3>❌ خطا</h3>
        <div class="reason">
          ${escapeHtml(e.message)}
        </div>
      </div>
      `;
  }
}

      ${panel(
        "🧩 FVG / Order Block",
        row("FVG",tf.fvg?.type)+

            ?num(tf.fvg.low)+" → "+num(tf.fvg.high)

      ${panel(

        row("Delta",num(fp.delta))+

        row("Buy Share",pct(fp.buyShare))+

      ${panel(

        row("Sell Liquidity",num(wall.sellLiquidity,2))+
        row("Buy Share",pct(wall.buyShare))+
        row("Sell Share",pct(wall.sellShare))+
        row("Imbalance",pct(wall.imbalance))+
        row("Buy Wall",wall.buy?num(wall.buy.price):"—")+
        row("Sell Wall",wall.sell?num(wall.sell.price):"—")
      )}

      ${panel(
        "🧱 حمایت / مقاومت",
        row(
          "Nearest Support",
          sr.nearestSupport
            ?num(sr.nearestSupport.price)
            :"—"
        )+
        row(
          "Nearest Resistance",
          sr.nearestResistance
            ?num(sr.nearestResistance.price)
            :"—"
        )+
        row(

/* =========================================================
PANEL HELPERS
========================================================= */

function panel(title,content){

  return`
    <div class="panel">
      <h3>${title}</h3>
      ${content}
    </div>
  `;
}

function row(label,value){

  return`
    <div class="row">
      <span class="label">
        ${escapeHtml(label)}
      </span>

      <b class="value">
        ${escapeHtml(
          value===null||
          value===undefined||
          value===""
            ?"—"
            :String(value)
        )}
      </b>
    </div>
  `;
}

function reasonsPanel(d){

  const reasons=d.reasons||[];

  if(!reasons.length){

    return panel(
      "📝 دلایل",
      `<div class="reason">
        دلیل قطعی برای سیگنال ثبت نشده است.
      </div>`
    );
  }

  return panel(
    "📝 دلایل سیگنال",
    reasons
      .map(x=>
        `<div class="reason">
          ${escapeHtml(x)}
        </div>`
      )
      .join("")
  );
}
