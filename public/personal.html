<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اسکنر شخصی</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0b0f14;
  color:#eaf2ff;
  font-family:Tahoma,Arial,sans-serif
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:14px
}

.top{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center
}

.box,.card{
  background:#111821;
  border:1px solid #263241;
  border-radius:14px;
  padding:12px;
  margin:10px 0
}

.btn{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  background:#1d6fff;
  color:#fff;
  font-weight:700;
  cursor:pointer
}

.input{
  flex:1;
  min-width:180px;
  background:#0b1118;
  color:#fff;
  border:1px solid #334155;
  border-radius:10px;
  padding:11px
}

.muted{
  color:#8fa1b7
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:10px
}

.green{color:#54e08a}
.red{color:#ff6b7d}
.yellow{color:#ffd166}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  border-bottom:1px solid #202b38;
  padding:8px 0
}

.item{
  background:#0d141d;
  border:1px solid #263241;
  border-radius:10px;
  margin:7px 0;
  overflow:hidden
}

.item summary{
  cursor:pointer;
  padding:11px;
  font-weight:700;
  list-style:none
}

.item summary::-webkit-details-marker{
  display:none
}

.content{
  padding:0 11px 11px
}

.score{
  font-size:28px;
  font-weight:800
}

.small{
  font-size:12px
}

.refresh{
  font-size:12px;
  color:#8fa1b7;
  margin-top:7px
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:8px;
  background:#1b2634
}

.notice{
  padding:10px;
  border-radius:10px;
  background:#172230;
  color:#b7c5d6;
  font-size:12px;
  margin:10px 0
}

.bar{
  height:8px;
  background:#202b38;
  border-radius:20px;
  overflow:hidden;
  margin-top:7px
}

.bar>div{
  height:100%;
  background:#2381ff
}

@media(max-width:600px){
  .wrap{padding:9px}
  .top{flex-direction:column}
  .input,.btn{width:100%}
}
</style>
</head>

<body>

<div class="wrap">

<h2>📊 اسکنر شخصی</h2>

<div class="box">

<div class="top">

<input
 id="symbol"
 class="input"
 placeholder="مثلاً BTCUSDT"
 autocomplete="off"
>

<button
 class="btn"
 onclick="analyze()"
>
تحلیل
</button>

</div>

<div class="small muted">
تحلیل خودکار فقط در تایم‌فریم‌های ۱ دقیقه و ۱۵ دقیقه · به‌روزرسانی زنده
</div>

</div>

<div id="out"></div>

</div>

<script>

let timer=null;
let lastSymbol='';

const $=id=>
  document.getElementById(id);

const esc=s=>
  String(s??'').replace(
    /[&<>"']/g,
    m=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[m])
  );

const DIR={
  BULLISH:'صعودی',
  BEARISH:'نزولی',
  RANGE:'رنج',
  LONG:'خرید',
  SHORT:'فروش',
  WAIT:'انتظار',
  NONE:'ندارد',
  UP:'صعودی',
  DOWN:'نزولی',
  FLAT:'خنثی',
  NEUTRAL:'خنثی',
  NORMAL:'عادی',
  SPIKE:'جهش'
};

const TYPE={
  BULLISH:'صعودی',
  BEARISH:'نزولی',
  BULLISH_DIVERGENCE:'واگرایی صعودی',
  BEARISH_DIVERGENCE:'واگرایی نزولی',
  NONE:'ندارد',
  SWING_SUPPORT:'حمایت نوسانی',
  SWING_RESISTANCE:'مقاومت نوسانی',
  BUY_WALL:'دیوار خرید',
  SELL_WALL:'دیوار فروش'
};

function label(v){

  return DIR[v] ||
         TYPE[v] ||
         String(v??'—');

}

function dirClass(d){

  return d==='BULLISH' ||
         d==='LONG' ||
         d==='UP'
    ? 'green'
    : d==='BEARISH' ||
      d==='SHORT' ||
      d==='DOWN'
      ? 'red'
      : 'yellow';

}

function fmt(v){

  if(v==null || v==='')
    return '—';

  if(typeof v==='number'){

    return v.toLocaleString(
      'fa-IR',
      {
        maximumFractionDigits:
          Math.abs(v)>=1000 ? 4 : 8
      }
    );

  }

  return esc(v);

}

function rememberOpen(){

  return [
    ...document.querySelectorAll(
      'details[data-key]'
    )
  ]
  .filter(x=>x.open)
  .map(x=>x.dataset.key);

}

function restoreOpen(keys){

  keys.forEach(k=>{

    const x=
      document.querySelector(
        `details[data-key="${CSS.escape(k)}"]`
      );

    if(x)
      x.open=true;

  });

}

function renderStyles(x){

  const items=x.items||[];

  if(!items.length)
    return '<div class="muted">اطلاعات سبک‌ها موجود نیست.</div>';

  return items.map(
    (i,n)=>`

      <div class="row">

        <span>
          ${esc(
            i.name ||
            [
              'ساختار بازار',
              'اسمارت مانی',
              'ایچیموکو',
              'مومنتوم',
              'حجم',
              'جریان سفارش',
              'نقدینگی'
            ][n] ||
            'سبک'
          )}
        </span>

        <b class="${dirClass(i.direction)}">

          ${label(i.direction)}
          ·
          ${fmt(i.score||0)}/100

        </b>

      </div>

    `
  ).join('');

}

function renderConvertedMA(d){

  const c=d.convertedMA1m;

  if(!c ||
     !Array.isArray(c.events) ||
     !c.events.length){

    return `
      <div class="muted">
        اطلاعات MAهای تبدیل‌شده موجود نیست.
      </div>
    `;

  }

  return c.events.map(
    e=>`

      <div class="row">

        <span>

          ${esc(e.source)}
          /
          MA${fmt(
            e.period1m
          )}

        </span>

        <b class="${dirClass(
          e.confirmation
        )}">

          ${esc(
            e.confirmation||'NONE'
          )}

        </b>

      </div>

      <div class="row small">

        <span>
          مقدار
        </span>

        <b>
          ${fmt(e.value)}
        </b>

      </div>

    `
  ).join('');

}

function renderTF(key,x){

  const a=x||{};

  const m=a.macd||{};
  const i=a.ichimoku||{};
  const dv=a.divergence||{};
  const v=a.volume||{};
  const h=a.hunt||{};
  const f=a.fvg||{};
  const ob=a.orderBlock||{};
  const extra=a.extra||{};

  return `

  <details
    class="item"
    data-key="tf-${esc(key)}"
  >

    <summary>

      ${esc(
        key==='1'
          ? '۱ دقیقه'
          : key==='3'
            ? '۳ دقیقه'
            : key==='5'
              ? '۵ دقیقه'
              : key==='15'
                ? '۱۵ دقیقه'
                : key==='60'
                  ? '۱ ساعت'
                  : key
      )}

      —

      <span class="${dirClass(a.trend)}">

        ${label(a.trend)}

      </span>

    </summary>

    <div class="content">

      <div class="grid">

        <div class="box">

          <b>میانگین‌های متحرک</b>

          <div class="row">
            <span>MA7</span>
            <b>${fmt(a.ma7)}</b>
          </div>

          <div class="row">
            <span>MA20</span>
            <b>${fmt(a.ma20)}</b>
          </div>

          <div class="row">
            <span>شیب</span>
            <b class="${dirClass(a.maSlope)}">
              ${label(a.maSlope)}
            </b>
          </div>

          <div class="row">
            <span>ADX</span>
            <b>${fmt(a.adx)}</b>
          </div>

          <div class="row">
            <span>ATR</span>
            <b>${fmt(a.atr)}</b>
          </div>

          <div class="row">
            <span>عرض بولینگر</span>
            <b>${fmt(a.bollingerWidth)}%</b>
          </div>

        </div>


        <div class="box">

          <b>MACD و RSI</b>

          <div class="row">
            <span>MACD</span>
            <b class="${dirClass(m.direction)}">
              ${label(m.direction)}
            </b>
          </div>

          <div class="row">
            <span>Histogram</span>
            <b>${fmt(m.histogram)}</b>
          </div>

          <div class="row">
            <span>RSI</span>
            <b>${fmt(a.rsi)}</b>
          </div>

          <div class="row">
            <span>جهت RSI</span>
            <b class="${dirClass(extra.RSI?.direction)}">
              ${label(extra.RSI?.direction)}
            </b>
          </div>

        </div>


        <div class="box">

          <b>ایچیموکو</b>

          <div class="row">
            <span>جهت</span>
            <b class="${dirClass(i.direction)}">
              ${label(i.direction)}
            </b>
          </div>

          <div class="row">
            <span>Tenkan</span>
            <b>${fmt(i.tenkan)}</b>
          </div>

          <div class="row">
            <span>Kijun</span>
            <b>${fmt(i.kijun)}</b>
          </div>

          <div class="row">
            <span>Span A</span>
            <b>${fmt(i.spanA)}</b>
          </div>

          <div class="row">
            <span>Span B</span>
            <b>${fmt(i.spanB)}</b>
          </div>

        </div>


        <div class="box">

          <b>واگرایی</b>

          <div class="score ${dirClass(dv.side)}">

            ${label(
              dv.type ||
              'NONE'
            )}

          </div>

        </div>


        <div class="box">

          <b>حجم</b>

          <div class="row">
            <span>حجم فعلی</span>
            <b>${fmt(v.current)}</b>
          </div>

          <div class="row">
            <span>میانگین</span>
            <b>${fmt(v.average)}</b>
          </div>

          <div class="row">
            <span>نسبت</span>
            <b>${fmt(v.ratio)}</b>
          </div>

          <div class="row">
            <span>وضعیت</span>
            <b>${label(v.state)}</b>
          </div>

          <div class="row">
            <span>Spike</span>
            <b>${v.spike?'بله':'خیر'}</b>
          </div>

        </div>


        <div class="box">

          <b>ساختار بازار</b>

          <div class="row">
            <span>BOS</span>
            <b class="${dirClass(a.bos)}">
              ${label(a.bos)}
            </b>
          </div>

          <div class="row">
            <span>CHoCH</span>
            <b class="${dirClass(a.choch)}">
              ${label(a.choch)}
            </b>
          </div>

          <div class="row">
            <span>Candle</span>
            <b class="${dirClass(a.candle?.direction)}">
              ${label(a.candle?.direction)}
            </b>
          </div>

          <div class="row">
            <span>قدرت کندل</span>
            <b>${fmt(a.candle?.strength)}</b>
          </div>

        </div>


        <div class="box">

          <b>Liquidity Hunt</b>

          <div class="row">
            <span>جهت</span>
            <b class="${dirClass(h.side)}">
              ${label(h.side)}
            </b>
          </div>

          <div class="row">
            <span>تأیید</span>
            <b>${h.confirmed?'بله':'خیر'}</b>
          </div>

          <div class="row">
            <span>قیمت Sweep</span>
            <b>${fmt(h.sweepPrice)}</b>
          </div>

          <div class="row">
            <span>قدرت</span>
            <b>${fmt(h.strength)}</b>
          </div>

        </div>


        <div class="box">

          <b>FVG / Order Block</b>

          <div class="row">
            <span>FVG</span>
            <b class="${dirClass(f.type)}">
              ${label(f.type)}
            </b>
          </div>

          <div class="row">
            <span>بالا</span>
            <b>${fmt(f.top)}</b>
          </div>

          <div class="row">
            <span>پایین</span>
            <b>${fmt(f.bottom)}</b>
          </div>

          <div class="row">
            <span>OB</span>
            <b class="${dirClass(ob.type)}">
              ${label(ob.type)}
            </b>
          </div>

          <div class="row">
            <span>قیمت OB</span>
            <b>${fmt(ob.price)}</b>
          </div>

        </div>

      </div>


      <details
        class="item"
        data-key="${esc(key)}-sr"
      >

        <summary>
          ▼ حمایت و مقاومت
        </summary>

        <div class="content">

          <div class="row">
            <span>حمایت</span>
            <b>${fmt(a.support)}</b>
          </div>

          <div class="row">
            <span>مقاومت</span>
            <b>${fmt(a.resistance)}</b>
          </div>

        </div>

      </details>

    </div>

  </details>

  `;

}

function renderFootprint(fp){

  if(!fp ||
     fp.error){

    return `
      <div class="muted">
        فوت‌پرینت در دسترس نیست.
      </div>
    `;

  }

  return `

  <div class="grid">

    <div class="box">
      <b>حجم خرید</b>
      <div class="score green">
        ${fmt(fp.buyVolume)}
      </div>
    </div>

    <div class="box">
      <b>حجم فروش</b>
      <div class="score red">
        ${fmt(fp.sellVolume)}
      </div>
    </div>

    <div class="box">

      <b>Delta</b>

      <div class="score ${
        fp.delta>0
          ? 'green'
          : fp.delta<0
            ? 'red'
            : 'yellow'
      }">

        ${fmt(fp.delta)}

      </div>

      <div>
        ${fmt(fp.deltaPercent)}%
      </div>

    </div>

    <div class="box">

      <b>فشار سفارش</b>

      <div class="score">
        ${label(fp.pressure)}
      </div>

    </div>

    <div class="box">
      <b>ارزش خرید</b>
      <div>${fmt(fp.buyNotional)}</div>
    </div>

    <div class="box">
      <b>ارزش فروش</b>
      <div>${fmt(fp.sellNotional)}</div>
    </div>

    <div class="box">
      <b>تعداد معاملات</b>
      <div>${fmt(fp.trades)}</div>
    </div>

    <div class="box">
      <b>معامله بزرگ</b>
      <div>${fmt(fp.largeTradeNotional)}</div>
    </div>

  </div>

  `;

}

function renderWalls(w){

  if(!w ||
     w.error){

    return `
      <div class="muted">
        Order Book در دسترس نیست.
      </div>
    `;

  }

  return `

  <div class="grid">

    <div class="box">

      <b>🟢 دیوار خرید</b>

      <div class="score green">
        ${fmt(w.buy?.price)}
      </div>

      <div>
        ارزش:
        ${fmt(w.buy?.notional)}
      </div>

      <div>
        فاصله:
        ${fmt(w.buy?.distancePct)}%
      </div>

      <div>
        قدرت:
        ${fmt(w.buyStrength)}
      </div>

    </div>


    <div class="box">

      <b>🔴 دیوار فروش</b>

      <div class="score red">
        ${fmt(w.sell?.price)}
      </div>

      <div>
        ارزش:
        ${fmt(w.sell?.notional)}
      </div>

      <div>
        فاصله:
        ${fmt(w.sell?.distancePct)}%
      </div>

      <div>
        قدرت:
        ${fmt(w.sellStrength)}
      </div>

    </div>


    <div class="box">

      <b>نقدینگی</b>

      <div class="row">
        <span>خرید</span>
        <b class="green">
          ${fmt(w.buyLiquidity)}
        </b>
      </div>

      <div class="row">
        <span>فروش</span>
        <b class="red">
          ${fmt(w.sellLiquidity)}
        </b>
      </div>

      <div class="row">
        <span>سهم خرید</span>
        <b>${fmt(w.buyShare)}%</b>
      </div>

      <div class="row">
        <span>سهم فروش</span>
        <b>${fmt(w.sellShare)}%</b>
      </div>

    </div>

  </div>


  <details
    class="item"
    data-key="walls-buy"
  >

    <summary>
      ▼ سطوح خرید
    </summary>

    <div class="content">

      ${
        (w.buyLevels||[])
          .map(
            x=>`

            <div class="row">

              <span>
                ${fmt(x.price)}
              </span>

              <b>
                ${fmt(x.notional)}
                ·
                ${fmt(x.distancePct)}%
              </b>

            </div>

            `
          )
          .join('')
        ||
        '<div class="muted">—</div>'
      }

    </div>

  </details>


  <details
    class="item"
    data-key="walls-sell"
  >

    <summary>
      ▼ سطوح فروش
    </summary>

    <div class="content">

      ${
        (w.sellLevels||[])
          .map(
            x=>`

            <div class="row">

              <span>
                ${fmt(x.price)}
              </span>

              <b>
                ${fmt(x.notional)}
                ·
                ${fmt(x.distancePct)}%
              </b>

            </div>

            `
          )
          .join('')
        ||
        '<div class="muted">—</div>'
      }

    </div>

  </details>

  `;

}

function renderMarket(m){

  if(!m ||
     m.error){

    return `
      <div class="notice">
        OI / Funding برای این نماد در پاسخ فعلی Bybit
        قابل دریافت نیست.
        ${
          m?.error
            ? '<br>'+esc(m.error)
            : ''
        }
      </div>
    `;

  }

  return `

  <div class="grid">

    <div class="box">
      <b>Open Interest</b>
      <div class="score">
        ${fmt(m.openInterest)}
      </div>
    </div>

    <div class="box">
      <b>Funding Rate</b>
      <div class="score">
        ${fmt(m.fundingRate)}
      </div>
    </div>

    <div class="box">
      <b>تغییر OI</b>
      <div>
        فعلی: ${fmt(m.openInterest)}
      </div>
      <div>
        قبلی: ${fmt(m.previousOpenInterest)}
      </div>
      <div>
        تغییر: ${fmt(m.openInterestChange)}
      </div>
    </div>

    <div class="box">
      <b>تغییر Funding</b>
      <div>
        فعلی: ${fmt(m.fundingRate)}
      </div>
      <div>
        قبلی: ${fmt(m.previousFundingRate)}
      </div>
      <div>
        تغییر: ${fmt(m.fundingChange)}
      </div>
    </div>

  </div>

  `;

}

function renderReasons(reasons){

  if(!Array.isArray(reasons) ||
     !reasons.length){

    return `
      <div class="muted">
        دلیل مشخصی برای سیگنال ثبت نشده است.
      </div>
    `;

  }

  return reasons.map(
    r=>`

      <div class="row">

        <span class="${dirClass(r.side)}">

          ${label(r.side)}

        </span>

        <b>
          ${esc(r.text)}
        </b>

      </div>

    `
  ).join('');

}

function render(d){

  const open=
    rememberOpen();

  const direction=
    d.direction ||
    d.marketState ||
    'NONE';

  const score=
    Number(d.score||0);

  const main=`

  <div class="card">

    <div class="score ${dirClass(direction)}">

      ${label(direction)}
      ·
      ${fmt(score)}/100

    </div>

    <div class="grid">

      <div>

        نماد:
        <b>
          ${esc(d.symbol)}
        </b>

      </div>

      <div>

        بازار:
        <b>
          ${
            d.category==='spot'
              ? 'اسپات'
              : d.category==='linear'
                ? 'فیوچرز'
                : '—'
          }
        </b>

      </div>

      <div>

        قیمت:
        <b>
          ${fmt(d.price)}
        </b>

      </div>

      <div>

        Long:
        <b class="green">
          ${fmt(d.longScore)}
        </b>

      </div>

      <div>

        Short:
        <b class="red">
          ${fmt(d.shortScore)}
        </b>

      </div>

    </div>

    <div class="refresh">

      آخرین به‌روزرسانی:
      ${
        d.generatedAt
          ? new Date(
              d.generatedAt
            ).toLocaleTimeString('fa-IR')
          : '—'
      }

    </div>

  </div>

  `;


  const wanted=[
    '1',
    '15'
  ];

  const tfs=
    Object.entries(
      d.timeframes||{}
    )
    .filter(
      ([k])=>
        wanted.includes(String(k))
    )
    .map(
      ([k,x])=>
        renderTF(k,x)
    )
    .join('');


  $('out').innerHTML=

  main+

  `

  <details
    class="item"
    data-key="timeframes"
    open
  >

    <summary>
      📊 تحلیل تایم‌فریم‌های شخصی
      <span class="muted">
        1m + 15m
      </span>
    </summary>

    <div class="content">

      ${tfs ||
        '<div class="muted">داده تایم‌فریم موجود نیست.</div>'
      }

    </div>

  </details>


  <details
    class="item"
    data-key="converted-ma"
  >

    <summary>
      📐 MAهای تبدیل‌شده روی 1m
    </summary>

    <div class="content">

      ${renderConvertedMA(d)}

    </div>

  </details>


  <details
    class="item"
    data-key="footprint"
  >

    <summary>
      👣 Footprint / Delta
    </summary>

    <div class="content">

      ${renderFootprint(
        d.footprint
      )}

    </div>

  </details>


  <details
    class="item"
    data-key="walls"
  >

    <summary>
      🧱 Order Book / Walls
    </summary>

    <div class="content">

      ${renderWalls(
        d.walls
      )}

    </div>

  </details>


  <details
    class="item"
    data-key="market"
  >

    <summary>
      📈 OI / Funding
    </summary>

    <div class="content">

      ${renderMarket(
        d.market
      )}

    </div>

  </details>


  <details
    class="item"
    data-key="reasons"
  >

    <summary>
      🧠 دلایل تشکیل سیگنال
    </summary>

    <div class="content">

      ${renderReasons(
        d.reasons
      )}

    </div>

  </details>

  `;

  restoreOpen(open);

}

async function get(sym){

  const u=
    `/api/analyze?symbol=${
      encodeURIComponent(sym)
    }&mode=personal&strictness=75`;

  const r=
    await fetch(
      u,
      {
        cache:'no-store'
      }
    );

  const d=
    await r.json();

  if(!d.ok)
    throw Error(
      d.error ||
      'خطا در تحلیل'
    );

  return d;

}

async function analyze(){

  const s=
    $('symbol')
      .value
      .trim()
      .toUpperCase();

  if(!s)
    return;

  if(timer)
    clearInterval(timer);

  lastSymbol=s;

  try{

    $('out').innerHTML=
      '<div class="box">در حال تحلیل...</div>';

    const d=
      await get(s);

    render(d);

    timer=
      setInterval(
        async()=>{

          try{

            const d=
              await get(
                lastSymbol
              );

            render(d);

          }
          catch(e){}

        },
        8000
      );

  }
  catch(e){

    $('out').innerHTML=
      `<div class="box red">
        ${esc(e.message)}
      </div>`;

  }

}

$('symbol')
  .addEventListener(
    'keydown',
    e=>{

      if(e.key==='Enter')
        analyze();

    }
  );

</script>
