<!doctype html>
<html lang="fa" dir="rtl">
<head>

<meta charset="utf-8">
<meta
name="viewport"
content="width=device-width,initial-scale=1"
>

<title>اسکنر شخصی Bybit</title>

<style>

*{
box-sizing:border-box
}

body{
margin:0;
background:#090e14;
color:#edf4ff;
font-family:Tahoma,Arial,sans-serif
}

.wrap{
max-width:1050px;
margin:auto;
padding:14px
}

.top{
display:flex;
gap:8px
}

.input{
flex:1;
background:#0e151e;
color:#fff;
border:1px solid #334155;
border-radius:11px;
padding:12px
}

.btn{
border:0;
border-radius:10px;
padding:11px 15px;
background:#2563eb;
color:#fff;
font-weight:700
}

.card,.item,.box{
background:#111923;
border:1px solid #263446;
border-radius:14px;
margin:9px 0
}

.card,.box,.content{
padding:11px
}

.grid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(210px,1fr));
gap:9px
}

.item>summary{
cursor:pointer;
padding:12px;
font-weight:700
}

.row{
display:flex;
justify-content:space-between;
gap:10px;
border-bottom:1px solid #263446;
padding:8px 0
}

.green{color:#55e28a}
.red{color:#ff7182}
.yellow{color:#ffd166}
.muted{color:#8fa1b7}

.score{
font-size:28px;
font-weight:800
}

.small{
font-size:12px
}

</style>

</head>

<body>

<div class="wrap">

<h2>📊 اسکنر شخصی Bybit</h2>

<div class="card">

<div class="top">

<input
id="symbol"
class="input"
placeholder="BTCUSDT"
>

<button
class="btn"
onclick="analyze()"
>
تحلیل
</button>

</div>

<div class="small muted">
فقط 1 دقیقه و 15 دقیقه · بدون Radar و Pump/Dump · به‌روزرسانی زنده
</div>

</div>

<div id="out"></div>

</div>

<script>

let timer=null;
let last='';

const $=x=>
document.getElementById(x);

const esc=s=>
String(s??'')
.replace(
/[&<>"']/g,
m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[m])
);

const fmt=v=>
v==null||v===''
?'—'
:typeof v==='number'
?(Math.abs(v)>=1000
?v.toLocaleString(
'en-US',
{maximumFractionDigits:4}
)
:v.toFixed(5))
:esc(v);

const cls=d=>
d==='BULLISH'||d==='LONG'
?'green'
:d==='BEARISH'||d==='SHORT'
?'red'
:'yellow';

function styles(st){

return(st.items||[])
.map(i=>`

<details class="item">

<summary>

${esc(i.name)}

—

<span class="${cls(i.direction)}">

${esc(i.direction)}

· ${i.score}/100

</span>

</summary>

<div class="content">

<div class="row">

<span>
امتیاز
</span>

<b>
${i.score}/100
</b>

</div>

<pre
class="small"
style="white-space:pre-wrap"
>${esc(
JSON.stringify(
i.details||{},
null,
2
)
)}</pre>

</div>

</details>

`)
.join('');

}

function tf(x){

let a=x.analysis||{};
let e=x.indicators||{};
let f=x.footprint||{};
let w=x.orderBook||{};
let s=x.supportResistance||{};
let st=x.style||{};

return `

<details
open
class="item"
>

<summary>

${esc(x.label)}

—

<span class="${cls(
st.overall?.direction
)}">

${esc(
st.overall?.direction
)}

${st.overall?.score||0}/100

</span>

</summary>

<div class="content">

<div class="grid">

<div class="box">

<b>
MA / Market
</b>

<div>
MA7:
${fmt(a.ma7)}
</div>

<div>
MA20:
${fmt(a.ma20)}
</div>

<div>
شیب:
${esc(a.maSlope)}
</div>

<div>
ADX:
${fmt(a.market?.adx)}
</div>

</div>

<div class="box">

<b>
MACD / RSI
</b>

<div>
${esc(e.MACD?.direction)}
· Hist
${fmt(e.MACD?.hist)}
</div>

<div>
RSI:
${fmt(e.RSI?.value)}
</div>

</div>

<div class="box">

<b>
SMC / ICT
</b>

<div>
BOS:
${esc(a.bos)}
</div>

<div>
CHoCH:
${esc(a.choch)}
</div>

<div>
FVG:
${esc(a.fvg?.type)}
</div>

<div>
OB:
${esc(a.orderBlock?.type)}
</div>

</div>

<div class="box">

<b>
Hunt
</b>

<div>
${esc(a.hunt?.side)}
${a.hunt?.confirmed?'✓':''}
</div>

<div>
Level:
${fmt(a.hunt?.level)}
</div>

</div>

</div>

<details class="item">

<summary>
▼ Footprint / Delta
</summary>

<div class="content">

<div class="row">

<span>
Buy
</span>

<b>
${fmt(f.buyVolume)}
</b>

</div>

<div class="row">

<span>
Sell
</span>

<b>
${fmt(f.sellVolume)}
</b>

</div>

<div class="row">

<span>
Delta
</span>

<b class="${
f.delta>0
?'green'
:f.delta<0
?'red'
:'yellow'
}">

${fmt(f.delta)}
(${fmt(f.deltaPercent)}%)

</b>

</div>

<div class="row">

<span>
Pressure
</span>

<b>
${esc(f.pressure)}
</b>

</div>

</div>

</details>

<details class="item">

<summary>
▼ Order Book / Walls
</summary>

<div class="content">

<div class="row">

<span>
Buy Wall
</span>

<b>
${fmt(w.buy?.price)}
·
$${fmt(w.buy?.notional)}
</b>

</div>

<div class="row">

<span>
Sell Wall
</span>

<b>
${fmt(w.sell?.price)}
·
$${fmt(w.sell?.notional)}
</b>

</div>

<div class="row">

<span>
Buy/Sell Strength
</span>

<b>
${fmt(w.buyStrength)}
/
${fmt(w.sellStrength)}
</b>

</div>

</div>

</details>

<details class="item">

<summary>
▼ Support / Resistance
</summary>

<div class="content">

<div class="row">

<span>
حمایت
</span>

<b>
${fmt(
s.nearestSupport?.price
)}
</b>

</div>

<div class="row">

<span>
مقاومت
</span>

<b>
${fmt(
s.nearestResistance?.price
)}
</b>

</div>

</div>

</details>

<details class="item">

<summary>
▼ سبک‌های معاملاتی
</summary>

<div class="content">

${styles(st)}

</div>

</details>

</div>

</details>

`;

}

function render(d){

$('out').innerHTML=

`

<div class="card">

<div class="score ${cls(
d.marketState
)}">

${esc(d.marketState)}
· ${d.score}/100

</div>

<div>

${esc(d.symbol)}

·

${d.category==='linear'
?'Futures'
:'Spot'}

· قیمت

<b>
${fmt(d.price)}
</b>

</div>

<div class="small muted">

${new Date(
d.generatedAt
).toLocaleTimeString(
'fa-IR'
)}

</div>

</div>

`

+

['1','15']
.map(
k=>
d.deepByTimeframe[k]
?tf(
d.deepByTimeframe[k]
)
:''
)
.join('');

}

async function get(s){

let r=
await fetch(
`/api/analyze?symbol=${
encodeURIComponent(s)
}&mode=personal&strictness=75`
);

let d=await r.json();

if(!d.ok)
throw Error(
d.error||'خطا'
);

return d;

}

async function analyze(){

let s=
$('symbol')
.value
.trim();

if(!s)return;

if(timer)
clearInterval(timer);

last=s;

$('out').innerHTML=
`
<div class="card">
در حال تحلیل...
</div>
`;

try{

render(
await get(s)
);

timer=setInterval(
async()=>{
try{

render(
await get(last)
);

}catch(e){}

},
8000
);

}catch(e){

$('out').innerHTML=
`
<div class="card red">
${esc(e.message)}
</div>
`;

}

}

</script>

</body>
</html>
