<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اسکنر شخصی</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0b0f14;
  color:#eaf2ff;
  font-family:Tahoma,Arial,sans-serif
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:14px
}

.top{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center
}

.box,.card{
  background:#111821;
  border:1px solid #263241;
  border-radius:14px;
  padding:12px;
  margin:10px 0
}

.btn{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  background:#1d6fff;
  color:#fff;
  font-weight:700
}

.input{
  flex:1;
  min-width:180px;
  background:#0b1118;
  color:#fff;
  border:1px solid #334155;
  border-radius:10px;
  padding:11px
}

.muted{
  color:#8fa1b7
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));
  gap:10px
}

.green{color:#54e08a}
.red{color:#ff6b7d}
.yellow{color:#ffd166}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  border-bottom:1px solid #202b38;
  padding:8px 0
}

.item{
  background:#0d141d;
  border:1px solid #263241;
  border-radius:10px;
  margin:7px 0
}

.item summary{
  cursor:pointer;
  padding:11px;
  font-weight:700;
  list-style:none
}

.item summary::-webkit-details-marker{
  display:none
}

.content{
  padding:0 11px 11px
}

.score{
  font-size:28px;
  font-weight:800
}

.small{
  font-size:12px
}

.refresh{
  font-size:12px;
  color:#8fa1b7
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:8px;
  background:#1b2634
}
</style>
</head>

<body>

<div class="wrap">

<h2>📊 اسکنر شخصی</h2>

<div class="box">

<div class="top">

<input
  id="symbol"
  class="input"
  placeholder="مثلاً BTCUSDT"
>

<button
  class="btn"
  onclick="analyze()"
>
تحلیل
</button>

</div>

<div class="small muted">
تحلیل خودکار فقط در تایم‌فریم‌های ۱ دقیقه و ۱۵ دقیقه · به‌روزرسانی زنده
</div>

</div>

<div id="out"></div>

</div>

<script>

let timer=null;
let lastSymbol='';

const $=id=>
  document.getElementById(id);

const esc=s=>
  String(s??'').replace(
    /[&<>"']/g,
    m=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[m])
  );

const DIR={
  BULLISH:'صعودی',
  BEARISH:'نزولی',
  RANGE:'رنج',
  LONG:'خرید',
  SHORT:'فروش',
  WAIT:'انتظار',
  NONE:'ندارد',
  UP:'صعودی',
  DOWN:'نزولی',
  FLAT:'خنثی',
  NORMAL:'عادی',
  SPIKE:'جهش'
};

const TYPE={
  BULLISH:'صعودی',
  BEARISH:'نزولی',
  BULLISH_DIVERGENCE:'واگرایی صعودی',
  BEARISH_DIVERGENCE:'واگرایی نزولی',
  NONE:'ندارد',
  SWING_SUPPORT:'حمایت نوسانی',
  SWING_RESISTANCE:'مقاومت نوسانی',
  BUY_WALL:'دیوار خرید',
  SELL_WALL:'دیوار فروش'
};

const label=v=>
  DIR[v] ||
  TYPE[v] ||
  String(v??'—');

function dirClass(d){

  return d==='BULLISH' ||
         d==='LONG' ||
         d==='UP'
    ? 'green'

    : d==='BEARISH' ||
      d==='SHORT' ||
      d==='DOWN'
      ? 'red'

      : 'yellow';
}

function fmt(v){

  if(v==null || v==='')
    return '—';

  if(typeof v==='number'){

    return Math.abs(v)>=1000

      ? v.toLocaleString(
          'fa-IR',
          {
            maximumFractionDigits:4
          }
        )

      : v.toLocaleString(
          'fa-IR',
          {
            maximumFractionDigits:6
          }
        );
  }

  return esc(v);
}

function rememberOpen(){

  return [
    ...document.querySelectorAll(
      'details[data-key]'
    )
  ]
  .filter(x=>x.open)
  .map(x=>x.dataset.key);
}

function restoreOpen(keys){

  keys.forEach(k=>{

    const x=
      document.querySelector(
        `details[data-key="${CSS.escape(k)}"]`
      );

    if(x)
      x.open=true;
  });
}

function renderStyles(x){

  return (x.items||[])
    .map(
      (i,n)=>
        `<div class="row">

          <span>
            ${esc(
              i.name ||
              [
                'ساختار بازار',
                'اسمارت مانی',
                'ایچیموکو',
                'مومنتوم',
                'حجم',
                'جریان سفارش',
                'نقدینگی'
              ][n] ||
              'سبک'
            )}
          </span>

          <b class="${dirClass(i.direction)}">
            ${label(i.direction)}
            ·
            ${i.score||0}/100
          </b>

        </div>`
    )
    .join('');
}

function renderTF(key,x){

  const a=x.analysis||{};
  const e=x.indicators||{};
  const f=x.footprint||{};
  const w=x.orderBook||{};
  const s=x.supportResistance||{};
  const st=x.style||{};

  return `

  <details
    class="item"
    data-key="tf-${key}"
  >

  <summary>

    ${esc(x.label||key+' دقیقه')}

    —

    <span
      class="${dirClass(
        st.overall?.direction
      )}"
    >

      ${label(
        st.overall?.direction ||
        'RANGE'
      )}

      ${st.overall?.score||0}/100

    </span>

  </summary>

  <div class="content">

  <div class="grid">

    <div class="box">

      <b>میانگین‌های متحرک</b>

      <div>
        MA7:
        ${fmt(a.ma7)}
      </div>

      <div>
        MA20:
        ${fmt(a.ma20)}
      </div>

      <div>
        شیب:
        ${label(a.maSlope)}
      </div>

      <div>
        قدرت روند:
        ${fmt(a.adx)}
      </div>

      <div>
        دامنه نوسان:
        ${fmt(a.atrPct)}%
      </div>

    </div>


    <div class="box">

      <b>MACD و RSI</b>

      <div>
        جهت MACD:
        ${label(e.MACD?.direction)}
      </div>

      <div>
        هیستوگرام:
        ${fmt(e.MACD?.hist)}
      </div>

      <div>
        RSI:
        ${fmt(e.RSI?.value)}
      </div>

    </div>


    <div class="box">

      <b>ایچیموکو و واگرایی</b>

      <div>
        ایچیموکو:
        ${label(e.ICHIMOKU?.direction)}
      </div>

      <div>
        واگرایی:
        ${label(e.DIVERGENCE?.type)}
      </div>

    </div>


    <div class="box">

      <b>SMC / ICT</b>

      <div>
        شکست ساختار:
        ${label(a.bos)}
      </div>

      <div>
        تغییر ساختار:
        ${label(a.choch)}
      </div>

      <div>
        شکاف ارزش منصفانه:
        ${label(a.fvg?.type)}
      </div>

      <div>
        بلوک سفارش:
        ${label(a.orderBlock?.type)}
      </div>

    </div>

  </div>


  <details
    class="item"
    data-key="${key}-hunt"
  >

    <summary>
      ▼ هانت / جمع‌آوری نقدینگی
    </summary>

    <div class="content">

      <div class="row">

        <span>
          جهت هانت
        </span>

        <b
          class="${dirClass(
            a.hunt?.side
          )}"
        >
          ${label(a.hunt?.side)}
        </b>

      </div>


      <div class="row">

        <span>
          تأیید شده
        </span>

        <b>
          ${
            a.hunt?.confirmed
              ? 'بله'
              : 'خیر'
          }
        </b>

      </div>


      <div class="row">

        <span>
          قیمت هانت
        </span>

        <b>
          ${fmt(
            a.hunt?.level ||
            a.price
          )}
        </b>

      </div>

    </div>

  </details>


  <details
    class="item"
    data-key="${key}-foot"
  >

    <summary>
      ▼ فوت‌پرینت / بید / آسک / دلتا
    </summary>

    <div class="content">

      <div class="row">
        <span>حجم خرید</span>
        <b>${fmt(f.buyVolume)}</b>
      </div>

      <div class="row">
        <span>حجم فروش</span>
        <b>${fmt(f.sellVolume)}</b>
      </div>

      <div class="row">

        <span>دلتا</span>

        <b
          class="${
            f.delta>0
              ? 'green'
              : f.delta<0
                ? 'red'
                : 'yellow'
          }"
        >

          ${fmt(f.delta)}
          (${fmt(f.deltaPercent)}%)

        </b>

      </div>

      <div class="row">
        <span>فشار سفارش</span>
        <b>${label(f.pressure)}</b>
      </div>

      <div class="row">
        <span>ارزش خرید</span>
        <b>${fmt(f.buyNotional)}</b>
      </div>

      <div class="row">
        <span>ارزش فروش</span>
        <b>${fmt(f.sellNotional)}</b>
      </div>

      <div class="row">
        <span>تعداد معاملات</span>
        <b>
          ${fmt(
            f.trades ||
            f.availableTrades
          )}
        </b>
      </div>

    </div>

  </details>


  <details
    class="item"
    data-key="${key}-book"
  >

    <summary>
      ▼ دفتر سفارش / دیوارهای خرید و فروش
    </summary>

    <div class="content">

      <div class="row">

        <span>
          دیوار خرید
        </span>

        <b>
          ${fmt(w.buy?.price)}
          ·
          ${fmt(w.buy?.notional)}
        </b>

      </div>


      <div class="row">

        <span>
          دیوار فروش
        </span>

        <b>
          ${fmt(w.sell?.price)}
          ·
          ${fmt(w.sell?.notional)}
        </b>

      </div>


      <div class="row">

        <span>
          قدرت خرید
        </span>

        <b>
          ${fmt(w.buyStrength)}
        </b>

      </div>


      <div class="row">

        <span>
          قدرت فروش
        </span>

        <b>
          ${fmt(w.sellStrength)}
        </b>

      </div>

    </div>

  </details>


  <details
    class="item"
    data-key="${key}-sr"
  >

    <summary>
      ▼ حمایت و مقاومت
    </summary>

    <div class="content">

      <div class="row">

        <span>
          حمایت نزدیک
        </span>

        <b>
          ${fmt(
            s.nearestSupport?.price
          )}
        </b>

      </div>


      <div class="row">

        <span>
          مقاومت نزدیک
        </span>

        <b>
          ${fmt(
            s.nearestResistance?.price
          )}
        </b>

      </div>


      <div class="row">

        <span>
          قوی‌ترین حمایت
        </span>

        <b>
          ${fmt(
            s.strongestSupport?.price
          )}
        </b>

      </div>


      <div class="row">

        <span>
          قوی‌ترین مقاومت
        </span>

        <b>
          ${fmt(
            s.strongestResistance?.price
          )}
        </b>

      </div>

    </div>

  </details>


  <details
    class="item"
    data-key="${key}-styles"
  >

    <summary>
      ▼ سبک‌های معاملاتی
    </summary>

    <div class="content">

      ${renderStyles(st)}

    </div>

  </details>

  </div>

  </details>

  `;
}

function render(d){

  const open=
    rememberOpen();

  const main=`

  <div class="card">

    <div
      class="score ${dirClass(
        d.marketState
      )}"
    >

      ${label(d.marketState)}
      ·
      ${d.score}/100

    </div>

    <div>

      قیمت:
      <b>
        ${fmt(d.price)}
      </b>

    </div>

    <div class="refresh">

      آخرین به‌روزرسانی:
      ${
        new Date(
          d.generatedAt
        ).toLocaleTimeString(
          'fa-IR'
        )
      }

    </div>

  </div>

  `;

  const wanted=[
    '1',
    '15'
  ];

  const tfs=
    Object.entries(
      d.deepByTimeframe||{}
    )
    .filter(
      ([k])=>
        wanted.includes(
          String(k)
        )
    )
    .map(
      ([k,x])=>
        renderTF(k,x)
    )
    .join('');

  $('out').innerHTML=
    main+tfs;

  restoreOpen(open);
}

async function get(sym){

  const u=
    `/api/analyze?symbol=${
      encodeURIComponent(sym)
    }&mode=personal&strictness=75`;

  const r=
    await fetch(
      u,
      {
        cache:'no-store'
      }
    );

  const d=
    await r.json();

  if(!d.ok)
    throw Error(
      d.error ||
      'خطا'
    );

  return d;
}

async function analyze(){

  const s=
    $('symbol')
      .value
      .trim();

  if(!s)
    return;

  if(timer)
    clearInterval(timer);

  lastSymbol=s;

  try{

    $('out').innerHTML=
      '<div class="box">در حال تحلیل...</div>';

    const d=
      await get(s);

    render(d);

    timer=
      setInterval(
        async()=>{
          try{
            render(
              await get(
                lastSymbol
              )
            );
          }
          catch(e){}
        },
        8000
      );

  }
  catch(e){

    $('out').innerHTML=
      `<div class="box red">
        ${esc(e.message)}
      </div>`;
  }
}

$('symbol')
  .addEventListener(
    'keydown',
    e=>{
      if(e.key==='Enter')
        analyze();
    }
  );

</script>

</body>
</html>
