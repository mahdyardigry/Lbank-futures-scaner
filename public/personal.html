<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Personal Smart Radar</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:#080c12;
  color:#e8edf5;
  font-family:Tahoma,Arial,sans-serif;
}

body{
  min-height:100vh;
}

button{
  font-family:inherit;
}

.header{
  position:sticky;
  top:0;
  z-index:20;
  background:#0c1119;
  border-bottom:1px solid #202938;
  padding:14px;
}

.header-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.title{
  font-size:20px;
  font-weight:bold;
}

.status{
  font-size:12px;
  padding:7px 10px;
  border-radius:20px;
  background:#152019;
  color:#45e08b;
}

.status.off{
  background:#261619;
  color:#ff6b6b;
}

.sub{
  margin-top:8px;
  color:#8792a4;
  font-size:12px;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:14px;
}

.control-box{
  background:#0d131c;
  border:1px solid #202938;
  border-radius:14px;
  padding:12px;
  margin-bottom:14px;
}

.control-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
}

.control-row button{
  border:1px solid #293445;
  background:#151c27;
  color:#fff;
  border-radius:9px;
  padding:9px 14px;
  cursor:pointer;
}

.control-row button:hover{
  background:#1d2735;
}

.control-row button.active{
  background:#163b2a;
  border-color:#287b51;
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:12px;
}

.info{
  background:#0a1018;
  border:1px solid #202938;
  border-radius:10px;
  padding:10px;
}

.info-label{
  color:#7d8899;
  font-size:11px;
}

.info-value{
  margin-top:5px;
  font-weight:bold;
  font-size:14px;
}

.section-title{
  margin:18px 0 10px;
  font-size:16px;
  font-weight:bold;
}

.signal-list{
  display:grid;
  gap:10px;
}

.signal{
  background:#0d131c;
  border:1px solid #263143;
  border-radius:14px;
  overflow:hidden;
}

.signal.long{
  border-right:4px solid #28c979;
}

.signal.short{
  border-right:4px solid #ff5d68;
}

.signal-head{
  padding:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.symbol{
  font-weight:bold;
  font-size:17px;
}

.direction{
  font-weight:bold;
  padding:6px 10px;
  border-radius:8px;
  font-size:12px;
}

.direction.long{
  background:#123522;
  color:#45e08b;
}

.direction.short{
  background:#3b171b;
  color:#ff6872;
}

.signal-meta{
  padding:0 12px 10px;
  color:#8994a5;
  font-size:11px;
}

.score-row{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  padding:0 12px 12px;
}

.badge{
  padding:6px 9px;
  border-radius:8px;
  background:#151c27;
  border:1px solid #263143;
  font-size:11px;
}

.badge.green{
  color:#4be58e;
}

.badge.red{
  color:#ff6872;
}

.badge.yellow{
  color:#ffd166;
}

.signal-actions{
  border-top:1px solid #202938;
  padding:10px 12px;
}

.deep-btn{
  width:100%;
  border:1px solid #334157;
  background:#151d29;
  color:#fff;
  padding:10px;
  border-radius:9px;
  cursor:pointer;
}

.deep-btn:hover{
  background:#202b3c;
}

.empty{
  text-align:center;
  padding:35px 10px;
  color:#737f91;
  background:#0d131c;
  border:1px dashed #263143;
  border-radius:14px;
}

.deep-panel{
  position:fixed;
  top:0;
  bottom:0;
  left:0;
  width:min(620px,100%);
  background:#080d14;
  border-right:1px solid #293445;
  z-index:100;
  transform:translateX(-105%);
  transition:.25s ease;
  overflow:auto;
  box-shadow:10px 0 40px rgba(0,0,0,.45);
}

.deep-panel.open{
  transform:translateX(0);
}

.deep-header{
  position:sticky;
  top:0;
  z-index:2;
  background:#0d131c;
  border-bottom:1px solid #202938;
  padding:12px;
}

.deep-header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.close{
  background:#24161a;
  color:#ff7078;
  border:1px solid #54262d;
  border-radius:8px;
  padding:8px 12px;
  cursor:pointer;
}

.deep-content{
  padding:12px;
}

.deep-section{
  background:#0d131c;
  border:1px solid #202938;
  border-radius:12px;
  margin-bottom:10px;
  overflow:hidden;
}

.deep-section-title{
  padding:10px 12px;
  background:#111923;
  font-weight:bold;
  font-size:13px;
}

.deep-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  padding:10px;
}

.metric{
  background:#090f16;
  border:1px solid #202938;
  border-radius:8px;
  padding:9px;
}

.metric small{
  display:block;
  color:#778397;
  font-size:10px;
}

.metric strong{
  display:block;
  margin-top:5px;
  font-size:13px;
}

.bull{
  color:#42df89;
}

.bear{
  color:#ff6872;
}

.neutral{
  color:#ffd166;
}

.level{
  display:flex;
  justify-content:space-between;
  gap:8px;
  padding:9px 12px;
  border-bottom:1px solid #1b2430;
  font-size:12px;
}

.level:last-child{
  border-bottom:0;
}

.reason{
  padding:8px 12px;
  border-bottom:1px solid #1b2430;
  font-size:12px;
  color:#cbd3df;
}

.trade-box{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  padding:10px;
}

.trade{
  padding:10px;
  border-radius:9px;
  background:#090f16;
  border:1px solid #202938;
  text-align:center;
}

.trade small{
  display:block;
  color:#7d8899;
  font-size:10px;
}

.trade strong{
  display:block;
  margin-top:5px;
  font-size:13px;
}

.alert{
  position:fixed;
  left:15px;
  right:15px;
  bottom:15px;
  z-index:200;
  background:#111923;
  border:1px solid #344257;
  border-radius:12px;
  padding:12px;
  display:none;
  box-shadow:0 10px 35px rgba(0,0,0,.4);
}

.alert.show{
  display:block;
}

.alert-title{
  font-weight:bold;
}

.alert-text{
  color:#aab4c3;
  font-size:11px;
  margin-top:5px;
}

@media(max-width:700px){

  .info-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .deep-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .trade-box{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="header-top">

    <div class="title">
      📡 Personal Smart Radar
    </div>

    <div id="status" class="status">
      در حال اتصال...
    </div>

  </div>

  <div class="sub">
    اسکن خودکار برخورد قیمت با MA20 تایم‌فریم 1 دقیقه و تأیید چندگانه
  </div>

</header>

<main class="container">

  <div class="control-box">

    <div class="control-row">

      <button
        id="startBtn"
        class="active"
        onclick="startScanner()">
        ▶ شروع اسکن
      </button>

      <button
        id="stopBtn"
        onclick="stopScanner()">
        ⏸ توقف اسکن
      </button>

      <button onclick="scanNow()">
        🔄 اسکن فوری
      </button>

      <button onclick="clearSignals()">
        🗑 پاک کردن
      </button>

    </div>

    <div class="info-grid">

      <div class="info">
        <div class="info-label">وضعیت اسکن</div>
        <div id="scanState" class="info-value">فعال</div>
      </div>

      <div class="info">
        <div class="info-label">آخرین اسکن</div>
        <div id="lastScan" class="info-value">---</div>
      </div>

      <div class="info">
        <div class="info-label">تعداد سیگنال</div>
        <div id="signalCount" class="info-value">0</div>
      </div>

      <div class="info">
        <div class="info-label">حداقل قدرت</div>
        <div class="info-value">75 / 100</div>
      </div>

    </div>

  </div>

  <div class="section-title">
    🔥 سیگنال‌های جدید
  </div>

  <div id="signals" class="signal-list">

    <div class="empty">
      هنوز سیگنال قوی پیدا نشده است.
      <br>
      اسکن خودکار در حال بررسی بازار است.
    </div>

  </div>

</main>

<!-- DEEP PANEL -->

<aside id="deepPanel" class="deep-panel">

  <div class="deep-header">

    <div class="deep-header-row">

      <strong id="deepTitle">
        تحلیل عمیق
      </strong>

      <button
        class="close"
        onclick="closeDeep()">
        ✕ بستن
      </button>

    </div>

  </div>

  <div
    id="deepContent"
    class="deep-content">

  </div>

</aside>

<div id="alert" class="alert">

  <div id="alertTitle" class="alert-title">
    🚨 سیگنال جدید
  </div>

  <div id="alertText" class="alert-text">
  </div>

</div>

<script>

/* =========================================================
CONFIG
========================================================= */

const API_BASE = "";

const SCAN_INTERVAL = 15000;

const MIN_SCORE = 75;

let timer = null;

let scanning = false;

let scanOffset = 0;

let signals = [];

let seen = new Set();

let currentDeep = null;


/* =========================================================
ELEMENTS
========================================================= */

const $ = id =>
  document.getElementById(id);


/* =========================================================
STATUS
========================================================= */

function setStatus(text,on=true){

  $("status").textContent=text;

  $("status").classList.toggle(
    "off",
    !on
  );
}


/* =========================================================
FORMAT
========================================================= */

function num(v,d=2){

  const x=Number(v);

  if(!Number.isFinite(x))
    return "---";

  return x.toLocaleString(
    "en-US",
    {
      maximumFractionDigits:d
    }
  );
}

function price(v){

  const x=Number(v);

  if(!Number.isFinite(x))
    return "---";

  if(x>=1000)
    return x.toLocaleString(
      "en-US",
      {maximumFractionDigits:2}
    );

  if(x>=1)
    return x.toLocaleString(
      "en-US",
      {maximumFractionDigits:5}
    );

  return x.toLocaleString(
    "en-US",
    {maximumFractionDigits:10}
  );
}

function time(v){

  if(!v)
    return "---";

  return new Date(v)
    .toLocaleTimeString(
      "fa-IR",
      {
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit"
      }
    );
}


/* =========================================================
API
========================================================= */

async function api(path){

  const r=
    await fetch(
      API_BASE+path,
      {
        cache:"no-store"
      }
    );

  const d=
    await r.json();

  if(!r.ok || d.ok===false){

    throw new Error(
      d.error ||
      `HTTP ${r.status}`
    );
  }

  return d;
}


/* =========================================================
HEALTH
========================================================= */

async function health(){

  try{

    await api("/api/health");

    setStatus(
      "🟢 متصل",
      true
    );

  }catch(e){

    setStatus(
      "🔴 خطا",
      false
    );

  }
}


/* =========================================================
START / STOP
========================================================= */

function startScanner(){

  if(scanning)
    return;

  scanning=true;

  $("scanState").textContent=
    "فعال";

  $("startBtn")
    .classList.add("active");

  runScan();

  timer=
    setInterval(
      runScan,
      SCAN_INTERVAL
    );
}


function stopScanner(){

  scanning=false;

  $("scanState").textContent=
    "متوقف";

  $("startBtn")
    .classList.remove("active");

  if(timer){

    clearInterval(timer);

    timer=null;
  }
}


function scanNow(){

  runScan();
}


/* =========================================================
SCAN
========================================================= */

async function runScan(){

  try{

    setStatus(
      "🟢 در حال اسکن",
      true
    );

    const data=
      await api(
        `/api/scan?offset=${scanOffset}`
      );

    $("lastScan").textContent=
      time(Date.now());

    scanOffset=
      Number(
        data.nextOffset || 0
      );

    const results=
      Array.isArray(data.results)
        ? data.results
        : [];

    for(const x of results){

      if(!x)
        continue;

      const score=
        Number(x.score || 0);

      if(score<MIN_SCORE)
        continue;

      /*
       * فقط سیگنال‌هایی که واقعاً
       * جهت مشخص دارند.
       */

      if(
        x.direction!=="LONG" &&
        x.direction!=="SHORT"
      ){
        continue;
      }

      addSignal(x);
    }

    setStatus(
      "🟢 آماده",
      true
    );

  }catch(e){

    console.error(e);

    setStatus(
      "🔴 خطای اتصال",
      false
    );

  }

}


/* =========================================================
ADD SIGNAL
========================================================= */

function addSignal(x){

  /*
   * کلید سیگنال
   * برای جلوگیری از تکرار
   */

  const key=
    [
      x.symbol,
      x.direction,
      x.timeframes?.["1"]?.timestamp || ""
    ].join("_");

  if(seen.has(key))
    return;

  seen.add(key);

  const signal={
    ...x,
    detectedAt:Date.now(),
    key
  };

  signals.unshift(signal);

  /*
   * حداکثر 100 سیگنال
   */

  if(signals.length>100){

    const removed=
      signals.pop();

    if(removed)
      seen.delete(
        removed.key
      );
  }

  renderSignals();

  notifySignal(signal);
}


/* =========================================================
RENDER SIGNALS
========================================================= */

function renderSignals(){

  $("signalCount").textContent=
    signals.length;

  if(!signals.length){

    $("signals").innerHTML=`
      <div class="empty">
        هنوز سیگنال قوی پیدا نشده است.
      </div>
    `;

    return;
  }

  $("signals").innerHTML=
    signals.map(
      (x,i)=>
        signalHTML(x,i)
    ).join("");
}


function signalHTML(x,index){

  const long=
    x.direction==="LONG";

  const dir=
    long
      ? "LONG"
      : "SHORT";

  const score=
    Number(x.score||0);

  const one=
    x.timeframes?.["1"] || {};

  const ma=
    one.ma20;

  const fp=
    x.footprint || {};

  const wall=
    x.walls || {};

  const movement=
    x.movement || {};

  return `

    <div class="signal ${long?"long":"short"}">

      <div class="signal-head">

        <div>

          <div class="symbol">
            ${escapeHTML(x.symbol)}
          </div>

          <div class="signal-meta">
            قیمت: ${price(x.price)}
          </div>

        </div>

        <div class="direction ${long?"long":"short"}">
          ${dir}
        </div>

      </div>

      <div class="score-row">

        <div class="badge ${long?"green":"red"}">
          قدرت ${score}/100
        </div>

        <div class="badge">
          MA20: ${price(ma)}
        </div>

        <div class="badge">
          زمان: ${time(x.detectedAt)}
        </div>

        ${
          fp && !fp.error
          ? `
            <div class="badge ${
              fp.deltaPercent>=0
                ? "green"
                : "red"
            }">
              Delta ${num(fp.deltaPercent,1)}%
            </div>
          `
          :""
        }

        ${
          wall && !wall.error
          ? `
            <div class="badge yellow">
              Liquidity ${num(
                Math.max(
                  wall.buyStrength||0,
                  wall.sellStrength||0
                ),0
              )}
            </div>
          `
          :""
        }

        ${
          movement
          ? `
            <div class="badge">
              Pump ${num(movement.pumpScore,0)}
              /
              Dump ${num(movement.dumpScore,0)}
            </div>
          `
          :""
        }

      </div>

      <div class="signal-meta">

        ${
          x.signalLevel
          ? `سطح سیگنال: ${escapeHTML(
              x.signalLevel
            )}`
          :""
        }

      </div>

      <div class="signal-actions">

        <button
          class="deep-btn"
          onclick="openDeep(${index})">

          🔍 مشاهده تحلیل عمیق

        </button>

      </div>

    </div>

  `;
}


/* =========================================================
DEEP
========================================================= */

function openDeep(index){

  const x=
    signals[index];

  if(!x)
    return;

  currentDeep=x;

  $("deepTitle").textContent=
    `تحلیل عمیق ${x.symbol}`;

  $("deepContent").innerHTML=
    deepHTML(x);

  $("deepPanel")
    .classList.add("open");
}


function closeDeep(){

  $("deepPanel")
    .classList.remove("open");

  currentDeep=null;
}


/* =========================================================
DEEP HTML
========================================================= */

function deepHTML(x){

  const one=
    x.timeframes?.["1"] || {};

  const three=
    x.timeframes?.["3"] || {};

  const five=
    x.timeframes?.["5"] || {};

  const fifteen=
    x.timeframes?.["15"] || {};

  const hour=
    x.timeframes?.["60"] || {};

  const fp=
    x.footprint || {};

  const wall=
    x.walls || {};

  const sr=
    x.supportResistance || {};

  const market=
    x.market || {};

  const styles=
    x.styles || {};

  const movement=
    x.movement || {};

  const reversal=
    x.reversal || {};

  const reasons=
    Array.isArray(x.reasons)
      ? x.reasons
      : [];

  const trade=
    calculateTradePlan(x);

  return `

    ${tradeHTML(trade)}

    ${section(
      "📊 خلاصه سیگنال",
      `
      <div class="deep-grid">

        ${metric(
          "جهت",
          x.direction,
          x.direction==="LONG"
            ? "bull"
            : "bear"
        )}

        ${metric(
          "قدرت",
          `${num(x.score,0)} / 100`
        )}

        ${metric(
          "قیمت",
          price(x.price)
        )}

        ${metric(
          "زمان کشف",
          time(x.detectedAt)
        )}

        ${metric(
          "سطح",
          x.signalLevel
        )}

        ${metric(
          "وضعیت Pump/Dump",
          movement.pumpDumpStatus
        )}

      </div>
      `
    )}

    ${section(
      "🎯 وضعیت سبک‌های معاملاتی",
      `
      <div class="deep-grid">

        ${styleMetric(
          "SMC",
          styles.SMC
        )}

        ${styleMetric(
          "ICT",
          styles.ICT
        )}

        ${styleMetric(
          "MA",
          styles.MA
        )}

        ${styleMetric(
          "Volume",
          styles.Volume
        )}

        ${styleMetric(
          "Candles",
          styles.Candles
        )}

        ${styleMetric(
          "Order Flow",
          styles.OrderFlow
        )}

        ${styleMetric(
          "Liquidity",
          styles.Liquidity
        )}

      </div>
      `
    )}

    ${section(
      "📈 MA20 تایم 1 دقیقه",
      `
      <div class="deep-grid">

        ${metric(
          "قیمت",
          price(one.price)
        )}

        ${metric(
          "MA20",
          price(one.ma20)
        )}

        ${metric(
          "MA7",
          price(one.ma7)
        )}

        ${metric(
          "شیب MA",
          one.maSlope
        )}

        ${metric(
          "Trend",
          one.trend
        )}

        ${metric(
          "برخورد MA20",
          one.touchMA20
            ? "بله"
            : "خیر"
        )}

        ${metric(
          "برخورد MA7",
          one.touchMA7
            ? "بله"
            : "خیر"
        )}

        ${metric(
          "Volume Spike",
          one.volume?.spike
            ? "بله"
            : "خیر"
        )}

      </div>
      `
    )}

    ${section(
      "🧠 ساختار بازار",
      `
      <div class="deep-grid">

        ${metric(
          "BOS",
          one.bos
        )}

        ${metric(
          "CHoCH",
          one.choch
        )}

        ${metric(
          "Swing High",
          price(
            one.structure?.swingHigh
          )
        )}

        ${metric(
          "Swing Low",
          price(
            one.structure?.swingLow
          )
        )}

        ${metric(
          "FVG",
          one.fvg?.type
        )}

        ${metric(
          "Order Block",
          one.orderBlock?.type
        )}

        ${metric(
          "Hunt",
          one.hunt?.side
        )}

        ${metric(
          "Hunt Confirm",
          one.hunt?.confirmed
            ? "تأیید"
            : "ندارد"
        )}

      </div>
      `
    )}

    ${section(
      "🕯️ کندل‌شناسی",
      `
      <div class="deep-grid">

        ${metric(

/* =========================================================
TRADE PLAN
========================================================= */

function calculateTradePlan(x){

  const one=
    x.timeframes?.["1"] || {};

  const p=
    Number(x.price||0);

  const atrV=
    Number(
      one.market?.atr ||
      one.atr ||
      0
    );

  const sr=
    x.supportResistance || {};

  const support=
    Number(
      sr.nearestSupport?.price || 0
    );

  const resistance=
    Number(
      sr.nearestResistance?.price || 0
    );

  /*
   * برای جلوگیری از SL/TP غیرمنطقی،
   * اگر ATR موجود نباشد از فاصله
   * حمایت/مقاومت استفاده می‌کنیم.
   */

  let risk=0;

  if(atrV>0){

    risk=atrV*1.2;

  }else if(
    x.direction==="LONG" &&
    support>0 &&
    support<p
  ){

    risk=p-support;

  }else if(
    x.direction==="SHORT" &&
    resistance>0 &&
    resistance>p
  ){

    risk=resistance-p;

  }else{

    risk=p*0.003;
  }

  risk=
    Math.max(
      risk,
      p*0.001
    );

  let entry=p;

  let sl=0;

  let tp1=0;
  let tp2=0;

  if(x.direction==="LONG"){

    sl=
      Math.min(
        p-risk,
        support>0
          ? support-risk*0.15
          : p-risk
      );

    tp1=
      p+risk*1.5;

    tp2=
      p+risk*2.5;

    if(
      resistance>p &&
      resistance>tp1
    ){

      tp1=resistance;
    }

  }else{

    sl=
      Math.max(
        p+risk,
        resistance>p
          ? resistance+risk*0.15
          : p+risk
      );

    tp1=
      p-risk*1.5;

    tp2=
      p-risk*2.5;

    if(
      support>0 &&
      support<p &&
      support<tp1
    ){

      tp1=support;
    }
  }

  const rr=
    risk>0
      ? Math.abs(tp1-entry)/risk
      : 0;

  return {
    entry,
    sl,
    tp1,
    tp2,
    risk,
    rr
  };
}

/* =========================================================

function section(title,content){

  return `

        ${title}

      ${content}

    </div>

  `;
}


function metric(label,value,cls=""){

  return `

    <div class="metric">

      <small>
        ${label}
      </small>

      <strong class="${cls}">
        ${escapeHTML(
          value===null ||
          value===undefined ||
          value===""
            ? "---"
            : String(value)
        )}
      </strong>

    </div>

  `;
}


function styleMetric(label,value){

  const v=
    Number(value||0);

  const cls=
    v>=75
      ? "bull"
      : v<=45
        ? "bear"
        : "neutral";

  return metric(
    label,
    `${v}/100`,
    cls
  );
}


function tfMetric(label,x){

  if(!x || x.error){

    return metric(
      label,
      "خطا",
      "bear"
    );
  }

  const state=
    x.trend ||
    x.maSlope ||
    "---";

  const cls=
    state==="BULLISH" ||
    state==="UP"
      ? "bull"
      : state==="BEARISH" ||
        state==="DOWN"
        ? "bear"
        : "neutral";

  return metric(
    label,
    `${state} | MA20 ${price(x.ma20)}`,
    cls
  );
}


function levelHTML(
  p,
  liquidity,
  distance,
  label=""
){

  return `

    <div class="level">

      <span>
        ${label || "Level"}
      </span>

      <span>
        ${price(p)}
      </span>

      <span>
        ${liquidity
          ? num(liquidity)
          : "---"}
      </span>

      <span>
        ${num(distance,2)}%
      </span>

    </div>

  `;
}


function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}


/* =========================================================
NOTIFICATION
========================================================= */

function notifySignal(x){

  const dir=
    x.direction==="LONG"
      ? "🟢 LONG"
      : "🔴 SHORT";

  const title=
    `🚨 سیگنال جدید ${x.symbol}`;

  const text=
    `${dir} | قدرت ${x.score}/100 | ${time(
      x.detectedAt
    )}`;

  $("alertTitle").textContent=
    title;

  $("alertText").textContent=
    text;

  $("alert").classList.add("show");

  setTimeout(
    ()=>
      $("alert")
        .classList.remove("show"),
    7000
  );

  /*
   * صدای هشدار
   */

  try{

    const AudioContext=
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioContext)
      return;

    const ctx=
      new AudioContext();

    const osc=
      ctx.createOscillator();

    const gain=
      ctx.createGain();

    osc.frequency.value=880;

    osc.type="sine";

    gain.gain.value=0.08;

    osc.connect(gain);

    gain.connect(
      ctx.destination
    );

    osc.start();

    setTimeout(
      ()=>{
        osc.frequency.value=660;
      },
      150
    );

    setTimeout(
      ()=>{
        osc.stop();
        ctx.close();
      },
      350
    );

  }catch(e){}

}
