<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اسکنر شخصی Bybit</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:#07111f;
  color:#e8f0fa;
}
button,input,select{font:inherit}
.container{
  width:min(1180px,94%);
  margin:auto;
  padding:18px 0 50px;
}
header{
  background:#0d1a2b;
  border:1px solid #1d334d;
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
}
h1{margin:0 0 8px;font-size:22px}
.sub{color:#91a4ba;font-size:13px}
.status{
  display:inline-flex;
  align-items:center;
  gap:7px;
  margin-top:12px;
  padding:7px 12px;
  border-radius:20px;
  background:#10243a;
  color:#7ee2a8;
  font-size:12px;
}
.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#37d47a;
}
.panel{
  background:#0d1a2b;
  border:1px solid #1d334d;
  border-radius:16px;
  margin-bottom:14px;
  overflow:visible;
}
.panel-title{
  padding:15px 16px;
  font-weight:bold;
  border-bottom:1px solid #1d334d;
}
.panel-body{padding:15px}
.search{
  display:flex;
  gap:8px;
}
input{
  flex:1;
  min-width:0;
  background:#081524;
  color:#fff;
  border:1px solid #29425e;
  border-radius:10px;
  padding:12px;
  outline:none;
}
input:focus{border-color:#4b89c8}
button{
  border:0;
  border-radius:10px;
  padding:11px 16px;
  cursor:pointer;
  background:#1769aa;
  color:#fff;
}
button:hover{filter:brightness(1.12)}
button.secondary{background:#18304a}
button.green{background:#16734c}
button.red{background:#8d3040}
.results{
  position:relative;
  z-index:50;
}
.search-results{
  position:absolute;
  top:calc(100% + 5px);
  right:0;
  left:0;
  background:#0b1828;
  border:1px solid #29425e;
  border-radius:12px;
  overflow:hidden;
  display:none;
  max-height:300px;
  overflow-y:auto;
  box-shadow:0 15px 35px rgba(0,0,0,.45);
}
.search-results.show{display:block}
.result{
  padding:11px 13px;
  border-bottom:1px solid #1b2d41;
  cursor:pointer;
}
.result:last-child{border-bottom:0}
.result:hover{background:#142b43}
.result small{color:#8298ae}
.controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}
.control{
  background:#081524;
  border:1px solid #203a54;
  border-radius:10px;
  padding:9px 12px;
}
.control label{
  color:#8ea3b8;
  font-size:11px;
  display:block;
  margin-bottom:4px;
}
select{
  background:#081524;
  color:#fff;
  border:0;
  outline:0;
}
details{
  border:1px solid #1d334d;
  border-radius:12px;
  margin-top:10px;
  background:#091626;
}
details[open]{background:#0b192a}
summary{
  list-style:none;
  cursor:pointer;
  padding:13px 14px;
  font-weight:bold;
  user-select:none;
}
summary::-webkit-details-marker{display:none}
summary:after{
  content:"＋";
  float:left;
  color:#7190ad;
}
details[open] summary:after{content:"−"}
.detail{
  padding:0 14px 14px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}
.card{
  background:#091726;
  border:1px solid #1d334d;
  border-radius:12px;
  padding:12px;
}
.card .label{
  color:#7f95ab;
  font-size:11px;
  margin-bottom:6px;
}
.card .value{
  font-size:17px;
  font-weight:bold;
}
.green-t{color:#48dc91}
.red-t{color:#ff6677}
.yellow-t{color:#ffd36a}
.blue-t{color:#67b8ff}
.gray-t{color:#9badbf}
.signal{
  border-radius:14px;
  padding:16px;
  border:1px solid #29425e;
  background:#0a1726;
}
.signal-long{
  border-color:#18744d;
  background:#09251b;
}
.signal-short{
  border-color:#96394a;
  background:#291017;
}
.signal-wait{
  border-color:#665525;
  background:#211b0a;
}
.signal-main{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.signal-direction{
  font-size:25px;
  font-weight:bold;
}
.score{
  font-size:28px;
  font-weight:bold;
}
.badges{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:10px;
}
.badge{
  background:#13273d;
  border:1px solid #29445e;
  border-radius:20px;
  padding:6px 9px;
  font-size:11px;
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}
th,td{
  padding:9px 7px;
  border-bottom:1px solid #1d334d;
  text-align:center;
}
th{color:#8fa4b9}
pre{
  white-space:pre-wrap;
  word-break:break-word;
  background:#06101c;
  padding:12px;
  border-radius:10px;
  font-size:11px;
  direction:ltr;
  text-align:left;
  max-height:500px;
  overflow:auto;
}
.loading{
  padding:18px;
  text-align:center;
  color:#8ea4ba;
}
.error{
  color:#ff7180;
  background:#291018;
  border:1px solid #71303b;
  padding:12px;
  border-radius:10px;
}
.empty{
  color:#7f94aa;
  padding:10px 0;
}
@media(max-width:850px){
  .grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:520px){
  .container{width:96%;padding-top:10px}
  .search{flex-direction:column}
  .grid{grid-template-columns:1fr 1fr}
  .signal-main{align-items:flex-start}
  .signal-direction{font-size:21px}
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>🔎 اسکنر شخصی هوشمند Bybit</h1>
  <div class="sub">
    تحلیل واقعی بازار با MA20، ساختار، نقدینگی، Footprint، Order Book و Smart Money
  </div>
  <div class="status">
    <span class="dot"></span>
    <span id="connection">در حال اتصال...</span>
  </div>
</header>

<section class="panel">
  <div class="panel-title">🔎 بررسی دستی ارز</div>

  <div class="panel-body results">

    <div class="search">
      <input
        id="symbolInput"
        type="text"
        placeholder="مثلاً BTCUSDT"
        autocomplete="off"
      >
      <button id="analyzeBtn">بررسی</button>
    </div>

    <div id="searchResults" class="search-results"></div>

    <div class="controls">

      <div class="control">
        <label>بازار</label>
        <select id="category">
          <option value="linear">Futures</option>
          <option value="spot">Spot</option>
        </select>
      </div>

      <div class="control">
        <label>سختی سیگنال</label>
        <select id="difficulty">
          <option value="0">خیلی آسان</option>
          <option value="10">آسان</option>
          <option value="25" selected>متوسط</option>
          <option value="40">سخت</option>
          <option value="60">خیلی سخت</option>
          <option value="80">بسیار سخت</option>
          <option value="100">حداکثری</option>
        </select>
      </div>

      <button id="scanBtn" class="secondary">
        🔄 اسکن بازار
      </button>

    </div>
  </div>
</section>

<div id="output"></div>

</div>

<script>
/* =========================================================
   CONFIG
========================================================= */

const WORKER_URL = "";

const $ = id => document.getElementById(id);

const output = $("output");
const symbolInput = $("symbolInput");
const searchResults = $("searchResults");
const category = $("category");
const difficulty = $("difficulty");

/* =========================================================
   API
========================================================= */

async function api(path){
  const url =
    WORKER_URL +
    path;

  const res =
    await fetch(url,{
      cache:"no-store"
    });

  const data =
    await res.json();

  if(!res.ok || data.ok === false){
    throw new Error(
      data.error ||
      "خطا در دریافت اطلاعات"
    );
  }

  return data;
}

/* =========================================================
   HEALTH
========================================================= */

async function health(){

  try{

    const data =
      await api("/health");

    $("connection").textContent =
      data.connected
        ? "اتصال به Bybit برقرار است"
        : "اتصال برقرار نیست";

  }catch(e){

    $("connection").textContent =
      "خطا در اتصال";

  }

}

health();

/* =========================================================
   SEARCH
========================================================= */

let searchTimer = null;

symbolInput.addEventListener(
  "input",
  () => {

    clearTimeout(searchTimer);

    const q =
      symbolInput.value.trim();

    if(!q){

      searchResults.classList.remove("show");
      searchResults.innerHTML = "";

      return;
    }

    searchTimer =
      setTimeout(
        () => searchSymbol(q),
        250
      );
  }
);

async function searchSymbol(q){

  try{

    const data =
      await api(
        "/api/search?q=" +
        encodeURIComponent(q)
      );

    const results =
      data.results || [];

    if(!results.length){

      searchResults.innerHTML =
        `<div class="result">
          نماد پیدا نشد
        </div>`;

      searchResults.classList.add("show");

      return;
    }

    searchResults.innerHTML =
      results
        .slice(0,20)
        .map(
          x => `
          <div
            class="result"
            data-symbol="${escapeAttr(x.symbol)}"
            data-category="${escapeAttr(x.category)}"
          >
            <b>${escapeHtml(x.symbol)}</b>
            <br>
            <small>
              ${x.category === "linear" ? "Futures" : "Spot"}
              • ${escapeHtml(x.status || "")}
            </small>
          </div>
        `
        )
        .join("");

    searchResults.classList.add("show");

  }catch(e){

    searchResults.innerHTML =
      `<div class="result">${escapeHtml(e.message)}</div>`;

    searchResults.classList.add("show");
  }
}

searchResults.addEventListener(
  "click",
  e => {

    const item =
      e.target.closest(".result");

    if(!item) return;

    const symbol =
      item.dataset.symbol;

    const cat =
      item.dataset.category;

    symbolInput.value =
      symbol;

    category.value =
      cat;

    searchResults.classList.remove("show");

    analyze();
  }
);

document.addEventListener(
  "click",
  e => {

    if(
      !e.target.closest(".results")
    ){
      searchResults.classList.remove("show");
    }

  }
);

/* =========================================================
   ANALYZE
========================================================= */

$("analyzeBtn").addEventListener(
  "click",
  analyze
);

symbolInput.addEventListener(
  "keydown",
  e => {

    if(e.key === "Enter"){
      e.preventDefault();
      searchResults.classList.remove("show");
      analyze();
    }

  }
);

async function analyze(){

  const symbol =
    symbolInput.value
      .trim()
      .toUpperCase();

  if(!symbol){

    output.innerHTML =
      `<section class="panel">
        <div class="panel-body error">
          نام ارز را وارد کن.
        </div>
      </section>`;

    return;
  }

  searchResults.classList.remove("show");

  output.innerHTML =
    `<section class="panel">
      <div class="loading">
        ⏳ در حال دریافت داده واقعی Bybit و تحلیل...
      </div>
    </section>`;

  try{

    const data =
      await api(
        "/api/analyze?" +
        new URLSearchParams({
          symbol,
          category:category.value,
          difficulty:difficulty.value
        }).toString()
      );

    renderAnalysis(data);

  }catch(e){

    output.innerHTML =
      `<section class="panel">
        <div class="panel-body error">
          ${escapeHtml(e.message)}
        </div>
      </section>`;

  }
}

/* =========================================================
   SIGNAL
========================================================= */

function renderSignal(data){

  const signal =
    data.signal || {};

  const direction =
    signal.direction || "WAIT";

  const score =
    Number(signal.score || 0);

  let cls =
    "signal-wait";

  let title =
    "🟡 انتظار";

  if(direction === "LONG"){
    cls = "signal-long";
    title = "🟢 LONG";
  }

  if(direction === "SHORT"){
    cls = "signal-short";
    title = "🔴 SHORT";
  }

  const bull =
    Number(signal.bull || 0);

  const bear =
    Number(signal.bear || 0);

  return `
    <section class="panel">
      <div class="panel-title">🎯 سیگنال نهایی</div>

      <div class="panel-body">

        <div class="signal ${cls}">

          <div class="signal-main">

            <div>
              <div class="signal-direction">
                ${title}
              </div>

              <div class="sub">
                مبنا: ${escapeHtml(signal.basis || "1M_MA20")}
              </div>
            </div>

            <div>
              <div class="score">
                ${round(score,0)}/100
              </div>

              <div class="sub">
                Bull ${round(bull,0)}
                •
                Bear ${round(bear,0)}
              </div>
            </div>

          </div>

          <div class="badges">
            <span class="badge">
              آستانه: ${round(signal.threshold || 0,0)}
            </span>

            <span class="badge">
              سختی: ${round(signal.difficulty || 0,0)}
            </span>

            <span class="badge">
              داده: واقعی + محاسبه‌شده
            </span>
          </div>

        </div>

        <details>
          <summary>دلایل سیگنال</summary>
          <div class="detail">

            <h4 class="green-t">دلایل Long</h4>
            ${
              renderList(
                signal.reasons?.bull || []
              )
            }

            <h4 class="red-t">دلایل Short</h4>
            ${
              renderList(
                signal.reasons?.bear || []
              )
            }

          </div>
        </details>

      </div>
    </section>
  `;
}

/* =========================================================
   TRADING STYLE
========================================================= */

function renderTradingStyle(data){

  const style =
    data.tradingStyle ||
    data.styles ||
    {};

  let current =
    style.style ||
    style.current ||
    "RANGE / NO CLEAR STYLE";

  const side =
    style.side ||
    "NEUTRAL";

  const confidence =
    Number(
      style.confidence || 0
    );

  const smart =
    data.smartMoney?.style ||
    style.smartMoney ||
    "RANGE";

  const bull =
    style.bullishFactors ||
    [];

  const bear =
    style.bearishFactors ||
    [];

  if(
    !current ||
    current === "undefined" ||
    current === "null"
  ){
    current =
      "RANGE / NO CLEAR STYLE";
  }

  return `
    <section class="panel">
      <div class="panel-title">
        🧠 سبک معاملاتی
      </div>

      <div class="panel-body">

        <div class="grid">

          <div class="card">
            <div class="label">سبک فعلی</div>
            <div class="value blue-t">
              ${escapeHtml(
                tradingStyleFa(current)
              )}
            </div>
          </div>

          <div class="card">
            <div class="label">جهت</div>
            <div class="value ${
              side === "LONG"
                ? "green-t"
                : side === "SHORT"
                  ? "red-t"
                  : "yellow-t"
            }">
              ${escapeHtml(side)}
            </div>
          </div>

          <div class="card">
            <div class="label">اعتماد</div>
            <div class="value">
              ${round(confidence,0)}%
            </div>
          </div>

          <div class="card">
            <div class="label">Smart Money</div>
            <div class="value">
              ${escapeHtml(
                tradingStyleFa(smart)
              )}
            </div>
          </div>

        </div>

        <details>
          <summary>
            عوامل محاسبه سبک معاملاتی
          </summary>

          <div class="detail">

            <h4 class="green-t">
              عوامل صعودی
            </h4>

            ${
              renderList(
                bull.map(
                  tradingFactorFa
                )
              )
            }

            <h4 class="red-t">
              عوامل نزولی
            </h4>

            ${
              renderList(
                bear.map(
                  tradingFactorFa
                )
              )
            }

            <div class="badges">
              <span class="badge">
                محاسبه‌شده از داده واقعی
              </span>

              <span class="badge">
                Bybit
              </span>
            </div>

          </div>
        </details>

      </div>
    </section>
  `;
}

/* =========================================================
   MA20
========================================================= */

function renderMA20(data){

  const ma =
    data.MA20 ||
    data.oneMinute?.MA20Analysis ||
    {};

  return `
    <section class="panel">

      <div class="panel-title">
        📈 MA20 واقعی — تایم 1 دقیقه
      </div>

      <div class="panel-body">

        <div class="grid">

          ${metric("MA20",fmt(ma.value))}
          ${metric("موقعیت",faPosition(ma.position))}
          ${metric("Bias",faBias(ma.bias))}
          ${metric("شیب 1M",fmt(ma.slope1mPct)+"%")}
          ${metric("شیب 3M",fmt(ma.slope3mPct)+"%")}
          ${metric("شیب 5M",fmt(ma.slope5mPct)+"%")}
          ${metric("شیب 10M",fmt(ma.slope10mPct)+"%")}
          ${metric("فاصله",fmt(ma.distancePct)+"%")}
          ${metric("تماس",ma.touched ? "بله" : "خیر")}
          ${metric("رد شدن",faRejection(ma.rejection))}
          ${metric("تأیید",faConfirmation(ma.confirmation))}
          ${metric("Cross Up",ma.crossUp ? "بله" : "خیر")}
          ${metric("Cross Down",ma.crossDown ? "بله" : "خیر")}
          ${metric("Long Setup",ma.validLongSetup ? "فعال" : "خیر")}
          ${metric("Short Setup",ma.validShortSetup ? "فعال" : "خیر")}

        </div>

        <details>
          <summary>جزئیات کندل برخورد با MA20</summary>
          <div class="detail">
            ${renderObjectTable(ma.candle || {})}
          </div>
        </details>

      </div>
    </section>
  `;
}

/* =========================================================
   15M
========================================================= */

function render15M(data){

  const x =
    data.fifteenMinute ||
    data.higherTimeframe ||
    {};

  return `
    <section class="panel">
      <div class="panel-title">
        🕐 تحلیل تایم بالاتر — 15 دقیقه
      </div>

      <div class="panel-body">

        <div class="grid">
          ${metric("انتظار",faExpectation(x.expectation))}
          ${metric("Trend",faTrend(x.trend))}
          ${metric("MA7",fmt(x.MA7))}
          ${metric("MA20",fmt(x.MA20))}
          ${metric("شیب MA20",fmt(x.MA20Slope))}
          ${metric("RSI",fmt(x.RSI))}
          ${metric("ATR",fmt(x.ATR))}
          ${metric("ATR %",fmt(x.ATRPct)+"%")}
          ${metric("حجم",faVolume(x.volume))}
        </div>

        <details>
          <summary>Smart Money تایم 15 دقیقه</summary>
          <div class="detail">
            ${
              renderSmart(
                x.smartMoney || {}
              )
            }
          </div>
        </details>

        <details>
          <summary>حمایت و مقاومت 15 دقیقه</summary>
          <div class="detail">
            ${
              renderLevels(
                x.supportResistance || {}
              )
            }
          </div>
        </details>

      </div>
    </section>
  `;
}

/* =========================================================
   SMART MONEY
========================================================= */

function renderSmart(s){

  return `
    <div class="grid">
      ${metric("Style",tradingStyleFa(s.style))}
      ${metric("Bullish",fmt(s.bullishScore))}
      ${metric("Bearish",fmt(s.bearishScore))}
      ${metric("Trend",faTrend(s.structure?.trend))}
      ${metric("BOS",faSide(s.BOS?.side))}
      ${metric("CHoCH",faSide(s.CHoCH?.side))}
      ${metric("Hunt",faHunt(s.liquiditySweep?.type))}
    </div>

    <details>
      <summary>FVG</summary>
      <div class="detail">
        ${renderFVG(s.FVG || [])}
      </div>
    </details>

    <details>
      <summary>Order Block</summary>
      <div class="detail">
        ${renderOB(s.OrderBlocks || [])}
      </div>
    </details>

    <details>
      <summary>ساختار بازار</summary>
      <div class="detail">
        ${renderObjectTable(s.structure || {})}
      </div>
    </details>
  `;
}

/* =========================================================
   FOOTPRINT
========================================================= */

function renderFootprint(data){

  const f =
    data.footprint ||
    {};

  const levels =
    f.levels ||
    [];

  return `
    <section class="panel">

      <div class="panel-title">
        👣 Footprint / Order Flow
      </div>

      <div class="panel-body">

        <div class="grid">
          ${metric("Buy",money(f.buy))}
          ${metric("Sell",money(f.sell))}
          ${metric("Delta",money(f.delta))}
          ${metric("Delta %",fmt(f.deltaPct)+"%")}
          ${metric("Buy Share",fmt(f.buyShare)+"%")}
          ${metric("Sell Share",fmt(f.sellShare)+"%")}
          ${metric("Buy Volume",fmt(f.buyVolume))}
          ${metric("Sell Volume",fmt(f.sellVolume))}
        </div>

        <details>
          <summary>
            سطوح Footprint
          </summary>

          <div class="detail">

            ${
              levels.length
                ? `
                <table>
                  <thead>
                    <tr>
                      <th>قیمت</th>
                      <th>Buy</th>
                      <th>Sell</th>
                      <th>Delta</th>
                      <th>Delta%</th>
                      <th>تعداد</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${
                      levels
                        .slice(0,30)
                        .map(
                          x => `
                          <tr>
                            <td>${fmt(x.price)}</td>

function renderObjectTable(obj){

          k !== "asks" &&
          k !== "trades"

  if(!rows.length){
    return `<div class="empty">داده‌ای نیست.</div>`;
  }

  return `
    <table>
      <tbody>
        ${
          rows.map(
            ([k,v]) => `
            <tr>
              <th>${escapeHtml(k)}</th>
              <td>${formatValue(v)}</td>

          ).join("")

function formatValue(v){

  if(v === null || v === undefined){
    return "-";
  }

  if(typeof v === "object"){
    return escapeHtml(
      JSON.stringify(v)
    );
  }

  if(typeof v === "boolean"){
    return v ? "بله" : "خیر";
  }

  return escapeHtml(
    String(v)
  );
}

function fmt(v){

  const n =
    Number(v);

  if(!Number.isFinite(n)){
    return "-";
  }

  if(
    Math.abs(n) >= 1000000
  ){
    return (
      (n / 1000000)
        .toFixed(2) +
      "M"
    );
  }

  if(
    Math.abs(n) >= 1000
  ){
    return (
      (n / 1000)
        .toFixed(2) +
      "K"
    );
  }

  if(
    Math.abs(n) < 0.000001 &&
    n !== 0
  ){
    return n.toExponential(3);
  }

  return Number(
    n.toFixed(6)
  ).toString();
}

function money(v){
  return fmt(v);
}

function round(v,d=2){

  const n =
    Number(v);

  if(!Number.isFinite(n)){
    return 0;
  }

  return Number(
    n.toFixed(d)
  );
}

/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(v){

  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function escapeAttr(v){
  return escapeHtml(v);
}
