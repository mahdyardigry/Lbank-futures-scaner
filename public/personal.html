<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>رادار شخصی MA20</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#080c12;
  color:#e8eef7;
  font-family:Tahoma,Arial,sans-serif;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.header{
  padding:18px 14px;
  background:linear-gradient(135deg,#101925,#0b111a);
  border-bottom:1px solid #202c3a;
}

.header h1{
  margin:0 0 8px;
  font-size:21px;
}

.header p{
  margin:0;
  color:#91a0b3;
  font-size:12px;
}

.toolbar{
  padding:12px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  background:#0b1119;
  border-bottom:1px solid #20202b;
}

.toolbar button{
  border:1px solid #273548;

  color:#dce7f5;

  border-radius:9px;
}

.toolbar button.active{

}

.status{

}

}

.container{
  max-width:1100px;

}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;

}

.section-title h2{
  margin:0;
  font-size:16px;
}

.counter{
  color:#8d9aae;
  font-size:12px;
}

.signals{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:10px;
}

.empty{
  padding:35px 15px;
  text-align:center;
  background:#0d141e;
  border:1px dashed #293747;
  border-radius:12px;
  color:#7f8da0;
}

.signal{
  background:#0d141e;
  border:1px solid #263344;
  border-radius:13px;
  padding:13px;

  overflow:hidden;
}

.signal.long{
  border-color:#1f8d59;
}

.signal.short{

}

.signal.current{
  border-color:#f0b84b;
  box-shadow:
    0 0 0 2px #f0b84b33,

}

.selected-bar{
  display:none;

  border:1px solid #7d6025;

.signal.current .selected-bar{

}

.signal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;

}

.symbol{

}

.badge{
  padding:5px 9px;

}

.badge.long{
  background:#123e2b;
  color:#62e6a1;
}

.badge.short{
  background:#4a1d1d;
  color:#ff8c8c;
}

.badge.wait{

  color:#e6c76c;
}

.signal-grid{
  display:grid;
  grid-template-columns:1fr 1fr;

}

.metric{
  background:#101923;
  border-radius:8px;
  padding:8px;
}

.metric small{
  display:block;

}

.metric b{

}

.ma{

}

.time{

}

.signal-actions{

.signal-actions button{

}

.deep-head-row{
  display:flex;
  justify-content:space-between;

}

.close{
  background:#3a1d1d;
  color:#ffaaaa;
  border:1px solid #6d3535;
  border-radius:8px;
  padding:8px 12px;
}

.deep-title{
  font-size:19px;
  font-weight:bold;
}

.deep-sub{
  color:#8290a2;
  font-size:11px;
  margin-top:5px;
}

.live{
  margin-top:8px;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.live span{
  background:#111c28;
  border:1px solid #263548;
  border-radius:7px;
  padding:5px 8px;

}

.live .on{

}

.important{
  margin-top:10px;
  background:#2c2110;
  border:1px solid #75551e;
  color:#f0cd70;
  border-radius:9px;
  padding:10px;

  line-height:1.9;
}

.direction-box{
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
  text-align:center;
  font-size:15px;
  font-weight:bold;
  border:1px solid #263445;
  background:#101923;
}

.direction-box.up{
  color:#62e6a1;
  border-color:#237b4e;
  background:#0d2118;
}

.direction-box.down{
  color:#ff8c8c;
  border-color:#863f3f;
  background:#261313;
}

.direction-box.flat{
  color:#e6c76c;
  border-color:#6b5a2d;
  background:#211d12;
}

.tf-title{
  margin:18px 0 8px;
  font-size:15px;
  color:#dce7f5;
  padding-bottom:7px;
  border-bottom:1px solid #263445;
}

.deep-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));

}

.panel{
  background:#0d141e;
  border:1px solid #263445;
  border-radius:12px;

}

.panel h3{
  margin:0 0 10px;
  font-size:14px;
  color:#dbe6f3;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:6px 0;
  border-bottom:1px solid #18222e;
  font-size:12px;
}

.row:last-child{
  border-bottom:0;
}

.label{
  color:#7f8c9e;
}

.value{
  text-align:left;
  direction:ltr;
}

.reason{
  background:#111c28;
  border-radius:7px;
  padding:7px;
  margin:5px 0;
  font-size:11px;
  color:#bdc9d7;
  line-height:1.8;
}

.reason.important{
  margin-top:5px;
}

.wall{
  padding:8px;
  background:#111a24;
  border-radius:8px;
  margin:5px 0;
  font-size:11px;
}

.loading{
  text-align:center;
  padding:35px;
  color:#8b99aa;
}

.toast{
  position:fixed;
  left:12px;
  bottom:12px;
  z-index:100;
  background:#152131;
  border:1px solid #32455b;
  border-radius:10px;
  padding:10px 13px;
  display:none;
  max-width:330px;
  font-size:12px;
}

.change-up{
  color:#62e6a1 !important;
}

.change-down{
  color:#ff8c8c !important;
}

@media(max-width:600px){

  .deep{
    margin:5px auto;
  }

  .deep-head{
    top:0;
    border-radius:8px;
  }

  .signals{
    grid-template-columns:1fr;
  }

  .deep-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="header">
  <h1>🎯 رادار شخصی MA20</h1>
  <p>شکار برخورد قیمت با میانگین متحرک ۲۰ در تایم‌فریم یک دقیقه</p>
</div>

<div class="toolbar">

  <button
    id="startBtn"
    class="active"
    onclick="startRadar()">
    ▶ شروع رادار
  </button>

  <button onclick="stopRadar()">
    ⏸ توقف
  </button>

  <button onclick="scanNow()">
    🔄 بررسی دستی
  </button>

  <button onclick="clearSignals()">
    🗑 پاک کردن سیگنال‌ها
  </button>

  <button
    id="soundBtn"
    onclick="toggleSound()">
    🔊 صدا روشن
  </button>

</div>

<div class="status">

  وضعیت:
  <strong id="statusText">
    در حال آماده‌سازی...
  </strong>

  <span id="lastScan"></span>

</div>

<div class="container">

  <div class="section-title">

    <h2>
      🚨 سیگنال‌های MA20 یک‌دقیقه
    </h2>

    <span
      class="counter"
      id="signalCount">
      0 سیگنال
    </span>

  </div>

  <div id="signals" class="signals">

    <div class="empty">
      هنوز سیگنال جدیدی دریافت نشده است.<br>
      رادار برخورد MA20 در حال انتظار است.
    </div>

  </div>

</div>


<div id="deepPanel">

  <div class="deep">

    <div class="deep-head">

      <div class="deep-head-row">

        <div>

          <div
            class="deep-title"
            id="deepTitle">
            تحلیل عمیق
          </div>

          <div
            class="deep-sub"
            id="deepSub">
          </div>

          <div
            class="live"
            id="liveStatus">
          </div>

        </div>

        <button
          class="close"
          onclick="closeDeep()">
          ✕ بستن
        </button>

      </div>

    </div>

    <div id="importantEvent"></div>

    <div id="deepContent">

      <div class="loading">
        در حال دریافت تحلیل...
      </div>

    </div>

  </div>

</div>


<div id="toast" class="toast"></div>


<script>

/* =========================================================
تنظیمات
========================================================= */

const WORKER =
  "https://soft-flower-2790.29mah12.workers.dev";

const SCAN_URL =
  WORKER + "/api/scan";

const ANALYZE_URL =
  WORKER + "/api/analyze";

const SCAN_INTERVAL = 15000;

/*
  تحلیل ارز انتخاب‌شده سریع‌تر تازه می‌شود.
*/
const SELECTED_REFRESH = 12000;


/* =========================================================
حافظه سیگنال‌ها
========================================================= */

const seenSignals = new Set();

const signals = new Map();

let currentSignalId = null;

let currentSelectedSymbol = null;

let currentSelectedCategory = "linear";

let radarTimer = null;

let selectedRefreshTimer = null;

let running = false;

let soundEnabled = true;

let offset = 0;

let lastSelectedAnalysis = null;

let importantEvents = [];


/* =========================================================
ذخیره انتخاب
========================================================= */

const STORAGE_KEY =
  "personal_ma20_selected_signal";

const SIGNALS_KEY =
  "personal_ma20_signals";


function saveSelected(){

  if(!currentSignalId)return;

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify({
        id:currentSignalId,
        symbol:currentSelectedSymbol,
        category:currentSelectedCategory,
        savedAt:Date.now()
      })
    );

  }catch(e){}
}


function loadSelected(){

  try{

    const raw =
      localStorage.getItem(
        STORAGE_KEY
      );

    if(!raw)return null;

    return JSON.parse(raw);

  }catch(e){

    return null;
  }
}


/* =========================================================
ذخیره سیگنال‌ها
========================================================= */

function saveSignals(){

  try{

    const arr =
      [...signals.values()]
        .slice(0,100)
        .map(s=>({
          ...s,
          deep:null
        }));

    localStorage.setItem(
      SIGNALS_KEY,
      JSON.stringify(arr)
    );

  }catch(e){}
}


function loadSignals(){

  try{

    const raw =
      localStorage.getItem(
        SIGNALS_KEY
      );

    if(!raw)return;

    const arr=JSON.parse(raw);

    if(!Array.isArray(arr))return;

    for(const s of arr){

      if(!s.id || !s.symbol)continue;

      signals.set(
        s.id,
        s
      );

      seenSignals.add(
        s.id
      );
    }

  }catch(e){}
}


/* =========================================================
DOM
========================================================= */

const $ = id =>
  document.getElementById(id);


/* =========================================================
زمان
========================================================= */

function timeText(ts){

  const d =
    ts
      ? new Date(ts)
      : new Date();

  return d.toLocaleTimeString(
    "fa-IR",
    {
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit"
    }
  );
}


/* =========================================================
عدد
========================================================= */

function num(v,digits=4){

  if(
    v===null||
    v===undefined||
    v===""||
    Number.isNaN(Number(v))
  ){
    return "-";
  }

  return Number(v).toLocaleString(
    "en-US",
    {
      maximumFractionDigits:digits
    }
  );
}


function pct(v){

  if(
    v===null||
    v===undefined||
    Number.isNaN(Number(v))
  ){
    return "-";
  }

  return Number(v).toFixed(2)+"٪";
}


/* =========================================================
ترجمه
========================================================= */

function fa(v){

  if(v===null||v===undefined)return "—";

  const s=String(v);

  const map={

    LONG:"صعودی",
    SHORT:"نزولی",
    WAIT:"انتظار",

    UP:"صعودی",
    DOWN:"نزولی",
    FLAT:"خنثی",

    BULLISH:"صعودی",
    BEARISH:"نزولی",
    NEUTRAL:"خنثی",

    TOUCH:"برخورد",
    REJECTION:"برگشت",
    BREAK:"شکست",

    CONFIRMED:"تأیید شده",
    true:"بله",
    false:"خیر",

    BUY:"خرید",
    SELL:"فروش",

    SMC:"پول هوشمند",
    ICT:"تحلیل نقدینگی",
    MA:"میانگین متحرک",
    Volume:"حجم",
    Candles:"کندل",
    OrderFlow:"جریان سفارش",
    Liquidity:"نقدینگی",

    "Strong Buy":"خرید بسیار قوی",
    "Strong Sell":"فروش بسیار قوی",
    "Buy":"خرید",
    "Sell":"فروش",
    "Neutral":"خنثی"

  };

  return map[s] || s;
}


/* =========================================================
وضعیت
========================================================= */

function setStatus(text,good=false){

  $("statusText").textContent=text;

  $("statusText").style.color =
    good
      ? "#5ee69b"
      : "#e6c76c";
}


/* =========================================================
پیام
========================================================= */

let toastTimer;

function toast(text){

  const el=$("toast");

  el.textContent=text;

  el.style.display="block";

  clearTimeout(toastTimer);

  toastTimer=setTimeout(()=>{
    el.style.display="none";
  },3500);
}


/* =========================================================
صدا
========================================================= */

function beep(){

  if(!soundEnabled)return;

  try{

    const Ctx =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!Ctx)return;

    const ctx=new Ctx();

    const osc=ctx.createOscillator();

    const gain=ctx.createGain();

    osc.type="sine";

    osc.frequency.setValueAtTime(
      740,
      ctx.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
      1040,
      ctx.currentTime+0.18
    );

    gain.gain.setValueAtTime(
      0.0001,
      ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.22,
      ctx.currentTime+0.02
    );

    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      ctx.currentTime+0.35
    );

    osc.connect(gain);

    gain.connect(ctx.destination);

    osc.start();

    osc.stop(
      ctx.currentTime+0.36
    );

  }catch(e){}
}


function toggleSound(){

  soundEnabled=!soundEnabled;

  $("soundBtn").textContent =
    soundEnabled
      ?"🔊 صدا روشن"
      :"🔇 صدا خاموش";

  if(soundEnabled)beep();
}


/* =========================================================
استخراج سیگنال MA20
========================================================= */

function extractMA20Signal(item){

  const tf =
    item?.timeframes?.["1"];

  if(!tf || tf.error)return null;

  if(!tf.touchMA20)return null;

  const price =
    Number(
      tf.price ||
      item.price
    );

  const ma20 =
    Number(tf.ma20);

  if(!price || !ma20)return null;

  let direction="WAIT";

  if(
    price>=ma20 &&
    tf.maSlope==="UP"
  ){
    direction="LONG";
  }

  if(
    price<=ma20 &&
    tf.maSlope==="DOWN"
  ){
    direction="SHORT";
  }

  if(item.direction==="LONG")
    direction="LONG";

  if(item.direction==="SHORT")
    direction="SHORT";

  const event =
    item.convertedMA1m?.events
      ?.find(x =>
        x.source==="1m" &&
        x.ma==="MA20"
      ) || null;

  const type =
    event?.type ||
    "TOUCH";

  return{

    symbol:item.symbol,

    category:
      item.category ||
      "linear",

    direction,

    price,

    ma20,

    distancePct:
      (price-ma20)/ma20*100,

    maSlope:
      tf.maSlope,

    trend:
      tf.trend,

    type,

    rejection:
      event?.rejection||false,

    crossUp:
      event?.crossUp||false,

    crossDown:
      event?.crossDown||false,

    volumeConfirmed:
      event?.volumeConfirmed||
      tf.volume?.spike||
      false,

    score:
      item.score||0,

    longScore:
      item.longScore||0,

    shortScore:
      item.shortScore||0,

    hunt:
      tf.hunt||null,

    timestamp:
      tf.timestamp||
      item.generatedAt||
      Date.now(),

    deep:item
  };
}


/* =========================================================
شناسه
========================================================= */

function signalId(s){

  return[
    s.symbol,
    s.timestamp,
    s.direction,
    s.type
  ].join("_");
}


/* =========================================================
ثبت سیگنال
========================================================= */

function addSignal(s){

  const id=signalId(s);

  if(seenSignals.has(id)){
    return false;
  }

  seenSignals.add(id);

  signals.set(
    id,
    {
      id,
      ...s,
      receivedAt:Date.now(),
      active:true
    }
  );

  saveSignals();

  beep();

  renderSignals();

  toast(
    `🚨 سیگنال جدید ${s.symbol} — ${fa(s.direction)}`
  );

  return true;
}


/* =========================================================
نمایش سیگنال‌ها
========================================================= */

function renderSignals(){

  const box=$("signals");

  if(!signals.size){

    box.innerHTML=`

      <div class="empty">
        هنوز سیگنال جدیدی دریافت نشده است.<br>
        رادار برخورد MA20 در حال انتظار است.
      </div>

    `;

    $("signalCount").textContent=
      "0 سیگنال";

    return;
  }

  const arr =
    [...signals.values()]
      .sort(
        (a,b)=>
          b.receivedAt-a.receivedAt
      );

  box.innerHTML =
    arr.map(s=>{

      const dirClass =
        s.direction==="LONG"
          ?"long"
          :s.direction==="SHORT"
            ?"short"
            :"";

      const badgeClass =
        s.direction==="LONG"
          ?"long"
          :s.direction==="SHORT"
            ?"short"
            :"wait";

      const directionText =
        s.direction==="LONG"
          ?"🟢 صعودی"
          :s.direction==="SHORT"
            ?"🔴 نزولی"
            :"🟡 MA20";

      const typeText={
        TOUCH:"برخورد",
        REJECTION:"برگشت از MA20",
        BREAK:"شکست MA20"
      }[s.type] ||
      "برخورد MA20";

      return`

        <div
          class="signal ${dirClass} ${
            currentSignalId===s.id
              ?"current"
              :""
          }"
        >

          <div class="selected-bar">
            📌 این ارز در حال بررسی است
          </div>

          <div class="signal-head">

            <div class="symbol">
              ${escapeHtml(s.symbol)}
            </div>

            <div class="badge ${badgeClass}">
              ${directionText}
            </div>

          </div>

          <div class="signal-grid">

            <div class="metric">
              <small>قیمت</small>
              <b>${num(s.price)}</b>
            </div>

            <div class="metric">
              <small>میانگین ۲۰ یک دقیقه</small>
              <b class="ma">
                ${num(s.ma20)}
              </b>
            </div>

            <div class="metric">
              <small>فاصله از میانگین ۲۰</small>
              <b>${pct(s.distancePct)}</b>
            </div>

            <div class="metric">
              <small>نوع برخورد</small>
              <b>${typeText}</b>
            </div>

            <div class="metric">
              <small>شیب میانگین ۲۰</small>
              <b>${fa(s.maSlope)}</b>
            </div>

            <div class="metric">
              <small>تأیید حجم</small>
              <b>
                ${
                  s.volumeConfirmed
                    ?"بله"
                    :"خیر"
                }
              </b>
            </div>

          </div>

          <div class="time">

            🕒 دریافت:

function escapeHtml(v){

  return String(v??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

========================================================= */

function focusSignal(id){

  const s=signals.get(id);

  if(!s)return;

  currentSignalId=id;

  currentSelectedSymbol=s.symbol;

  currentSelectedCategory=
    s.category||"linear";

  saveSelected();

  renderSignals();

  const cards =
    document.querySelectorAll(
      ".signal"
    );

  const arr =
    [...signals.values()]
      .sort(
        (a,b)=>
          b.receivedAt-a.receivedAt
      );

  const index =
    arr.findIndex(
      x=>x.id===id
    );

  if(cards[index]){

    cards[index].scrollIntoView({
      behavior:"smooth",
      block:"center"
    });

  }

  /*
    اگر انتخاب شد، تحلیل عمیق را هم باز کن.
  */

  openDeep(
    encodeURIComponent(s.symbol),
    s.category||"linear",
    id
  );
}


/* =========================================================
اسکن
========================================================= */

async function scanNow(){

  if(!running){

    setStatus(
      "در حال بررسی دستی...",
      false
    );

  }

  try{

    const url =
      SCAN_URL+
      "?offset="+
      encodeURIComponent(offset);

    const r =
      await fetch(
        url,
        {
          cache:"no-store"
        }
      );

    if(!r.ok){

      throw new Error(
        "خطای ارتباطی "+r.status
      );

    }

    const data =
      await r.json();

    if(!data.ok){

      throw new Error(
        data.error||
        "خطای نامشخص"
      );

    }

    offset =
      Number(data.nextOffset)||0;

    let found=0;

    for(
      const item
      of data.results||[]
    ){

      const signal =
        extractMA20Signal(item);

      if(!signal)continue;

      if(addSignal(signal)){
        found++;
      }

    }

    $("lastScan").textContent =
      ` | آخرین بررسی: ${timeText()}`;

    if(running){

      setStatus(
        found
          ?`🟢 ${found} سیگنال جدید`
          :"🟡 بازار بررسی شد؛ سیگنال جدیدی نبود",
        found>0
      );

    }else{

      setStatus(
        found
          ?`🟢 ${found} سیگنال پیدا شد`
          :"🟡 بررسی انجام شد"
      );

    }

    /*
      اگر ارز انتخاب شده در اسکن جدید
      دوباره دیده شد، اطلاعات کارت آن
      نیز تازه می‌شود.
    */

    if(
      currentSelectedSymbol &&
      data.results
    ){

      const updated =
        data.results.find(
          x=>
            x.symbol===
            currentSelectedSymbol
        );

      if(updated){

        const fresh =
          extractMA20Signal(updated);

        if(fresh){

          const old =
            signals.get(
              currentSignalId
            );

          if(old){

            signals.set(
              currentSignalId,
              {
                ...old,
                ...fresh,
                id:currentSignalId,
                receivedAt:old.receivedAt
              }
            );

            saveSignals();

            renderSignals();

          }

        }

      }

    }

  }catch(e){

    console.error(e);

    setStatus(
      "❌ خطا: "+e.message
    );

    toast(
      "خطا در ارتباط با سرور"
    );

  }

}

/* =========================================================
تشخیص اتفاق مهم
========================================================= */

function detectImportantChanges(oldData,newData){

  if(!oldData)return;

  const events=[];

  const old1 =
    oldData.timeframes?.["1"]||{};

  const new1 =
    newData.timeframes?.["1"]||{};

  const old15 =
    oldData.timeframes?.["15"]||{};

  const new15 =
    newData.timeframes?.["15"]||{};


  /*
    تغییر جهت یک دقیقه
  */

  const oldDir =
    normalizeDirection(
      oldData.direction ||
      old1.trend
    );

  const newDir =
    normalizeDirection(
      newData.direction ||
      new1.trend
    );

  if(
    oldDir &&
    newDir &&
    oldDir!==newDir
  ){

    events.push(
      `⚠️ جهت یک دقیقه تغییر کرد: ${fa(oldDir)} ← ${fa(newDir)}`
    );

  }


  /*
    تغییر وضعیت ۱۵ دقیقه
  */

  const old15Dir =
    normalizeDirection(
      old15.trend
    );

  const new15Dir =
    normalizeDirection(
      new15.trend
    );

  if(
    old15Dir &&
    new15Dir &&
    old15Dir!==new15Dir
  ){

    events.push(
      `🚨 جهت ۱۵ دقیقه تغییر کرد: ${fa(old15Dir)} ← ${fa(new15Dir)}`
    );

  }


  /*
    شکست یا برخورد MA20
  */

  if(
    !old1.touchMA20 &&
    new1.touchMA20
  ){

    events.push(
      "📌 قیمت دوباره به میانگین ۲۰ یک دقیقه رسید."
    );

  }


  /*
    تغییر امتیاز شدید
  */

  const oldScore =
    Number(oldData.score)||0;

  const newScore =
    Number(newData.score)||0;

  if(
    Math.abs(
      newScore-oldScore
    )>=15
  ){

    events.push(
      `📊 امتیاز تحلیل ${newScore>oldScore?"افزایش":"کاهش"} قابل‌توجه داشت: ${oldScore} ← ${newScore}`
    );

  }


  /*
    تغییر شدید دلتا
  */

  const oldDelta =
    Number(
      oldData.footprint?.delta
    )||0;

  const newDelta =
    Number(
      newData.footprint?.delta
    )||0;

  if(
    oldDelta!==0 &&
    newDelta!==0 &&
    (
      oldDelta>0 !==
      newDelta>0
    )
  ){

    events.push(
      "👣 فشار خرید و فروش در جریان سفارش معکوس شد."
    );

  }


  /*
    تغییر فشار سفارشات
  */

  const oldPressure =
    String(
      oldData.footprint?.pressure||
      ""
    );

  const newPressure =
    String(
      newData.footprint?.pressure||
      ""
    );

  if(
    oldPressure &&
    newPressure &&
    oldPressure!==newPressure
  ){

    events.push(
      `📚 فشار سفارشات تغییر کرد: ${fa(oldPressure)}`
    );

  }


  /*
    تغییر وضعیت حجم
  */

  const oldSpike =
    !!old1.volume?.spike;

  const newSpike =
    !!new1.volume?.spike;

  if(
    !oldSpike &&
    newSpike
  ){

    events.push(
      "🔥 افزایش غیرعادی حجم مشاهده شد."
    );

  }


  if(events.length){

    importantEvents = [
      ...events,
      ...importantEvents
    ].slice(0,8);

    renderImportantEvents();

    for(
      const e of events
    ){

      toast(e);

    }

    beep();

  }

}


function normalizeDirection(v){

  if(!v)return null;

  const s=
    String(v)
      .toUpperCase();

  if(
    s==="LONG"||
    s==="UP"||
    s==="BULLISH"||
    s.includes("BULL")
  ){
    return"LONG";
  }

  if(
    s==="SHORT"||
    s==="DOWN"||
    s==="BEARISH"||
    s.includes("BEAR")
  ){
    return"SHORT";
  }

  return"FLAT";
}

/* =========================================================

========================================================= */

function panel(title,content){

  return`

    <div class="panel">

      <h3>
        ${title}
      </h3>

      ${content}

    </div>

  `;

}


function row(label,value){

  return`

    <div class="row">

      <span class="label">
        ${escapeHtml(label)}
      </span>

      <b class="value">

        ${escapeHtml(
          value===null||
          value===undefined||
          value===""
            ?"—"
            :String(value)
        )}

      </b>

    </div>

  `;

}

function closeDeep(){

  /*

    بنابراین وقتی دوباره باز شود

/* =========================================================
سلامت Worker
========================================================= */

async function health(){

  try{

    const r =
      await fetch(
        WORKER+"/api/health",
        {
          cache:"no-store"
        }
      );

    const d =
      await r.json();

    if(d.ok){

      setStatus(
        "🟢 ارتباط با سرور برقرار است",
        true
      );

      return true;
    }

  }catch(e){

    setStatus(
      "🔴 سرور در دسترس نیست"
    );

  }

  return false;
}


/* =========================================================
بازگردانی انتخاب بعد از ورود
========================================================= */

async function restoreSelected(){

  const saved =
    loadSelected();

  if(!saved)return;

  /*
    ابتدا از سیگنال‌های ذخیره‌شده پیدا کن.
  */

  let id=saved.id;

  let s=signals.get(id);

  /*
    اگر شناسه قدیمی بود،
    بر اساس نماد پیدا کن.
  */

  if(!s){

    const arr =
      [...signals.values()]
        .filter(
          x=>
            x.symbol===
            saved.symbol
        )
        .sort(
          (a,b)=>
            b.receivedAt-a.receivedAt
        );

    s=arr[0];

    if(s){
      id=s.id;
    }

  }

  if(!s){

    currentSelectedSymbol=
      saved.symbol;

    currentSelectedCategory=
      saved.category||"linear";

    currentSignalId=
      saved.id||null;

    /*
      حتی اگر کارت دیگر موجود نباشد،
      تحلیل ارز را مستقیم باز می‌کنیم.
    */

    if(
      currentSelectedSymbol
    ){

      await openDeep(
        encodeURIComponent(
          currentSelectedSymbol
        ),
        currentSelectedCategory,
        currentSignalId ||
          (
            currentSelectedSymbol+
            "_saved"
          )
      );

    }

    return;
  }

  currentSignalId=id;

  currentSelectedSymbol=
    s.symbol;

  currentSelectedCategory=
    s.category||"linear";

  renderSignals();

}


/* =========================================================
بازگشت از برنامه دیگر
========================================================= */

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(
      document.visibilityState===
      "visible"
    ){

      /*
        به محض برگشت کاربر،
        بازار انتخاب‌شده را تازه کن.
      */

      if(
        currentSelectedSymbol &&
        currentSignalId
      ){

        refreshSelectedAnalysis();

      }

      scanNow();

    }

  }
);

(async()=>{

  startRadar();

})();
