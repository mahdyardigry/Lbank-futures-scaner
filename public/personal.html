<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Personal MA20 Radar</title>

<style>
*{box-sizing:border-box}
body{
margin:0;background:#080c12;color:#e8eef7;
font-family:Tahoma,Arial,sans-serif
}
button,input{font:inherit}
button{cursor:pointer}
.header{
padding:18px 14px;
background:linear-gradient(135deg,#101925,#0b111a);
border-bottom:1px solid #202c3a
}
.header h1{margin:0 0 8px;font-size:21px}
.header p{margin:0;color:#91a0b3;font-size:12px}
.toolbar{
padding:12px;display:flex;gap:8px;flex-wrap:wrap;
background:#0b1119;border-bottom:1px solid #20202b
}
.toolbar button{
border:1px solid #273548;background:#111a25;color:#dce7f5;
padding:9px 13px;border-radius:9px
}
.toolbar button.active{
background:#174e35;border-color:#2ca968
}
.status{
padding:10px 13px;font-size:12px;color:#9caabd;
border-bottom:1px solid #1b2532
}
.status strong{color:#5ee69b}
.container{max-width:1100px;margin:auto;padding:12px}
.section-title{
display:flex;justify-content:space-between;align-items:center;
margin:10px 0
}
.section-title h2{margin:0;font-size:16px}
.counter{color:#8d9aae;font-size:12px}
.signals{
display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:10px
}
.empty{
padding:35px 15px;text-align:center;background:#0d141e;
border:1px dashed #293747;border-radius:12px;color:#7f8da0
}
.signal{
background:#0d141e;border:1px solid #263344;border-radius:13px;
padding:13px;position:relative;overflow:hidden
}
.signal.long{border-color:#1f8d59}
.signal.short{border-color:#a14343}
.signal.current{
box-shadow:0 0 0 2px #f0b84b55,0 0 18px #f0b84b22
}
.signal-head{
display:flex;justify-content:space-between;align-items:center;
margin-bottom:12px
}
.symbol{font-size:18px;font-weight:bold}
.badge{
padding:5px 9px;border-radius:20px;font-size:11px;font-weight:bold
}
.badge.long{background:#123e2b;color:#62e6a1}
.badge.short{background:#4a1d1d;color:#ff8c8c}
.badge.wait{background:#302a16;color:#e6c76c}
.signal-grid{
display:grid;grid-template-columns:1fr 1fr;gap:7px
}
.metric{
background:#101923;border-radius:8px;padding:8px
}
.metric small{
display:block;color:#758397;font-size:10px;margin-bottom:4px
}
.metric b{font-size:13px}
.ma{color:#67c7ff}
.time{color:#9caabd;font-size:11px;margin-top:10px}
.signal-actions{display:flex;gap:7px;margin-top:10px}
.signal-actions button{
flex:1;border:1px solid #29394d;background:#121d29;
color:#e8eef7;padding:9px;border-radius:8px
}
.signal-actions button:hover{background:#192838}

#deepPanel{
display:none;position:fixed;inset:0;z-index:50;
background:#070b10ee;overflow:auto
}
.deep{max-width:1100px;margin:20px auto;padding:12px}
.deep-head{
background:#0d141e;border:1px solid #293748;border-radius:13px;
padding:14px;position:sticky;top:8px;z-index:3
}
.deep-head-row{
display:flex;justify-content:space-between;align-items:center;gap:10px
}
.close{
background:#3a1d1d;color:#ffaaaa;border:1px solid #6d3535;
border-radius:8px;padding:8px 12px
}
.deep-title{font-size:19px;font-weight:bold}
.deep-sub{color:#8290a2;font-size:11px;margin-top:5px}
.live{
margin-top:8px;padding:7px 9px;border-radius:7px;
background:#10251b;color:#62e6a1;font-size:11px
}
.live.alert{
background:#3a2415;color:#ffc46b
}
.deep-grid{
display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:10px;margin-top:10px
}
.panel{
background:#0d141e;border:1px solid #263445;border-radius:12px;
padding:12px
}
.panel h3{
margin:0 0 10px;font-size:14px;color:#dbe6f3
}
.row{
display:flex;justify-content:space-between;gap:10px;
padding:6px 0;border-bottom:1px solid #18222e;font-size:12px
}
.row:last-child{border-bottom:0}
.label{color:#7f8c9e}
.value{text-align:left;direction:ltr}
.reason{
background:#111c28;border-radius:7px;padding:7px;
margin:5px 0;font-size:11px;color:#bdc9d7
}
.reason.important{
background:#3b2717;color:#ffd080;border:1px solid #76501f
}
.loading{text-align:center;padding:35px;color:#8b99aa}
.toast{
position:fixed;left:12px;bottom:12px;z-index:100;
background:#152131;border:1px solid #32455b;border-radius:10px;
padding:10px 13px;display:none;max-width:330px;font-size:12px
}
@media(max-width:600px){
.deep{margin:5px auto}
.deep-head{top:0;border-radius:8px}
.signals{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="header">
<h1>🎯 رادار شخصی MA20</h1>
<p>شکار برخورد قیمت با MA20 تایم‌فریم ۱ دقیقه + پایش زنده</p>
</div>

<div class="toolbar">
<button id="startBtn" class="active" onclick="startRadar()">▶ شروع رادار</button>
<button onclick="stopRadar()">⏸ توقف</button>
<button onclick="scanNow()">🔄 بررسی دستی</button>
<button onclick="clearSignals()">🗑 پاک کردن سیگنال‌ها</button>
<button id="soundBtn" onclick="toggleSound()">🔊 صدا روشن</button>
</div>

<div class="status">
وضعیت:
<strong id="statusText">در حال آماده‌سازی...</strong>
<span id="lastScan"></span>
</div>

<div class="container">

<div class="section-title">
<h2>🚨 سیگنال‌های MA20 یک‌دقیقه</h2>
<span class="counter" id="signalCount">0 سیگنال</span>
</div>

<div id="signals" class="signals">
<div class="empty">
هنوز سیگنال جدیدی دریافت نشده است.<br>
رادار برخورد MA20 در حال انتظار است.
</div>
</div>

</div>

<div id="deepPanel">
<div class="deep">

<div class="deep-head">
<div class="deep-head-row">
<div>
<div class="deep-title" id="deepTitle">تحلیل عمیق</div>
<div class="deep-sub" id="deepSub"></div>
<div id="liveStatus" class="live">🟢 پایش زنده فعال است</div>
</div>

<button class="close" onclick="closeDeep()">✕ بستن</button>
</div>
</div>

<div id="deepContent">
<div class="loading">در حال دریافت تحلیل...</div>
</div>

</div>
</div>

<div id="toast" class="toast"></div>

<script>

const WORKER="https://soft-flower-2790.29mah12.workers.dev";
const SCAN_URL=WORKER+"/api/scan";
const ANALYZE_URL=WORKER+"/api/analyze";

const SCAN_INTERVAL=15000;
const LIVE_INTERVAL=15000;

const STORAGE_KEY="PERSONAL_MA20_SIGNALS_V2";
const SELECTED_KEY="PERSONAL_MA20_SELECTED_V2";

const seenSignals=new Set();
const signals=new Map();

let currentSignalId=null;
let radarTimer=null;
let liveTimer=null;
let running=false;
let soundEnabled=true;
let offset=0;

let lastLiveData=null;
let lastImportantState=null;

/* =========================
DOM
========================= */

const $=id=>document.getElementById(id);

/* =========================
TIME
========================= */

function timeText(ts){
const d=ts?new Date(ts):new Date();
return d.toLocaleTimeString("fa-IR",{
hour:"2-digit",
minute:"2-digit",
second:"2-digit"
});
}

/* =========================
NUMBER
========================= */

function num(v,digits=4){
if(v===null||v===undefined||v===""||Number.isNaN(Number(v)))return "-";
return Number(v).toLocaleString("en-US",{maximumFractionDigits:digits});
}

function pct(v){
if(v===null||v===undefined||Number.isNaN(Number(v)))return "-";
return Number(v).toFixed(2)+"%";
}

/* =========================
STATUS
========================= */

function setStatus(text,good=false){
$("statusText").textContent=text;
$("statusText").style.color=good?"#5ee69b":"#e6c76c";
}

/* =========================
TOAST
========================= */

let toastTimer;

function toast(text){
const el=$("toast");
el.textContent=text;
el.style.display="block";
clearTimeout(toastTimer);
toastTimer=setTimeout(()=>el.style.display="none",4000);
}

/* =========================
SOUND
========================= */

function beep(){
if(!soundEnabled)return;

try{
const Ctx=window.AudioContext||window.webkitAudioContext;
if(!Ctx)return;

const ctx=new Ctx();
const osc=ctx.createOscillator();
const gain=ctx.createGain();

osc.type="sine";
osc.frequency.setValueAtTime(740,ctx.currentTime);
osc.frequency.exponentialRampToValueAtTime(1040,ctx.currentTime+.18);

gain.gain.setValueAtTime(.0001,ctx.currentTime);
gain.gain.exponentialRampToValueAtTime(.22,ctx.currentTime+.02);
gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.35);

osc.connect(gain);
gain.connect(ctx.destination);
osc.start();
osc.stop(ctx.currentTime+.36);
}catch(e){}
}

function toggleSound(){
soundEnabled=!soundEnabled;
$("soundBtn").textContent=soundEnabled?"🔊 صدا روشن":"🔇 صدا خاموش";
if(soundEnabled)beep();
}

/* =========================
LOCAL STORAGE
========================= */

function saveSignals(){

try{
const arr=[...signals.values()];
localStorage.setItem(STORAGE_KEY,JSON.stringify(arr));
}catch(e){}
}

function loadSignals(){

try{

const raw=localStorage.getItem(STORAGE_KEY);
if(!raw)return;

const arr=JSON.parse(raw);

if(!Array.isArray(arr))return;

arr.forEach(s=>{
if(!s||!s.id)return;
signals.set(s.id,s);
seenSignals.add(s.id);
});

}catch(e){
console.log("load signals error",e);
}
}

function saveSelected(){

try{

if(currentSignalId){
localStorage.setItem(
SELECTED_KEY,
currentSignalId
);
}else{
localStorage.removeItem(SELECTED_KEY);
}

}catch(e){}
}

function loadSelected(){

try{

const id=localStorage.getItem(SELECTED_KEY);

if(id&&signals.has(id)){
currentSignalId=id;
}

}catch(e){}
}

/* =========================
MA20 SIGNAL
========================= */

function extractMA20Signal(item){

const tf=item?.timeframes?.["1"];

if(!tf||tf.error)return null;
if(!tf.touchMA20)return null;

const price=Number(tf.price||item.price);
const ma20=Number(tf.ma20);

if(!price||!ma20)return null;

let direction="WAIT";

if(price>=ma20&&tf.maSlope==="UP")direction="LONG";
if(price<=ma20&&tf.maSlope==="DOWN")direction="SHORT";

if(item.direction==="LONG")direction="LONG";
if(item.direction==="SHORT")direction="SHORT";

const event=item.convertedMA1m?.events?.find(
x=>x.source==="1m"&&x.ma==="MA20"
)||null;

return{
symbol:item.symbol,
category:item.category||"linear",
direction,
price,
ma20,
distancePct:(price-ma20)/ma20*100,
maSlope:tf.maSlope,
trend:tf.trend,
type:event?.type||"TOUCH",
rejection:event?.rejection||false,
crossUp:event?.crossUp||false,
crossDown:event?.crossDown||false,
volumeConfirmed:event?.volumeConfirmed||tf.volume?.spike||false,
score:item.score||0,
longScore:item.longScore||0,
shortScore:item.shortScore||0,
hunt:tf.hunt||null,
timestamp:tf.timestamp||item.generatedAt||Date.now(),
deep:item,
receivedAt:Date.now()
};
}

/* =========================
SIGNAL ID
========================= */

function signalId(s){

return[
s.symbol,
s.timestamp,
s.direction,
s.type
].join("_");

}

/* =========================
ADD / UPDATE
========================= */

function addSignal(s){

const id=signalId(s);

if(seenSignals.has(id)){

/*
اطلاعات همان سیگنال را تازه می‌کنیم
ولی زمان دریافت اولیه را نگه می‌داریم.
*/
const old=signals.get(id);

signals.set(id,{
...old,
...s,
receivedAt:old?.receivedAt||Date.now()
});

saveSignals();
renderSignals();

return false;
}

seenSignals.add(id);

signals.set(id,{
id,
...s,
receivedAt:Date.now(),
active:true
});

saveSignals();
beep();
renderSignals();

toast(
`🚨 سیگنال جدید ${s.symbol} — ${
s.direction==="LONG"?"LONG":
s.direction==="SHORT"?"SHORT":"MA20"
}`
);

return true;
}

/* =========================
RENDER
========================= */

function renderSignals(){

const box=$("signals");

if(!signals.size){

box.innerHTML=`
<div class="empty">
هنوز سیگنال جدیدی دریافت نشده است.<br>
رادار برخورد MA20 در حال انتظار است.
</div>`;

$("signalCount").textContent="0 سیگنال";
return;
}

const arr=[...signals.values()].sort(
(a,b)=>b.receivedAt-a.receivedAt
);

box.innerHTML=arr.map(s=>{

const dirClass=
s.direction==="LONG"?"long":
s.direction==="SHORT"?"short":"";

const badgeClass=
s.direction==="LONG"?"long":
s.direction==="SHORT"?"short":"wait";

const directionText=
s.direction==="LONG"?"🟢 LONG":
s.direction==="SHORT"?"🔴 SHORT":"🟡 MA20";

const typeText={
TOUCH:"برخورد",
REJECTION:"برگشت از MA20",
BREAK:"شکست MA20"
}[s.type]||"برخورد MA20";

const selected=currentSignalId===s.id;

return`

<div class="signal ${dirClass} ${selected?"current":""}">

<div class="signal-head">

<div class="symbol">
${escapeHtml(s.symbol)}
${selected?" 🔒":""}
</div>

<div class="badge ${badgeClass}">
${directionText}
</div>

</div>

<div class="signal-grid">

<div class="metric">
<small>قیمت</small>
<b>${num(s.price)}</b>
</div>

<div class="metric">
<small>MA20 یک دقیقه</small>
<b class="ma">${num(s.ma20)}</b>
</div>

<div class="metric">
<small>فاصله</small>
<b>${pct(s.distancePct)}</b>
</div>

<div class="metric">
<small>نوع</small>
<b>${typeText}</b>
</div>

<div class="metric">
<small>شیب MA20</small>
<b>${s.maSlope||"-"}</b>
</div>

<div class="metric">
<small>حجم</small>
<b>${s.volumeConfirmed?"تأیید":"عادی"}</b>
</div>

</div>

<div class="time">
🕒 ${timeText(s.receivedAt)}
|
کندل: ${timeText(s.timestamp)}
</div>

<div class="signal-actions">

<button onclick="openDeep('${encodeURIComponent(s.symbol)}','${s.category}','${s.id}')">
🔬 ${selected?"ادامه بررسی":"تحلیل عمیق"}
</button>

<button onclick="focusSignal('${s.id}')">
${selected?"🔒 انتخاب شده":"🎯 انتخاب"}
</button>

</div>

</div>

`;

}).join("");

$("signalCount").textContent=`${arr.length} سیگنال`;

}

/* =========================
ESCAPE
========================= */

function escapeHtml(v){

return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

/* =========================
SELECT SIGNAL
========================= */

function focusSignal(id){

if(!signals.has(id))return;

currentSignalId=id;

saveSelected();
renderSignals();

const s=signals.get(id);

if(s){
toast(`🔒 ${s.symbol} برای بررسی شما قفل شد و حذف نمی‌شود.`);
}

const cards=document.querySelectorAll(".signal");

const arr=[...signals.values()].sort(
(a,b)=>b.receivedAt-a.receivedAt
);

const index=arr.findIndex(x=>x.id===id);

if(cards[index]){
cards[index].scrollIntoView({
behavior:"smooth",
block:"center"
});
}

}

/* =========================
SCAN
========================= */

async function scanNow(){

if(!running)setStatus("در حال بررسی دستی...",false);

try{

const url=SCAN_URL+"?offset="+encodeURIComponent(offset);

const r=await fetch(url,{cache:"no-store"});

if(!r.ok)throw new Error("HTTP "+r.status);

const data=await r.json();

if(!data.ok){
throw new Error(data.error||"خطای Worker");
}

offset=Number(data.nextOffset)||0;

let found=0;

for(const item of data.results||[]){

const signal=extractMA20Signal(item);

if(!signal)continue;

if(addSignal(signal))found++;

}

$("lastScan").textContent=
` | آخرین بررسی: ${timeText()}`;

if(running){

setStatus(
found
?`🟢 ${found} سیگنال جدید`
:"🟡 اسکن انجام شد؛ سیگنال جدیدی نبود",
found>0
);

}else{

setStatus(
found
?`🟢 ${found} سیگنال پیدا شد`
:"🟡 بررسی انجام شد"
);

}

}catch(e){

console.error(e);

setStatus("❌ خطا: "+e.message);
toast("خطا در اتصال به Worker: "+e.message);

}

}

/* =========================
START
========================= */

function startRadar(){

if(running)return;

running=true;

$("startBtn").classList.add("active");

setStatus("🟢 رادار فعال است",true);

scanNow();

radarTimer=setInterval(
scanNow,
SCAN_INTERVAL
);

}

/* =========================
STOP
========================= */

function stopRadar(){

running=false;

$("startBtn").classList.remove("active");

if(radarTimer){
clearInterval(radarTimer);
radarTimer=null;
}

setStatus("⏸ رادار متوقف شد");

}

/* =========================
CLEAR
========================= */

function clearSignals(){

signals.clear();
seenSignals.clear();

currentSignalId=null;

localStorage.removeItem(STORAGE_KEY);
localStorage.removeItem(SELECTED_KEY);

renderSignals();

toast("🗑 همه سیگنال‌ها پاک شدند.");

}

/* =========================================================
LIVE ANALYSIS
========================================================= */

async function refreshLive(){

if(!currentSignalId)return;

const selected=signals.get(currentSignalId);

if(!selected)return;

try{

const url=
ANALYZE_URL+
"?symbol="+encodeURIComponent(selected.symbol)+
"&category="+encodeURIComponent(selected.category||"linear");

const r=await fetch(url,{cache:"no-store"});

if(!r.ok)throw new Error("HTTP "+r.status);

const data=await r.json();

if(!data.ok)throw new Error(data.error||"تحلیل دریافت نشد");

const changes=detectImportantChanges(lastLiveData,data);

lastLiveData=data;

updateSelectedSignalFromLive(data);

$("deepSub").textContent=
`قیمت: ${num(data.price)} | امتیاز: ${data.score}/100 | بروزرسانی: ${timeText()}`;

if(changes.length){

$("liveStatus").className="live alert";

$("liveStatus").textContent=
"🚨 اتفاق مهم: "+changes.join(" | ");

toast(
`🚨 ${selected.symbol}: ${changes.join(" | ")}`
);

}else{

$("liveStatus").className="live";

$("liveStatus").textContent=
"🟢 پایش زنده فعال است — آخرین بروزرسانی "+timeText();

}

$("deepContent").innerHTML=buildDeep(data);

}catch(e){

console.error(e);

$("liveStatus").className="live alert";

$("liveStatus").textContent=
"🟠 خطا در بروزرسانی زنده";

}

}

/* =========================
UPDATE SELECTED CARD
========================= */

function updateSelectedSignalFromLive(d){

if(!currentSignalId)return;

const s=signals.get(currentSignalId);

if(!s)return;

const tf=d.timeframes?.["1"]||{};

signals.set(currentSignalId,{
...s,
price:Number(tf.price||d.price||s.price),
ma20:Number(tf.ma20||s.ma20),
maSlope:tf.maSlope||s.maSlope,
trend:tf.trend||s.trend,
score:d.score??s.score,
longScore:d.longScore??s.longScore,
shortScore:d.shortScore??s.shortScore,
volumeConfirmed:
tf.volume?.spike??
s.volumeConfirmed
});

saveSignals();
renderSignals();

}

/* =========================
IMPORTANT EVENTS
========================= */

function detectImportantChanges(oldData,newData){

if(!oldData)return[];

const changes=[];

const oldTf=oldData.timeframes?.["1"]||{};
const newTf=newData.timeframes?.["1"]||{};

const oldScore=Number(oldData.score||0);
const newScore=Number(newData.score||0);

if(
oldData.direction&&
newData.direction&&
oldData.direction!==newData.direction
){
changes.push(
`تغییر جهت ${oldData.direction} ← ${newData.direction}`
);
}

if(
oldTf.maSlope&&
newTf.maSlope&&
oldTf.maSlope!==newTf.maSlope
){
changes.push(
`تغییر شیب MA20 به ${newTf.maSlope}`
);
}

if(
oldTf.hunt?.type!==newTf.hunt?.type &&
newTf.hunt?.type
){
changes.push(
`Hunt جدید: ${newTf.hunt.type}`
);
}

if(
oldTf.bos!==newTf.bos &&
newTf.bos
){
changes.push(`BOS: ${newTf.bos}`);
}

if(
oldTf.choch!==newTf.choch &&
newTf.choch
){
changes.push(`CHoCH: ${newTf.choch}`);
}

const oldDelta=Number(oldData.footprint?.delta||0);
const newDelta=Number(newData.footprint?.delta||0);

if(oldDelta!==0&&newDelta!==0){

if(
oldDelta<0&&newDelta>0
){
changes.push("Delta از فروش به خرید برگشت");
}

if(
oldDelta>0&&newDelta<0
){
changes.push("Delta از خرید به فروش برگشت");
}

}

const oldPump=Number(oldData.movement?.pumpScore||0);
const newPump=Number(newData.movement?.pumpScore||0);

const oldDump=Number(oldData.movement?.dumpScore||0);
const newDump=Number(newData.movement?.dumpScore||0);

if(newPump-oldPump>=15){
changes.push("افزایش Pump Score");
}

if(newDump-oldDump>=15){
changes.push("افزایش Dump Score");
}

if(Math.abs(newScore-oldScore)>=10){

changes.push(
`Score تغییر کرد ${oldScore} → ${newScore}`
);

}

const oldSR=oldData.supportResistance||{};
const newSR=newData.supportResistance||{};

if(
oldSR.nearestResistance?.price&&
newSR.nearestResistance?.price&&
oldSR.nearestResistance.price!==newSR.nearestResistance.price
){
changes.push("مقاومت نزدیک تغییر کرد");
}

if(
oldSR.nearestSupport?.price&&
newSR.nearestSupport?.price&&
oldSR.nearestSupport.price!==newSR.nearestSupport.price
){
changes.push("حمایت نزدیک تغییر کرد");
}

const oldWall=oldData.walls||{};
const newWall=newData.walls||{};

if(
oldWall.buy?.price&&
newWall.buy?.price&&
oldWall.buy.price!==newWall.buy.price
){
changes.push("Buy Wall جابه‌جا شد");
}

if(
oldWall.sell?.price&&
newWall.sell?.price&&
oldWall.sell.price!==newWall.sell.price
){
changes.push("Sell Wall جابه‌جا شد");
}

return changes.slice(0,5);

}

/* =========================
HELPERS
========================= */

function panel(title,content){

return`
<div class="panel">
<h3>${title}</h3>
${content}
</div>
`;

}

function row(label,value){

return`
<div class="row">
<span class="label">${escapeHtml(label)}</span>
<b class="value">
${escapeHtml(
value===null||
value===undefined||
value===""
?"—"
:String(value)
)}
</b>
</div>
`;

}

function reasonsPanel(d){

const reasons=d.reasons||[];

if(!reasons.length){

return panel(
"📝 دلایل",
`<div class="reason">
دلیل قطعی برای سیگنال ثبت نشده است.
</div>`
);

}

return panel(
"📝 دلایل سیگنال",
reasons.map(x=>
`<div class="reason">${escapeHtml(x)}</div>`
).join("")
);

}
