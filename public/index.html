<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#080c12;

}

.container{

header{

h1{

.subtitle{

}

.status{

.searchBox{

}

.controls{

  font-size:13px;

.card{

.cardTitle{

  margin-bottom:12px;
}

.symbolHeader{
  display:flex;

}

.symbol{

}

.price{

  font-size:15px;

}

.signal{

.signal.long{

}

.score{

  margin-top:6px;

}

.grid{

}

.stat{

  border:1px solid #1d2732;

  padding:11px;
}

.statLabel{
  color:#7f8b9a;
  font-size:10px;
  margin-bottom:5px;
}

.statValue{
  font-size:14px;
  font-weight:bold;
}

.green{
  color:#38e879;
}

.red{
  color:#ff5664;
}

.yellow{
  color:#ffd34d;
}

.blue{
  color:#58a6ff;
}

.tfTable{
  width:100%;
  border-collapse:collapse;
  font-size:11px;
}

.tfTable th{

  padding:8px 4px;

.maLong{

.maShort{

}

.maNeutral{

}

.reason{

  padding:9px;
  margin-bottom:6px;
  font-size:11px;
  color:#b9c4d1;

.wall{
  display:flex;
  justify-content:space-between;
  gap:8px;
}

.wallBox{
  flex:1;
  background:#0c1118;

.wallTitle{

.level{

}

</head>

<body>

<div class="container">

<header>
  <h1>📊 اسکنر هوشمند بازار</h1>
  <div class="subtitle">
    ساختار • نقدینگی • حجم • Order Flow • FVG • BOS • CHoCH • MA
  </div>

  <div id="status" class="status">
    🟡 در حال اتصال...
  </div>
</header>

<div class="searchBox">

  <div class="searchRow">
    <input
      id="symbolInput"
      placeholder="مثلاً BTCUSDT یا BTC"
      autocomplete="off"
    >

    <button onclick="analyzeSymbol()">
      🔎 بررسی ارز
    </button>
  </div>

  <div class="controls">

    <button class="method active" data-method="ma">
      MA
    </button>

    <button class="method active" data-method="smart">
      Smart Money
    </button>

    <button class="method active" data-method="ict">
      ICT / FVG
    </button>

    <button class="method active" data-method="macd">
      MACD
    </button>

    <button class="method active" data-method="rsi">
      RSI
    </button>

    <button class="method active" data-method="ichimoku">
      Ichimoku
    </button>

    <button class="method active" data-method="volume">
      Volume
    </button>

    <button class="method active" data-method="orderflow">
      Order Flow
    </button>

    <button class="method active" data-method="liquidity">
      Liquidity
    </button>

    <button class="method active" data-method="sr">
      Support / Resistance
    </button>

    <button class="method active" data-method="oi">
      OI
    </button>

  </div>

  <div class="threshold">
    حداقل امتیاز سیگنال:
    <input
      id="threshold"
      type="number"
      min="1"
      max="100"
      value="75"
    >
  </div>

</div>

<div id="result">

  <div class="card loading">
    برای شروع نام ارز را وارد کن.
  </div>

</div>

</div>

<script>

const API = "";

const TF_CONFIG = [

  {
    key:"1",
    label:"1 دقیقه",
    multiplier:1
  },

  {
    key:"3",
    label:"3 دقیقه",
    multiplier:3
  },

  {
    key:"5",
    label:"5 دقیقه",
    multiplier:5
  },

  {
    key:"15",
    label:"15 دقیقه",
    multiplier:15
  },

  {
    key:"60",
    label:"1 ساعت",
    multiplier:60
  }

];

/* =====================================================
   METHODS
===================================================== */

document
.querySelectorAll(".method")
.forEach(btn=>{

  btn.addEventListener("click",()=>{

    btn.classList.toggle("active");

  });

});


function getMethods(){

  return [
    ...document.querySelectorAll(".method.active")
  ]
  .map(x=>x.dataset.method);

}


function threshold(){

  return Math.max(
    1,
    Math.min(
      100,
      Number(
        document.getElementById("threshold").value
      ) || 75
    )
  );

}


/* =====================================================
   FORMAT
===================================================== */

function num(v,d=2){

  if(v===null || v===undefined || !Number.isFinite(Number(v)))
    return "-";

  return Number(v).toLocaleString(
    "en-US",
    {
      maximumFractionDigits:d
    }
  );

}


function price(v){

  if(v===null || v===undefined)
    return "-";

  const x=Number(v);

  if(x>=1000)
    return num(x,2);

  if(x>=1)
    return num(x,4);

  if(x>=.01)
    return num(x,6);

  return num(x,10);

}


/* =====================================================
   MA CONVERSION
===================================================== */

/*
  همه چیز بر اساس کندل 1 دقیقه محاسبه می‌شود.

  MA7 / MA20:

  1m:
    7
    20

  3m:
    21
    60

  5m:
    35
    100

  15m:
    105
    300

  1h:
    420
    1200
*/

function convertedMA(period,multiplier){

  return period * multiplier;

}


function maText(period,multiplier){

  return convertedMA(
    period,
    multiplier
  );

}


/* =====================================================
   MA COLOR
===================================================== */

function maClass(a){

  if(!a)
    return "maNeutral";

  if(
    a.trend==="BULLISH" &&
    a.maSlope==="UP"
  )
    return "maLong";

  if(
    a.trend==="BEARISH" &&
    a.maSlope==="DOWN"
  )
    return "maShort";

  return "maNeutral";

}


function trendText(a){

  if(!a)
    return "-";

  if(a.trend==="BULLISH")
    return "🟢 صعودی";

  if(a.trend==="BEARISH")
    return "🔴 نزولی";

  return "🟡 رنج";

}


/* =====================================================
   SIGNAL
===================================================== */

function signalClass(direction){

  if(direction==="LONG")
    return "long";

  if(direction==="SHORT")
    return "short";

  return "wait";

}


function signalText(direction){

  if(direction==="LONG")
    return "🟢 LONG";

  if(direction==="SHORT")
    return "🔴 SHORT";

  return "🟡 WAIT";

}


/* =====================================================
   TIMEFRAME TABLE
===================================================== */

function renderTimeframes(data){

  const tf =
    data.timeframes || {};

  let html=`

  <div class="card">

    <div class="cardTitle">
      📐 مووینگ‌های چند تایم‌فریمی
    </div>

    <div class="small">
      تمام MAها بر اساس کندل 1 دقیقه‌ای محاسبه می‌شوند.
    </div>

    <div style="overflow-x:auto;margin-top:10px">

      <table class="tfTable">

        <thead>

          <tr>

            <th>تایم</th>

            <th>MA7 معادل 1m</th>

            <th>MA20 معادل 1m</th>

            <th>روند</th>

            <th>شیب MA20</th>

            <th>RSI</th>

            <th>MACD</th>

          </tr>

        </thead>

        <tbody>
  `;

  for(const item of TF_CONFIG){

    const a=tf[item.key];

    if(!a || a.error){

      html+=`

      <tr>

        <td class="tfName">
          ${item.label}
        </td>

        <td colspan="6">
          داده کافی نیست
        </td>

      </tr>

      `;

      continue;

    }

    html+=`

      <tr>

        <td class="tfName">
          ${item.label}
        </td>

        <td>
          ${maText(7,item.multiplier)}
        </td>

        <td>
          ${maText(20,item.multiplier)}
        </td>

        <td class="${maClass(a)}">
          ${trendText(a)}
        </td>

        <td>
          ${
            a.maSlope==="UP"
              ? "🟢 صعود"
              : a.maSlope==="DOWN"
                ? "🔴 نزول"
                : "🟡 خنثی"
          }
        </td>

        <td>
          ${num(a.rsi,1)}
        </td>

        <td class="${
          a.macd?.direction==="LONG"
            ? "green"
            : a.macd?.direction==="SHORT"
              ? "red"
              : "yellow"
        }">
          ${
            a.macd?.direction==="LONG"
              ? "LONG"
              : a.macd?.direction==="SHORT"
                ? "SHORT"
                : "NONE"
          }
        </td>

      </tr>

    `;

  }

  html+=`

        </tbody>

      </table>

    </div>

  </div>

  `;

  return html;

}


/* =====================================================
   MAIN RENDER
===================================================== */

function render(data){

  const result =
    document.getElementById("result");

  const base =
    data.timeframes?.["1"] || {};

  const direction =
    data.direction || "WAIT";

  let html="";

  html+=`

  <div class="card">

    <div class="symbolHeader">

      <div>

        <div class="symbol">
          ${data.symbol || "-"}
        </div>

        <div class="small">
          ${
            data.category==="linear"
              ? "بازار فیوچرز"
              : "بازار اسپات"
          }
        </div>

      </div>

      <div class="price">
        ${price(data.price)}
      </div>

    </div>

    <div class="signal ${signalClass(direction)}">

      <div class="signalDirection">
        ${signalText(direction)}
      </div>

      <div class="score">
        امتیاز نهایی:
        <b>${num(data.score,0)}</b>
        / 100
      </div>

      <div class="small">
        سطح:
        ${data.signalLevel || "-"}
        |
        حداقل:
        ${data.threshold || 75}
      </div>

    </div>

  </div>


  ${renderTimeframes(data)}


  <div class="card">

    <div class="cardTitle">
      📊 وضعیت بازار 1 دقیقه
    </div>

    <div class="grid">

      <div class="stat">

        <div class="statLabel">
          MA7
        </div>

        <div class="statValue blue">
          ${price(base.ma7)}
        </div>

      </div>


      <div class="stat">

        <div class="statLabel">
          MA20
        </div>

        <div class="statValue blue">
          ${price(base.ma20)}
        </div>

      </div>


      <div class="stat">

        <div class="statLabel">
          روند
        </div>

        <div class="statValue">
          ${trendText(base)}
        </div>

      </div>


      <div class="stat">

        <div class="statLabel">
          شیب MA20
        </div>

        <div class="statValue">
          ${
            base.maSlope==="UP"
              ? "🟢 صعودی"
              : base.maSlope==="DOWN"
                ? "🔴 نزولی"
                : "🟡 خنثی"
          }
        </div>

      </div>


      <div class="stat">

        <div class="statLabel">
          RSI
        </div>

        <div class="statValue">
          ${num(base.rsi,1)}
        </div>

      </div>


      <div class="stat">

        <div class="statLabel">
          ADX
        </div>

        <div class="statValue">
          ${num(base.market?.adx,1)}
        </div>

      </div>


      <div class="stat">

        <div class="statLabel">
          BOS
        </div>

        <div class="statValue ${
          base.bos==="BULLISH"
            ? "green"
            : base.bos==="BEARISH"
              ? "red"
              : ""
        }">
          ${base.bos || "NONE"}
        </div>

      </div>


      <div class="stat">

        <div class="statLabel">
          CHoCH
        </div>

        <div class="statValue ${
          base.choch==="BULLISH"
            ? "green"
            : base.choch==="BEARISH"
              ? "red"
              : ""
        }">
          ${base.choch || "NONE"}
        </div>

      </div>

    </div>

  </div>


  <div class="card">

    <div class="cardTitle">
      🧠 Smart Money / ICT
    </div>

    <div class="grid">

      <div class="stat">

        <div class="statLabel">
          Liquidity Hunt
        </div>

        <div class="statValue">

          ${
            base.hunt?.side==="LONG"
              ? "🟢 شکار نقدینگی خرید"
              : base.hunt?.side==="SHORT"
                ? "🔴 شکار نقدینگی فروش"
                : "—"
          }

        </div>

      </div>


      <div class="stat">

        <div class="statLabel">
          FVG
        </div>

        <div class="statValue">

          ${
            base.fvg?.type==="BULLISH"
              ? "🟢 FVG صعودی"
              : base.fvg?.type==="BEARISH"
                ? "🔴 FVG نزولی"
                : "—"
          }

        </div>

      </div>


      <div class="stat">

        <div class="statLabel">
          Order Block
        </div>

        <div class="statValue">

          ${
            base.orderBlock?.type==="BULLISH"
              ? "🟢 OB صعودی"
              : base.orderBlock?.type==="BEARISH"
                ? "🔴 OB نزولی"
                : "—"
          }

        </div>

      </div>


      <div class="stat">

        <div class="statLabel">
          Candle
        </div>

        <div class="statValue">
          ${base.candle || "-"}
        </div>

      </div>

    </div>

  </div>


  <div class="card">

    <div class="cardTitle">
      📦 Order Flow
    </div>

    <div class="grid">

      <div class="stat">

        <div class="statLabel">
          Buy Volume
        </div>

        <div class="statValue green">
          ${num(data.footprint?.buyVolume,2)}
        </div>

      </div>


      <div class="stat">

        <div class="statLabel">
          Sell Volume
        </div>

        <div class="statValue red">
          ${num(data.footprint?.sellVolume,2)}

      </div>


      <div class="stat">

        <div class="statLabel">
          Delta
        </div>

        <div class="statValue ${
          Number(data.footprint?.delta)>=0
            ? "green"

        }">
          ${num(data.footprint?.delta,2)}

      </div>


      <div class="stat">

          Delta %
        </div>

          ${num(data.footprint?.deltaPercent,1)}%
        </div>

      </div>

    </div>

  </div>


  <div class="card">

    <div class="cardTitle">
      🧱 نقدینگی نزدیک قیمت
    </div>

    <div class="wall">

      <div class="wallBox">

        <div class="wallTitle">
          🟢 بزرگ‌ترین دیوار خرید
        </div>

        <div class="level green">
          ${
            data.walls?.buy
              ? price(data.walls.buy.price)
              : "-"
          }
        </div>

        <div class="small">
          ${
            data.walls?.buy
              ? "$"+num(data.walls.buy.notional,0)
              : ""
          }
        </div>

        <div class="small">
          ${
            data.walls?.buy
              ? num(data.walls.buy.distancePct,2)+"% فاصله"
              : ""
          }
        </div>

      </div>


      <div class="wallBox">

        <div class="wallTitle">
          🔴 بزرگ‌ترین دیوار فروش
        </div>

        <div class="level red">
          ${
            data.walls?.sell
              ? price(data.walls.sell.price)
              : "-"
          }
        </div>

        <div class="small">
          ${
            data.walls?.sell
              ? "$"+num(data.walls.sell.notional,0)
              : ""
          }
        </div>

        <div class="small">
          ${
            data.walls?.sell
              ? num(data.walls.sell.distancePct,2)+"% فاصله"
              : ""
          }
        </div>

      </div>

    </div>

  </div>


  <div class="card">

    <div class="cardTitle">
      📈 حجم و وضعیت بازار
    </div>

    <div class="grid">

      <div class="stat">

        <div class="statLabel">
          Volume
        </div>

        <div class="statValue">
          ${num(base.volume?.current,2)}
        </div>

      </div>


      <div class="stat">

        <div class="statLabel">
          Volume / MA20
        </div>

        <div class="statValue">
          ${num(base.volume?.ratio,2)}x
        </div>

      </div>


      <div class="stat">

        <div class="statLabel">
          Volume Spike
        </div>

        <div class="statValue">
          ${
            base.volume?.spike
              ? "🔥 فعال"
              : "—"
          }
        </div>

      </div>


      <div class="stat">

        <div class="statLabel">
          Market State
        </div>

        <div class="statValue">
          ${base.market?.state || "-"}
        </div>

      </div>

    </div>

  </div>


  <div class="card">

    <div class="cardTitle">
      💰 Futures
    </div>

    <div class="grid">

      <div class="stat">

        <div class="statLabel">
          Open Interest
        </div>

        <div class="statValue">
          ${num(data.market?.openInterest,2)}
        </div>

      </div>


      <div class="stat">

        <div class="statLabel">
          Funding
        </div>

        <div class="statValue">
          ${
            data.market?.fundingRate !== null &&
            data.market?.fundingRate !== undefined
              ? num(
                  Number(data.market.fundingRate)*100,
                  4
                )+"%"
              : "-"
          }
        </div>

      </div>


      <div class="stat">

        <div class="statLabel">
          24H Change
        </div>

        <div class="statValue ${
          Number(data.market?.change24h)>=0
            ? "green"
            : "red"
        }">
          ${
            data.market?.change24h !== undefined
              ? num(data.market.change24h,2)+"%"
              : "-"
          }
        </div>

      </div>


      <div class="stat">

        <div class="statLabel">
          24H Turnover
        </div>

        <div class="statValue">
          ${num(data.market?.turnover24h,0)}
        </div>

      </div>

    </div>

  </div>


  <div class="card">

    <div class="cardTitle">
      🎯 دلایل سیگنال
    </div>

    ${
      (data.reasons || []).length
        ? data.reasons
            .map(x=>`
              <div class="reason">
                ${x}
              </div>
            `)
            .join("")
        : `
          <div class="small">
            هنوز دلیل قدرتمندی برای ورود تأیید نشده است.
          </div>
        `
    }

  </div>


  <div class="card">

    <div class="cardTitle">
      ℹ️ اطلاعات تحلیل
    </div>

    <div class="small">
      زمان تحلیل:
      ${
        data.generatedAt
          ? new Date(
              data.generatedAt
            ).toLocaleString("fa-IR")
          : "-"
      }
    </div>

    <div class="small" style="margin-top:7px">
      مدل MA:
      تبدیل دوره‌های 3، 5، 15 و 60 دقیقه‌ای
      به کندل‌های 1 دقیقه‌ای
    </div>

  </div>

  `;

  result.innerHTML=html;

}


/* =====================================================
   ANALYZE
===================================================== */

async function analyzeSymbol(){

  const input =
    document
      .getElementById("symbolInput")
      .value
      .trim();

  if(!input){

    document.getElementById("result").innerHTML=`
      <div class="card error">
        نام ارز را وارد کن.
      </div>
    `;

    return;

  }

  document.getElementById("result").innerHTML=`
    <div class="card loading">
      🔄 در حال دریافت اطلاعات ${input.toUpperCase()}...
      <br><br>
      ساختار، حجم، نقدینگی، Order Flow و تایم‌فریم‌ها در حال بررسی است.
    </div>
  `;

  try{

    const methods =
      encodeURIComponent(
        JSON.stringify(
          getMethods()
        )
      );

    const url =
      `${API}/api/analyze`+
      `?symbol=${encodeURIComponent(input)}`+
      `&threshold=${threshold()}`+
      `&methods=${methods}`;

    const response =
      await fetch(url);

    const data =
      await response.json();

    if(!response.ok || !data.ok){

      throw new Error(
        data.error ||
        "خطا در دریافت اطلاعات"
      );

    }

    render(data);

  }catch(e){

    document.getElementById("result").innerHTML=`

      <div class="card">

        <div class="error">
          ❌ ${e.message}
        </div>

        <div class="small" style="margin-top:10px">
          نام ارز را به شکل BTC یا BTCUSDT وارد کن.
        </div>

      </div>

    `;

  }

}


/* =====================================================
   ENTER KEY
===================================================== */

document
.getElementById("symbolInput")
.addEventListener(
  "keydown",
  e=>{

    if(e.key==="Enter")
      analyzeSymbol();

  }
);


/* =====================================================
   HEALTH
===================================================== */

async function health(){

  try{

    const r =
      await fetch(
        `${API}/api/health`
      );

    const d =
      await r.json();

    if(d.ok){

      document.getElementById(
        "status"
      ).textContent =
        "🟢 اتصال برقرار است";

    }else{

      throw new Error();

    }

  }catch{

    document.getElementById(
      "status"
    ).textContent =
      "🔴 اتصال برقرار نیست";

  }

}

health();

</script>
