<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1"
>

<title>Bybit Futures Scanner V10</title>

<style>

*{
box-sizing:border-box
}

body{
margin:0;
background:#0b0f14;
color:#fff;
font-family:Arial,Tahoma,sans-serif
}

.container{
max-width:900px;
margin:auto;
padding:14px
}

h1{
font-size:21px;
margin:5px 0 14px
}

.card{
background:#151b23;
border:1px solid #293241;
border-radius:14px;
padding:14px;
margin-bottom:12px
}

.row{
display:flex;
gap:8px;
flex-wrap:wrap
}

input,button{
min-height:44px;
padding:9px 12px;
border-radius:9px;
border:1px solid #394555;
background:#0b0f14;
color:#fff;
font-size:15px
}

input{
flex:1;
min-width:150px
}

button{
background:#238636;
border:0;
font-weight:bold
}

button.scan{
background:#2563eb
}

button.mute{
background:#8b1e1e
}

button.soundOn{
background:#238636
}

.status{
color:#9aa4b2;
font-size:13px;
margin-top:10px;
line-height:1.8
}

.tf{
display:flex;
gap:6px;
margin-top:10px
}

.tf span{
background:#0b0f14;
border:1px solid #303947;
padding:6px 10px;
border-radius:8px;
font-size:12px
}

.top{
color:#ffd740;
font-weight:bold;
margin-bottom:8px
}

.empty{
text-align:center;
padding:25px;
color:#8b949e
}

.signal{
background:#0b0f14;
border-radius:12px;
padding:14px;
margin-top:10px;
border-right:4px solid #777
}

.signal.long{
border-right-color:#00c853
}

.signal.short{
border-right-color:#ff3d00
}

.signal.wait{
border-right-color:#ffc107
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px
}

.title{
font-size:18px;
font-weight:bold
}

.score{
font-size:20px;
font-weight:bold
}

.meta{
color:#9aa4b2;
font-size:12px;
margin-top:4px
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:7px;
margin-top:10px
}

.box{
background:#11161d;
border-radius:9px;
padding:9px
}

.label{
color:#8b949e;
font-size:11px;
margin-bottom:5px
}

.value{
font-size:14px;
font-weight:bold
}

.confirm{
margin-top:10px;
background:#11161d;
border-radius:10px;
padding:10px;
line-height:2;
font-size:13px
}

.section{
margin-top:10px;
font-weight:bold;
color:#ffd740
}

.green{
color:#00e676
}

.red{
color:#ff5252
}

.yellow{
color:#ffd740
}

.gray{
color:#8b949e
}

.alertBox{
background:#11161d;
border:1px solid #394555;
border-radius:10px;
padding:10px;
margin-top:10px;
line-height:1.8
}

.alertActive{
border-color:#00e676
}

.alertMuted{
border-color:#ff5252
}

@media(max-width:600px){

.grid{
grid-template-columns:1fr 1fr
}

}

</style>

</head>


<body>

<div class="container">


<h1>
📊 اسکنر فیوچرز Bybit
</h1>


<!-- CONTROL -->

<div class="card">

<div class="row">

<input
id="symbol"
value="BTCUSDT"
placeholder="مثلاً BTCUSDT"
>

<button
onclick="analyzeSymbol()"
>
🔎 تحلیل ارز
</button>

<button
class="scan"
onclick="scanMarket()"
>
🚨 اسکن ۲۰۰ ارز
</button>

</div>


<div class="tf">

<span>۱ دقیقه (1m)</span>

<span>۳ دقیقه (3m)</span>

<span>۵ دقیقه (5m)</span>

</div>


<div class="alertBox alertActive" id="alertBox">

<div>

<b>
🔔 هشدار صوتی
</b>

</div>

<div
class="status"
id="alertStatus"
>
هشدار فعال است.
</div>

<button
class="soundOn"
id="soundButton"
onclick="toggleSound()"
>
🔔 قطع هشدار
</button>

</div>


<div
id="status"
class="status"
>
آماده اسکن Bybit Futures
</div>

</div>


<!-- RESULTS -->

<div class="card">

<div class="top">
🏆 ۱۰ موقعیت برتر
</div>

<div id="results">

<div class="empty">
هنوز اسکن انجام نشده.
</div>

</div>

</div>


<!-- MANUAL -->

<div class="card">

<div class="top">
🔎 نتیجه تحلیل دستی
</div>

<div id="manual">

<div class="empty">
یک ارز وارد کن و تحلیل ارز را بزن.
</div>

</div>

</div>


</div>


<script>


// =================================================
// SETTINGS
// =================================================

let soundEnabled = true;

let lastAlertSymbols = new Set();


// =================================================
// NUMBER
// =================================================

function num(v){

if(
v===null ||
v===undefined ||
Number.isNaN(Number(v))
)
return "-";

return Number(v).toLocaleString(
"en-US",
{
maximumFractionDigits:8
}
);

}


// =================================================
// PERCENT
// =================================================

function pct(v){

if(
v===null ||
v===undefined ||
Number.isNaN(Number(v))
)
return "-";

return Number(v).toFixed(2)+"%";

}


// =================================================
// TRANSLATIONS
// =================================================

function trendFA(v){

if(v==="BULLISH")
return "🟢 صعودی (BULLISH)";

if(v==="BEARISH")
return "🔴 نزولی (BEARISH)";

return "🟡 رنج (RANGE)";

}


function slopeFA(v){

if(v==="UP")
return "🟢 صعودی (UP)";

if(v==="DOWN")
return "🔴 نزولی (DOWN)";

return "🟡 خنثی (FLAT)";

}


function structureFA(v){

if(v==="BULLISH")
return "🟢 صعودی (BULLISH)";

if(v==="BEARISH")
return "🔴 نزولی (BEARISH)";

return "⚪ بدون ساختار (NONE)";

}


function fvgFA(v){

if(v==="BULLISH")
return "🟢 صعودی (BULLISH)";

if(v==="BEARISH")
return "🔴 نزولی (BEARISH)";

return "⚪ ندارد (NONE)";

}


function directionFA(v){

if(v==="LONG")
return "🟢 خرید (LONG)";

if(v==="SHORT")
return "🔴 فروش (SHORT)";

return "🟡 انتظار (WAIT)";

}


function scoreClass(score){

if(score>=75)
return "green";

if(score>=50)
return "yellow";

return "gray";

}


// =================================================
// SOUND
// =================================================

function playAlert(){

if(!soundEnabled)
return;

try{

const AudioContext =
window.AudioContext ||
window.webkitAudioContext;

if(!AudioContext)
return;

const ctx =
new AudioContext();

const oscillator =
ctx.createOscillator();

const gain =
ctx.createGain();


oscillator.type = "sine";

oscillator.frequency.setValueAtTime(
880,
ctx.currentTime
);

oscillator.frequency.setValueAtTime(
660,
ctx.currentTime + 0.18
);

oscillator.frequency.setValueAtTime(
880,
ctx.currentTime + 0.36
);


gain.gain.setValueAtTime(
0.001,
ctx.currentTime
);

gain.gain.exponentialRampToValueAtTime(
0.35,
ctx.currentTime + 0.03
);

gain.gain.exponentialRampToValueAtTime(
0.001,
ctx.currentTime + 0.55
);


oscillator.connect(gain);

gain.connect(ctx.destination);

oscillator.start();

oscillator.stop(
ctx.currentTime + 0.6
);

}
catch(e){

console.log(
"Audio error",
e
);

}

}


// =================================================
// TOGGLE SOUND
// =================================================

function toggleSound(){

soundEnabled =
!soundEnabled;

const button =
document.getElementById(
"soundButton"
);

const box =
document.getElementById(
"alertBox"
);

const status =
document.getElementById(
"alertStatus"
);


if(soundEnabled){

button.textContent =
"🔔 قطع هشدار";

button.className =
"soundOn";

box.className =
"alertBox alertActive";

status.textContent =
"هشدار صوتی فعال است.";

}
else{

button.textContent =
"🔕 فعال‌کردن هشدار";

button.className =
"mute";

box.className =
"alertBox alertMuted";

status.textContent =
"هشدار صوتی قطع شده است.";

}

}


// =================================================
// CHECK ALERTS
// =================================================

function checkAlerts(list){

if(!Array.isArray(list))
return;


const current =
new Set();


for(const r of list){

if(
r.signal === "CONFIRMED LONG" ||
r.signal === "CONFIRMED SHORT"
){

current.add(r.symbol);


if(
!lastAlertSymbols.has(r.symbol)
){

playAlert();

}

}

}


lastAlertSymbols =
current;

}


// =================================================
// FOOTPRINT
// =================================================

function renderFootprint(fp){

if(!fp){

return `
<div class="empty">
فوت‌پرینت در اسکن بازار دریافت نمی‌شود.
<br>
در تحلیل دستی دریافت می‌شود.
</div>
`;

}


if(fp.error){

return `
<div class="empty">
خطای فوت‌پرینت:
${fp.error}
</div>
`;

}


return `

<div class="section">
👣 فوت‌پرینت واقعی
</div>

<div class="grid">

<div class="box">

<div class="label">
حجم خرید
</div>

<div class="value green">
${num(fp.buyVolume)}
</div>

</div>


<div class="box">

<div class="label">
حجم فروش
</div>

<div class="value red">
${num(fp.sellVolume)}
</div>

</div>


<div class="box">

<div class="label">
دلتا
</div>

<div class="value ${
fp.delta>=0
?"green"
:"red"
}">
${num(fp.delta)}
</div>

</div>


<div class="box">

<div class="label">
دلتا درصد
</div>

<div class="value ${
fp.deltaPercent>=0
?"green"
:"red"
}">
${pct(fp.deltaPercent)}
</div>

</div>


<div class="box">

<div class="label">
نسبت خرید
</div>

<div class="value">
${pct(fp.buyRatio)}
</div>

</div>


<div class="box">

<div class="label">
نسبت فروش
</div>

<div class="value">
${pct(fp.sellRatio)}
</div>

</div>


<div class="box">

<div class="label">
معاملات
</div>

<div class="value">
${num(fp.trades)}
</div>

</div>


<div class="box">

<div class="label">
معامله بزرگ
</div>

<div class="value ${
fp.largeTrade
?"yellow"
:"gray"
}">
${
fp.largeTrade
?"💥 بله"
:"❌ خیر"
}
</div>

</div>

</div>


<div class="confirm">

<b>
نتیجه Footprint:
</b>

<br>

${
fp.delta>0
?"🟢 فشار خرید بیشتر است"
:
fp.delta<0
?"🔴 فشار فروش بیشتر است"
:
"🟡 تعادل خرید و فروش"
}

<br>

بزرگ‌ترین معامله:
${num(fp.largeTradeNotional)}

</div>

`;

}


// =================================================
// RENDER SIGNAL
// =================================================

function renderSignal(r){

const cls =
r.direction==="LONG"
?"long"
:
r.direction==="SHORT"
?"short"
:
"wait";


return `

<div class="signal ${cls}">

<div class="header">

<div>

<div class="title">

${directionFA(r.direction)}
&nbsp;
${r.symbol}

</div>

<div class="meta">

تایم‌فریم:
۱ دقیقه / ۳ دقیقه / ۵ دقیقه

</div>

</div>


<div class="score ${scoreClass(r.score)}">

${r.score}/100

</div>

</div>


<div class="grid">


<div class="box">

<div class="label">
قیمت فعلی
</div>

<div class="value">
${num(r.price)}
</div>

</div>


<div class="box">

<div class="label">
ورود
</div>

<div class="value">
${num(r.entry)}
</div>

</div>


<div class="box">

<div class="label">
حد ضرر
</div>

<div class="value red">
${num(r.sl)}
</div>

</div>


<div class="box">

<div class="label">
هدف ۱
</div>

<div class="value green">
${num(r.tp1)}
</div>

</div>


<div class="box">

<div class="label">
هدف ۲
</div>

<div class="value green">
${num(r.tp2)}
</div>

</div>


<div class="box">

<div class="label">
هدف ۳
</div>

<div class="value green">
${num(r.tp3)}
</div>

</div>

</div>


<div class="confirm">

<b>
تأییدها:
</b>

${r.confirmations}

<br>

<b>
تایم‌فریم‌های صعودی:
</b>

${r.bullishTimeframes}/3

<br>

<b>
تایم‌فریم‌های نزولی:
</b>

${r.bearishTimeframes}/3

</div>


<div class="confirm">

<div class="section">
📈 ۱ دقیقه
</div>

${renderTF(r.timeframes["1"])}


<div class="section">
📈 ۳ دقیقه
</div>

${renderTF(r.timeframes["3"])}


<div class="section">
📈 ۵ دقیقه
</div>

${renderTF(r.timeframes["5"])}

</div>


${renderFootprint(r.footprint)}


${
r.reasons && r.reasons.length
?
`
<div class="confirm">

<b>
⚠️ نکات:
</b>

<br>

${r.reasons
.map(x => "• "+x)
.join("<br>")}

</div>
`
:
""
}


</div>

`;

}


// =================================================
// RENDER TF
// =================================================

function renderTF(x){

if(!x)
return "❌ اطلاعات دریافت نشد.";

if(x.error)
return "❌ "+x.error;


return `

روند:
${trendFA(x.trend)}

<br>

شیب MA20:
${slopeFA(x.maSlope)}

<br>

MA7:
${num(x.ma7)}

<br>

MA20:
${num(x.ma20)}

<br>

تماس با MA20:
${x.touchMA20?"✅ بله":"❌ خیر"}

<br>

ساختار:
${structureFA(x.structure)}

<br>

FVG:
${fvgFA(x.fvg?.type)}

<br>

حجم فعلی:
${num(x.volume?.current)}

<br>

میانگین حجم 7:
${num(x.volume?.ma7)}

<br>

میانگین حجم 20:
${num(x.volume?.ma20)}

<br>

جهش حجم:
${x.volume?.spike?"🔥 بله":"❌ خیر"}

`;

}


// =================================================
// GET JSON
// =================================================

async function getJSON(url){

const response =
await fetch(url);

const data =
await response.json();

if(!data.ok){

throw new Error(
data.error ||
data.detail ||
"خطای دریافت اطلاعات"
);

}

return data;

}


// =================================================
// MANUAL ANALYZE
// =================================================

async function analyzeSymbol(){

const symbol =
document
.getElementById("symbol")
.value
.trim()
.toUpperCase();


const manual =
document.getElementById("manual");

const status =
document.getElementById("status");


if(!symbol){

status.textContent =
"❌ نماد را وارد کن.";

return;

}


manual.innerHTML =
`
<div class="empty">

⏳ در حال تحلیل
${symbol}

</div>
`;


status.textContent =
`⏳ تحلیل ${symbol} در ۱، ۳ و ۵ دقیقه...`;


try{

const data =
await getJSON(
"/api/analyze?symbol="+
encodeURIComponent(symbol)
);


manual.innerHTML =
renderSignal(data);


status.textContent =
`✅ تحلیل ${symbol} کامل شد.`;


// کاربر با کلیک تحلیل دستی
// تعامل صوتی را فعال کرده است.

}
catch(e){

manual.innerHTML =
`
<div class="empty">

❌ خطا

<br><br>

${e.message}

</div>
`;

status.textContent =
"❌ تحلیل انجام نشد.";

}

}


// =================================================
// SCAN MARKET
// =================================================

async function scanMarket(){

const results =
document.getElementById(
"results"
);

const status =
document.getElementById(
"status"
);


results.innerHTML =
`
<div class="empty">

⏳ در حال بررسی ۲۰۰ ارز اولویت‌دار Bybit...

<br><br>

این عملیات ممکن است کمی زمان ببرد.

</div>
`;


status.textContent =
"⏳ بررسی ۲۰۰ ارز Bybit Futures...";


try{

const data =
await getJSON(
"/api/scan"
);


const list =
data.results || [];


if(!list.length){

results.innerHTML =
`
<div class="empty">

🟡 فعلاً سیگنال تأییدشده‌ای پیدا نشد.

<br><br>

۲۰۰ ارز بررسی شدند.

</div>
`;

}
else{

results.innerHTML =
list
.map(renderSignal)
.join("");

}


checkAlerts(list);


status.textContent =
`✅ اسکن کامل شد — ${list.length} موقعیت برتر از ${data.scanned} ارز بررسی‌شده.`;

}
catch(e){

results.innerHTML =
`
<div class="empty">

❌ خطا

<br><br>

${e.message}

</div>
`;

status.textContent =
"❌ اسکن بازار انجام نشد.";

}

}

</script>

</body>

</html>
