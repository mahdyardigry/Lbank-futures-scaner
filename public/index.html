<script>


/*
==================================================
تنظیم Worker
==================================================
*/

const API_BASE = "";


/*
==================================================
فقط سه تایم فریم
==================================================
*/

const TIMEFRAMES = [
  "1",
  "3",
  "5"
];


/*
==================================================
ابزار عدد
==================================================
*/

function number(value){

  if(
    value === null ||
    value === undefined ||
    Number.isNaN(Number(value))
  ){

    return "-";

  }

  return Number(value).toLocaleString(
    "en-US",
    {
      maximumFractionDigits:8
    }
  );

}


/*
==================================================
درصد
==================================================
*/

function percent(value){

  if(
    value === null ||
    value === undefined ||
    Number.isNaN(Number(value))
  ){

    return "-";

  }

  return Number(value).toFixed(2) + "%";

}


/*
==================================================
SMA
==================================================
*/

function sma(data,period){

  if(
    !data ||
    data.length < period
  ){

    return null;

  }

  const part =
    data.slice(
      data.length - period
    );

  return (
    part.reduce(
      (a,b)=>a+b,
      0
    ) / period
  );

}


/*
==================================================
شیب MA20
==================================================
*/

function calculateSlope(closes){

  if(
    !closes ||
    closes.length < 25
  ){

    return {
      value:0,
      direction:"FLAT",
      strength:0
    };

  }


  const current =
    sma(closes,20);


  const previous =
    sma(
      closes.slice(0,-1),
      20
    );


  if(
    current === null ||
    previous === null
  ){

    return {
      value:0,
      direction:"FLAT",
      strength:0
    };

  }


  const value =
    (
      (current - previous) /
      previous
    ) * 100;


  let direction = "FLAT";


  if(value > 0.02){

    direction = "UP";

  }
  else if(value < -0.02){

    direction = "DOWN";

  }


  return {

    value,

    direction,

    strength:
      Math.min(
        100,
        Math.abs(value) * 1000
      )

  };

}


/*
==================================================
نزدیکی قیمت به MA20
==================================================
*/

function ma20Touch(
  price,
  ma20,
  tolerance = 0.003
){

  if(
    price === null ||
    ma20 === null
  ){

    return false;

  }


  const distance =
    Math.abs(
      price - ma20
    ) / ma20;


  return distance <= tolerance;

}


/*
==================================================
واکنش کندل
==================================================
*/

function candleReaction(
  rows,
  direction
){

  if(
    !rows ||
    rows.length < 2
  ){

    return false;

  }


  const last =
    rows[
      rows.length - 1
    ];


  const open =
    Number(last.open);


  const close =
    Number(last.close);


  if(direction === "LONG"){

    return close > open;

  }


  if(direction === "SHORT"){

    return close < open;

  }


  return false;

}


/*
==================================================
ساختار
==================================================
*/

function detectStructure(closes){

  if(
    !closes ||
    closes.length < 10
  ){

    return "NONE";

  }


  const n =
    closes.length;


  const a =
    closes[n - 6];


  const b =
    closes[n - 3];


  const c =
    closes[n - 1];


  if(
    c > b &&
    b > a
  ){

    return "BULLISH";

  }


  if(
    c < b &&
    b < a
  ){

    return "BEARISH";

  }


  return "NONE";

}


/*
==================================================
FVG
==================================================
*/

function detectFVG(rows){

  if(
    !rows ||
    rows.length < 3
  ){

    return {
      type:"NONE",
      bottom:null,
      top:null
    };

  }


  const a =
    rows[
      rows.length - 3
    ];


  const c =
    rows[
      rows.length - 1
    ];


  const aHigh =
    Number(a.high);


  const aLow =
    Number(a.low);


  const cHigh =
    Number(c.high);


  const cLow =
    Number(c.low);


  if(
    cLow > aHigh
  ){

    return {

      type:"BULLISH",

      bottom:aHigh,

      top:cLow

    };

  }


  if(
    cHigh < aLow
  ){

    return {

      type:"BEARISH",

      bottom:cHigh,

      top:aLow

    };

  }


  return {

    type:"NONE",

    bottom:null,

    top:null

  };

}


/*
==================================================
حجم
==================================================
*/

function volumeInfo(rows){

  if(
    !rows ||
    rows.length < 20
  ){

    return {

      current:0,
      ma7:0,
      ma20:0,
      spike:false

    };

  }


  const volumes =
    rows.map(
      r => Number(r.volume)
    );


  const current =
    volumes[
      volumes.length - 1
    ];


  const ma7 =
    sma(
      volumes,
      7
    );


  const ma20 =
    sma(
      volumes,
      20
    );


  return {

    current,

    ma7,

    ma20,

    spike:
      current >
      ma20 * 1.5

  };

}


/*
==================================================
تحلیل یک تایم فریم
==================================================
*/

function analyzeTF(rows){

  if(
    !rows ||
    rows.length < 25
  ){

    return null;

  }


  const closes =
    rows.map(
      r => Number(r.close)
    );


  const price =
    closes[
      closes.length - 1
    ];


  const ma7 =
    sma(
      closes,
      7
    );


  const ma20 =
    sma(
      closes,
      20
    );


  const slope =
    calculateSlope(
      closes
    );


  let trend = "RANGE";


  if(
    ma7 > ma20
  ){

    trend = "BULLISH";

  }
  else if(
    ma7 < ma20
  ){

    trend = "BEARISH";

  }


  const structure =
    detectStructure(
      closes
    );


  const fvg =
    detectFVG(
      rows
    );


  const volume =
    volumeInfo(
      rows
    );


  const touch =
    ma20Touch(
      price,
      ma20
    );


  const longReaction =
    candleReaction(
      rows,
      "LONG"
    );


  const shortReaction =
    candleReaction(
      rows,
      "SHORT"
    );


  return {

    price,

    ma7,

    ma20,

    trend,

    slope,

    structure,

    fvg,

    volume,

    longTouch:touch,

    shortTouch:touch,

    longReaction,

    shortReaction

  };

}


/*
==================================================
تعیین جهت
==================================================
*/

function determineDirection(x){

  if(!x){

    return "WAIT";

  }


  let longPoints = 0;

  let shortPoints = 0;


  if(
    x.trend === "BULLISH"
  ){

    longPoints += 2;

  }


  if(
    x.trend === "BEARISH"
  ){

    shortPoints += 2;

  }


  if(
    x.slope.direction === "UP"
  ){

    longPoints += 2;

  }


  if(
    x.slope.direction === "DOWN"
  ){

    shortPoints += 2;

  }


  if(
    x.structure === "BULLISH"
  ){

    longPoints += 2;

  }


  if(
    x.structure === "BEARISH"
  ){

    shortPoints += 2;

  }


  if(
    x.fvg.type === "BULLISH"
  ){

    longPoints++;

  }


  if(
    x.fvg.type === "BEARISH"
  ){

    shortPoints++;

  }


  if(
    longPoints >
    shortPoints &&
    longPoints >= 3
  ){

    return "LONG";

  }


  if(
    shortPoints >
    longPoints &&
    shortPoints >= 3
  ){

    return "SHORT";

  }


  return "WAIT";

}


/*
==================================================
اهداف
==================================================
*/

function calculateTargets(
  x,
  direction
){

  if(
    !x ||
    !x.price
  ){

    return null;

  }


  const price =
    x.price;


  let sl;

  let risk;


  if(
    direction === "LONG"
  ){

    let base =
      price * 0.985;


    if(
      x.fvg.type === "BULLISH"
    ){

      base =
        Math.min(
          base,
          x.fvg.bottom * 0.998
        );

    }


    sl = base;


    risk =
      price - sl;

  }
  else if(
    direction === "SHORT"
  ){

    let base =
      price * 1.015;


    if(
      x.fvg.type === "BEARISH"
    ){

      base =
        Math.max(
          base,
          x.fvg.top * 1.002
        );

    }


    sl = base;


    risk =
      sl - price;

  }
  else{

    return null;

  }


  if(
    risk <= 0
  ){

    risk =
      price * 0.01;


    if(
      direction === "LONG"
    ){

      sl =
        price - risk;

    }
    else{

      sl =
        price + risk;

    }

  }


  let tp1;

  let tp2;

  let tp3;


  if(
    direction === "LONG"
  ){

    tp1 =
      price + risk;

    tp2 =
      price + risk * 2;

    tp3 =
      price + risk * 3;

  }
  else{

    tp1 =
      price - risk;

    tp2 =
      price - risk * 2;

    tp3 =
      price - risk * 3;

  }


  return {

    entry:price,

    sl,

    tp1,

    tp2,

    tp3,

    rr:"1:3"

  };

}


/*
==================================================
دریافت Kline
==================================================
*/

async function getKlines(
  symbol,
  interval
){

  const url =
    API_BASE +
    "/api/kline" +
    "?symbol=" +
    encodeURIComponent(symbol) +
    "&interval=" +
    encodeURIComponent(interval) +
    "&limit=100";


  const response =
    await fetch(url);


  if(!response.ok){

    throw new Error(
      "HTTP " +
      response.status
    );

  }


  const data =
    await response.json();


  if(!data.ok){

    throw new Error(
      data.error ||
      data.detail ||
      "خطای دریافت داده"
    );

  }


  return data.rows || [];

}


/*
==================================================
تحلیل کامل دستی
فقط 1m / 3m / 5m
==================================================
*/

async function fullAnalyze(symbol){

  const analyses = {};


  for(
    const tf of TIMEFRAMES
  ){

    try{

      const rows =
        await getKlines(
          symbol,
          tf
        );


      analyses[tf] =
        analyzeTF(
          rows
        );

    }
    catch(e){

      analyses[tf] =
        null;

    }

  }


  const main =
    analyses["5"] ||
    analyses["3"] ||
    analyses["1"];


  if(!main){

    throw new Error(
      "اطلاعات کافی دریافت نشد."
    );

  }


  /*
  جهت اصلی از 5m
  */

  let direction =
    determineDirection(
      main
    );


  /*
  اگر 5m خنثی بود
  از 3m استفاده می‌کنیم
  */

  if(
    direction === "WAIT" &&
    analyses["3"]
  ){

    direction =
      determineDirection(
        analyses["3"]
      );

  }


  /*
  اگر هنوز خنثی بود
  از 1m
  */

  if(
    direction === "WAIT" &&
    analyses["1"]
  ){

    direction =
      determineDirection(
        analyses["1"]
      );

  }


  let score = 0;

  let confirmations = 0;


  for(
    const tf of TIMEFRAMES
  ){

    const x =
      analyses[tf];


    if(!x){
      continue;
    }


    /*
    روند
    */

    if(
      direction === "LONG" &&
      x.trend === "BULLISH"
    ){

      score += 15;

      confirmations++;

    }


    if(
      direction === "SHORT" &&
      x.trend === "BEARISH"
    ){

      score += 15;

      confirmations++;

    }


    /*
    شیب MA20
    */

    if(
      direction === "LONG" &&
      x.slope.direction === "UP"
    ){

      score += 10;

      confirmations++;

    }


    if(
      direction === "SHORT" &&
      x.slope.direction === "DOWN"
    ){

      score += 10;

      confirmations++;

    }


    /*
    ساختار
    */

    if(
      direction === "LONG" &&
      x.structure === "BULLISH"
    ){

      score += 10;

      confirmations++;

    }


    if(
      direction === "SHORT" &&
      x.structure === "BEARISH"
    ){

      score += 10;

      confirmations++;

    }


    /*
    FVG
    */

    if(
      direction === "LONG" &&
      x.fvg.type === "BULLISH"
    ){

      score += 5;

      confirmations++;

    }


    if(
      direction === "SHORT" &&
      x.fvg.type === "BEARISH"
    ){

      score += 5;

      confirmations++;

    }


    /*
    حجم
    */

    if(
      x.volume.spike
    ){

      score += 5;

    }

  }


  score =
    Math.min(
      100,
      Math.round(score)
    );


  const targets =
    direction === "WAIT"
    ? null
    : calculateTargets(
        main,
        direction
      );


  return {

    symbol,

    direction,

    score,

    confirmations,

    main,

    targets,

    analyses

  };

}


/*
==================================================
نمایش تایم فریم ها
==================================================
*/

function renderMTF(analyses){

  const names = {

    "1":"1m",

    "3":"3m",

    "5":"5m"

  };


  let html = "";


  for(
    const tf of TIMEFRAMES
  ){

    const x =
      analyses[tf];


    if(!x){

      html +=
        `${names[tf]} ⏳<br>`;

      continue;

    }


    const icon =
      x.trend === "BULLISH"
      ? "🟢"
      : x.trend === "BEARISH"
      ? "🔴"
      : "🟡";


    html +=
      `${names[tf]} ${icon} ${x.trend}<br>`;

  }


  return html;

}


/*
==================================================
نمایش نتیجه
==================================================
*/

function renderSignal(result){

  const direction =
    result.direction;


  const cls =
    direction === "LONG"
    ? "long"
    : direction === "SHORT"
    ? "short"
    : "wait";


  const icon =
    direction === "LONG"
    ? "🟢 LONG"
    : direction === "SHORT"
    ? "🔴 SHORT"
    : "🟡 WAIT";


  const x =
    result.main;


  const t =
    result.targets;


  let targetsHTML = "";


  if(t){

    targetsHTML = `

      <div class="grid">

        <div class="box">

          <div class="label">
            Entry
          </div>

          <div class="value">
            ${number(t.entry)}
          </div>

        </div>


        <div class="box">

          <div class="label">
            SL
          </div>

          <div class="value red">
            ${number(t.sl)}
          </div>

        </div>


        <div class="box">

          <div class="label">
            TP1
          </div>

          <div class="value green">
            ${number(t.tp1)}
          </div>

        </div>


        <div class="box">

          <div class="label">
            TP2
          </div>

          <div class="value green">
            ${number(t.tp2)}
          </div>

        </div>


        <div class="box">

          <div class="label">
            TP3
          </div>

          <div class="value green">
            ${number(t.tp3)}
          </div>

        </div>


        <div class="box">

          <div class="label">
            R:R
          </div>

          <div class="value">
            ${t.rr}
          </div>

        </div>

      </div>

    `;

  }


  return `

    <div class="signal ${cls}">

      <div class="header">

        <div>

          <div class="title">
            ${icon} ${result.symbol}
          </div>

          <div class="meta">
            فقط 1m / 3m / 5m
          </div>

        </div>


        <div class="score">

          ${result.score}/100

        </div>

      </div>


      ${targetsHTML}


      <div class="confirm">

        <b>
          تأییدها:
        </b>

        ${result.confirmations}

        <br><br>


        <b>
          MA20 Touch:
        </b>

        ${
          x.longTouch || x.shortTouch
          ? "✅"
          : "❌"
        }

        <br>


        <b>
          MA20 Slope:
        </b>

        ${
          x.slope.direction === "UP"
          ? "🟢 صعودی"
          : x.slope.direction === "DOWN"
          ? "🔴 نزولی"
          : "🟡 خنثی"
        }

        <br>


        <b>
          Structure:
        </b>

        ${
          x.structure === "BULLISH"
          ? "🟢 BULLISH"
          : x.structure === "BEARISH"
          ? "🔴 BEARISH"
          : "⚪ NONE"
        }

        <br>


        <b>
          FVG:
        </b>

        ${
          x.fvg.type === "BULLISH"
          ? "🟢 BULLISH"
          : x.fvg.type === "BEARISH"
          ? "🔴 BEARISH"
          : "⚪ NONE"
        }

        <br>


        <b>
          Volume:
        </b>

        ${
          x.volume.spike
          ? "🔥 تأیید"
          : "❌"
        }

      </div>


      <div class="confirm">

        <b>
          تایم‌فریم‌ها:
        </b>

        <br>

        ${renderMTF(
          result.analyses
        )}

      </div>

    </div>

  `;

}


/*
==================================================
تحلیل دستی
==================================================
*/

async function analyzeSymbol(){

  const input =
    document.getElementById(
      "symbol"
    );


  const manual =
    document.getElementById(
      "manual"
    );


  const status =
    document.getElementById(
      "status"
    );


  const symbol =
    input.value
      .trim()
      .toUpperCase();


  if(!symbol){

    status.textContent =
      "❌ نماد را وارد کن.";

    return;

  }


  manual.innerHTML = `
    <div class="empty">
      ⏳ در حال تحلیل ${symbol}...
    </div>
  `;


  status.textContent =
    `⏳ تحلیل ${symbol} در 1m / 3m / 5m...`;


  try{

    const result =
      await fullAnalyze(
        symbol
      );


    manual.innerHTML =
      renderSignal(
        result
      );


    status.textContent =
      `✅ تحلیل ${symbol} کامل شد.`;

  }
  catch(error){

    console.error(error);


    manual.innerHTML = `
      <div class="empty">
        ❌ خطا<br><br>
        ${error.message}
      </div>
    `;


    status.textContent =
      "❌ تحلیل انجام نشد.";

  }

}


/*
==================================================
اسکن سریع بازار
==================================================
*/

async function scanMarket(){

  const resultsBox =
    document.getElementById(
      "results"
    );


  const status =
    document.getElementById(
      "status"
    );


  const progressBar =
    document.getElementById(
      "progressBar"
    );


  resultsBox.innerHTML = `
    <div class="empty">
      ⏳ دریافت لیست فیوچرز Bybit...
    </div>
  `;


  progressBar.style.width =
    "0%";


  try{

    /*
    دریافت ارزها
    */

    const response =
      await fetch(
        API_BASE +
        "/api/futures"
      );


    const data =
      await response.json();


    if(!data.ok){

      throw new Error(
        data.error ||
        "دریافت لیست ارزها ناموفق بود."
      );

    }


    const symbols =
      (data.futures || [])
        .filter(
          s =>
            s.endsWith("USDT") &&
            !s.includes("-")
        );


    /*
    ==========================================
    مرحله 1:
    فقط 5m
    ==========================================
    */

    const candidates = [];


    const batchSize = 25;


    for(
      let i = 0;
      i < symbols.length;
      i += batchSize
    ){

      const batch =
        symbols.slice(
          i,
          i + batchSize
        );


      const batchResults =
        await Promise.all(

          batch.map(
            async symbol => {

              try{

                const rows =
                  await getKlines(
                    symbol,
                    "5"
                  );


                const x =
                  analyzeTF(
                    rows
                  );


                if(!x){

                  return null;

                }


                /*
                جهت
                */

                const direction =
                  determineDirection(
                    x
                  );


                if(
                  direction === "WAIT"
                ){

                  return null;

                }


                /*
                امتیاز اولیه 5m
                */

                let score = 0;


                if(
                  direction === "LONG" &&
                  x.trend === "BULLISH"
                ){

                  score += 20;

                }


                if(
                  direction === "SHORT" &&
                  x.trend === "BEARISH"
                ){

                  score += 20;

                }


                if(
                  direction === "LONG" &&
                  x.slope.direction === "UP"
                ){

                  score += 15;

                }


                if(
                  direction === "SHORT" &&
                  x.slope.direction === "DOWN"
                ){

                  score += 15;

                }


                if(
                  direction === "LONG" &&
                  x.structure === "BULLISH"
                ){

                  score += 15;

                }


                if(
                  direction === "SHORT" &&
                  x.structure === "BEARISH"
                ){

                  score += 15;

                }


                if(
                  direction === "LONG" &&
                  x.fvg.type === "BULLISH"
                ){

                  score += 10;

                }


                if(
                  direction === "SHORT" &&
                  x.fvg.type === "BEARISH"
                ){

                  score += 10;

                }


                if(
                  x.volume.spike
                ){

                  score += 10;

                }


                return {

                  symbol,

                  direction,

                  x,

                  score

                };

              }
              catch(e){

                return null;

              }

            }
          )

        );


      batchResults.forEach(
        r => {

          if(r){

            candidates.push(r);

          }

        }
      );


      const done =
        Math.min(
          i + batchSize,
          symbols.length
        );


      const pct =
        Math.round(
          done /
          symbols.length *
          100
        );


      progressBar.style.width =
        pct + "%";


      status.textContent =
        `⏳ مرحله اول 5m: ${done} از ${symbols.length}...`;

    }


    /*
    ==========================================
    بهترین‌های 5m
    ==========================================
    */

    candidates.sort(
      (a,b) =>
        b.score - a.score
    );


    /*
    فقط 30 کاندید
    برای 1m و 3m
    */

    const shortlist =
      candidates.slice(
        0,
        30
      );


    status.textContent =
      `⏳ ${shortlist.length} کاندید قوی؛ بررسی 1m و 3m...`;


    const finalResults = [];


    /*
    ==========================================
    مرحله دوم
    1m + 3m
    ==========================================
    */

    for(
      let i = 0;
      i < shortlist.length;
      i++
    ){

      const candidate =
        shortlist[i];


      try{

        const rows1 =
          await getKlines(
            candidate.symbol,
            "1"
          );


        const rows3 =
          await getKlines(
            candidate.symbol,
            "3"
          );


        const x1 =
          analyzeTF(
            rows1
          );


        const x3 =
          analyzeTF(
            rows3
          );


        if(
          !x1 ||
          !x3
        ){

          continue;

        }


        const direction =
          candidate.direction;


        let score =
          candidate.score;


        let confirmations = 0;


        /*
        ==================================
        1m Trend
        ==================================
        */

        if(
          direction === "LONG" &&
          x1.trend === "BULLISH"
        ){

          score += 10;

          confirmations++;

        }


        if(
          direction === "SHORT" &&
          x1.trend === "BEARISH"
        ){

          score += 10;

          confirmations++;

        }


        /*
        ==================================
        3m Trend
        ==================================
        */

        if(
          direction === "LONG" &&
          x3.trend === "BULLISH"
        ){

          score += 10;

          confirmations++;

        }


        if(
          direction === "SHORT" &&
          x3.trend === "BEARISH"
        ){

          score += 10;

          confirmations++;

        }


        /*
        ==================================
        MA20 Slope 1m
        ==================================
        */

        if(
          direction === "LONG" &&
          x1.slope.direction === "UP"
        ){

          score += 5;

          confirmations++;

        }


        if(
          direction === "SHORT" &&
          x1.slope.direction === "DOWN"
        ){

          score += 5;

          confirmations++;

        }


        /*
        ==================================
        MA20 Slope 3m
        ==================================
        */

        if(
          direction === "LONG" &&
          x3.slope.direction === "UP"
        ){

          score += 5;

          confirmations++;

        }


        if(
          direction === "SHORT" &&
          x3.slope.direction === "DOWN"
        ){

          score += 5;

          confirmations++;

        }


        /*
        ==================================
        MA20 Touch + Reaction
        ==================================
        */

        if(
          direction === "LONG" &&
          x1.longTouch &&
          x1.longReaction
        ){

          score += 10;

          confirmations++;

        }


        if(
          direction === "SHORT" &&
          x1.shortTouch &&
          x1.shortReaction
        ){

          score += 10;

          confirmations++;

        }


        /*
        ==================================
        ساختار 1m
        ==================================
        */

        if(
          direction === "LONG" &&
          x1.structure === "BULLISH"
        ){

          score += 5;

        }


        if(
          direction === "SHORT" &&
          x1.structure === "BEARISH"
        ){

          score += 5;

        }


        /*
        ==================================
        ساختار 3m
        ==================================
        */

        if(
          direction === "LONG" &&
          x3.structure === "BULLISH"
        ){

          score += 5;

        }


        if(
          direction === "SHORT" &&
          x3.structure === "BEARISH"
        ){

          score += 5;

        }


        /*
        ==================================
        حجم
        ==================================
        */

        if(
          x1.volume.spike
        ){

          score += 5;

        }


        if(
          x3.volume.spike
        ){

          score += 5;

        }


        score =
          Math.min(
            100,
            Math.round(score)
          );


        /*
        حداقل دو تأیید
        */

        if(
          confirmations < 2
        ){

          continue;

        }


        /*
        اهداف
        */

        const targets =
          calculateTargets(
            candidate.x,
            direction
          );


        finalResults.push({

          symbol:
            candidate.symbol,

          direction,

          score,

          confirmations,

          main:
            candidate.x,

          targets,

          analyses:{

            "1":x1,

            "3":x3,

            "5":candidate.x

          }

        });


      }
      catch(e){

        console.log(
          candidate.symbol,
          e
        );

      }


      const pct =
        Math.round(
          (
            i + 1
          ) /
          shortlist.length *
          100
        );


      progressBar.style.width =
        pct + "%";


      status.textContent =
        `⏳ مرحله دوم 1m+3m: ${
          i + 1
        } از ${
          shortlist.length
        }...`;

    }


    /*
    ==========================================
    رتبه بندی
    ==========================================
    */

    finalResults.sort(
      (a,b) => {

        if(
          b.score !== a.score
        ){

          return (
            b.score -
            a.score
          );

        }


        return (
          b.confirmations -
          a.confirmations
        );

      }
    );


    /*
    ==========================================
    فقط 10 مورد
    ==========================================
    */

    const top10 =
      finalResults.slice(
        0,
        10
      );


    if(
      !top10.length
    ){

      resultsBox.innerHTML = `
        <div class="empty">
          🟡 فعلاً موقعیت
          تأییدشده‌ای پیدا نشد.
        </div>
      `;

    }
    else{

      resultsBox.innerHTML =
        top10
          .map(
            r =>
              renderSignal(r)
          )
          .join("");

    }


    progressBar.style.width =
      "100%";


    status.textContent =
      `✅ اسکن تمام شد — ${
        top10.length
      } موقعیت برتر پیدا شد.`;

  }
  catch(error){

    console.error(error);


    resultsBox.innerHTML = `
      <div class="empty">

        ❌ خطا:

        <br><br>

        ${error.message}

      </div>
    `;


    status.textContent =
      "❌ اسکن بازار انجام نشد.";

  }

}

</script>
