<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Bybit Futures Scanner</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#080c12;
color:#fff;
font-family:Arial,Tahoma,sans-serif;
}

.container{
max-width:850px;
margin:auto;
padding:14px;
}

.card{
background:#131923;
border:1px solid #293342;
border-radius:14px;
padding:14px;
margin-bottom:12px;
}

h1{
font-size:21px;
margin:5px 0 15px;
}

.row{
display:flex;
gap:8px;
flex-wrap:wrap;
}

input,button{
height:45px;
border-radius:9px;
border:1px solid #394555;
background:#080c12;
color:#fff;
padding:8px 12px;
font-size:15px;
}

input{
flex:1;
min-width:170px;
}

button{
background:#238636;
border:0;
font-weight:bold;
}

button.scan{
background:#8957e5;
}

.status{
color:#8b949e;
font-size:13px;
margin-top:10px;
}

.results{
display:grid;
gap:10px;
}

.coin{
background:#080c12;
border:1px solid #303b4b;
border-radius:12px;
padding:13px;
}

.coinTitle{
font-size:19px;
font-weight:bold;
margin-bottom:8px;
}

.long{
color:#3fb950;
}

.short{
color:#f85149;
}

.wait{
color:#d29922;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:7px;
}

.box{
background:#131923;
border-radius:8px;
padding:9px;
}

.label{
color:#8b949e;
font-size:11px;
}

.value{
font-size:14px;
font-weight:bold;
margin-top:4px;
}

.details{
margin-top:10px;
line-height:1.8;
font-size:13px;
color:#c9d1d9;
}

#manualResult{
margin-top:12px;
}

</style>

</head>

<body>

<div class="container">

<h1>📊 Bybit Futures Scanner</h1>


<!-- SEARCH -->

<div class="card">

<div class="row">

<input
id="search"
placeholder="مثلاً BTC یا SOLUSDT">

<button onclick="manualAnalyze()">
🔎 تحلیل
</button>

<button
class="scan"
onclick="autoScan()">

🚨 اسکن بازار

</button>

</div>

<div id="status" class="status">
آماده
</div>

</div>


<!-- MANUAL -->

<div
id="manualResult"
class="card"
style="display:none">

</div>


<!-- AUTO -->

<div class="card">

<h3>
🚨 سیگنال‌های تأیید شده
</h3>

<div
id="results"
class="results">

هنوز اسکن انجام نشده.

</div>

</div>

</div>


<script>


function n(x){

if(x === null ||
x === undefined ||
!Number.isFinite(Number(x)))
return "-";

return Number(x).toLocaleString(
"en-US",
{
maximumFractionDigits:8
});

}


// ==================================================
// MANUAL
// ==================================================

async function manualAnalyze(){

let symbol =
document
.getElementById("search")
.value
.trim()
.toUpperCase();

if(!symbol){

alert("نماد را وارد کن.");

return;
}

if(!symbol.endsWith("USDT"))
symbol += "USDT";


const status =
document.getElementById("status");

const box =
document.getElementById("manualResult");


status.textContent =
"⏳ در حال تحلیل " + symbol;


box.style.display = "block";

box.innerHTML =
"⏳ در حال دریافت اطلاعات...";


try{

const response =
await fetch(
"/api/analyze?symbol=" +
encodeURIComponent(symbol)
);

const data =
await response.json();


if(!data.ok)
throw new Error(
data.detail ||
data.error ||
"خطا"
);


if(!data.exists){

box.innerHTML =
"❌ " +
symbol +
" در Bybit Futures وجود ندارد.";

status.textContent =
"نماد پیدا نشد.";

return;
}


const best =
data.best;


let html =
"<div class='coin'>";

html +=
"<div class='coinTitle'>" +
symbol +
"</div>";


if(!best){

html +=
"<div class='wait'>" +
"🟡 WAIT — فعلاً سیگنال تأییدشده وجود ندارد." +
"</div>";

}
else{

const cls =
best.direction === "LONG"
? "long"
: "short";

html +=
"<div class='" +
cls +
" coinTitle'>" +
(best.direction === "LONG"
? "🟢 LONG CONFIRMED"
: "🔴 SHORT CONFIRMED") +
"</div>";


html +=
"<div class='grid'>" +

boxx("TF",best.interval) +

boxx("Price",n(best.price)) +

boxx("MA20",n(best.ma20)) +

boxx("Entry",n(best.entry)) +

boxx("SL",n(best.sl)) +

boxx("TP1",n(best.tp1)) +

boxx("TP2",n(best.tp2)) +

boxx("TP3",n(best.tp3)) +

boxx("R:R","1:"+n(best.rr)) +

boxx("Long Score",best.longScore) +

boxx("Short Score",best.shortScore) +

"</div>";


html +=
"<div class='details'>" +

"MA20 Touch: " +
(best.touch ? "✅" : "❌") +

"<br>" +

"Confirmation: " +
(best.confirmation ? "✅" : "❌") +

"<br>" +

"Volume: " +
(best.volumeConfirm ? "✅" : "❌") +

"<br>" +

"Structure: " +
best.structure +

"<br>" +

"FVG: " +
best.fvg +

"</div>";

}

html += "</div>";

box.innerHTML = html;

status.textContent =
"✅ تحلیل کامل شد.";

}
catch(e){

box.innerHTML =
"❌ خطا: " +
e.message;

status.textContent =
"خطا";

}

}


function boxx(label,value){

return `
<div class="box">
<div class="label">${label}</div>
<div class="value">${value}</div>
</div>
`;

}


// ==================================================
// AUTO SCANNER
// ==================================================

async function autoScan(){

const status =
document.getElementById("status");

const results =
document.getElementById("results");


status.textContent =
"⏳ دریافت لیست Bybit...";

results.innerHTML =
"⏳ در حال دریافت ارزها...";


try{

const response =
await fetch("/api/symbols");

const data =
await response.json();


if(!data.ok)
throw new Error(
data.error || "خطا"
);


const symbols =
data.futures;


status.textContent =
"🔎 بررسی " +
symbols.length +
" ارز...";


const found = [];


// برای جلوگیری از فشار زیاد روی API
// فعلاً اولین 50 ارز را تست می‌کنیم.

for(
let i=0;
i<Math.min(symbols.length,50);
i++
){

const symbol =
symbols[i];


try{

const r =
await fetch(
"/api/analyze?symbol=" +
encodeURIComponent(symbol)
);

const d =
await r.json();


if(
d.ok &&
d.exists &&
d.best
){

found.push({
symbol,
best:d.best
});

}

}
catch(e){}


status.textContent =
"🔎 " +
(i+1) +
" / " +
Math.min(symbols.length,50);

}


if(!found.length){

results.innerHTML =
"🟡 فعلاً سیگنال تأییدشده پیدا نشد.";

status.textContent =
"اسکن تمام شد.";

return;
}


found.sort(
(a,b) =>
Math.max(
b.best.longScore,
b.best.shortScore
)
-
Math.max(
a.best.longScore,
a.best.shortScore
)
);


results.innerHTML =
found
.map(x => renderCoin(
x.symbol,
x.best
))
.join("");


status.textContent =
"✅ " +
found.length +
" سیگنال پیدا شد.";

}
catch(e){

results.innerHTML =
"❌ " +
e.message;

status.textContent =
"خطا";

}

}


// ==================================================
// RENDER
// ==================================================

function renderCoin(symbol,b){

const long =
b.direction === "LONG";

return `

<div class="coin">

<div class="coinTitle ${long
? "long"
: "short"}">

${long
? "🟢 LONG"
: "🔴 SHORT"}

&nbsp;

${symbol}

</div>

<div class="grid">

${boxx("TF",b.interval)}

${boxx("Price",n(b.price))}

${boxx("MA20",n(b.ma20))}

${boxx("Entry",n(b.entry))}

${boxx("SL",n(b.sl))}

${boxx("TP1",n(b.tp1))}

${boxx("TP2",n(b.tp2))}

${boxx("TP3",n(b.tp3))}

${boxx("R:R","1:"+n(b.rr))}

</div>

<div class="details">

MA20 Touch:
${b.touch ? "✅" : "❌"}

&nbsp;

Confirmation:
${b.confirmation ? "✅" : "❌"}

&nbsp;

Volume:
${b.volumeConfirm ? "✅" : "❌"}

<br>

Structure:
${b.structure}

&nbsp;

FVG:
${b.fvg}

</div>

</div>

`;

}

</script>

</body>

</html>
