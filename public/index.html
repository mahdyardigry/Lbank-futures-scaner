<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
/>

<title>Crypto Scanner V12</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#080c12;
  color:#e8edf5;
  font-family:Arial,sans-serif;
}

header{
  padding:18px;
  text-align:center;
  border-bottom:1px solid #202733;
  background:#0d121a;
}

h1{
  margin:0 0 8px;
  font-size:22px;
}

.subtitle{
  color:#8d98a8;
  font-size:13px;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:12px;
}

.panel{
  background:#101722;
  border:1px solid #202938;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
}

.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

input,
select,
button{
  background:#0b1119;
  color:#fff;
  border:1px solid #2b3545;
  border-radius:9px;
  padding:11px;
  font-size:14px;
}

input{
  flex:1;
  min-width:180px;
}

button{
  cursor:pointer;
}

button:hover{
  border-color:#5e718e;
}

.primary{
  background:#153c62;
}

.tabs{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-bottom:10px;
}

.tab{
  flex:1;
  min-width:110px;
}

.tab.active{
  background:#245b8e;
}

.hidden{
  display:none;
}

.section-title{
  font-size:16px;
  margin-bottom:10px;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(160px,1fr));
  gap:8px;
}

.card{
  background:#0b1119;
  border:1px solid #202b39;
  border-radius:10px;
  padding:12px;
}

.card-title{
  color:#8e9aad;
  font-size:12px;
  margin-bottom:7px;
}

.value{
  font-size:18px;
  font-weight:bold;
}

.long{
  color:#36d58a;
}

.short{
  color:#ff6875;
}

.wait{
  color:#e7c75f;
}

.small{
  font-size:12px;
  color:#8e9aad;
}

.signal{
  text-align:center;
  padding:18px;
  border-radius:12px;
  background:#0b1119;
  border:1px solid #273244;
}

.signal-direction{
  font-size:30px;
  font-weight:bold;
}

.score{
  font-size:22px;
  margin-top:8px;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}

th,
td{
  padding:8px 5px;
  border-bottom:1px solid #202936;
  text-align:center;
}

th{
  color:#8e9aad;
}

.scroll{
  overflow:auto;
  max-height:420px;
}

details{
  background:#0d131c;
  border:1px solid #202a37;
  border-radius:10px;
  padding:10px;
  margin-top:8px;
}

summary{
  cursor:pointer;
  font-weight:bold;
}

.status{
  display:inline-block;
  padding:5px 8px;
  border-radius:7px;
  font-size:11px;
  background:#192331;
}

footer{
  text-align:center;
  color:#667386;
  padding:20px;
  font-size:11px;
}

</style>

</head>

<body>

<header>

<h1>📊 اسکنر هوشمند بازار</h1>

<div class="subtitle">
تحلیل ساختار، نقدینگی، حجم و جریان سفارش Bybit
</div>

<div style="margin-top:8px">
<span id="connection" class="status">
🟡 در حال اتصال
</span>
</div>

</header>


<div class="container">

<!-- MANUAL -->

<div class="panel">

<div class="section-title">
🔎 بررسی دستی ارز
</div>

<div class="row">

<input
  id="symbol"
  placeholder="مثلاً BTCUSDT"
  value="BTCUSDT"
/>

<select id="market">

<option value="linear">
فیوچرز
</option>

<option value="spot">
اسپات
</option>

</select>

<select id="interval">

<option value="1">1 دقیقه</option>
<option value="3">3 دقیقه</option>
<option value="5">5 دقیقه</option>
<option value="15">15 دقیقه</option>
<option value="60">1 ساعت</option>

</select>

<button
  class="primary"
  onclick="manualAnalyze()"
>
بررسی
</button>

</div>

</div>


<!-- SIGNAL SETTINGS -->

<div class="panel">

<details>

<summary>
⚙️ تنظیمات سیگنال‌گیری
</summary>

<div style="margin-top:12px">

<div class="small">
هرچه سطح Volume بالاتر باشد،
ورود حجم بیشتری برای تأیید سیگنال لازم است.
</div>

<br>

<select id="volumeLevel">

<option value="1">
Volume 1 - بسیار آسان
</option>

<option value="2">
Volume 2 - آسان
</option>

<option value="3" selected>
Volume 3 - متعادل
</option>

<option value="4">
Volume 4 - سخت
</option>

<option value="5">
Volume 5 - خیلی سخت
</option>

<option value="6">
Volume 6 - بسیار سخت
</option>

</select>

</div>

</details>

</div>


<!-- SCAN -->

<div class="panel">

<div class="section-title">
🚨 اسکن بازار
</div>

<div class="tabs">

<button
  class="tab active"
  id="futuresTab"
  onclick="setScanMarket('linear')"
>
فیوچرز
</button>

<button
  class="tab"
  id="spotTab"
  onclick="setScanMarket('spot')"
>
اسپات
</button>

</div>

<button
  class="primary"
  style="width:100%"
  onclick="scanMarket()"
>
🚀 شروع اسکن
</button>

</div>


<!-- RESULT -->

<div id="result"></div>

</div>


<footer>

Crypto Scanner V12 — Bybit Market Analysis

</footer>


<script>

const WORKER_URL =
  "https://soft-flower-2790.29mah12.workers.dev";

let scanCategory = "linear";


function api(path, params = {}){

  const url =
    new URL(WORKER_URL + path);

  Object.entries(params).forEach(
    ([key,value]) => {

      if(
        value !== undefined &&
        value !== null &&
        value !== ""
      ){
        url.searchParams.set(
          key,
          value
        );
      }

    }
  );

  return fetch(url.toString())
    .then(async response => {

      const data =
        await response.json();

      if(!response.ok || data.ok === false){

        throw new Error(
          data.error ||
          "API Error"
        );

      }

      return data;

    });

}


async function testConnection(){

  try{

    await api("/health");

    document.getElementById(
      "connection"
    ).innerText =
      "🟢 اتصال برقرار است";

  }catch(e){

    document.getElementById(
      "connection"
    ).innerText =
      "🔴 خطا در اتصال";

  }

}


function setScanMarket(category){

  scanCategory = category;

  document
    .getElementById("futuresTab")
    .classList.toggle(
      "active",
      category === "linear"
    );

  document
    .getElementById("spotTab")
    .classList.toggle(
      "active",
      category === "spot"
    );

}


async function manualAnalyze(){

  const symbol =
    document
      .getElementById("symbol")
      .value
      .trim()
      .toUpperCase();

  const category =
    document
      .getElementById("market")
      .value;

  const interval =
    document
      .getElementById("interval")
      .value;

  const volumeLevel =
    document
      .getElementById("volumeLevel")
      .value;

  if(!symbol){

    alert("نام ارز را وارد کن");

    return;
  }

  document.getElementById(
    "result"
  ).innerHTML = `
    <div class="panel">
      ⏳ در حال تحلیل ${symbol}...
    </div>
  `;

  try{

    const data =
      await api("/api/analyze",{
        category,
        symbol,
        interval,
        volumeLevel
      });

    renderAnalysis(data);

  }catch(e){

    document.getElementById(
      "result"
    ).innerHTML = `
      <div class="panel">
        🔴 ${escapeHtml(e.message)}
      </div>
    `;

  }

}


async function scanMarket(){

  const interval =
    document
      .getElementById("interval")
      .value;

  const volumeLevel =
    document
      .getElementById("volumeLevel")
      .value;

  document.getElementById(
    "result"
  ).innerHTML = `
    <div class="panel">
      ⏳ در حال اسکن بازار...
      <br>
      ابتدا غربال اولیه انجام می‌شود
      و سپس تعداد محدود ارز تحلیل کامل می‌شوند.
    </div>
  `;

  try{

    const data =
      await api("/api/scan",{
        category:scanCategory,
        interval,
        volumeLevel
      });

    renderScan(data);

  }catch(e){

    document.getElementById(
      "result"
    ).innerHTML = `
      <div class="panel">
        🔴 ${escapeHtml(e.message)}
      </div>
    `;

  }

}


function renderAnalysis(data){

  const s = data.signal;

  const directionClass =
    s.direction === "LONG"
      ? "long"
      : s.direction === "SHORT"
      ? "short"
      : "wait";

  let reasons = "";

  const r = s.reasons;

  reasons += `
    <div class="grid">

      <div class="card">
        <div class="card-title">
          Volume
        </div>
        <div class="value">
          ${Number(
            data.volume.ratio
          ).toFixed(2)}x
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          RSI
        </div>
        <div class="value">
          ${s.indicators.rsi.toFixed(1)}
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          MA 7
        </div>
        <div class="value">
          ${formatPrice(
            s.indicators.ma7
          )}
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          MA 20
        </div>
        <div class="value">
          ${formatPrice(
            s.indicators.ma20
          )}
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          OI Change
        </div>
        <div class="value">
          ${Number(
            r.oiChange
          ).toFixed(2)}%
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          Funding
        </div>
        <div class="value">
          ${formatFunding(
            r.fundingRate
          )}
        </div>
      </div>

    </div>
  `;

  const huntText =
    data.hunt.detected
      ? (
        data.hunt.type === "bullish"
          ? "🟢 Hunt صعودی"
          : "🔴 Hunt نزولی"
      )
      : "⚪ Hunt مشاهده نشد";

  document.getElementById(
    "result"
  ).innerHTML = `

    <div class="panel">

      <div class="signal">

        <div class="small">
          ${data.market.category === "spot"
            ? "بازار اسپات"
            : "بازار فیوچرز"}
          |
          ${data.market.symbol}
          |
          ${data.market.interval}m
        </div>

        <div
          class="signal-direction ${directionClass}"
        >
          ${s.direction}
        </div>

        <div>
          قدرت:
          <b>${s.strength}</b>
        </div>

        <div class="score">
          ${s.score}/100
        </div>

        <div class="small">
          Long ${s.long}
          |
          Short ${s.short}
        </div>

      </div>

    </div>


    <div class="panel">

      <div class="section-title">
        📊 شاخص‌های اصلی
      </div>

      ${reasons}

    </div>


    <div class="panel">

      <div class="section-title">
        🧠 ساختار بازار
      </div>

      <div class="grid">

        <div class="card">
          <div class="card-title">
            Trend
          </div>
          <div class="value">
            ${data.structure.trend}
          </div>
        </div>

        <div class="card">
          <div class="card-title">
            BOS
          </div>
          <div class="value">
            ${data.structure.bos
              ? data.structure.bosDirection
              : "ندارد"}
          </div>
        </div>

        <div class="card">
          <div class="card-title">
            Hunt
          </div>
          <div class="value">
            ${huntText}
          </div>
        </div>

        <div class="card">
          <div class="card-title">
            Support
          </div>
          <div class="value">
            ${formatPrice(
              data.supportResistance.support
            )}
          </div>
        </div>

        <div class="card">
          <div class="card-title">
            Resistance
          </div>
          <div class="value">
            ${formatPrice(
              data.supportResistance.resistance
            )}
          </div>
        </div>

      </div>

    </div>


    <div class="panel">

      <details open>

        <summary>
          📚 Footprint / جریان سفارش
        </summary>

        <div class="grid" style="margin-top:10px">

          <div class="card">
            <div class="card-title">
              Buy Volume
            </div>
            <div class="value long">
              ${formatNumber(
                data.footprint.buy
              )}
            </div>
          </div>

          <div class="card">
            <div class="card-title">
              Sell Volume
            </div>
            <div class="value short">
              ${formatNumber(
                data.footprint.sell
              )}
            </div>
          </div>

          <div class="card">
            <div class="card-title">
              Delta
            </div>
            <div class="value">
              ${formatNumber(
                data.footprint.delta
              )}
            </div>
          </div>

          <div class="card">
            <div class="card-title">
              Buy %
            </div>
            <div class="value">
              ${data.footprint.buyPercent
                .toFixed(1)}%
            </div>
          </div>

        </div>

      </details>

    </div>


    <div class="panel">

      <details>

        <summary>
          🧱 Order Book / دیوارهای سفارش
        </summary>

        <div class="grid" style="margin-top:10px">

          <div class="card">
            <div class="card-title">
              کل سفارش خرید
            </div>
            <div class="value long">
              ${formatNumber(
                data.orderbook.bidTotal
              )}
            </div>
          </div>

          <div class="card">
            <div class="card-title">
              کل سفارش فروش
            </div>
            <div class="value short">
              ${formatNumber(
                data.orderbook.askTotal
              )}
            </div>
          </div>

          <div class="card">
            <div class="card-title">
              Imbalance
            </div>
            <div class="value">
              ${(
                data.orderbook.imbalance *
                100
              ).toFixed(2)}%
            </div>
          </div>

        </div>


        <h4>
          دیوارهای خرید
        </h4>

        ${wallsTable(
          data.orderbook.bidWalls
        )}


        <h4>
          دیوارهای فروش
        </h4>

        ${wallsTable(
          data.orderbook.askWalls
        )}

      </details>

    </div>


    <div class="panel">

      <details>

        <summary>
          🕳️ FVG
        </summary>

        <div class="scroll">

          <table>

            <thead>
              <tr>
                <th>نوع</th>
                <th>پایین</th>
                <th>بالا</th>
              </tr>
            </thead>

            <tbody>

              ${
                data.fvg
                  .slice()
                  .reverse()
                  .map(x => `
                    <tr>
                      <td>
                        ${x.type}
                      </td>
                      <td>
                        ${formatPrice(x.low)}
                      </td>
                      <td>
                        ${formatPrice(x.high)}
                      </td>
                    </tr>
                  `)
                  .join("")
              }

            </tbody>

          </table>

        </div>

      </details>

    </div>

  `;

}


function renderScan(data){

  const rows =
    data.results.map(x => {

      const cls =
        x.direction === "LONG"
          ? "long"
          : x.direction === "SHORT"
          ? "short"
          : "wait";

      return `

        <tr>

          <td>
            <b>${x.symbol}</b>
          </td>

          <td>
            ${formatPrice(x.price)}
          </td>

          <td class="${x.change24h >= 0
            ? "long"
            : "short"}">
            ${x.change24h.toFixed(2)}%
          </td>

          <td>
            ${x.score}
          </td>

          <td class="${cls}">
            ${x.direction}
          </td>

          <td>
            ${x.strength}
          </td>

          <td>
            ${x.volumeRatio.toFixed(2)}x
          </td>

          <td>
            ${x.oiChange.toFixed(2)}%
          </td>

          <td>
            ${x.hunt.detected
              ? x.hunt.type
              : "-"}
          </td>

        </tr>

      `;

    }).join("");


  document.getElementById(
    "result"
  ).innerHTML = `

    <div class="panel">

      <div class="section-title">
        🚨 نتایج اسکن
      </div>

      <div class="small">
        ${data.scanned}
        ارز غربال و تحلیل شدند.
      </div>

      <br>

      <div class="scroll">

        <table>

          <thead>

            <tr>

              <th>ارز</th>
              <th>قیمت</th>
              <th>24h</th>
              <th>امتیاز</th>
              <th>سیگنال</th>
              <th>قدرت</th>
              <th>Volume</th>
              <th>OI</th>
              <th>Hunt</th>

            </tr>

          </thead>

          <tbody>

            ${rows}

          </tbody>

        </table>

      </div>

    </div>

  `;

}


function wallsTable(walls){

  return `

    <div class="scroll">

      <table>

        <thead>

          <tr>
            <th>قیمت</th>
            <th>مقدار</th>
          </tr>

        </thead>

        <tbody>

          ${
            walls.map(x => `

              <tr>

                <td>
                  ${formatPrice(x.price)}
                </td>

                <td>
                  ${formatNumber(x.size)}
                </td>

              </tr>

            `).join("")
          }

        </tbody>

      </table>

    </div>

  `;

}


function formatPrice(v){

  const n = Number(v);

  if(!Number.isFinite(n))
    return "-";

  if(n >= 1000)
    return n.toLocaleString(
      "en-US",
      {
        maximumFractionDigits:2
      }
    );

  if(n >= 1)
    return n.toFixed(4);

  return n.toFixed(8);

}


function formatNumber(v){

  const n = Number(v);

  if(!Number.isFinite(n))
    return "-";

  if(Math.abs(n) >= 1000000)
    return (
      n / 1000000
    ).toFixed(2) + "M";

  if(Math.abs(n) >= 1000)
    return (
      n / 1000
    ).toFixed(2) + "K";

  return n.toFixed(2);

}


function formatFunding(v){

  const n = Number(v) * 100;

  return n.toFixed(4) + "%";

}


function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


testConnection();

</script>

</body>

</html>
