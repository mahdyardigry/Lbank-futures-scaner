}

<body>

<div class="container">


<h1>

</h1>


<div class="card">


<div class="row">

<input
id="symbol"
value="BTCUSDT"
placeholder="مثلاً BTCUSDT"
>

<button onclick="analyzeSymbol()">
🔎 تحلیل ارز
</button>

class="scan"
onclick="scanMarket()"
>
🚨 اسکن ۲۰۰ ارز
</button>

</div>


<div class="tf">

<span>
۱ دقیقه (1m)
</span>

<span>
۳ دقیقه (3m)
</span>

<span>
۵ دقیقه (5m)
</span>

</div>


<div class="alertBox">

<div>
🔔 هشدار صوتی:

id="alertStatus"
class="alertOn"
>
فعال
</span>
</div>

id="alertHelp"

>
برای آماده‌سازی صدای هشدار، یک بار روی صفحه لمس کن.

id="alertButton"

</div>

id="scanInfo"

>
۲۰۰ ارز بررسی اولیه نشده است.

یک ارز وارد کن و تحلیل ارز را بزن.

<script>


// =================================================
// CONFIG
// =================================================

const API_BASE = "";

const ALERT_KEY = "bybit_scanner_alert_enabled";

const LAST_ALERT_KEY = "bybit_scanner_last_alert";

const AUTO_SCAN = true;


// =================================================
// ALERT STATE
// =================================================

let soundEnabled =
localStorage.getItem(ALERT_KEY) !== "false";

let audioContext = null;

let audioReady = false;

let lastAlertSignature =
localStorage.getItem(LAST_ALERT_KEY) || "";


// =================================================
// AUDIO INITIALIZE
// =================================================

function initAudio(){

try{

if(!audioContext){

audioContext =
new (
window.AudioContext ||
window.webkitAudioContext
)();

}

if(
audioContext.state === "suspended"
){

audioContext.resume();

}

audioReady = true;

updateAlertUI();

}catch(e){

audioReady = false;

updateAlertUI();

}

}


// =================================================
// BEEP
// =================================================

function beep(){

if(!soundEnabled)
return;

try{

if(!audioContext){

initAudio();

}

if(!audioContext)
return;

if(
audioContext.state === "suspended"
){

audioContext.resume();

}

const now =
audioContext.currentTime;


const osc =
audioContext.createOscillator();

const gain =
audioContext.createGain();


osc.type = "sine";


osc.frequency.setValueAtTime(
880,
now
);

osc.frequency.setValueAtTime(
1100,
now + 0.18
);

osc.frequency.setValueAtTime(
880,
now + 0.36
);


gain.gain.setValueAtTime(
0.001,
now
);

gain.gain.exponentialRampToValueAtTime(
0.18,
now + 0.03
);

gain.gain.exponentialRampToValueAtTime(
0.001,
now + 0.45
);


osc.connect(gain);

gain.connect(
audioContext.destination
);


osc.start(now);

osc.stop(
now + 0.46
);


// لرزش گوشی

if(
navigator.vibrate
){

navigator.vibrate([
180,
100,
180,
100,
300
]);

}


audioReady = true;

}catch(e){

console.log(
"Audio error:",
e
);

audioReady = false;

}

}


// =================================================
// ALERT UI
// =================================================

function updateAlertUI(){

const status =
document.getElementById(
"alertStatus"
);

const button =
document.getElementById(
"alertButton"
);

const help =
document.getElementById(
"alertHelp"
);


if(!soundEnabled){

status.textContent =
"خاموش";

status.className =
"alertOff";

button.textContent =
"🔔 فعال کردن هشدار";

button.className =
"alertStart";

help.textContent =
"هشدار صوتی خاموش است.";

return;

}


status.textContent =
"فعال";

status.className =
"alertOn";

button.textContent =
audioReady
?"🔕 قطع هشدار"
:"🔔 آماده‌سازی هشدار";

button.className =
audioReady
?"stop"
:"alertStart";


if(audioReady){

help.textContent =
"هشدار صوتی آماده است.";

}else{

help.textContent =
"یک بار روی صفحه یا دکمه فعال‌سازی لمس کن تا صدای هشدار آماده شود.";

}

}


// =================================================
// TOGGLE ALERT
// =================================================

function toggleAlert(){

if(!soundEnabled){

soundEnabled = true;

localStorage.setItem(
ALERT_KEY,
"true"
);

initAudio();

beep();

}else{

soundEnabled = false;

localStorage.setItem(
ALERT_KEY,
"false"
);

}

updateAlertUI();

}


// =================================================
// ARM AUDIO BY USER TOUCH
// =================================================

function armAudio(){

if(!soundEnabled)
return;

initAudio();

}


// =================================================
// ALERT SIGNAL
// =================================================

function signalSignature(list){

if(!list || !list.length)
return "";

return list
.slice(0,10)
.map(r => {

return (
(r.symbol || "") +
"_" +
(r.direction || "") +
"_" +
String(r.score || 0)
);

})
.join("|");

}


function alertForSignals(list){

if(!soundEnabled)
return;

if(!list || !list.length)
return;


// سیگنال فعلی

const signature =
signalSignature(list);


// اگر همان سیگنال قبلاً هشدار داده شده
// دوباره پشت سر هم زنگ نزن

if(
signature &&
signature === lastAlertSignature
){

return;

}


lastAlertSignature =
signature;


localStorage.setItem(
LAST_ALERT_KEY,
signature
);


// هشدار

beep();


// تغییر وضعیت صفحه

const status =
document.getElementById(
"status"
);

status.textContent =
"🚨 هشدار! سیگنال جدید پیدا شد.";

}


// =================================================
// FORMAT
// =================================================

function num(v){

if(
v===null ||
v===undefined ||
Number.isNaN(Number(v))
)
return "-";

return Number(v).toLocaleString(
"en-US",
{
maximumFractionDigits:8
}
);

}


function pct(v){

if(
v===null ||
v===undefined ||
Number.isNaN(Number(v))
)
return "-";

return Number(v).toFixed(2)+"%";

}


function trendFA(v){

if(v==="BULLISH")
return "🟢 صعودی (BULLISH)";

if(v==="BEARISH")
return "🔴 نزولی (BEARISH)";

return "🟡 رنج (RANGE)";

}


function slopeFA(v){

if(v==="UP")
return "🟢 صعودی (UP)";

if(v==="DOWN")
return "🔴 نزولی (DOWN)";

return "🟡 خنثی (FLAT)";

}


function structureFA(v){

if(v==="BULLISH")
return "🟢 صعودی (BULLISH)";

if(v==="BEARISH")
return "🔴 نزولی (BEARISH)";

return "⚪ بدون ساختار (NONE)";

}


function fvgFA(v){

if(v==="BULLISH")
return "🟢 صعودی (BULLISH)";

if(v==="BEARISH")
return "🔴 نزولی (BEARISH)";

return "⚪ ندارد (NONE)";

}


function directionFA(v){

if(v==="LONG")
return "🟢 خرید (LONG)";

if(v==="SHORT")
return "🔴 فروش (SHORT)";

return "🟡 انتظار (WAIT)";

}


function scoreClass(score){

if(score>=75)
return "green";

if(score>=55)
return "yellow";

return "gray";

}


// =================================================
// FOOTPRINT
// =================================================

function renderFootprint(fp){

if(!fp){

return `
<div class="empty">
فوت‌پرینت دریافت نشده.
</div>
`;

}


if(fp.error){

return `
<div class="empty">
خطای فوت‌پرینت:
${fp.error}
</div>
`;

}


return `

<div class="section">
👣 فوت‌پرینت واقعی
</div>

<div class="grid">

<div class="box">
<div class="label">
حجم خرید
</div>
<div class="value green">
${num(fp.buyVolume)}
</div>
</div>

<div class="box">
<div class="label">
حجم فروش
</div>
<div class="value red">
${num(fp.sellVolume)}
</div>
</div>

<div class="box">
<div class="label">
دلتا
</div>
<div class="value ${
fp.delta>=0
?"green"
:"red"
}">
${num(fp.delta)}
</div>
</div>

<div class="box">
<div class="label">
دلتا درصد
</div>
<div class="value ${
fp.deltaPercent>=0
?"green"
:"red"
}">
${pct(fp.deltaPercent)}
</div>
</div>

<div class="box">
<div class="label">
نسبت خرید
</div>
<div class="value">
${pct(fp.buyRatio)}
</div>
</div>

<div class="box">
<div class="label">
نسبت فروش
</div>
<div class="value">
${pct(fp.sellRatio)}
</div>
</div>

<div class="box">
<div class="label">
تعداد معاملات
</div>
<div class="value">
${num(fp.trades)}
</div>
</div>

<div class="box">
<div class="label">
معامله بزرگ
</div>
<div class="value ${
fp.largeTrade
?"yellow"
:"gray"
}">
${
fp.largeTrade
?"💥 بله"
:"❌ خیر"
}
</div>
</div>

</div>

<div class="confirm">

<b>
نتیجه Footprint:
</b>
<br>

${
fp.delta>0
?"🟢 فشار خرید بیشتر است"
:fp.delta<0
?"🔴 فشار فروش بیشتر است"
:"🟡 تعادل خرید و فروش"
}

<br>

بزرگ‌ترین معامله:
${num(fp.largeTradeNotional)}

</div>

`;

}


// =================================================
// SIGNAL
// =================================================

function renderSignal(r){

const cls =
r.direction==="LONG"
?"long"
:r.direction==="SHORT"
?"short"
:"wait";


return `

<div class="signal ${cls}">

<div class="header">

<div>

<div class="title">

${directionFA(r.direction)}
&nbsp;
${r.symbol}

</div>

<div class="meta">

تایم‌فریم:
۱ دقیقه / ۳ دقیقه / ۵ دقیقه

</div>

</div>

<div class="score ${
scoreClass(r.score)
}">

${r.score}/100

</div>

</div>


<div class="grid">

<div class="box">
<div class="label">
قیمت فعلی
</div>
<div class="value">
${num(r.price)}
</div>
</div>

<div class="box">
<div class="label">
ورود
</div>
<div class="value">
${num(r.entry)}
</div>
</div>

<div class="box">
<div class="label">
حد ضرر
</div>
<div class="value red">
${num(r.sl)}
</div>
</div>

<div class="box">
<div class="label">
هدف ۱
</div>
<div class="value green">
${num(r.tp1)}
</div>
</div>

<div class="box">
<div class="label">
هدف ۲
</div>
<div class="value green">
${num(r.tp2)}
</div>
</div>

<div class="box">
<div class="label">
هدف ۳
</div>
<div class="value green">
${num(r.tp3)}
</div>
</div>

</div>


<div class="confirm">

<b>
تأییدها:
</b>

${r.confirmations}

<br>

<b>
تایم‌فریم‌های صعودی:
</b>

${r.bullishTimeframes}/3

<br>

<b>
تایم‌فریم‌های نزولی:
</b>

${r.bearishTimeframes}/3

</div>


<div class="confirm">

<div class="section">
📈 وضعیت ۱ دقیقه
</div>

${renderTF(r.timeframes?.["1"])}

<div class="section">
📈 وضعیت ۳ دقیقه
</div>

${renderTF(r.timeframes?.["3"])}

<div class="section">
📈 وضعیت ۵ دقیقه
</div>

${renderTF(r.timeframes?.["5"])}

</div>


${
r.reasons &&
r.reasons.length
?
`

<div class="confirm">

<b>
⚠️ نکات:
</b>

<br>

${r.reasons
.map(x=>`• ${x}`)
.join("<br>")}

</div>

`
:""
}


${renderFootprint(r.footprint)}

</div>

`;

}


// =================================================
// TF
// =================================================

function renderTF(x){

if(!x)
return "❌ اطلاعات دریافت نشد.";

if(x.error)
return "❌ "+x.error;


return `

روند:
${trendFA(x.trend)}

<br>

شیب MA20:
${slopeFA(x.maSlope)}

<br>

MA7:
${num(x.ma7)}

<br>

MA20:
${num(x.ma20)}

<br>

تماس با MA20:
${x.touchMA20?"✅ بله":"❌ خیر"}

<br>

ساختار:
${structureFA(x.structure)}

<br>

FVG:
${fvgFA(x.fvg?.type)}

<br>

حجم فعلی:
${num(x.volume?.current)}

<br>

میانگین حجم 7:
${num(x.volume?.ma7)}

<br>

میانگین حجم 20:
${num(x.volume?.ma20)}

<br>

جهش حجم:
${x.volume?.spike?"🔥 بله":"❌ خیر"}

`;

}


// =================================================
// GET JSON
// =================================================

async function getJSON(url){

const response =
await fetch(
url,
{
cache:"no-store"
}
);


if(!response.ok){

throw new Error(
"HTTP "+response.status
);

}


const data =
await response.json();


if(!data.ok){

throw new Error(
data.error ||
data.detail ||
"خطای دریافت اطلاعات"
);

}


return data;

}


// =================================================
// MANUAL ANALYZE
// =================================================

async function analyzeSymbol(){

armAudio();

const symbol =
document
.getElementById("symbol")
.value
.trim()
.toUpperCase();


const manual =
document.getElementById("manual");

const status =
document.getElementById("status");


if(!symbol){

status.textContent =
"❌ نماد را وارد کن.";

return;

}


manual.innerHTML =
`
<div class="empty">
⏳ در حال تحلیل ${symbol}...
</div>
`;


status.textContent =
`⏳ تحلیل ${symbol} در ۱، ۳ و ۵ دقیقه...`;


try{

const data =
await getJSON(
API_BASE+
"/api/analyze?symbol="+
encodeURIComponent(symbol)
);


manual.innerHTML =
renderSignal(data);


status.textContent =
`✅ تحلیل ${symbol} کامل شد.`;


}catch(e){

manual.innerHTML =
`
<div class="empty">
❌ خطا
<br><br>
${e.message}
</div>
`;

status.textContent =
"❌ تحلیل انجام نشد.";

}

}


// =================================================
// SCAN MARKET
// =================================================

async function scanMarket(){

armAudio();


const results =
document.getElementById(
"results"
);

const status =
document.getElementById(
"status"
);

const scanInfo =
document.getElementById(
"scanInfo"
);


results.innerHTML =
`
<div class="empty">

⏳ در حال اسکن سریع بازار...

<br>

<span class="scanBadge">
۲۰۰ ارز بررسی اولیه
</span>

<br><br>

از بین آن‌ها ۲۰ ارز تحلیل عمیق می‌شوند.

</div>
`;


status.textContent =
"⏳ دریافت و اولویت‌بندی ۲۰۰ ارز Bybit...";


try{

const data =
await getJSON(
API_BASE+"/api/scan"
);


const list =
data.results || [];


const initial =
data.initialScanned ||
data.totalScanned ||
200;


const deep =
data.deepScanned ||
20;


scanInfo.innerHTML =
`
${initial}
ارز بررسی اولیه شدند.
<br>
${deep}
ارز تحلیل عمیق شدند.
`;


if(!list.length){

results.innerHTML =
`
<div class="empty">

🟡 فعلاً سیگنال تأییدشده‌ای پیدا نشد.

<br><br>

از ${deep} ارز تحلیل‌شده،
هیچ موقعیت بالاتر از حد تأیید پیدا نشد.

</div>
`;


// وقتی سیگنال وجود ندارد، هشدار نمی‌زنیم

status.textContent =
`
✅ اسکن کامل شد —
0 موقعیت برتر از ${deep}
ارز تحلیل عمیق.
`;

}else{

results.innerHTML =
list
.slice(0,10)
.map(renderSignal)
.join("");


status.textContent =
`
🚨 ${list.length}
موقعیت برتر پیدا شد.
`;


alertForSignals(list);

}

}catch(e){

results.innerHTML =
`
<div class="empty">

❌ خطا

<br><br>

${e.message}

</div>
`;

status.textContent =
"❌ اسکن بازار انجام نشد.";

}

}


// =================================================
// AUTO SCAN AFTER REFRESH
// =================================================

function autoStart(){
