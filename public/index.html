<body>

<div class="container">

<h1>📊 Bybit Futures Scanner V6</h1>

<div class="card">

  <div class="row">

    <input
      id="symbol"
      value="BTCUSDT"
      placeholder="مثلاً BTCUSDT">

    <button onclick="analyzeSymbol()">
      🔎 تحلیل ارز

      🚨 اسکن بازار
    </button>

  <div class="tf">
    <span>1m</span>
    <span>3m</span>
    <span>5m</span>

  <div id="status" class="status">
    آماده اسکن Bybit Futures
  </div>

</div>


<div class="card">

  <div class="top">
    🏆 10 موقعیت برتر
  </div>

  <div id="results">
    <div class="empty">
      هنوز اسکن انجام نشده.
    </div>
  </div>

</div>


<div class="card">

  <div class="top">
    🔎 نتیجه تحلیل دستی
  </div>

  <div id="manual">
    <div class="empty">
      یک ارز وارد کن و روی «تحلیل ارز» بزن.
    </div>
  </div>

</div>

</div>


<script>

/*
==================================================
تنظیم مهم
==================================================

اگر Worker شما روی همین دامنه است:

/api/...

اگر Worker جداست، مقدار زیر را با آدرس Worker خودت عوض کن.
*/

const API_BASE = "";


/*
تایم فریم های مجاز
فقط همین 5 تایم فریم
*/

const TIMEFRAMES = [
  "1",
  "3",
  "5",
  "15",
  "60"
];


/*
امتیاز هر تأیید
مجموع = 100
*/

const WEIGHTS = {
  maSlope: 15,
  maTouch: 15,
  reaction: 10,
  structure: 15,
  fvg: 10,
  volume: 10,
  delta: 10,
  mtf: 10,
  rr: 5
};


function number(value){

  if(
    value === null ||
    value === undefined ||
    Number.isNaN(Number(value))
  ){
    return "-";
  }

  return Number(value).toLocaleString(
    "en-US",
    {
      maximumFractionDigits:8
    }
  );
}


function percent(value){

  if(
    value === null ||
    value === undefined ||
    Number.isNaN(Number(value))
  ){
    return "-";
  }

  return Number(value).toFixed(2) + "%";
}


function scoreGrade(score){

  if(score >= 85){
    return "A+";
  }

  if(score >= 75){
    return "A";
  }

  if(score >= 65){
    return "B";
  }

  if(score >= 55){
    return "C";
  }

  return "WAIT";
}


function gradeClass(score){

  if(score >= 75){
    return "green";
  }

  if(score >= 55){
    return "yellow";
  }

  return "gray";
}


/*
شیب MA20

اگر MA20 فعلی نسبت به MA20 قبلی
به شکل مشخصی بالاتر باشد:
صعودی

اگر پایین تر باشد:
نزولی
*/

function calculateSlope(closes){

  if(!closes || closes.length < 25){

    return {
      value:0,
      direction:"FLAT",
      strength:0
    };

  }

  const current = sma(closes,20);

  const previous = sma(
    closes.slice(0,-1),
    20
  );

  if(
    current === null ||
    previous === null
  ){

    return {
      value:0,
      direction:"FLAT",
      strength:0
    };

  }

  const value =
    ((current - previous) / previous) * 100;

  let direction = "FLAT";

  if(value > 0.02){
    direction = "UP";
  }
  else if(value < -0.02){
    direction = "DOWN";
  }

  const strength =
    Math.min(
      100,
      Math.abs(value) * 1000
    );

  return {
    value,
    direction,
    strength
  };
}


function sma(data,period){

  if(
    !data ||
    data.length < period
  ){
    return null;
  }

  const part =
    data.slice(
      data.length-period
    );

  return part.reduce(
    (a,b)=>a+b,
    0
  ) / period;
}


/*
تشخیص نزدیکی قیمت به MA20
*/

function ma20Touch(
  price,
  ma20,
  tolerance = 0.003
){

  if(
    price === null ||
    ma20 === null
  ){
    return false;
  }

  const distance =
    Math.abs(price-ma20)/ma20;

  return distance <= tolerance;
}


/*
واکنش قیمت

برای LONG:
آخرین کندل صعودی باشد

برای SHORT:
آخرین کندل نزولی باشد
*/

function candleReaction(
  rows,
  direction
){

  if(!rows || rows.length < 2){
    return false;
  }

  const last =
    rows[rows.length-1];

  const open =
    Number(last[1]);

  const close =
    Number(last[4]);

  if(direction === "LONG"){
    return close > open;
  }

  if(direction === "SHORT"){
    return close < open;
  }

  return false;
}


/*
ساختار ساده

Higher High / Higher Low
Lower High / Lower Low
*/

function detectStructure(closes){

  if(!closes || closes.length < 10){

    return "NONE";

  }

  const n = closes.length;

  const a = closes[n-6];
  const b = closes[n-3];
  const c = closes[n-1];

  if(c > b && b > a){
    return "BULLISH";
  }

  if(c < b && b < a){
    return "BEARISH";
  }

  return "NONE";
}


/*
FVG ساده سه کندلی
*/

function detectFVG(rows){

  if(!rows || rows.length < 3){

    return {
      type:"NONE",
      bottom:null,
      top:null
    };

  }

  const a =
    rows[rows.length-3];

  const c =
    rows[rows.length-1];

  const aHigh =
    Number(a[2]);

  const aLow =
    Number(a[3]);

  const cHigh =
    Number(c[2]);

  const cLow =
    Number(c[3]);


  /*
  Bullish FVG
  */

  if(cLow > aHigh){

    return {
      type:"BULLISH",
      bottom:aHigh,
      top:cLow
    };

  }


  /*
  Bearish FVG
  */

  if(cHigh < aLow){

    return {
      type:"BEARISH",
      bottom:cHigh,
      top:aLow
    };

  }


  return {
    type:"NONE",
    bottom:null,
    top:null
  };
}


/*
محاسبه Volume
*/

function volumeInfo(rows){

  if(!rows || rows.length < 20){

    return {
      current:0,
      ma7:0,
      ma20:0,
      spike:false
    };

  }

  const volumes =
    rows.map(
      r => Number(r[5])
    );

  const current =
    volumes[volumes.length-1];

  const ma7 =
    sma(volumes,7);

  const ma20 =
    sma(volumes,20);

  return {

    current,
    ma7,
    ma20,

    spike:
      current > ma20 * 1.5

  };

}


/*
امتیاز تایم فریم های بالاتر

15m و 1H برای ورودهای کوچک
اهمیت بیشتری دارند.
*/

function mtfScore(
  analyses,
  direction
){

  let score = 0;

  const important = [
    "5",
    "15",
    "60"
  ];

  important.forEach(tf => {

    const x =
      analyses[tf];

    if(!x) return;

    if(
      direction === "LONG" &&
      x.trend === "BULLISH"
    ){

      score += 3;

    }

    if(
      direction === "SHORT" &&
      x.trend === "BEARISH"
    ){

      score += 3;

    }

  });

  return Math.min(10,score);

}


/*
تحلیل یک تایم فریم
*/

function analyzeTF(rows){

  if(!rows || rows.length < 25){

    return null;

  }

  const closes =
    rows.map(
      r => Number(r[4])
    );

  const price =
    closes[closes.length-1];

  const ma7 =
    sma(closes,7);

  const ma20 =
    sma(closes,20);

  const slope =
    calculateSlope(closes);

  let trend = "RANGE";

  if(ma7 > ma20){
    trend = "BULLISH";
  }
  else if(ma7 < ma20){
    trend = "BEARISH";
  }

  const structure =
    detectStructure(closes);

  const fvg =
    detectFVG(rows);

  const volume =
    volumeInfo(rows);

  const longTouch =
    ma20Touch(price,ma20);

  const shortTouch =
    longTouch;

  const longReaction =
    candleReaction(
      rows,
      "LONG"
    );

  const shortReaction =
    candleReaction(
      rows,
      "SHORT"
    );

  return {

    price,
    ma7,
    ma20,

    trend,

    slope,

    structure,

    fvg,

    volume,

    longTouch,
    shortTouch,

    longReaction,
    shortReaction

  };

}


/*
تعیین جهت
*/

function determineDirection(x){

  if(!x){
    return "WAIT";
  }

  let longPoints = 0;
  let shortPoints = 0;

  if(x.trend === "BULLISH"){
    longPoints += 2;
  }

  if(x.trend === "BEARISH"){
    shortPoints += 2;
  }

  if(x.slope.direction === "UP"){
    longPoints += 2;
  }

  if(x.slope.direction === "DOWN"){
    shortPoints += 2;
  }

  if(x.structure === "BULLISH"){
    longPoints += 2;
  }

  if(x.structure === "BEARISH"){
    shortPoints += 2;
  }

  if(x.fvg.type === "BULLISH"){
    longPoints += 1;
  }

  if(x.fvg.type === "BEARISH"){
    shortPoints += 1;
  }

  if(
    longPoints > shortPoints &&
    longPoints >= 3
  ){
    return "LONG";
  }

  if(
    shortPoints > longPoints &&
    shortPoints >= 3
  ){
    return "SHORT";
  }

  return "WAIT";
}


/*
محاسبه امتیاز نهایی
*/

function calculateScore(
  x,
  direction,
  mtf
){

  if(
    !x ||
    direction === "WAIT"
  ){
    return {
      score:0,
      confirmations:0,
      total:9
    };
  }

  let score = 0;
  let confirmations = 0;


  /*
  MA20 Slope
  */

  const goodSlope =
    direction === "LONG"
    ? x.slope.direction === "UP"
    : x.slope.direction === "DOWN";

  if(goodSlope){

    score += WEIGHTS.maSlope;
    confirmations++;

  }


  /*
  MA20 Touch
  */

  const touch =
    direction === "LONG"
    ? x.longTouch
    : x.shortTouch;

  if(touch){

    score += WEIGHTS.maTouch;
    confirmations++;

  }


  /*
  Candle reaction
  */

  const reaction =
    direction === "LONG"
    ? x.longReaction
    : x.shortReaction;

  if(reaction){

    score += WEIGHTS.reaction;
    confirmations++;

  }


  /*
  Structure
  */

  const goodStructure =
    direction === "LONG"
    ? x.structure === "BULLISH"
    : x.structure === "BEARISH";

  if(goodStructure){

    score += WEIGHTS.structure;
    confirmations++;

  }


  /*
  FVG
  */

  const goodFVG =
    direction === "LONG"
    ? x.fvg.type === "BULLISH"
    : x.fvg.type === "BEARISH";

  if(goodFVG){

    score += WEIGHTS.fvg;
    confirmations++;

  }


  /*
  Volume
  */

  if(x.volume.spike){

    score += WEIGHTS.volume;
    confirmations++;

  }


  /*
  Delta

  فعلاً چون Delta واقعی از API موجود نیست،
  این بخش را در آینده با Footprint واقعی
  فعال می‌کنیم.
  */

  let deltaConfirmed = false;


  /*
  MTF
  */

  if(mtf >= 6){

    score += mtf;
    confirmations++;

  }


  /*
  R:R

  فعلاً بعد از ساخت SL/TP بررسی می‌شود.
  */

  score =
    Math.min(
      100,
      Math.round(score)
    );


  return {

    score,

    confirmations,

    total:9,

    deltaConfirmed

  };

}


/*
SL / TP ساختاری
*/

function calculateTargets(
  x,
  direction
){

  const price =
    x.price;

  let sl;
  let risk;


  if(direction === "LONG"){

    let base =
      price * 0.985;

    if(x.fvg.type === "BULLISH"){
      base =
        Math.min(
          base,
          x.fvg.bottom * 0.998
        );
    }

    sl = base;

    risk =
      price - sl;

  }
  else {

    let base =
      price * 1.015;

    if(x.fvg.type === "BEARISH"){
      base =
        Math.max(
          base,
          x.fvg.top * 1.002
        );
    }

    sl = base;

    risk =
      sl - price;

  }


  if(risk <= 0){

    risk =
      price * 0.01;

    if(direction === "LONG"){
      sl = price-risk;
    }
    else{
      sl = price+risk;
    }

  }


  let tp1;
  let tp2;
  let tp3;


  if(direction === "LONG"){

    tp1 = price + risk;
    tp2 = price + risk*2;
    tp3 = price + risk*3;

  }
  else{

    tp1 = price - risk;
    tp2 = price - risk*2;
    tp3 = price - risk*3;

  }


  return {

    entry:price,
    sl,
    tp1,
    tp2,
    tp3,

    rr:"1:3"

  };

}


/*
دریافت Kline از Worker
*/

async function getKlines(
  symbol,
  interval
){

  const url =
    API_BASE +
    "/api/kline" +
    "?symbol=" +
    encodeURIComponent(symbol) +
    "&interval=" +
    encodeURIComponent(interval);


  const response =
    await fetch(url);


  const data =
    await response.json();


  if(!data.ok){

    throw new Error(
      data.error ||
      data.detail ||
      "خطای دریافت داده"
    );

  }


  return data.rows || [];

}


/*
تحلیل کامل یک ارز
*/

async function fullAnalyze(symbol){

  const analyses = {};

  for(
    const tf of TIMEFRAMES
  ){

    try{

      const rows =
        await getKlines(
          symbol,
          tf
        );

      analyses[tf] =
        analyzeTF(rows);

    }
    catch(error){

      analyses[tf] = null;

    }

  }


  /*
  تایم فریم اصلی = 15m
  */

  const main =
    analyses["15"] ||
    analyses["5"] ||
    analyses["3"] ||
    analyses["1"];


  if(!main){

    throw new Error(
      "اطلاعات کافی برای تحلیل " +
      symbol +
      " دریافت نشد."
    );

  }


  const direction =
    determineDirection(main);


  const mtf =
    mtfScore(
      analyses,
      direction
    );


  const result =
    calculateScore(
      main,
      direction,
      mtf
    );


  const targets =
    direction === "WAIT"
    ? null
    : calculateTargets(
        main,
        direction
      );


  return {

    symbol,

    main,

    direction,

    score:result.score,

    confirmations:
      result.confirmations,

    total:
      result.total,

    mtf,

    targets,

    analyses

  };

}


/*
نمایش نتیجه
*/

function renderSignal(result){

  const direction =
    result.direction;

  const score =
    result.score;

  const grade =
    scoreGrade(score);

  const cls =
    direction === "LONG"
    ? "long"
    : direction === "SHORT"
    ? "short"
    : "wait";


  const icon =
    direction === "LONG"
    ? "🟢 LONG"
    : direction === "SHORT"
    ? "🔴 SHORT"
    : "🟡 WAIT";


  const x =
    result.main;


  const t =
    result.targets;


  let targetsHTML = "";


  if(t){

    targetsHTML = `

      <div class="grid">

        <div class="box">
          <div class="label">Entry</div>
          <div class="value">${number(t.entry)}</div>
        </div>

        <div class="box">
          <div class="label">SL</div>
          <div class="value red">${number(t.sl)}</div>
        </div>

        <div class="box">
          <div class="label">TP1</div>
          <div class="value green">${number(t.tp1)}</div>
        </div>

        <div class="box">
          <div class="label">TP2</div>
          <div class="value green">${number(t.tp2)}</div>
        </div>

        <div class="box">
          <div class="label">TP3</div>
          <div class="value green">${number(t.tp3)}</div>
        </div>

        <div class="box">
          <div class="label">R:R</div>
          <div class="value">${t.rr}</div>
        </div>

      </div>

    `;

  }


  return `

    <div class="signal ${cls}">

      <div class="header">

        <div>

          <div class="title">
            ${icon} ${result.symbol}
          </div>

          <div class="meta">
            تایم‌فریم اصلی: 15m
          </div>

        </div>

        <div class="score ${gradeClass(score)}">
          ${score}/100
          <small>${grade}</small>
        </div>

      </div>


      ${targetsHTML}


      <div class="confirm">

        <b>تأییدها:</b>
        ${result.confirmations}/${result.total}

        <br>

        MA20 Touch:
        ${x.longTouch || x.shortTouch ? "✅" : "❌"}

        <br>

        MA20 Slope:
        ${
          x.slope.direction === "UP"
          ? "🟢 صعودی"
          : x.slope.direction === "DOWN"
          ? "🔴 نزولی"
          : "🟡 خنثی"
        }

        <br>

        Structure:
        ${
          x.structure === "BULLISH"
          ? "🟢 BULLISH"
          : x.structure === "BEARISH"
          ? "🔴 BEARISH"
          : "⚪ NONE"
        }

        <br>

        FVG:
        ${
          x.fvg.type === "BULLISH"
          ? "🟢 BULLISH"
          : x.fvg.type === "BEARISH"
          ? "🔴 BEARISH"
          : "⚪ NONE"
        }

        <br>

        Volume:
        ${x.volume.spike ? "🔥 تأیید" : "❌"}

        <br>

        MTF:
        ${result.mtf}/10

      </div>


      <div class="confirm">

        <b>تایم‌فریم‌ها:</b><br>

        ${renderMTF(result.analyses)}

      </div>

    </div>

  `;

}


function renderMTF(analyses){

  const names = {
    "1":"1m",
    "3":"3m",
    "5":"5m",
    "15":"15m",
    "60":"1H"
  };

  let html = "";

  for(
    const tf of TIMEFRAMES
  ){

    const x =
      analyses[tf];

    if(!x){

      html +=
        `${names[tf]} ⏳<br>`;

      continue;

    }

    const icon =
      x.trend === "BULLISH"
      ? "🟢"
      : x.trend === "BEARISH"
      ? "🔴"
      : "🟡";

    html +=
      `${names[tf]} ${icon} ${x.trend}<br>`;

  }

  return html;
}


/*
تحلیل دستی
*/

async function analyzeSymbol(){

  const input =
    document.getElementById(
      "symbol"
    );

  const manual =
    document.getElementById(
      "manual"
    );

  const status =
    document.getElementById(
      "status"
    );


  const symbol =
    input.value
      .trim()
      .toUpperCase();


  if(!symbol){

    status.textContent =
      "❌ نماد را وارد کن.";

    return;

  }


  manual.innerHTML =
    `<div class="empty">
      ⏳ در حال تحلیل ${symbol}...
    </div>`;


  status.textContent =
    `⏳ در حال بررسی ${symbol} در 5 تایم‌فریم...`;


  try{

    const result =
      await fullAnalyze(symbol);


    manual.innerHTML =
      renderSignal(result);


    status.textContent =
      `✅ تحلیل ${symbol} کامل شد.`;

  }
  catch(error){

    console.error(error);

    manual.innerHTML =
      `<div class="empty">
        ❌ خطا<br><br>
        ${error.message}
      </div>`;


    status.textContent =
      "❌ تحلیل انجام نشد.";

  }

}


/*
اسکن بازار
*/

async function scanMarket(){

  const resultsBox =
    document.getElementById(
      "results"
    );

  const status =
    document.getElementById(
      "status"
    );


  resultsBox.innerHTML =
    `<div class="empty">
      ⏳ دریافت لیست فیوچرز Bybit...
    </div>`;


  try{

    /*
    دریافت لیست ارزها
    */

    const response =
      await fetch(
        API_BASE +
        "/api/futures"
      );


    const data =
      await response.json();


    if(!data.ok){

      throw new Error(
        data.error ||
        "دریافت لیست فیوچرز ناموفق بود."
      );

    }


    const symbols =
      data.futures || [];


    /*
    فقط نمادهای USDT
    و حذف قراردادهای تاریخ‌دار
    */

    const cleanSymbols =
      symbols
        .filter(
          s =>
            s.endsWith("USDT") &&
            !s.includes("-")
        );


    status.textContent =
      `⏳ ${cleanSymbols.length} ارز در حال بررسی است...`;


    const results = [];


    /*
    برای اینکه مرورگر و Worker
    تحت فشار قرار نگیرند،
    هر بار چند ارز بررسی می‌شود.
    */

    const batchSize = 5;


    for(
      let i=0;
      i<cleanSymbols.length;
      i+=batchSize
    ){

      const batch =
        cleanSymbols.slice(
          i,
          i+batchSize
        );


      const batchResults =
        await Promise.all(
          batch.map(
            async symbol => {

              try{

                return await fullAnalyze(
                  symbol
                );

              }
              catch(error){

                return null;

              }

            }
          )
        );


      batchResults.forEach(
        r => {

          if(
            r &&
            r.direction !== "WAIT" &&
            r.score >= 55
          ){

            results.push(r);

          }

        }
      );


      status.textContent =
        `⏳ بررسی ${Math.min(
          i+batchSize,
          cleanSymbols.length
        )} از ${cleanSymbols.length}...`;

    }


    /*
    مرتب‌سازی بر اساس Score
    */

    results.sort(
      (a,b) =>
        b.score-a.score
    );


    /*
    فقط 10 مورد
    */

    const top10 =
      results.slice(0,10);


    if(!top10.length){

      resultsBox.innerHTML =
        `<div class="empty">
          🟡 فعلاً سیگنال تأییدشده‌ای
          پیدا نشد.
        </div>`;

    }
    else{

      resultsBox.innerHTML =
        top10
          .map(
            r =>
              renderSignal(r)
          )
          .join("");

    }


    status.textContent =
      `✅ اسکن کامل شد — ${top10.length} سیگنال برتر از ${cleanSymbols.length} ارز.`;

  }
  catch(error){

    console.error(error);

    resultsBox.innerHTML =
      `<div class="empty">
        ❌ خطا:<br><br>
        ${error.message}
      </div>`;


    status.textContent =
      "❌ اسکن بازار انجام نشد.";

  }

}
