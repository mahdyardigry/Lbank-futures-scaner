<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1"
>

<title>Bybit Smart Money Radar</title>

<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#080c12;
  color:#eef2f7;
  font-family:
    Tahoma,
    Arial,
    sans-serif;
}

button,
input,
select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.container{
  width:min(1400px,96%);
  margin:auto;
  padding:14px 0 40px;
}

/* ================= HEADER ================= */

.header{
  background:
    linear-gradient(
      135deg,
      #101823,
      #0a111a
    );

  border:1px solid #1d2a38;
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:
    0 8px 35px rgba(0,0,0,.25);
}

.title{
  font-size:25px;
  font-weight:900;
  margin-bottom:7px;
}

.subtitle{
  color:#8fa1b5;
  font-size:13px;
}

.status{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:13px;
  font-size:13px;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#21d07a;
  box-shadow:0 0 12px #21d07a;
}

.dot.off{
  background:#e84b4b;
  box-shadow:0 0 12px #e84b4b;
}

/* ================= PANELS ================= */

.panel{
  background:#0d141d;
  border:1px solid #1c2936;
  border-radius:16px;
  padding:15px;
  margin-bottom:14px;
}

.panel-title{
  font-size:17px;
  font-weight:900;
  margin-bottom:13px;
}

/* ================= MANUAL ================= */

.search-row{
  display:grid;
  grid-template-columns:
    minmax(150px,2fr)
    minmax(100px,1fr)
    auto;

  gap:9px;
}

input,
select{
  width:100%;
  background:#080e15;
  color:#fff;
  border:1px solid #263746;
  border-radius:11px;
  padding:12px;
  outline:none;
}

input:focus,
select:focus{
  border-color:#4a8cff;
}

.btn{
  border:0;
  border-radius:11px;
  padding:11px 17px;
  color:#fff;
  background:#245fd6;
  font-weight:800;
}

.btn:hover{
  filter:brightness(1.12);
}

.btn.green{
  background:#168453;
}

.btn.orange{
  background:#a86614;
}

.btn.red{
  background:#a92e39;
}

.btn.gray{
  background:#293746;
}

.market-tabs{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.market-tab{
  flex:1;
  border:1px solid #273746;
  background:#101923;
  color:#9eacba;
  padding:10px;
  border-radius:10px;
}

.market-tab.active{
  background:#174e8e;
  color:#fff;
  border-color:#317bd2;
}

/* ================= SEARCH RESULT ================= */

.search-result{
  margin-top:12px;
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:10px;
}

.market-box{
  background:#090f16;
  border:1px solid #202e3c;
  border-radius:12px;
  padding:12px;
}

.market-box strong{
  display:block;
  margin-bottom:6px;
}

.found{
  color:#28d985;
}

.not-found{
  color:#ed5a61;
}

/* ================= ACTIONS ================= */

.actions{
  display:grid;
  grid-template-columns:
    repeat(3,1fr);

  gap:9px;
}

/* ================= SCORE ================= */

.score-grid{
  display:grid;
  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap:10px;
}

.score-card{
  background:#090f16;
  border:1px solid #202d3a;
  border-radius:13px;
  padding:14px;
  text-align:center;
}

.score-value{
  font-size:28px;
  font-weight:900;
  margin-top:5px;
}

.score-label{
  color:#91a0b0;
  font-size:12px;
}

.long{
  color:#22d487;
}

.short{
  color:#ff5964;
}

.wait{
  color:#f1b94b;
}

/* ================= SIGNAL ================= */

.signal{
  padding:16px;
  border-radius:14px;
  background:#090f16;
  border:1px solid #263746;
  margin-top:12px;
}

.signal-main{
  font-size:22px;
  font-weight:900;
}

.signal.confirmed{
  border-color:#20c979;
}

.signal.strong{
  box-shadow:
    0 0 20px rgba(40,210,130,.12);
}

.signal.very{
  box-shadow:
    0 0 25px rgba(255,193,7,.16);
}

/* ================= GRID ================= */

.grid{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:12px;
}

.grid3{
  display:grid;
  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:10px;
}

/* ================= TABLE ================= */

.table-wrap{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:650px;
}

th,
td{
  border-bottom:1px solid #1c2935;
  padding:9px 7px;
  text-align:center;
  font-size:12px;
}

th{
  color:#8294a7;
  font-weight:700;
}

td{
  color:#d9e0e7;
}

/* ================= METRICS ================= */

.metric{
  background:#090f16;
  border:1px solid #202d39;
  border-radius:12px;
  padding:12px;
}

.metric-title{
  color:#8292a4;
  font-size:11px;
  margin-bottom:6px;
}

.metric-value{
  font-size:18px;
  font-weight:900;
}

.metric-sub{
  color:#7c8b9a;
  font-size:11px;
  margin-top:5px;
}

/* ================= BADGES ================= */

.badge{
  display:inline-block;
  border-radius:7px;
  padding:4px 8px;
  font-size:11px;
  font-weight:800;
}

.badge.green{
  background:#0d3d2a;
  color:#42e29a;
}

.badge.red{
  background:#45171d;
  color:#ff6c75;
}

.badge.yellow{
  background:#46350d;
  color:#f3c54b;
}

.badge.blue{
  background:#112f53;
  color:#63a9ff;
}

.badge.gray{
  background:#202b36;
  color:#9ba9b6;
}

/* ================= SECTION ================= */

.section{
  margin-top:12px;
}

.section-head{
  font-size:15px;
  font-weight:900;
  margin-bottom:8px;
}

/* ================= REASONS ================= */

.reason{
  padding:8px 10px;
  margin:5px 0;
  border-radius:8px;
  background:#0a1118;
  border-right:3px solid #344656;
  font-size:12px;
}

.reason.long{
  border-color:#1fcf7b;
}

.reason.short{
  border-color:#ff535d;
}

/* ================= PUMP ================= */

.pump-card{
  border:1px solid #3d3020;
  background:#11100c;
  border-radius:13px;
  padding:13px;
}

.dump-card{
  border:1px solid #452027;
  background:#120c0e;
  border-radius:13px;
  padding:13px;
}

.reversal-card{
  border:1px solid #3d3548;
  background:#100e15;
  border-radius:13px;
  padding:13px;
}

/* ================= RADAR ================= */

.radar-grid{
  display:grid;
  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:10px;
}

.radar-item{
  background:#090f16;
  border:1px solid #202d3a;
  border-radius:12px;
  padding:12px;
}

.radar-symbol{
  font-size:17px;
  font-weight:900;
}

.radar-score{
  font-size:26px;
  font-weight:900;
  margin-top:6px;
}

/* ================= LOADING ================= */

.loading{
  padding:20px;
  text-align:center;
  color:#8da0b4;
}

.spinner{
  display:inline-block;
  width:18px;
  height:18px;
  border:3px solid #263747;
  border-top-color:#4c8dff;
  border-radius:50%;
  animation:spin .8s linear infinite;
  vertical-align:middle;
  margin-left:6px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* ================= ERROR ================= */

.error{
  background:#351419;
  border:1px solid #7b2935;
  color:#ff7b84;
  padding:11px;
  border-radius:10px;
  margin-top:10px;
}

/* ================= COLLAPSE ================= */

details{
  background:#0a1118;
  border:1px solid #1c2935;
  border-radius:12px;
  margin-top:9px;
}

summary{
  cursor:pointer;
  padding:12px;
  font-weight:800;
}

.details-body{
  padding:12px;
}

/* ================= FOOTPRINT ================= */

.delta-box{
  text-align:center;
  padding:18px;
  background:#090f16;
  border-radius:13px;
  border:1px solid #202d3a;
}

.delta-value{
  font-size:30px;
  font-weight:900;
}

/* ================= FOOTER ================= */

.footer{
  text-align:center;
  color:#5e6d7b;
  font-size:11px;
  padding:20px;
}

/* ================= MOBILE ================= */

@media(max-width:800px){

  .container{
    width:94%;
  }

  .search-row{
    grid-template-columns:1fr;
  }

  .actions{
    grid-template-columns:1fr;
  }

  .grid,
  .grid3,
  .score-grid,
  .radar-grid,
  .search-result{
    grid-template-columns:1fr;
  }

  .title{
    font-size:21px;
  }

  .panel{
    padding:12px;
  }

}

</style>

</head>

<body>

<div class="container">

<!-- ================= HEADER ================= -->

<header class="header">

  <div class="title">
    📊 اسکنر هوشمند بازار
  </div>

  <div class="subtitle">
    تحلیل ساختار، نقدینگی، حجم و جریان سفارش Bybit
  </div>

  <div class="status">
    <span id="statusDot" class="dot"></span>
    <span id="statusText">
      در حال اتصال به Bybit...
    </span>
  </div>

</header>


<!-- ================= MANUAL ================= -->

<section class="panel">

  <div class="panel-title">
    🔎 بررسی دستی ارز
  </div>

  <div class="search-row">

    <input
      id="symbolInput"
      placeholder="مثلاً BTCUSDT یا BTC"
      autocomplete="off"
    >

    <select id="category">

      <option value="linear">
        Futures
      </option>

      <option value="spot">
        Spot
      </option>

    </select>

    <button
      class="btn"
      onclick="analyzeManual()"
    >
      بررسی
    </button>

  </div>

  <div id="searchResult"></div>

</section>


<!-- ================= ACTIONS ================= -->

<section class="panel">

  <div class="panel-title">
    ⚡ اسکن بازار
  </div>

  <div class="actions">

    <button
      class="btn green"
      onclick="runScan()"
    >
      🔎 اسکن بازار
    </button>

    <button
      class="btn orange"
      onclick="runRadar()"
    >
      🚨 Pump / Dump Radar
    </button>

    <button
      class="btn gray"
      onclick="healthCheck()"
    >
      ⚙️ وضعیت سیستم
    </button>

  </div>

</section>


<!-- ================= OUTPUT ================= -->

<div id="output">

  <section class="panel">

    <div class="loading">
      برای شروع، یک ارز را بررسی کنید یا اسکن بازار را اجرا کنید.
    </div>

  </section>

</div>


<footer class="footer">

  Bybit Smart Money Radar — Worker V9

</footer>

</div>


<script>

/* =========================================================
STATE
========================================================= */

let currentOffset=0;

let autoRadar=false;


/* =========================================================
HELPERS
========================================================= */

const $ = id =>
  document.getElementById(id);


function num(v,d=0){

  const x=Number(v);

  return Number.isFinite(x)
    ? x
    : d;
}


function fmt(v,d=2){

  if(v===null || v===undefined)
    return "-";

  const x=Number(v);

  if(!Number.isFinite(x))
    return "-";

  return x.toLocaleString(
    "en-US",
    {
      maximumFractionDigits:d
    }
  );
}


function money(v){

  const x=num(v);

  if(x>=1000000000)
    return "$"+fmt(x/1000000000,2)+"B";

  if(x>=1000000)
    return "$"+fmt(x/1000000,2)+"M";

  if(x>=1000)
    return "$"+fmt(x/1000,2)+"K";

  return "$"+fmt(x,2);
}


function pct(v){

  const x=num(v);

  return (
    x>=0 ? "+" : ""
  )+
  fmt(x,2)+
  "%";
}


function directionBadge(direction){

  if(direction==="LONG")
    return `<span class="badge green">LONG</span>`;

  if(direction==="SHORT")
    return `<span class="badge red">SHORT</span>`;

  return `<span class="badge yellow">WAIT</span>`;
}


function scoreColor(score){

  if(score>=85)
    return "long";

  if(score>=75)
    return "long";

  if(score>=60)
    return "wait";

  return "";
}


function stateBadge(state){

  if(state==="ACTIVE")
    return `<span class="badge green">ACTIVE</span>`;

  if(state==="RANGE")
    return `<span class="badge gray">RANGE</span>`;

  if(state==="TRANSITION")
    return `<span class="badge yellow">TRANSITION</span>`;

  return `<span class="badge gray">${state||"-"}</span>`;
}


/* =========================================================
API
========================================================= */

async function api(url){

  const r=await fetch(url,{
    cache:"no-store"
  });

  const d=await r.json();

  if(!r.ok || d.ok===false){

    throw new Error(
      d.error ||
      "خطا در دریافت اطلاعات"
    );
  }

  return d;
}


/* =========================================================
STATUS
========================================================= */

async function healthCheck(){

  try{

    const d=
      await api("/api/health");

    $("statusDot")
      .classList
      .remove("off");

    $("statusText").textContent=
      `🟢 اتصال برقرار است — Bybit — ${d.version}`;

    renderHealth(d);

  }catch(e){

    $("statusDot")
      .classList
      .add("off");

    $("statusText").textContent=
      "🔴 اتصال Worker برقرار نیست";

    showError(e.message);
  }

}


/* =========================================================
MANUAL SEARCH
========================================================= */

async function analyzeManual(){

  const input=
    $("symbolInput")
      .value
      .trim();

  const category=
    $("category").value;

  if(!input){

    showError(
      "نام ارز را وارد کنید."
    );

    return;
  }

  $("output").innerHTML=
    loading(
      "در حال تحلیل عمیق ارز..."
    );

  $("searchResult").innerHTML=
    loading(
      "در حال پیدا کردن نماد..."
    );

  try{

    const found=
      await api(
        `/api/search?symbol=${encodeURIComponent(input)}`
      );

    renderSearch(found);

    const selected=
      category==="spot"
        ? found.spot
        : found.futures;

    if(!selected){

      $("output").innerHTML=
        `<section class="panel">
          <div class="error">
            ${category==="spot"
              ? "نماد Spot پیدا نشد."
              : "نماد Futures پیدا نشد."
            }
          </div>
        </section>`;

      return;
    }

    const d=
      await api(
        `/api/analyze?symbol=${encodeURIComponent(selected.symbol)}&category=${category}`
      );

    renderAnalysis(d);

  }catch(e){

    showError(e.message);
  }

}


/* =========================================================
SEARCH RESULT
========================================================= */

function renderSearch(d){

  const futures=d.futures;
  const spot=d.spot;

  $("searchResult").innerHTML=`

    <div class="search-result">

      <div class="market-box">

        <strong>
          📈 Futures
        </strong>

        ${
          futures
            ? `
              <span class="found">
                ✓ ${futures.symbol}
              </span>
            `
            : `
              <span class="not-found">
                ✕ پیدا نشد
              </span>
            `
        }

      </div>

      <div class="market-box">

        <strong>
          💱 Spot
        </strong>

        ${
          spot
            ? `
              <span class="found">
                ✓ ${spot.symbol}
              </span>
            `
            : `
              <span class="not-found">
                ✕ پیدا نشد
              </span>
            `
        }

      </div>

    </div>

  `;
}


/* =========================================================
ANALYSIS
========================================================= */

function renderAnalysis(d){

  const movement=d.movement || {};

  const reversal=d.reversal || {};

  const market=d.market || {};

  const fp=d.footprint || {};

  const wall=d.walls || {};

  const sr=d.supportResistance || {};

  const styles=d.styles || {};

  $("output").innerHTML=`

    ${mainSignal(d)}

    ${scoreCards(d)}

    ${movementSection(movement)}

    ${marketSection(market)}

    ${styleSection(styles)}

    <div class="grid">

      ${timeframeSection(d.timeframes)}

      ${convertedSection(d.convertedMA1m)}

    </div>

    <div class="grid">

      ${footprintSection(fp)}

      ${orderBookSection(wall)}

    </div>

    ${supportResistanceSection(sr)}

    ${reversalSection(reversal)}

    ${reasonsSection(d)}

    ${rawSection(d)}

  `;

}


/* =========================================================
MAIN SIGNAL
========================================================= */

function mainSignal(d){

  const score=d.score || 0;

  const level=d.signalLevel || "NONE";

  let title="⏳ انتظار";

  if(d.direction==="LONG")
    title="🟢 سیگنال LONG";

  if(d.direction==="SHORT")
    title="🔴 سیگنال SHORT";

  if(level==="VERY_STRONG")
    title+=" — بسیار قوی";

  else if(level==="CONFIRMED")
    title+=" — تأیید شده";

  else if(level==="WATCH")
    title+=" — تحت نظر";

  return `

    <section class="panel">

      <div class="signal ${
        level==="VERY_STRONG"
          ? "very"
          : level==="CONFIRMED"
            ? "confirmed"
            : ""
      }">

        <div class="signal-main">
          ${title}
        </div>

        <div style="margin-top:8px">

          ${directionBadge(d.direction)}

          <span class="badge blue">
            ${d.symbol}
          </span>

          <span class="badge gray">
            ${d.category==="linear"
              ? "Futures"
              : "Spot"
            }
          </span>

        </div>

        <div class="score-value ${scoreColor(score)}">
          ${Math.round(score)}/100
        </div>

        <div class="score-label">
          Signal Score
        </div>

      </div>

    </section>

  `;
}


/* =========================================================
SCORE CARDS
========================================================= */

function scoreCards(d){

  return `

    <section class="panel">

      <div class="panel-title">
        🎯 امتیاز سیگنال
      </div>

      <div class="score-grid">

        <div class="score-card">

          <div class="score-label">
            Long
          </div>

          <div class="score-value long">
            ${d.longScore}/100
          </div>

        </div>

        <div class="score-card">

          <div class="score-label">
            Short
          </div>

          <div class="score-value short">
            ${d.shortScore}/100
          </div>

        </div>

        <div class="score-card">

          <div class="score-label">
            Pump
          </div>

          <div class="score-value long">
            ${d.pumpScore}/100
          </div>

        </div>

        <div class="score-card">

          <div class="score-label">
            Dump
          </div>

          <div class="score-value short">
            ${d.dumpScore}/100
          </div>

        </div>

      </div>

    </section>

  `;
}


/* =========================================================
MOVEMENT
========================================================= */

function movementSection(m){

  return `

    <section class="panel">

      <div class="panel-title">
        🚀 حرکت بازار
      </div>

      <div class="grid3">

        ${metric(
          "تغییر 15 دقیقه",
          pct(m.change15m)
        )}

        ${metric(
          "تغییر 30 دقیقه",
          pct(m.change30m)
        )}

        ${metric(
          "Volume Ratio",
          fmt(m.volumeRatio,2)+"x"
        )}

        ${metric(
          "فاصله از MA20",
          pct(m.distanceFromMA20)
        )}

        ${metric(
          "Pump Score",
          m.pumpScore+"/100"
        )}

        ${metric(
          "Dump Score",
          m.dumpScore+"/100"
        )}

      </div>

    </section>

  `;
}


/* =========================================================
MARKET
========================================================= */

function marketSection(m){

  return `

    <section class="panel">

      <div class="panel-title">
        📊 OI / Funding / Market
      </div>

      <div class="grid3">

        ${metric(
          "Open Interest",
          money(m.openInterest)
        )}

        ${metric(
          "OI Change",
          pct(m.openInterestChange)
        )}

        ${metric(
          "Funding Rate",
          m.fundingRate!==null
            ? pct(num(m.fundingRate)*100)
            : "-"
        )}

        ${metric(
          "24h Price",
          pct(m.priceChange24h)
        )}

        ${metric(
          "24h Turnover",
          money(m.turnover24h)
        )}

        ${metric(
          "Mark Price",
          fmt(m.markPrice,8)
        )}

      </div>

    </section>

  `;
}


/* =========================================================
STYLE
========================================================= */

function styleSection(s){

  return `

    <section class="panel">

      <div class="panel-title">
        🧠 تحلیل چندسبکی
      </div>

      <div class="grid3">

        ${metric(
          "SMC",
          s.SMC
            ? s.SMC+"/100"
            : "-"
        )}

        ${metric(
          "ICT",

function radarCards(arr,type){

  if(!arr.length){

    return `
      <div class="loading">
        مورد قدرتمندی پیدا نشد.
      </div>
    `;
  }

  return `

    <div class="radar-grid">

      ${
        arr
          .map(x=>`

            <div class="radar-item">

              <div class="radar-symbol">
                ${x.symbol}
              </div>

              <div class="radar-score ${
                type==="pump"
                  ? "long"
                  : "short"
              }">

                ${
                  type==="pump"
                    ? x.pumpScore
                    : x.dumpScore
                }

                /100

              </div>

              <div style="margin-top:7px">

                ${directionBadge(
                  x.direction
                )}

              </div>

              <div class="metric-sub">

                15m:
                ${pct(
                  x.movement?.change15m
                )}

                <br>

                30m:
                ${pct(
                  x.movement?.change30m
                )}

              </div>

              <button
                class="btn gray"
                style="width:100%;margin-top:9px"
                onclick="quickAnalyze('${x.symbol}')"
              >
                تحلیل کامل
              </button>

            </div>

          `)
          .join("")
      }

    </div>

  `;
}


function reversalCards(arr){

  if(!arr.length){

    return `
      <div class="loading">
        سیگنال برگشت قابل توجهی پیدا نشد.
      </div>
    `;
  }

  return `

    <div class="radar-grid">

      ${
        arr
          .map(x=>{

            const p=
              x.reversal?.pumpScore || 0;

            const d=
              x.reversal?.dumpScore || 0;

            const best=
              Math.max(p,d);

            return `

              <div class="reversal-card">

                <div class="radar-symbol">
                  ${x.symbol}
                </div>

                <div class="radar-score wait">
                  ${best}/100
                </div>

                <div class="metric-sub">

                  Pump Reversal:
                  ${p}

                  <br>

                  Dump Reversal:
                  ${d}

                </div>

                <button
                  class="btn gray"
                  style="width:100%;margin-top:9px"
                  onclick="quickAnalyze('${x.symbol}')"
                >
                  تحلیل کامل
                </button>

              </div>

            `;

          })
          .join("")
      }

    </div>

  `;
}
