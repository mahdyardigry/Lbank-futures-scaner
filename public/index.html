<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1"
>

<title>Bybit Futures Scanner V10</title>

<style>

*{
box-sizing:border-box
}

body{
margin:0;
background:#0b0f14;
color:#fff;
font-family:Arial,Tahoma,sans-serif
}

.container{
max-width:900px;
margin:auto;
padding:14px
}

h1{
font-size:21px;
margin:5px 0 14px
}

.card{
background:#151b23;
border:1px solid #293241;
border-radius:14px;
padding:14px;
margin-bottom:12px
}

.row{
display:flex;
gap:8px;
flex-wrap:wrap
}

input,button{
min-height:44px;
padding:9px 12px;
border-radius:9px;
border:1px solid #394555;
background:#0b0f14;
color:#fff;
font-size:15px
}

input{
flex:1;
min-width:150px
}

button{
background:#238636;
border:0;
font-weight:bold
}

button.scan{
background:#2563eb
}

button.stop{
background:#b91c1c
}

.status{
color:#9aa4b2;
font-size:13px;
margin-top:10px;
line-height:1.8
}

.tf{
display:flex;
gap:6px;
margin-top:10px;
flex-wrap:wrap
}

.tf span{
background:#0b0f14;
border:1px solid #303947;
padding:6px 10px;
border-radius:8px;
font-size:12px
}

.top{
color:#ffd740;
font-weight:bold;
margin-bottom:8px
}

.empty{
text-align:center;
padding:25px;
color:#8b949e
}

.signal{
background:#0b0f14;
border-radius:12px;
padding:14px;
margin-top:10px;
border-right:4px solid #777
}

.signal.long{
border-right-color:#00c853
}

.signal.short{
border-right-color:#ff3d00
}

.signal.wait{
border-right-color:#ffc107
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px
}

.title{
font-size:18px;
font-weight:bold
}

.score{
font-size:20px;
font-weight:bold
}

.meta{
color:#9aa4b2;
font-size:12px;
margin-top:4px
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:7px;
margin-top:10px
}

.box{
background:#11161d;
border-radius:9px;
padding:9px
}

.label{
color:#8b949e;
font-size:11px;
margin-bottom:5px
}

.value{
font-size:14px;
font-weight:bold
}

.confirm{
margin-top:10px;
background:#11161d;
border-radius:10px;
padding:10px;
line-height:2;
font-size:13px
}

.section{
margin-top:10px;
font-weight:bold;
color:#ffd740
}

.green{
color:#00e676
}

.red{
color:#ff5252
}

.yellow{
color:#ffd740
}

.gray{
color:#8b949e
}

.alertBox{
background:#11161d;
border:1px solid #303947;
border-radius:10px;
padding:10px;
margin-top:10px;
line-height:1.8;
font-size:13px
}

.alertOn{
color:#00e676;
font-weight:bold
}

.alertOff{
color:#ff5252;
font-weight:bold
}

@media(max-width:600px){

.grid{
grid-template-columns:1fr 1fr
}

}

</style>

</head>


<body>

<div class="container">


<h1>
📊 اسکنر فیوچرز Bybit
</h1>


<div class="card">


<div class="row">

<input
id="symbol"
value="BTCUSDT"
placeholder="مثلاً BTCUSDT"
>

<button onclick="analyzeSymbol()">
🔎 تحلیل ارز
</button>

<button
class="scan"
onclick="scanMarket()"
>
🚨 اسکن ۲۰۰ ارز
</button>

</div>


<div class="tf">

<span>
۱ دقیقه (1m)
</span>

<span>
۳ دقیقه (3m)
</span>

<span>
۵ دقیقه (5m)
</span>

</div>


<div class="alertBox">

<div>
🔔 هشدار صوتی:
<span
id="alertStatus"
class="alertOn"
>
فعال
</span>
</div>

<div class="row">

<button
id="alertButton"
class="stop"
onclick="toggleAlert()"
>
🔕 قطع هشدار
</button>

</div>

</div>


<div
id="status"
class="status"
>
آماده اسکن Bybit
</div>


</div>


<div class="card">

<div class="top">
🏆 ۱۰ موقعیت برتر
</div>


<div
id="scanInfo"
class="status"
>
۲۰۰ ارز بررسی اولیه نشده است.
</div>


<div id="results">

<div class="empty">
هنوز اسکن انجام نشده.
</div>

</div>

</div>


<div class="card">

<div class="top">
🔎 نتیجه تحلیل دستی
</div>


<div id="manual">

<div class="empty">
یک ارز وارد کن و تحلیل ارز را بزن.
</div>

</div>

</div>


</div>


<script>


const API_BASE = "";


// =================================================
// ALERT
// =================================================

let soundEnabled = true;

let audioContext = null;


function initAudio(){

try{

if(!audioContext){

audioContext =
new (
window.AudioContext ||
window.webkitAudioContext
)();

}

if(
audioContext.state === "suspended"
){
audioContext.resume();
}

}catch(e){}

}


function beep(){

if(!soundEnabled)
return;

try{

initAudio();

const osc =
audioContext.createOscillator();

const gain =
audioContext.createGain();

osc.type = "sine";

osc.frequency.value = 880;

gain.gain.value = 0.15;

osc.connect(gain);

gain.connect(
audioContext.destination
);

osc.start();

setTimeout(
()=>{
osc.frequency.value = 1100;
},
150
);

setTimeout(
()=>{
osc.stop();
},
400
);

}catch(e){}

}


function toggleAlert(){

soundEnabled =
!soundEnabled;

const status =
document.getElementById(
"alertStatus"
);

const button =
document.getElementById(
"alertButton"
);


if(soundEnabled){

status.textContent =
"فعال";

status.className =
"alertOn";

button.textContent =
"🔕 قطع هشدار";

}else{

status.textContent =
"خاموش";

status.className =
"alertOff";

button.textContent =
"🔔 فعال کردن هشدار";

}

}


// =================================================
// FORMAT
// =================================================

function num(v){

if(
v===null ||
v===undefined ||
Number.isNaN(Number(v))
)
return "-";

return Number(v).toLocaleString(
"en-US",
{
maximumFractionDigits:8
}
);

}


function pct(v){

if(
v===null ||
v===undefined ||
Number.isNaN(Number(v))
)
return "-";

return Number(v).toFixed(2)+"%";

}


function trendFA(v){

if(v==="BULLISH")
return "🟢 صعودی (BULLISH)";

if(v==="BEARISH")
return "🔴 نزولی (BEARISH)";

return "🟡 رنج (RANGE)";

}


function slopeFA(v){

if(v==="UP")
return "🟢 صعودی (UP)";

if(v==="DOWN")
return "🔴 نزولی (DOWN)";

return "🟡 خنثی (FLAT)";

}


function structureFA(v){

if(v==="BULLISH")
return "🟢 صعودی (BULLISH)";

if(v==="BEARISH")
return "🔴 نزولی (BEARISH)";

return "⚪ بدون ساختار (NONE)";

}


function fvgFA(v){

if(v==="BULLISH")
return "🟢 صعودی (BULLISH)";

if(v==="BEARISH")
return "🔴 نزولی (BEARISH)";

return "⚪ ندارد (NONE)";

}


function directionFA(v){

if(v==="LONG")
return "🟢 خرید (LONG)";

if(v==="SHORT")
return "🔴 فروش (SHORT)";

return "🟡 انتظار (WAIT)";

}


function scoreClass(score){

if(score>=75)
return "green";

if(score>=55)
return "yellow";

return "gray";

}


// =================================================
// FOOTPRINT
// =================================================

function renderFootprint(fp){

if(!fp){

return `
<div class="empty">
فوت‌پرینت دریافت نشده.
</div>
`;

}


if(fp.error){

return `
<div class="empty">
خطای فوت‌پرینت:
${fp.error}
</div>
`;

}


return `

<div class="section">
👣 فوت‌پرینت واقعی
</div>

<div class="grid">

<div class="box">
<div class="label">
حجم خرید
</div>
<div class="value green">
${num(fp.buyVolume)}
</div>
</div>

<div class="box">
<div class="label">
حجم فروش
</div>
<div class="value red">
${num(fp.sellVolume)}
</div>
</div>

<div class="box">
<div class="label">
دلتا
</div>
<div class="value ${
fp.delta>=0
?"green"
:"red"
}">
${num(fp.delta)}
</div>
</div>

<div class="box">
<div class="label">
دلتا درصد
</div>
<div class="value ${
fp.deltaPercent>=0
?"green"
:"red"
}">
${pct(fp.deltaPercent)}
</div>
</div>

<div class="box">
<div class="label">
نسبت خرید
</div>
<div class="value">
${pct(fp.buyRatio)}
</div>
</div>

<div class="box">
<div class="label">
نسبت فروش
</div>
<div class="value">
${pct(fp.sellRatio)}
</div>
</div>

<div class="box">
<div class="label">
تعداد معاملات
</div>
<div class="value">
${num(fp.trades)}
</div>
</div>

<div class="box">
<div class="label">
معامله بزرگ
</div>
<div class="value ${
fp.largeTrade
?"yellow"
:"gray"
}">
${
fp.largeTrade
?"💥 بله"
:"❌ خیر"
}
</div>
</div>

</div>

<div class="confirm">

<b>
نتیجه Footprint:
</b>
<br>

${
fp.delta>0
?"🟢 فشار خرید بیشتر است"
:fp.delta<0
?"🔴 فشار فروش بیشتر است"
:"🟡 تعادل خرید و فروش"
}

<br>

بزرگ‌ترین معامله:
${num(fp.largeTradeNotional)}

</div>

`;

}


// =================================================
// SIGNAL
// =================================================

function renderSignal(r){

const cls =
r.direction==="LONG"
?"long"
:r.direction==="SHORT"
?"short"
:"wait";


return `

<div class="signal ${cls}">

<div class="header">

<div>

<div class="title">

${directionFA(r.direction)}
&nbsp;
${r.symbol}

</div>

<div class="meta">

تایم‌فریم:
۱ دقیقه / ۳ دقیقه / ۵ دقیقه

</div>

</div>

<div class="score ${
scoreClass(r.score)
}">

${r.score}/100

</div>

</div>


<div class="grid">

<div class="box">
<div class="label">
قیمت فعلی
</div>
<div class="value">
${num(r.price)}
</div>
</div>

<div class="box">
<div class="label">
ورود
</div>
<div class="value">
${num(r.entry)}
</div>
</div>

<div class="box">
<div class="label">
حد ضرر
</div>
<div class="value red">
${num(r.sl)}
</div>
</div>

<div class="box">
<div class="label">
هدف ۱
</div>
<div class="value green">
${num(r.tp1)}
</div>
</div>

<div class="box">
<div class="label">
هدف ۲
</div>
<div class="value green">
${num(r.tp2)}
</div>
</div>

<div class="box">
<div class="label">
هدف ۳
</div>
<div class="value green">
${num(r.tp3)}
</div>
</div>

</div>


<div class="confirm">

<b>
تأییدها:
</b>

${r.confirmations}

<br>

<b>
تایم‌فریم‌های صعودی:
</b>

${r.bullishTimeframes}/3

<br>

<b>
تایم‌فریم‌های نزولی:
</b>

${r.bearishTimeframes}/3

</div>


<div class="confirm">

<div class="section">
📈 وضعیت ۱ دقیقه
</div>

${renderTF(r.timeframes["1"])}

<div class="section">
📈 وضعیت ۳ دقیقه
</div>

${renderTF(r.timeframes["3"])}

<div class="section">
📈 وضعیت ۵ دقیقه
</div>

${renderTF(r.timeframes["5"])}

</div>


${
r.reasons &&
r.reasons.length
?
`

<div class="confirm">

<b>
⚠️ نکات:
</b>

<br>

${r.reasons
.map(x=>`• ${x}`)
.join("<br>")}

</div>

`
:""
}


${renderFootprint(r.footprint)}

</div>

`;

}


// =================================================
// TF
// =================================================

function renderTF(x){

if(!x)
return "❌ اطلاعات دریافت نشد.";

if(x.error)
return "❌ "+x.error;


return `

روند:
${trendFA(x.trend)}

<br>

شیب MA20:
${slopeFA(x.maSlope)}

<br>

MA7:
${num(x.ma7)}

<br>

MA20:
${num(x.ma20)}

<br>

تماس با MA20:
${x.touchMA20?"✅ بله":"❌ خیر"}

<br>

ساختار:
${structureFA(x.structure)}

<br>

FVG:
${fvgFA(x.fvg.type)}

<br>

حجم فعلی:
${num(x.volume.current)}

<br>

میانگین حجم 7:
${num(x.volume.ma7)}

<br>

میانگین حجم 20:
${num(x.volume.ma20)}

<br>

جهش حجم:
${x.volume.spike?"🔥 بله":"❌ خیر"}

`;

}


// =================================================
// GET JSON
// =================================================

async function getJSON(url){

const response =
await fetch(url);

const data =
await response.json();

if(!data.ok){

throw new Error(
data.error ||
data.detail ||
"خطای دریافت اطلاعات"
);

}

return data;

}


// =================================================
// MANUAL ANALYZE
// =================================================

async function analyzeSymbol(){

initAudio();

const symbol =
document
.getElementById("symbol")
.value
.trim()
.toUpperCase();


const manual =
document.getElementById("manual");

const status =
document.getElementById("status");


if(!symbol){

status.textContent =
"❌ نماد را وارد کن.";

return;

}


manual.innerHTML =
`
<div class="empty">
⏳ در حال تحلیل ${symbol}...
</div>
`;


status.textContent =
`⏳ تحلیل ${symbol} در ۱، ۳ و ۵ دقیقه...`;


try{

const data =
await getJSON(
API_BASE+
"/api/analyze?symbol="+
encodeURIComponent(symbol)
);


manual.innerHTML =
renderSignal(data);


status.textContent =
`✅ تحلیل ${symbol} کامل شد.`;


}catch(e){

manual.innerHTML =
`
<div class="empty">
❌ خطا
<br><br>
${e.message}
</div>
`;

status.textContent =
"❌ تحلیل انجام نشد.";

}

}


// =================================================
// SCAN
// =================================================

async function scanMarket(){

initAudio();

const results =
document.getElementById(
"results"
);

const status =
document.getElementById(
"status"
);

const scanInfo =
document.getElementById(
"scanInfo"
);


results.innerHTML =
`
<div class="empty">

⏳ در حال اسکن سریع بازار...

<br>

۲۰۰ ارز بررسی اولیه می‌شوند.

<br>

از بین آنها ۲۰ ارز تحلیل عمیق می‌شوند.

</div>
`;


status.textContent =
"⏳ دریافت و اولویت‌بندی ۲۰۰ ارز Bybit...";


try{

const data =
await getJSON(
API_BASE+"/api/scan"
);


const list =
data.results || [];


scanInfo.innerHTML =
`
۲۰۰ ارز بررسی اولیه شدند.
${data.deepScanned || 20}
ارز تحلیل عمیق شدند.
`;


if(!list.length){

results.innerHTML =
`
<div class="empty">

🟡 فعلاً سیگنال تأییدشده‌ای پیدا نشد.

</div>
`;

}else{

results.innerHTML =
list
.map(renderSignal)
.join("");


if(soundEnabled){

beep();

}

}


status.textContent =
`
✅ اسکن کامل شد —
${list.length}
موقعیت برتر از
${data.deepScanned || 20}
ارز تحلیل عمیق.
`;


}catch(e){

results.innerHTML =
`
<div class="empty">

❌ خطا

<br><br>

${e.message}

</div>
`;

status.textContent =
"❌ اسکن بازار انجام نشد.";

}

}


// =================================================
// AUTO INIT
// =================================================

document.addEventListener(
"click",
initAudio,
{once:true}
);

</script>

</body>

</html>
