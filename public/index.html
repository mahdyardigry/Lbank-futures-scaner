<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تحلیل عمیق Bybit</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#090e14;
color:#edf4ff;
font-family:Tahoma,Arial,sans-serif
}
.wrap{
max-width:1100px;
margin:auto;
padding:14px
}
.top{
display:flex;
gap:8px;
flex-wrap:wrap
}
.input{
flex:1;
min-width:190px;
background:#0e151e;
color:#fff;
border:1px solid #334155;
border-radius:11px;
padding:12px
}
.btn,.tab{
border:0;
border-radius:10px;
padding:11px 15px;
background:#2563eb;
color:#fff;
font-weight:700
}
.card,.item,.box{
background:#111923;
border:1px solid #263446;
border-radius:14px;
margin:9px 0
}
.card,.box,.content{
padding:11px
}
.grid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(210px,1fr));
gap:9px
}
.tabs{
display:flex;
gap:6px;
overflow:auto;
padding:5px 0
}
.tab{
white-space:nowrap;
background:#111923;
border:1px solid #334155
}
.tab.active{
background:#2563eb
}
.item>summary{
cursor:pointer;
padding:12px;
font-weight:700
}
.row{
display:flex;
justify-content:space-between;
gap:10px;
border-bottom:1px solid #263446;
padding:8px 0
}
.green{color:#55e28a}
.red{color:#ff7182}
.yellow{color:#ffd166}
.muted{color:#8fa1b7}
.score{
font-size:28px;
font-weight:800
}
.small{
font-size:12px
}
.bar{
height:7px;
background:#202b38;
border-radius:8px;
overflow:hidden
}
.bar i{
display:block;
height:100%;
background:#3b82f6
}
</style>
</head>

<body>

<div class="wrap">

<h2>🔎 تحلیل عمیق Bybit</h2>

<div class="card">

<div class="top">

<input
id="symbol"
class="input"
placeholder="نام ارز؛ BTC یا BTCUSDT"
>

<button
class="btn"
onclick="analyze()"
>
بررسی
</button>

</div>

<div class="small muted">
نماد به‌صورت خودکار در Spot یا Futures Bybit پیدا می‌شود.
Radar و Pump/Dump وجود ندارد.
</div>

</div>

<div id="summary"></div>

<div id="tabs" class="tabs"></div>

<div id="detail"></div>

</div>

<script>

let data=null;
let timer=null;
let selected='3';

const $=x=>
document.getElementById(x);

const esc=s=>
String(s??'')
.replace(
/[&<>"']/g,
m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[m])
);

const fmt=v=>
v==null||v===''
?'—'
:typeof v==='number'
?(Math.abs(v)>=1000
?v.toLocaleString(
'en-US',
{maximumFractionDigits:4}
)
:v.toFixed(5))
:esc(v);

const cls=d=>
d==='BULLISH'||d==='LONG'
?'green'
:d==='BEARISH'||d==='SHORT'
?'red'
:'yellow';

function summary(){

let d=data;
let m=d.market||{};

return `
<div class="card">

<div class="score ${cls(d.marketState)}">
${esc(d.marketState)} · ${d.score}/100
</div>

<div>
<b>${esc(d.symbol)}</b>
·
${d.category==='linear'
?'Futures'
:'Spot'}
· قیمت
<b>${fmt(d.price)}</b>
</div>

<div class="grid">

<div class="box">
Bid:
<b>${fmt(m.bidPrice)}</b>
<br>
Bid Size:
${fmt(m.bidSize)}
</div>

<div class="box">
Ask:
<b>${fmt(m.askPrice)}</b>
<br>
Ask Size:
${fmt(m.askSize)}
</div>

<div class="box">
Spread:
<b>${fmt(m.spread)}</b>
(${fmt(m.spreadPct)}%)
</div>

<div class="box">
OI:
<b>${fmt(m.openInterest)}</b>
<br>
OI Change:
${fmt(m.openInterestChange)}%
</div>

<div class="box">
Funding:
<b>${fmt(m.fundingRate)}</b>
<br>
24h:
${fmt(m.change24h)}%
</div>

</div>

<div class="small muted">
به‌روزرسانی:
${new Date(
d.generatedAt
).toLocaleTimeString('fa-IR')}
</div>

</div>
`;
}

function styles(st){

return (st.items||[])
.map(i=>`

<details class="item">

<summary>
${esc(i.name)}
—
<span class="${cls(i.direction)}">
${esc(i.direction)}
· ${i.score}/100
</span>
</summary>

<div class="content">

<div class="row">
<span>جهت</span>
<b class="${cls(i.direction)}">
${esc(i.direction)}
</b>
</div>

<div class="row">
<span>امتیاز</span>
<b>${i.score}/100</b>
</div>

<div class="bar">
<i style="width:${i.score}%"></i>
</div>

<pre
class="small"
style="white-space:pre-wrap"
>${esc(
JSON.stringify(
i.details||{},
null,
2
)
)}</pre>

</div>

</details>

`).join('');

}

function tf(x){

let a=x.analysis||{};
let e=x.indicators||{};
let f=x.footprint||{};
let w=x.orderBook||{};
let s=x.supportResistance||{};
let st=x.style||{};
let o=st.overall||{};

return `

<div class="card">

<b>${esc(x.label)}</b>
·
<span class="${cls(o.direction)}">
${esc(o.direction)}
${o.score||0}/100
</span>

<div class="grid">

<div class="box">

<b>MA / Market</b>

<div>
MA7:
${fmt(a.ma7)}
</div>

<div>
MA20:
${fmt(a.ma20)}
</div>

<div>
شیب:
${esc(a.maSlope)}
</div>

<div>
ADX:
${fmt(a.market?.adx)}
</div>

<div>
ATR:
${fmt(a.market?.atrPct)}%
</div>

</div>

<div class="box">

<b>MACD / RSI</b>

<div>
${esc(e.MACD?.direction)}
· Hist
${fmt(e.MACD?.hist)}
</div>

<div>
RSI:
${fmt(e.RSI?.value)}
</div>

</div>

<div class="box">

<b>Ichimoku / Divergence</b>

<div>
${esc(e.ICHIMOKU?.direction)}
</div>

<div>
${esc(e.DIVERGENCE?.type)}
</div>

</div>

<div class="box">

<b>SMC / ICT</b>

<div>
BOS:
${esc(a.bos)}
</div>

<div>
CHoCH:
${esc(a.choch)}
</div>

<div>
FVG:
${esc(a.fvg?.type)}
</div>

<div>
OB:
${esc(a.orderBlock?.type)}
</div>

</div>

</div>

<details class="item">

<summary>
▼ Hunt / Liquidity Sweep
</summary>

<div class="content">

<div class="row">
<span>Hunt</span>
<b class="${cls(a.hunt?.side)}">
${esc(a.hunt?.side)}
${a.hunt?.confirmed?'✓':''}
</b>
</div>

<div class="row">
<span>سطح Hunt</span>
<b>${fmt(a.hunt?.level)}</b>
</div>

<div class="row">
<span>Wick</span>
<b>${fmt(a.hunt?.wickPct)}%</b>
</div>

<div class="row">
<span>حمایت نزدیک</span>
<b>${fmt(s.nearestSupport?.price)}</b>
</div>

<div class="row">
<span>مقاومت نزدیک</span>
<b>${fmt(s.nearestResistance?.price)}</b>
</div>

</div>

</details>

<details class="item">

<summary>
▼ Footprint / Bid / Ask / Delta
</summary>

<div class="content">

<div class="row">
<span>Buy Volume</span>
<b>${fmt(f.buyVolume)}</b>
</div>

<div class="row">
<span>Sell Volume</span>
<b>${fmt(f.sellVolume)}</b>
</div>

<div class="row">
<span>Buy Notional</span>
<b>$${fmt(f.buyNotional)}</b>
</div>

<div class="row">
<span>Sell Notional</span>
<b>$${fmt(f.sellNotional)}</b>
</div>

<div class="row">
<span>Delta</span>

<b class="${
f.delta>0
?'green'
:f.delta<0
?'red'
:'yellow'
}">

${fmt(f.delta)}
(${fmt(f.deltaPercent)}%)

</b>

</div>

<div class="row">
<span>Pressure</span>
<b>${esc(f.pressure)}</b>
</div>

<div class="row">
<span>Trades</span>
<b>${fmt(f.availableTrades)}</b>
</div>

<div class="small muted">
پنجره زمانی:
${fmt(f.windowMinutes)}
دقیقه؛
فقط معاملات واقعی در دسترس Bybit محاسبه شده‌اند.
</div>

</div>

</details>

<details class="item">

<summary>
▼ Order Book / Walls
</summary>

<div class="content">

<div class="row">
<span>Buy Wall</span>
<b>
${fmt(w.buy?.price)}
·
$${fmt(w.buy?.notional)}
</b>
</div>

<div class="row">
<span>Sell Wall</span>
<b>
${fmt(w.sell?.price)}
·
$${fmt(w.sell?.notional)}
</b>
</div>

<div class="row">
<span>Buy Liquidity</span>
<b>
$${fmt(w.buyLiquidity)}
</b>
</div>

<div class="row">
<span>Sell Liquidity</span>
<b>
$${fmt(w.sellLiquidity)}
</b>
</div>

<div class="row">
<span>Buy/Sell Strength</span>
<b>
${fmt(w.buyStrength)}
/
${fmt(w.sellStrength)}
</b>
</div>

</div>

</details>

<details class="item">

<summary>
▼ Support / Resistance
</summary>

<div class="content">

<div class="row">
<span>قوی‌ترین حمایت</span>
<b>
${fmt(s.strongestSupport?.price)}
</b>
</div>

<div class="row">
<span>قوی‌ترین مقاومت</span>
<b>
${fmt(s.strongestResistance?.price)}
</b>
</div>

${
(s.supports||[])
.slice(0,8)
.map(z=>`

<div class="row">

<span>
Support ·
${esc(z.type)}
</span>

<b>
${fmt(z.price)}
·
${fmt(z.distancePct)}%
</b>

</div>

`)
.join('')
}

${
(s.resistances||[])
.slice(0,8)
.map(z=>`

<div class="row">

<span>
Resistance ·
${esc(z.type)}
</span>

<b>
${fmt(z.price)}
·
${fmt(z.distancePct)}%
</b>

</div>

`)
.join('')
}

</div>

</details>

<details class="item">

<summary>
▼ سبک‌های معاملاتی
</summary>

<div class="content">

${styles(st)}

</div>

</details>

</div>
`;
}

function render(){

let ks=
Object.keys(
data.deepByTimeframe||{}
);

if(!ks.includes(selected))
selected=ks[0]||'3';

$('summary').innerHTML=
summary();

$('tabs').innerHTML=
ks.map(k=>`

<button
class="tab ${k===selected?'active':''}"
onclick="
selected='${k}';
render()
"
>
${esc(
data.deepByTimeframe[k].label
)}
</button>

`).join('');

$('detail').innerHTML=
data.deepByTimeframe[selected]
?tf(
data.deepByTimeframe[selected]
)
:'';
}

async function load(s){

let r=
await fetch(
`/api/analyze?symbol=${
encodeURIComponent(s)
}&mode=commercial&strictness=75`
);

let d=await r.json();

if(!d.ok)
throw Error(
d.error||'ارز پیدا نشد'
);

data=d;

render();
}

async function analyze(){

let s=
$('symbol')
.value
.trim();

if(!s)return;

if(timer)
clearInterval(timer);

$('summary').innerHTML=
`
<div class="card">
در حال تحلیل عمیق...
</div>
`;

try{

await load(s);

timer=setInterval(
()=>load(s).catch(()=>{}),
8000
);

}catch(e){

$('summary').innerHTML=
`
<div class="card red">
${esc(e.message)}
</div>
`;

}

}

</script>

</body>
</html>
