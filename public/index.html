<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Bybit Futures Scanner</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0b0f14;
  color:#fff;
  font-family:Arial,Tahoma,sans-serif
}

.container{
  max-width:850px;
  margin:auto;
  padding:15px
}

.card{
  background:#151b23;
  border:1px solid #293241;
  border-radius:14px;
  padding:15px;
  margin-bottom:12px
}

h1{font-size:22px;margin:5px 0 15px}

.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

input,select,button{
  min-height:45px;
  padding:9px 12px;
  border-radius:9px;
  border:1px solid #394555;
  background:#0b0f14;
  color:white;
  font-size:15px
}

input{
  flex:1;
  min-width:150px
}

button{
  background:#238636;
  border:0;
  font-weight:bold;
  cursor:pointer
}

button.scan{
  background:#1976d2
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px
}

.box{
  background:#0b0f14;
  border-radius:10px;
  padding:13px;
  text-align:center
}

.label{
  color:#8b949e;
  font-size:12px;
  margin-bottom:7px
}

.value{
  font-size:16px;
  font-weight:bold
}

.signal{
  text-align:center;
  font-size:20px;
  font-weight:bold;
  padding:18px;
  margin-top:12px;
  background:#0b0f14;
  border-radius:12px
}

.long{color:#00e676}
.short{color:#ff5252}
.wait{color:#ffd740}

.info{
  color:#8b949e;
  font-size:13px;
  line-height:1.8
}

.result{
  background:#0b0f14;
  border:1px solid #293241;
  border-radius:12px;
  padding:13px;
  margin-top:10px
}

.result h3{
  margin:0 0 8px
}

.pricebox{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px
}

.small{
  background:#151b23;
  padding:9px;
  border-radius:8px;
  text-align:center
}

.progress{
  margin-top:10px;
  height:8px;
  background:#222;
  border-radius:10px;
  overflow:hidden
}

.bar{
  height:100%;
  width:0%;
  background:#238636;
  transition:.2s
}

.tf{
  display:inline-block;
  padding:5px 7px;
  margin:2px;
  border-radius:6px;
  background:#151b23;
  font-size:12px
}

hr{
  border:0;
  border-top:1px solid #293241;
  margin:15px 0
}

@media(max-width:500px){
  .grid{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>

<div class="container">

<h1>📊 Bybit Futures Scanner</h1>

<div class="card">

<div class="row">

<input
id="symbol"
value="BTCUSDT"
placeholder="مثلاً BTCUSDT">

<button onclick="analyze()">
🔎 تحلیل
</button>

<button class="scan" onclick="scanMarket()">
🚨 اسکن بازار
</button>

</div>

<p id="status" class="info">
آماده است.
</p>

<div class="progress">
<div id="bar" class="bar"></div>
</div>

</div>

<div id="analysisCard" class="card">

<h3>📌 تحلیل ارز</h3>

<div id="analysis">
هنوز تحلیلی انجام نشده.
</div>

</div>

<div class="card">

<h3>🚨 سیگنال‌های تأیید شده</h3>

<div id="signals">
🟡 هنوز اسکن نشده.
</div>

</div>

</div>


<script>

const WORKER =
"https://soft-flower-2790.29mah12.workers.dev";


const TIMEFRAMES = [
"1",
"3",
"5",
"15",
"30",
"60",
"120",
"240",
"D"
];


function n(v){

  if(v===null || v===undefined || isNaN(v))
    return "-";

  return Number(v).toLocaleString(
    "en-US",
    {maximumFractionDigits:8}
  );
}


function pct(v){

  if(v===null || v===undefined || isNaN(v))
    return "-";

  return Number(v).toFixed(2)+"%";
}


function tfName(tf){

  const names={
    "1":"1m",
    "3":"3m",
    "5":"5m",
    "15":"15m",
    "30":"30m",
    "60":"1h",
    "120":"2h",
    "240":"4h",
    "D":"1D"
  };

  return names[tf] || tf;
}


async function worker(path){

  const url =
    WORKER +
    path;

  const r =
    await fetch(url);

  const text =
    await r.text();

  let data;

  try{
    data=JSON.parse(text);
  }
  catch(e){
    throw new Error(
      "Worker پاسخ JSON نداد: "+
      text.substring(0,150)
    );
  }

  if(!r.ok || data.ok===false){

    throw new Error(
      data.error ||
      data.detail ||
      "Worker Error"
    );

  }

  return data;
}


function setBar(x){

  document.getElementById("bar")
    .style.width=x+"%";

}


function signalClass(signal){

  if(!signal) return "";

  if(signal.includes("LONG"))
    return "long";

  if(signal.includes("SHORT"))
    return "short";

  return "wait";
}


/* =========================
   تحلیل یک ارز
========================= */

async function analyze(){

  const symbol =
    document.getElementById("symbol")
      .value
      .trim()
      .toUpperCase();

  const status =
    document.getElementById("status");

  const box =
    document.getElementById("analysis");


  if(!symbol){

    status.textContent=
      "❌ نماد را وارد کن.";

    return;
  }


  status.textContent=
    "⏳ در حال تحلیل "+symbol+" ...";

  setBar(10);


  try{

    const data =
      await worker(
        "/api/analyze?symbol="+
        encodeURIComponent(symbol)+
        "&interval=15"
      );


    setBar(100);

    showAnalysis(data);

    status.textContent=
      "✅ تحلیل "+symbol+" انجام شد.";

  }
  catch(e){

    console.error(e);

    setBar(0);

    box.innerHTML=
      `<div class="signal short">
      ❌ خطا
      </div>
      <p class="info">${e.message}</p>`;

    status.textContent=
      "❌ "+e.message;

  }

}


/* =========================
   نمایش تحلیل
========================= */

function showAnalysis(data){

  const box =
    document.getElementById("analysis");


  const score =
    data.scores?.final ?? "-";


  const signal =
    data.signal || "WAIT";


  const entry =
    data.entry ??
    data.price ??
    "-";


  const sl =
    data.sl ??
    data.stopLoss ??
    "-";


  const tp1 =
    data.tp1 ?? "-";


  const tp2 =
    data.tp2 ?? "-";


  const tp3 =
    data.tp3 ?? "-";


  let tfHtml="";


  if(data.timeframes){

    for(const tf of TIMEFRAMES){

      const x =
        data.timeframes[tf];

      if(!x) continue;

      let icon="⚪";

      if(x.trend==="BULLISH")
        icon="🟢";

      else if(x.trend==="BEARISH")
        icon="🔴";

      tfHtml +=
        `<span class="tf">
        ${tfName(tf)} ${icon}
        </span>`;

    }

  }


  box.innerHTML=`

  <div class="signal ${signalClass(signal)}">
    ${signal}
  </div>

  <div class="grid">

    <div class="box">
      <div class="label">قیمت</div>
      <div class="value">${n(data.price)}</div>
    </div>

    <div class="box">
      <div class="label">MA7</div>
      <div class="value">${n(data.ma7)}</div>
    </div>

    <div class="box">
      <div class="label">MA20</div>
      <div class="value">${n(data.ma20)}</div>
    </div>

    <div class="box">
      <div class="label">روند</div>
      <div class="value">${data.trend || "-"}</div>
    </div>

    <div class="box">
      <div class="label">ساختار</div>
      <div class="value">${data.structure || "-"}</div>
    </div>

    <div class="box">
      <div class="label">BOS</div>
      <div class="value">${data.bos || "-"}</div>
    </div>

    <div class="box">
      <div class="label">CHoCH</div>
      <div class="value">${data.choch || "-"}</div>
    </div>

    <div class="box">
      <div class="label">FVG</div>
      <div class="value">${data.fvg || "-"}</div>
    </div>

  </div>


  <hr>

  <h3>🎯 ورود و مدیریت معامله</h3>

  <div class="pricebox">

    <div class="small">
      <div class="label">Entry</div>
      <b>${n(entry)}</b>
    </div>

    <div class="small">
      <div class="label">SL</div>
      <b>${n(sl)}</b>
    </div>

    <div class="small">
      <div class="label">TP1</div>
      <b>${n(tp1)}</b>
    </div>

    <div class="small">
      <div class="label">TP2</div>
      <b>${n(tp2)}</b>
    </div>

    <div class="small">
      <div class="label">TP3</div>
      <b>${n(tp3)}</b>
    </div>

    <div class="small">
      <div class="label">Score</div>
      <b>${score}/100</b>
    </div>

  </div>


  <hr>

  <h3>📊 حجم</h3>

  <div class="grid">

    <div class="box">
      <div class="label">Volume</div>
      <div class="value">${n(data.volume)}</div>
    </div>

    <div class="box">
      <div class="label">Volume MA7</div>
      <div class="value">${n(data.volumeMA7)}</div>
    </div>

    <div class="box">
      <div class="label">Volume MA20</div>
      <div class="value">${n(data.volumeMA20)}</div>
    </div>

    <div class="box">
      <div class="label">Volume Spike</div>
      <div class="value">
        ${data.volumeSpike ? "💥 YES":"NO"}
      </div>
    </div>

  </div>


  <hr>

  <h3>🌐 تأیید چندتایم‌فریمی</h3>

  <div>
    ${tfHtml || "-"}
  </div>


  <hr>

  <h3>👣 Footprint</h3>

  <p class="info">
    ${
      data.footprint?.available
      ?
      "✅ Footprint موجود است."
      :
      "⏳ Footprint واقعی در مرحله بعد اضافه می‌شود."
    }
  </p>


  <hr>

  <h3>🧠 دلیل سیگنال</h3>

  <p class="info">
    ${makeReason(data)}
  </p>

  `;

}


function makeReason(data){

  const reasons=[];

  if(data.trend)
    reasons.push("روند: "+data.trend);

  if(data.structure)
    reasons.push("ساختار: "+data.structure);

  if(data.bos && data.bos!=="NONE")
    reasons.push(data.bos);

  if(data.choch && data.choch!=="NONE")
    reasons.push(data.choch);

  if(data.fvg && data.fvg!=="NONE")
    reasons.push("FVG: "+data.fvg);

  if(data.volumeSpike)
    reasons.push("جهش حجم");

  if(data.bullishTimeframes)
    reasons.push(
      "تأیید صعودی "+
      data.bullishTimeframes+
      " از "+
      data.timeframeCount
    );

  if(data.bearishTimeframes)
    reasons.push(
      "تأیید نزولی "+
      data.bearishTimeframes+
      " از "+
      data.timeframeCount
    );

  return reasons.length
    ? reasons.join(" • ")
    : "شرایط کافی برای سیگنال وجود ندارد.";

}


/* =========================
   اسکن بازار
========================= */

async function scanMarket(){

  const status =
    document.getElementById("status");

  const signals =
    document.getElementById("signals");


  signals.innerHTML=
    "⏳ در حال دریافت لیست فیوچرز Bybit...";

  status.textContent=
    "⏳ شروع اسکن بازار...";

  setBar(2);


  try{

    const list =
      await worker("/api/futures");


    const futures =
      list.futures || [];


    if(!futures.length)
      throw new Error(
        "لیست فیوچرز دریافت نشد."
      );


    /*
      قراردادهای غیرمناسب حذف می‌شوند
    */

    const symbols =
      futures
      .filter(s =>
        s.endsWith("USDT") &&
        !s.includes("-") &&
        !s.includes("PERP") &&
        !s.startsWith("1000") &&
        !s.startsWith("10000") &&
        !s.startsWith("1000000")
      )
      .slice(0,50);


    signals.innerHTML="";


    let found=0;


    for(let i=0;i<symbols.length;i++){

      const symbol =
        symbols[i];

      status.textContent =
        `🔎 ${i+1} / ${symbols.length} → ${symbol}`;

      setBar(
        Math.round(
          ((i+1)/symbols.length)*100
        )
      );


      try{

        const data =
          await worker(
            "/api/analyze?symbol="+
            encodeURIComponent(symbol)+
            "&interval=15"
          );


        /*
          فعلاً فقط سیگنال‌های
          قوی نمایش داده می‌شوند.
        */

        const score =
          data.scores?.final || 0;


        const signal =
          data.signal || "";


        const confirmed =
          (
            signal.includes("LONG") ||
            signal.includes("SHORT")
          )
          &&
          score >= 65;


        if(confirmed){

          found++;

          addSignal(
            data,
            found
          );

        }

      }
      catch(e){

        console.log(
          symbol,
          e.message
        );

      }

    }


    if(found===0){

      signals.innerHTML=
        `<div class="signal wait">
        🟡 فعلاً سیگنال تأییدشده پیدا نشد.
        </div>`;

    }


    status.textContent=
      `✅ اسکن تمام شد — ${symbols.length} ارز بررسی شد.`;

    setBar(100);

  }
  catch(e){

    console.error(e);

    signals.innerHTML=
      `<div class="signal short">
      ❌ خطا
      </div>
      <p class="info">${e.message}</p>`;

    status.textContent=
      "❌ "+e.message;

    setBar(0);

  }

}


/* =========================
   کارت سیگنال
========================= */

function addSignal(data,index){

  const box =
    document.getElementById("signals");


  const signal =
    data.signal || "WAIT";


  const score =
    data.scores?.final ?? "-";


  const entry =
    data.entry ??
    data.price ??
    "-";


  const sl =
    data.sl ??
    data.stopLoss ??
    "-";


  const tp1 =
    data.tp1 ?? "-";


  const tp2 =
    data.tp2 ?? "-";


  const tp3 =
    data.tp3 ?? "-";


  const div =
    document.createElement("div");


  div.className="result";


  div.innerHTML=`

    <h3>
      ${index}️⃣
      ${data.symbol || "UNKNOWN"}
    </h3>

    <div class="signal ${signalClass(signal)}">
      ${signal}
    </div>

    <div class="pricebox">

      <div class="small">
        <div class="label">Score</div>
        <b>${score}/100</b>
      </div>

      <div class="small">
        <div class="label">Entry</div>
        <b>${n(entry)}</b>
      </div>

      <div class="small">
        <div class="label">SL</div>
        <b>${n(sl)}</b>
      </div>

      <div class="small">
        <div class="label">TP1</div>
        <b>${n(tp1)}</b>
      </div>

      <div class="small">
        <div class="label">TP2</div>
        <b>${n(tp2)}</b>
      </div>

      <div class="small">
        <div class="label">TP3</div>
        <b>${n(tp3)}</b>
      </div>

    </div>

    <p class="info">

      روند:
      ${data.trend || "-"}

      <br>

      ساختار:
      ${data.structure || "-"}

      <br>

      BOS:
      ${data.bos || "-"}

      <br>

      CHoCH:
      ${data.choch || "-"}

      <br>

      FVG:
      ${data.fvg || "-"}

    </p>

    <button onclick="
      document.getElementById('symbol').value='${data.symbol}';
      analyze();
    ">
      🔎 تحلیل کامل
    </button>

  `;


  box.appendChild(div);

}

</script>

</body>
</html>
