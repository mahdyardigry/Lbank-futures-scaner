<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

<title>Crypto Scanner V13 — Bybit</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#080c12;
  color:#e9eef5;
  font-family:Tahoma,Arial,sans-serif;
}

button,input,select{font-family:inherit}

button{
  cursor:pointer;
  border:0;
  border-radius:9px;
  padding:11px 14px;
  background:#246bfd;
  color:#fff;
  font-weight:bold;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

input,select{
  width:100%;
  background:#080d14;
  border:1px solid #293444;
  color:#fff;
  border-radius:9px;
  padding:11px;
  outline:none;
}

input:focus,select:focus{
  border-color:#4f8cff;
}

.container{
  width:min(1200px,96%);
  margin:auto;
}

header{
  padding:18px 10px;
  text-align:center;
  border-bottom:1px solid #202734;
}

header h1{
  margin:0;
  font-size:24px;
}

header p{
  margin:7px 0 0;
  color:#9aa6b5;
  font-size:13px;
}

.status{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-top:10px;
  padding:6px 12px;
  border-radius:20px;
  background:#101923;
  color:#61e6a7;
  font-size:12px;
}

.panel{
  background:#0d131c;
  border:1px solid #202938;
  border-radius:14px;
  padding:14px;
  margin-top:14px;
}

.panel-title{
  font-size:15px;
  font-weight:bold;
  margin-bottom:12px;
}

.controls{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:9px;
}

label{
  display:block;
  font-size:11px;
  color:#9ca9b9;
  margin-bottom:5px;
}

.market-buttons,
.tf-buttons{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.market-btn,
.tf,
.vol{
  background:#151e2a;
}

.market-btn.active{
  background:#246bfd;
}

.tf{
  min-width:55px;
  padding:9px;
}

.tf.active{
  background:#704dff;
}

.volume-levels{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:5px;
}

.vol{
  padding:9px 2px;
  font-size:12px;
}

.vol.active{
  background:#d77a1c;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.secondary{
  background:#1a2431;
}

.green{
  background:#138a5b;
}

.red{
  background:#a83d4b;
}

.loading{
  text-align:center;
  padding:25px;
  color:#9ba8b8;
}

.error{
  padding:14px;
  border-radius:10px;
  background:#3a171c;
  border:1px solid #72333d;
  color:#ff9da7;
}

.hidden{
  display:none!important;
}

.result-head{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:8px;
}

.metric{
  background:#111923;
  border:1px solid #202b38;
  border-radius:10px;
  padding:11px;
}

.metric-title{
  color:#8f9baa;
  font-size:11px;
}

.metric-value{
  font-size:17px;
  font-weight:bold;
  margin-top:5px;
}

.long{
  color:#48e09a;
}

.short{
  color:#ff6575;
}

.wait{
  color:#ffc857;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:10px;
  margin-top:10px;
}

.card{
  background:#0b1119;
  border:1px solid #202a38;
  border-radius:11px;
  padding:12px;
}

.card h3{
  margin:0 0 10px;
  font-size:14px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:8px;
  padding:6px 0;
  border-bottom:1px solid #17202b;
  font-size:12px;
}

.row:last-child{
  border-bottom:0;
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:12px;
  font-size:10px;
  background:#172230;
}

.badge.green{
  background:#123b2b;
  color:#62e9a8;
}

.badge.red{
  background:#421c23;
  color:#ff7785;
}

.progress{
  height:9px;
  border-radius:20px;
  background:#151d27;
  overflow:hidden;
  margin-top:8px;
}

.progress span{
  display:block;
  height:100%;
  background:#4f8cff;
}

.table-wrap{
  overflow:auto;
  margin-top:10px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:600px;
}

th,td{
  border-bottom:1px solid #202938;
  padding:8px;
  font-size:11px;
  text-align:center;
}

th{
  color:#8f9baa;
  background:#111923;
}

.scan-card{
  border:1px solid #202938;
  background:#0c131c;
  border-radius:12px;
  padding:11px;
}

.scan-top{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:center;
}

.scan-symbol{
  font-weight:bold;
}

.scan-price{
  font-size:12px;
  color:#9aa8b8;
}

.score{
  font-size:18px;
  font-weight:bold;
}

.reason{
  margin-top:10px;
  color:#aab5c3;
  font-size:11px;
  line-height:1.8;
}

.grid-scan{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:9px;
}

.small{
  font-size:11px;
  color:#929eac;
}

.section-space{
  margin-top:12px;
}

@media(max-width:600px){

  .actions{
    grid-template-columns:1fr;
  }

  .volume-levels{
    grid-template-columns:repeat(3,1fr);
  }

  header h1{
    font-size:20px;
  }
}
</style>
</head>


<body>

<header>

<div class="container">

<h1>📊 اسکنر هوشمند بازار</h1>

<p>
تحلیل ساختار، نقدینگی، حجم و جریان سفارش Bybit
</p>

<div class="status" id="status">
🟡 در حال اتصال به Bybit...
</div>

</div>

</header>


<main class="container">


<!-- =========================
     MANUAL ANALYSIS
========================= -->

<section class="panel">

<div class="panel-title">
🔎 بررسی دستی ارز
</div>

<div class="controls">

<div>

<label>نام ارز</label>

<input
id="symbol"
value="BTCUSDT"
placeholder="مثلاً BTCUSDT"

</div>


<div>

<label>بازار</label>

data-market="linear"
onclick="setMarket('linear')">

فیوچرز

<button
class="market-btn"

</div>


<div>

<div class="tf-buttons">

<button
class="tf active"

onclick="setTF('1')">
1m
</button>

<button
class="tf"
data-tf="3"
onclick="setTF('3')">
3m

<button
class="tf"
data-tf="5"
onclick="setTF('5')">
5m
</button>

<button
class="tf"
data-tf="15"
onclick="setTF('15')">
15m
</button>

<button
class="tf"
data-tf="60"
onclick="setTF('60')">

</button>

</div>

</div>

</div>


<div class="section-space">

</label>

<div class="volume-levels">

<button
class="vol"
data-vol="1"
onclick="setVolume(1)">
1
</button>

<button
class="vol"
data-vol="2"
onclick="setVolume(2)">
2
</button>

<button
class="vol active"
data-vol="3"
onclick="setVolume(3)">
3
</button>

<button
class="vol"
data-vol="4"
onclick="setVolume(4)">
4
</button>

<button
class="vol"
data-vol="5"
onclick="setVolume(5)">
5
</button>

<button
class="vol"
data-vol="6"
onclick="setVolume(6)">
6
</button>

</div>

</div>


<div class="actions">

<button onclick="analyzeManual()">
🔍 بررسی ارز
</button>

class="secondary"

<!-- =========================

========================= -->

<section class="panel">

<div class="panel-title">
🚨 اسکن بازار
</div>

<div class="controls">

<div>

<label>بازار اسکن</label>

<select id="scanMarket">

<option value="linear">
فیوچرز
</option>

<option value="spot">
اسپات
</option>

</select>

</div>


<div>

<label>تایم‌فریم اسکن</label>

<select id="scanTF">

<option value="1">1 دقیقه</option>
<option value="3">3 دقیقه</option>

class="green"

========================= -->

<section
id="resultSection"

</section>

========================= -->

<section
id="scanSection"
class="panel hidden">

<div class="panel-title">
🚨 نتایج اسکن
</div>

<div id="scanResult"></div>

</section>


</main>



<script>

/* =====================================================
   WORKER URL
===================================================== */

const WORKER_URL =
"https://soft-flower-2790.29mah12.workers.dev";


let market = "linear";
let timeframe = "1";
let volumeLevel = 3;


/* =====================================================
   BASIC HELPERS
===================================================== */

function $(id){
  return document.getElementById(id);
}


function money(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){
    return "-";
  }

  const n = Number(value);

  if(!Number.isFinite(n)){
    return "-";
  }

  if(n >= 1000){

    return n.toLocaleString(
      "en-US",
      {
        maximumFractionDigits:2
      }
    );
  }

  if(n >= 1){

    return n.toLocaleString(
      "en-US",
      {
        maximumFractionDigits:6
      }
    );
  }

  return n.toLocaleString(
    "en-US",
    {
      maximumSignificantDigits:8
    }
  );
}


function pct(value){

  const n = Number(value);

  if(!Number.isFinite(n)){
    return "-";
  }

  return n.toFixed(2) + "%";
}


function cls(direction){

  if(
    String(direction)
      .toUpperCase()
      .includes("LONG")
  ){
    return "long";
  }

  if(
    String(direction)
      .toUpperCase()
      .includes("SHORT")
  ){
    return "short";
  }

  return "wait";
}


function row(label,value){

  return `
    <div class="row">
      <span>${label}</span>
      <strong>${value ?? "-"}</strong>
    </div>
  `;
}


function yesNo(value){

  return value
    ? `<span class="badge green">بله</span>`
    : `<span class="badge">خیر</span>`;
}


function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* =====================================================
   MARKET
===================================================== */

function setMarket(value){

  market = value;

  document
    .querySelectorAll(".market-btn")
    .forEach(btn => {

      btn.classList.toggle(
        "active",
        btn.dataset.market === value
      );

    });
}


/* =====================================================
   TIMEFRAME
===================================================== */

function setTF(value){

  timeframe = value;

  document
    .querySelectorAll(".tf")
    .forEach(btn => {

      btn.classList.toggle(
        "active",
        btn.dataset.tf === value
      );

    });
}


/* =====================================================
   VOLUME LEVEL
===================================================== */

function setVolume(value){

  volumeLevel = Number(value);

  document
    .querySelectorAll(".vol")
    .forEach(btn => {

      btn.classList.toggle(
        "active",
        Number(btn.dataset.vol) === volumeLevel
      );

    });
}


/* =====================================================
   WORKER API
===================================================== */

async function api(path){

  const response =
    await fetch(
      WORKER_URL + path,
      {
        method:"GET",
        cache:"no-store",
        headers:{
          "Accept":"application/json"
        }
      }
    );

  const text =
    await response.text();

  let data;

  try{
    data = JSON.parse(text);
  }
  catch{

    throw new Error(
      "پاسخ Worker معتبر نیست: " +
      text.slice(0,200)
    );
  }


  if(
    !response.ok ||
    data.ok === false
  ){

    throw new Error(
      data.error ||
      data.message ||
      "خطای Worker"
    );
  }

  return data;
}


/* =====================================================
   HEALTH CHECK
===================================================== */

async function health(){

  try{

    const data =
      await api("/health");

    $("status").textContent =
      "🟢 اتصال برقرار است — " +
      (
        data.exchange ||
        "Bybit"
      );

  }
  catch(error){

    console.error(error);

    $("status").textContent =
      "🔴 Worker پاسخ نمی‌دهد";

  }
}


health();


/* =====================================================
   MANUAL ANALYSIS
===================================================== */

async function analyzeManual(){

  const symbol =
    $("symbol")
      .value
      .trim()
      .toUpperCase()
      .replace(
        /[^A-Z0-9]/g,
        ""
      );


  if(!symbol){

    alert(
      "نام ارز را وارد کن"
    );

    return;
  }


  $("symbol").value =
    symbol;


  $("resultSection")
    .classList
    .remove("hidden");


  $("result").innerHTML = `
    <div class="loading">

      ⏳ در حال دریافت اطلاعات
      ${escapeHtml(symbol)}
      از Bybit...

      <br><br>

      بازار:
      ${market === "linear" ? "فیوچرز" : "اسپات"}

      —

      تایم‌فریم:
      ${timeframe}m

    </div>
  `;


  try{

    const query =
      "?category=" +
      encodeURIComponent(market) +

      "&symbol=" +
      encodeURIComponent(symbol) +

      "&interval=" +
      encodeURIComponent(timeframe) +

      "&volumeLevel=" +
      encodeURIComponent(volumeLevel);


    const data =
      await api(
        "/api/analyze" +
        query
      );


    renderAnalysis(data);

  }
  catch(error){

    console.error(error);

    $("result").innerHTML = `
      <div class="error">

        ❌ خطا در تحلیل

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>
    `;

  }

}


/* =====================================================
   ANALYSIS RENDER
===================================================== */

function renderAnalysis(data){

  const s =
    data.signal || {};

  const t =
    data.ticker || {};

  const v =
    data.volume || {};

  const st =
    data.structure || {};

  const h =
    data.hunt || {};

  const ob =
    data.orderbook || {};

  const fp =
    data.footprint || {};

  const oi =
    data.openInterest || {};

  const funding =
    data.funding || {};

  const sr =
    data.supportResistance || {};

  const regime =
    data.regime || {};


  const indicators =
    data.indicators || {};


  let html = `

  <div class="result-head">

    ${metric(
      "نماد",
      data.market?.symbol ||
      data.symbol ||
      "-"
    )}

    ${metric(
      "قیمت",
      money(t.lastPrice)
    )}

    ${metric(
      "تغییر ۲۴ ساعت",
      `<span class="${
        Number(t.change24h) >= 0
        ? "long"
        : "short"
      }">
        ${pct(t.change24h)}
      </span>`
    )}

    ${metric(
      "سیگنال",
      `<span class="${cls(s.direction)}">
        ${s.direction || "WAIT"}
      </span>`
    )}

    ${metric(
      "قدرت",
      s.strength || "-"
    )}

    ${metric(
      "امتیاز",
      s.score ?? "-"
    )}

    ${metric(
      "اطمینان",
      s.confidence != null
        ? s.confidence + "%"
        : "-"
    )}

    ${metric(
      "وضعیت بازار",
      regime.regime || "-"
    )}

  </div>


  <div class="cards">


    <!-- INDICATORS -->

    <div class="card">

      <h3>📈 اندیکاتورها</h3>

      ${row(
        "MA 7",
        money(indicators.ma7)
      )}

      ${row(
        "MA 20",
        money(indicators.ma20)
      )}

      ${row(
        "RSI",
        money(indicators.rsi)
      )}

      ${row(
        "MACD",
        money(
          indicators.macd?.macd
        )
      )}

      ${row(
        "Signal",
        money(
          indicators.macd?.signal
        )
      )}

      ${row(
        "Histogram",
        money(
          indicators.macd?.histogram
        )
      )}

      ${row(
        "Ichimoku",
        indicators.ichimoku?.signal ||
        indicators.ichi?.signal ||
        "-"
      )}

      ${row(
        "Divergence",
        indicators.divergence ||
        "-"
      )}

    </div>


    <!-- VOLUME -->

    <div class="card">

      <h3>
        🔥 Volume —
        سطح ${v.level || volumeLevel}
      </h3>

      ${row(
        "حجم فعلی",
        money(v.current)
      )}

      ${row(
        "میانگین ۲۰",
        money(v.average20)
      )}

      ${row(
        "Volume Ratio",
        v.ratio != null
        ? Number(v.ratio).toFixed(2) + "x"
        : "-"
      )}

      ${row(
        "قوی",
        yesNo(v.strong)
      )}

      ${row(
        "خیلی قوی",
        yesNo(v.veryStrong)
      )}

      ${row(
        "Extreme",
        yesNo(v.extreme)
      )}

      ${row(
        "Ultra",
        yesNo(v.ultra)
      )}

    </div>


    <!-- STRUCTURE -->

    <div class="card">

      <h3>
        🏗 ساختار بازار
      </h3>

      ${row(
        "Trend",
        st.trend || "-"
      )}

      ${row(
        "BOS",
        st.bos
        ? (
          st.bosDirection ||
          "YES"
        )
        : "ندارد"
      )}

      ${row(
        "CHoCH",
        st.choch
        ? (
          st.chochDirection ||
          "YES"
        )
        : "ندارد"
      )}

      ${row(
        "Swing High",
        money(st.swingHigh)
      )}

      ${row(
        "Swing Low",
        money(st.swingLow)
      )}

    </div>


    <!-- HUNT -->

    <div class="card">

      <h3>
        🎯 Hunt / Liquidity Sweep
      </h3>

      ${row(
        "وضعیت",
        h.detected
        ? `<span class="badge green">
             شناسایی شد
           </span>`
        : "شناسایی نشد"
      )}

      ${row(
        "نوع",
        h.type || "-"
      )}

      ${row(
        "سطح",
        money(h.level)
      )}

      ${row(
        "قدرت",
        h.strength != null
        ? Number(
            h.strength
          ).toFixed(1)
        : "-"
      )}

    </div>


    <!-- FOOTPRINT -->

    <div class="card">

      <h3>
        👣 Footprint / Delta
      </h3>

      ${row(
        "Buy Volume",
        money(
          fp.buy ??
          fp.buyVolume
        )
      )}

      ${row(
        "Sell Volume",
        money(
          fp.sell ??
          fp.sellVolume
        )
      )}

      ${row(
        "Delta",
        money(
          fp.delta
        )
      )}

      ${row(
        "Buy %",
        pct(
          fp.buyPercent
        )
      )}

      ${row(
        "Sell %",
        pct(
          fp.sellPercent
        )
      )}

    </div>


    <!-- ORDER BOOK -->

    <div class="card">

      <h3>
        📚 Order Book
      </h3>

      ${row(
        "Bid",
        money(
          ob.bidTotal
        )
      )}

      ${row(
        "Ask",
        money(
          ob.askTotal
        )
      )}

      ${row(
        "Imbalance",
        ob.imbalance != null
        ? Number(
            ob.imbalance
          ).toFixed(4)
        : "-"
      )}

      ${row(
        "Bid Walls",
        ob.bidWalls?.length ||
        0
      )}

      ${row(
        "Ask Walls",
        ob.askWalls?.length ||
        0
      )}

    </div>


    <!-- OI -->

    <div class="card">

      <h3>
        💰 Open Interest
      </h3>

      ${row(
        "وضعیت",
        oi.supported === false
        ? "موجود نیست"
        : "فعال"
      )}

      ${row(
        "OI",
        money(oi.current)
      )}

      ${row(
        "تغییر",
        pct(oi.change)
      )}

    </div>


    <!-- FUNDING -->

    <div class="card">

      <h3>
        💵 Funding
      </h3>

      ${row(
        "وضعیت",
        funding.supported === false
        ? "موجود نیست"
        : "فعال"
      )}

      ${row(
        "Funding Rate",
        funding.rate != null
        ? Number(
            funding.rate
          ).toFixed(6)
        : "-"
      )}

    </div>


    <!-- SUPPORT RESISTANCE -->

    <div class="card">

      <h3>
        🧱 حمایت / مقاومت
      </h3>

      ${row(
        "قیمت",
        money(
          sr.price ||
          t.lastPrice
        )
      )}

      ${row(
        "Support",
        money(sr.support)
      )}

      ${row(
        "Resistance",
        money(sr.resistance)
      )}

      ${row(
        "فاصله Support",
        pct(
          sr.distanceToSupport
        )
      )}

      ${row(
        "فاصله Resistance",
        pct(
          sr.distanceToResistance
        )
      )}

    </div>


  </div>


  <!-- LONG SHORT -->

  <div class="card section-space">

    <h3>
      ⚖️ قدرت Long / Short
    </h3>

    ${row(
      "Long",
      s.long ?? 0
    )}

    <div class="progress">
      <span style="
        width:${Math.min(
          100,
          Math.max(
            0,
            Number(s.long || 0)
          )
        )}%
      "></span>
    </div>


    ${row(
      "Short",
      s.short ?? 0
    )}

    <div class="progress">
      <span style="
        width:${Math.min(
          100,
          Math.max(
            0,
            Number(s.short || 0)
          )
        )}%
      "></span>
    </div>

  </div>


  <!-- REASONS -->

  <div class="card section-space">

    <h3>
      🧠 دلایل سیگنال
    </h3>

    <div class="reason">

      ${
        Array.isArray(s.reasons)
        ? s.reasons
          .map(
            x =>
              "• " +
              escapeHtml(x)
          )
          .join("<br>")
        : (
          s.reason ||
          "دلیل خاصی ثبت نشده"
        )
      }

    </div>

  </div>


  <!-- FVG -->

  <div class="card section-space">

    <h3>
      🟦 FVG
    </h3>

    ${renderFVG(
      Array.isArray(data.fvg)
      ? data.fvg
      : []
    )}

  </div>


  <!-- ORDER BLOCK -->

  <div class="card section-space">

    <h3>
      🟪 Order Block
    </h3>

    ${renderOB(
      Array.isArray(
        data.orderBlocks
      )
      ? data.orderBlocks
      : []
    )}

  </div>


  <!-- WALLS -->

  <div class="card section-space">

    <h3>
      🧱 دیوارهای سفارش
    </h3>

    ${renderWalls(ob)}

  </div>


  <!-- FOOTPRINT LEVELS -->

  <div class="card section-space">

    <h3>
      👣 Footprint Price Levels
    </h3>

    ${renderFootprint(
      Array.isArray(fp.levels)
      ? fp.levels
      : []
    )}

  </div>

  `;


  $("result").innerHTML =
    html;
}


/* =====================================================
   METRIC
===================================================== */

function metric(title,value){

  return `
    <div class="metric">

      <div class="metric-title">
        ${title}
      </div>

      <div class="metric-value">
        ${value}
      </div>

    </div>
  `;
}


/* =====================================================
   FVG
===================================================== */

function renderFVG(list){

  if(!list.length){

    return `
      <div class="small">
        FVG مهمی پیدا نشد.
      </div>
    `;
  }


  return `
    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>نوع</th>
            <th>Low</th>
            <th>High</th>
            <th>Index</th>
          </tr>

        </thead>

        <tbody>

          ${
            list
              .slice(-10)
              .reverse()
              .map(x => `

                <tr>

                  <td class="${
                    x.type === "bullish"
                    ? "long"
                    : "short"
                  }">
                    ${escapeHtml(
                      x.type || "-"
                    )}
                  </td>

                  <td>
                    ${money(x.low)}
                  </td>

                  <td>
                    ${money(x.high)}
                  </td>

                  <td>
                    ${x.index ?? "-"}
                  </td>

                </tr>

              `)
              .join("")
          }

        </tbody>

      </table>

    </div>
  `;
}

   ORDER BLOCK

  if(!list.length){

/* =====================================================
   ORDER BOOK WALLS
===================================================== */

function renderWalls(ob){

  const bids =
    Array.isArray(
      ob.bidWalls
    )
    ? ob.bidWalls
    : [];

  const asks =
    Array.isArray(
      ob.askWalls
    )
    ? ob.askWalls
    : [];


  if(
    !bids.length &&
    !asks.length
  ){

    return `
      <div class="small">
        دیوار قابل‌توجهی پیدا نشد.
      </div>
    `;
  }


  return `
    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>سمت</th>
            <th>قیمت</th>
            <th>حجم</th>
            <th>ارزش تقریبی</th>
          </tr>

        </thead>

        <tbody>

          ${
            bids
              .slice(0,10)
              .map(x => `

                <tr>

                  <td class="long">
                    BUY WALL
                  </td>

                  <td>
                    ${money(x.price)}
                  </td>

                  <td>
                    ${money(x.size)}
                  </td>

                  <td>
                    ${money(
                      Number(x.price || 0) *
                      Number(x.size || 0)
                    )}
                  </td>

                </tr>

              `)
              .join("")
          }


          ${
            asks
              .slice(0,10)
              .map(x => `

                <tr>

                  <td class="short">
                    SELL WALL
                  </td>

                  <td>
                    ${money(x.price)}
                  </td>

                  <td>
                    ${money(x.size)}
                  </td>

                  <td>
                    ${money(
                      Number(x.price || 0) *
                      Number(x.size || 0)
                    )}
                  </td>

                </tr>

              `)
              .join("")
          }

        </tbody>

      </table>

    </div>
  `;
}


/* =====================================================
   FOOTPRINT
===================================================== */

function renderFootprint(list){

  if(!list.length){

    return `
      <div class="small">
        اطلاعات Footprint در پاسخ Worker موجود نیست.
      </div>
    `;
  }


  return `
    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>Price</th>
            <th>Buy</th>
            <th>Sell</th>
            <th>Delta</th>
          </tr>

        </thead>

        <tbody>

          ${
            list
              .slice(0,40)
              .map(x => `

                <tr>

                  <td>
                    ${money(x.price)}
                  </td>

                  <td class="long">
                    ${money(x.buy)}
                  </td>

                  <td class="short">
                    ${money(x.sell)}
                  </td>

                  <td class="${
                    Number(x.delta) >= 0
                    ? "long"
                    : "short"
                  }">
                    ${money(x.delta)}
                  </td>

                </tr>

              `)
              .join("")
          }

        </tbody>

      </table>

    </div>
  `;
}


/* =====================================================
   MARKET SCANNER
===================================================== */

async function scanMarket(){

  $("scanSection")
    .classList
    .remove("hidden");


  $("scanResult").innerHTML = `
    <div class="loading">

      ⏳ در حال اسکن بازار Bybit...

      <br><br>

      لطفاً چند ثانیه صبر کن.

    </div>
  `;


  const scanMarket =
    $("scanMarket").value;

  const scanTF =
    $("scanTF").value;

  const scanVolume =
    $("scanVolume").value;


  try{

    const query =
      "?category=" +
      encodeURIComponent(
        scanMarket
      ) +

      "&interval=" +
      encodeURIComponent(
        scanTF
      ) +

      "&volumeLevel=" +
      encodeURIComponent(
        scanVolume
      );


    const data =
      await api(
        "/api/scan" +
        query
      );


    renderScan(data);

  }
  catch(error){

    console.error(error);

    $("scanResult").innerHTML = `
      <div class="error">

        ❌ خطا در اسکن بازار

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>
    `;
  }

}


/* =====================================================
   SCAN RESULT
===================================================== */

function renderScan(data){

  const results =
    Array.isArray(data.results)
    ? data.results
    : [];


  if(!results.length){

    $("scanResult").innerHTML = `
      <div class="small">

        نتیجه‌ای با شرایط فعلی پیدا نشد.

      </div>
    `;

    return;
  }


  $("scanResult").innerHTML = `

    <div class="small"
      style="margin-bottom:10px">

      ${
        data.scanned ??
        results.length
      }

      ارز بررسی شد.

    </div>


    <div class="grid-scan">

      ${
        results
          .map(x => `

            <div class="scan-card">

              <div class="scan-top">

                <div>

                  <div class="scan-symbol">
                    ${escapeHtml(
                      x.symbol ||
                      "-"
                    )}
                  </div>

                  <div class="scan-price">
                    ${money(
                      x.price
                    )}
                  </div>

                </div>


                <div class="
                  score
                  ${cls(
                    x.direction
                  )}
                ">

                  ${x.score ?? 0}

                </div>

              </div>


              ${row(
                "Signal",
                `<span class="${cls(
                  x.direction
                )}">
                  ${x.direction || "-"}
                </span>`
              )}


              ${row(
                "قدرت",
                x.strength || "-"
              )}


              ${row(
                "Long / Short",
                `
                <span class="long">
                  ${x.long ?? 0}
                </span>
                /
                <span class="short">
                  ${x.short ?? 0}
                </span>
                `
              )}


              ${row(
                "تغییر ۲۴h",
                `<span class="${
                  Number(x.change24h) >= 0
                  ? "long"
                  : "short"
                }">
                  ${pct(x.change24h)}
                </span>`
              )}


              ${row(
                "Volume Ratio",
                x.volumeRatio != null
                ? Number(
                    x.volumeRatio
                  ).toFixed(2) + "x"
                : "-"
              )}


              ${row(
                "OI",
                pct(
                  x.oiChange
                )
              )}


              ${row(
                "Footprint Delta",
                `<span class="${
                  Number(
                    x.footprintDelta
                  ) >= 0
                  ? "long"
                  : "short"
                }">
                  ${money(
                    x.footprintDelta
                  )}
                </span>`
              )}


              ${row(
                "Order Book",
                x.orderbookImbalance != null
                ? Number(
                    x.orderbookImbalance
                  ).toFixed(3)
                : "-"
              )}


              <div class="reason">

                ${
                  x.hunt?.detected
                  ? "🎯 Hunt شناسایی شد<br>"
                  : ""
                }

                ${
                  x.fvg
                  ? "🟦 FVG: " +
                    escapeHtml(
                      x.fvg.type ||
                      "-"
                    ) +
                    "<br>"
                  : ""
                }

                ${
                  x.regime
                  ? "📊 Regime: " +
                    escapeHtml(
                      x.regime
                    )
                  : ""
                }

              </div>

            </div>

          `)
          .join("")
      }

    </div>
  `;
}

  $("resultSection")

  $("result").innerHTML = "";

  $("scanResult").innerHTML = "";
