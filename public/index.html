<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bybit Smart Money Scanner</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:#0b1017;
  color:#e8eef7;
  font-family:Tahoma,Arial,sans-serif
}

body{
  min-height:100vh
}

.container{
  width:min(1200px,100%);
  margin:auto;
  padding:14px
}

header{
  background:#111923;
  border:1px solid #263342;
  border-radius:16px;
  padding:16px;
  margin-bottom:12px
}

h1{
  margin:0 0 6px;
  font-size:23px
}

.sub{
  color:#93a4b8;
  font-size:13px
}

.status{
  display:inline-flex;
  align-items:center;
  gap:7px;
  margin-top:10px;
  padding:7px 10px;
  border-radius:10px;
  background:#0d1720;
  font-size:12px
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#41e58a
}

.controls{
  display:grid;
  grid-template-columns:
    minmax(180px,1fr)
    auto
    auto
    auto;
  gap:8px;
  margin-bottom:12px
}

input,select,button{
  min-height:43px;
  border-radius:10px;
  border:1px solid #304052;
  background:#0d151e;
  color:#fff;
  padding:9px 12px;
  font:inherit
}

button{
  background:#1769e8;
  border-color:#1769e8;
  font-weight:700;
  cursor:pointer
}

button.secondary{
  background:#172230;
  border-color:#304052
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));
  gap:10px
}

.card{
  background:#111923;
  border:1px solid #263342;
  border-radius:14px;
  padding:13px
}

.card h3{
  margin:0 0 10px;
  font-size:15px
}

.big{
  font-size:27px;
  font-weight:800
}

.green{color:#49e58b}
.red{color:#ff667b}
.yellow{color:#ffd166}
.muted{color:#91a2b5}

.section{
  margin-top:12px
}

details{
  background:#111923;
  border:1px solid #263342;
  border-radius:13px;
  margin:8px 0;
  overflow:hidden
}

summary{
  cursor:pointer;
  padding:12px;
  font-weight:700
}

.content{
  padding:12px;
  border-top:1px solid #263342
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:8px 0;
  border-bottom:1px solid #202b38
}

.row:last-child{
  border-bottom:0
}

.table{
  width:100%;
  border-collapse:collapse;
  font-size:12px
}

.table th,
.table td{
  padding:8px;
  border-bottom:1px solid #263342;
  text-align:center
}

.signal{
  padding:12px;
  border-radius:12px;
  background:#0c141d;
  border:1px solid #263342;
  margin:7px 0
}

.scorebar{
  height:9px;
  background:#202c39;
  border-radius:20px;
  overflow:hidden;
  margin-top:8px
}

.scorebar>div{
  height:100%;
  background:#2381ff
}

.notice{
  padding:10px;
  border-radius:10px;
  background:#172230;
  color:#b7c5d6;
  font-size:12px
}

@media(max-width:700px){
  .controls{
    grid-template-columns:1fr 1fr
  }

  .controls input{
    grid-column:1/-1
  }
}

@media(max-width:430px){
  .controls{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>

<div class="container">

<header>

<h1>📊 اسکنر هوشمند بازار Bybit</h1>

<div class="sub">
تحلیل ساختار، نقدینگی، حجم و جریان سفارش
</div>

<div class="status">
<span class="dot"></span>
<span id="status">در حال اتصال به Bybit...</span>
</div>

</header>


<div class="controls">

<input
 id="symbol"
 placeholder="نام ارز؛ مثال BTCUSDT"
 autocomplete="off"
>

<button onclick="manualAnalyze()">
🔎 بررسی
</button>

<select id="category">

<option value="auto">
بازار خودکار
</option>

<option value="linear">
فیوچرز
</option>

<option value="spot">
اسپات
</option>

</select>

<button
 class="secondary"
 onclick="scanNow()"
>
🔄 اسکن بازار
</button>

</div>


<div class="notice">
در اسکن بازار، ارزها به‌صورت چرخشی بررسی می‌شوند.
حجم ۲۴ ساعته معیار اصلی انتخاب سیگنال نیست.
</div>


<div
 id="summary"
 class="section"
></div>


<div
 id="results"
 class="section"
></div>

</div>


<script>

const $=id=>
  document.getElementById(id);


let scanOffset=0;
let scanning=false;


function fmt(v){

  if(v===undefined ||
     v===null ||
     v==='')
    return '—';

  if(typeof v==='number'){

    return v.toLocaleString(
      'fa-IR',
      {
        maximumFractionDigits:6
      }
    );
  }

  return String(v);
}


function esc(s){

  return String(s??'')
    .replace(
      /[&<>"']/g,
      m=>({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[m])
    );
}


function dirText(d){

  return {
    LONG:'Long',
    SHORT:'Short',
    WAIT:'انتظار',
    BULLISH:'صعودی',
    BEARISH:'نزولی',
    NONE:'ندارد',
    UP:'صعودی',
    DOWN:'نزولی',
    FLAT:'خنثی',
    NEUTRAL:'خنثی'
  }[d] || d || '—';
}


function cls(d){

  if(
    d==='LONG' ||
    d==='BULLISH' ||
    d==='UP'
  )
    return 'green';

  if(
    d==='SHORT' ||
    d==='BEARISH' ||
    d==='DOWN'
  )
    return 'red';

  return 'yellow';
}


async function health(){

  try{

    const r=
      await fetch(
        '/api/health',
        {
          cache:'no-store'
        }
      );

    const d=
      await r.json();

    if(d.ok){

      $('status').textContent=
        'اتصال برقرار است — Bybit';

    }else{

      $('status').textContent=
        'خطا در Worker';

    }

  }catch(e){

    $('status').textContent=
      'اتصال برقرار نیست';

  }
}


function renderSummary(d){

  const score=
    Number(d.score||0);

  $('summary').innerHTML=`

  <div class="grid">

    <div class="card">

      <h3>نماد</h3>

      <div class="big">
        ${esc(d.symbol)}
      </div>

      <div class="muted">
        ${
          d.category==='linear'
            ? 'فیوچرز'
            : d.category==='spot'
              ? 'اسپات'
              : '—'
        }
      </div>

    </div>


    <div class="card">

      <h3>جهت کلی</h3>

      <div
        class="big ${cls(
          d.direction
        )}"
      >
        ${dirText(d.direction)}
      </div>

      <div>
        امتیاز:
        ${fmt(score)}/100
      </div>

    </div>


    <div class="card">

      <h3>Long</h3>

      <div
        class="big green"
      >
        ${fmt(d.longScore)}
      </div>

    </div>


    <div class="card">

      <h3>Short</h3>

      <div
        class="big red"
      >
        ${fmt(d.shortScore)}
      </div>

    </div>

  </div>

  `;
}


function renderReasons(reasons){

  if(!Array.isArray(reasons) ||
     !reasons.length)
    return `
      <div class="muted">
        دلیل مشخصی برای سیگنال ثبت نشده است.
      </div>
    `;

  return reasons
    .slice(0,30)
    .map(
      x=>`

      <div class="signal">

        <b class="${cls(
          x.side
        )}">
          ${esc(x.side)}
        </b>

        <div>
          ${esc(x.text)}
        </div>

      </div>

      `
    )
    .join('');
}


function renderTimeframe(
  key,
  x
){

  if(!x)
    return '';

  if(x.error){

    return `
    <details>
      <summary>
        تایم‌فریم ${esc(key)}
      </summary>

      <div class="content red">
        ${esc(x.error)}
      </div>

    </details>
    `;
  }

  const m=x.macd||{};
  const i=x.ichimoku||{};
  const dv=x.divergence||{};
  const v=x.volume||{};
  const h=x.hunt||{};
  const f=x.fvg||{};
  const ob=x.orderBlock||{};

  return `

  <details>

    <summary>
      تایم‌فریم ${esc(key)}
      —
      <span class="${cls(
        x.trend
      )}">
        ${dirText(x.trend)}
      </span>
    </summary>

    <div class="content">

      <div class="grid">

        <div class="card">

          <h3>MA</h3>

          <div class="row">
            <span>MA7</span>
            <b>${fmt(x.ma7)}</b>
          </div>

          <div class="row">
            <span>MA20</span>
            <b>${fmt(x.ma20)}</b>
          </div>

          <div class="row">
            <span>شیب MA</span>
            <b class="${cls(
              x.maSlope
            )}">
              ${dirText(x.maSlope)}
            </b>
          </div>

        </div>


        <div class="card">

          <h3>MACD / RSI</h3>

          <div class="row">
            <span>MACD</span>
            <b class="${cls(
              m.direction
            )}">
              ${dirText(
                m.direction
              )}
            </b>
          </div>

          <div class="row">
            <span>Histogram</span>
            <b>${fmt(
              m.histogram
            )}</b>
          </div>

          <div class="row">
            <span>RSI</span>
            <b>${fmt(
              x.rsi
            )}</b>
          </div>

        </div>


        <div class="card">

          <h3>Ichimoku</h3>

          <div class="row">

            <span>جهت</span>

            <b class="${cls(
              i.direction
            )}">
              ${dirText(
                i.direction
              )}
            </b>

          </div>

          <div class="row">
            <span>Tenkan</span>
            <b>${fmt(
              i.tenkan
            )}</b>
          </div>

          <div class="row">
            <span>Kijun</span>
            <b>${fmt(
              i.kijun
            )}</b>
          </div>

        </div>


        <div class="card">

          <h3>واگرایی</h3>

          <div class="big ${
            cls(dv.side)
          }">

            ${esc(
              dv.type ||
              'NONE'
            )}

          </div>

        </div>


        <div class="card">

          <h3>حجم</h3>

          <div class="row">
            <span>نسبت حجم</span>
            <b>${fmt(
              v.ratio
            )}</b>
          </div>

          <div class="row">
            <span>وضعیت</span>
            <b>${esc(
              v.state
            )}</b>
          </div>

          <div class="row">
            <span>Spike</span>
            <b>
              ${
                v.spike
                  ? 'بله'
                  : 'خیر'
              }
            </b>
          </div>

        </div>


        <div class="card">

          <h3>ساختار</h3>

          <div class="row">
            <span>BOS</span>
            <b class="${cls(
              x.bos
            )}">
              ${dirText(
                x.bos
              )}
            </b>
          </div>

          <div class="row">
            <span>CHoCH</span>
            <b class="${cls(
              x.choch
            )}">
              ${dirText(
                x.choch
              )}
            </b>
          </div>

        </div>


        <div class="card">

          <h3>Liquidity Hunt</h3>

          <div class="row">
            <span>جهت</span>
            <b class="${cls(
              h.side
            )}">
              ${dirText(
                h.side
              )}
            </b>
          </div>

          <div class="row">
            <span>تأیید</span>
            <b>
              ${
                h.confirmed
                  ? 'بله'
                  : 'خیر'
              }
            </b>
          </div>

          <div class="row">
            <span>قیمت Sweep</span>
            <b>${fmt(
              h.sweepPrice
            )}</b>
          </div>

        </div>


        <div class="card">

          <h3>FVG / Order Block</h3>

          <div class="row">
            <span>FVG</span>
            <b class="${cls(
              f.type
            )}">
              ${dirText(
                f.type
              )}
            </b>
          </div>

          <div class="row">
            <span>OB</span>
            <b class="${cls(
              ob.type
            )}">
              ${dirText(
                ob.type
              )}
            </b>
          </div>

        </div>

      </div>

    </div>

  </details>

  `;
}


function renderFootprint(fp){

  if(!fp ||
     fp.error){

    return `
      <div class="muted">
        فوت‌پرینت در دسترس نیست.
      </div>
    `;
  }

  return `

  <div class="grid">

    <div class="card">
      <h3>Buy Volume</h3>
      <div class="big green">
        ${fmt(fp.buyVolume)}
      </div>
    </div>

    <div class="card">
      <h3>Sell Volume</h3>
      <div class="big red">
        ${fmt(fp.sellVolume)}
      </div>
    </div>

    <div class="card">

      <h3>Delta</h3>

      <div class="big ${
        fp.delta>0
          ? 'green'
          : fp.delta<0
            ? 'red'
            : 'yellow'
      }">

        ${fmt(fp.delta)}

      </div>

      <div>
        ${fmt(fp.deltaPercent)}%
      </div>

    </div>

    <div class="card">

      <h3>Pressure</h3>

      <div class="big">
        ${esc(
          fp.pressure||
          'NEUTRAL'
        )}
      </div>

    </div>

  </div>

  `;
}


function renderWalls(w){

  if(!w ||
     w.error){

    return `
      <div class="muted">
        Order Book در دسترس نیست.
      </div>
    `;
  }

  return `

  <div class="grid">

    <div class="card">

      <h3>دیوار خرید</h3>

      <div class="big green">
        ${fmt(
          w.buy?.price
        )}
      </div>

      <div>
        ارزش:
        ${fmt(
          w.buy?.notional
        )}
      </div>

      <div>
        قدرت:
        ${fmt(
          w.buyStrength
        )}
      </div>

    </div>


    <div class="card">

      <h3>دیوار فروش</h3>

      <div class="big red">
        ${fmt(
          w.sell?.price
        )}
      </div>

      <div>
        ارزش:
        ${fmt(
          w.sell?.notional
        )}
      </div>

      <div>
        قدرت:
        ${fmt(
          w.sellStrength
        )}
      </div>

    </div>


    <div class="card">

      <h3>نقدینگی</h3>

      <div class="row">
        <span>خرید</span>
        <b>${fmt(
          w.buyLiquidity
        )}</b>
      </div>

      <div class="row">
        <span>فروش</span>
        <b>${fmt(
          w.sellLiquidity
        )}</b>
      </div>

    </div>

  </div>

  `;
}


function renderMarket(m){

  if(!m)
    return '';

  return `

  <div class="grid">

    <div class="card">

      <h3>Open Interest</h3>

      <div class="big">
        ${fmt(
          m.openInterest
        )}
      </div>

    </div>


    <div class="card">

      <h3>Funding Rate</h3>

      <div class="big">
        ${fmt(
          m.fundingRate
        )}
      </div>

    </div>


    <div class="card">

      <h3>تغییر ۲۴ ساعته</h3>

      <div class="big ${
        m.change24h>=0
          ? 'green'
          : 'red'
      }">

        ${fmt(
          m.change24h
        )}%

      </div>

    </div>

  </div>

  `;
}


function renderAnalysis(d){

  renderSummary(d);

  const tf=
    Object.entries(
      d.timeframes||{}
    )
    .map(
      ([k,x])=>
        renderTimeframe(
          k,
          x
        )
    )
    .join('');

  const converted=
    d.convertedMA1m;

  $('results').innerHTML=`

  <details open>

    <summary>
      🔎 تحلیل تایم‌فریم‌ها
    </summary>

    <div class="content">

      ${tf}

    </div>

  </details>


  <details>

    <summary>
      📐 MAهای تبدیل‌شده روی 1m
    </summary>

    <div class="content">

      ${
        converted &&
        converted.events &&
        converted.events.length

        ?

        converted.events
          .map(
            e=>`

            <div class="row">

              <span>
                ${esc(e.source)}
                /
                ${esc(e.ma)}
              </span>

              <b class="${cls(
                e.confirmation
              )}">

                ${esc(
                  e.confirmation
                )}

              </b>

            </div>

            `
          )
          .join('')

        :

        '<div class="muted">برخورد مهمی پیدا نشد.</div>'
      }

    </div>

  </details>


  <details>

    <summary>
      📊 Footprint / Delta
    </summary>

    <div class="content">

      ${renderFootprint(
        d.footprint
      )}

    </div>

  </details>


  <details>

    <summary>
      🧱 Order Book / Walls
    </summary>

    <div class="content">

      ${renderWalls(
        d.walls
      )}

    </div>

  </details>


  <details>

    <summary>
      📈 OI / Funding
    </summary>

    <div class="content">

      ${renderMarket(
        d.market
      )}

    </div>

  </details>


  <details>

    <summary>
      🧠 دلایل سیگنال
    </summary>

    <div class="content">

      ${renderReasons(
        d.reasons
      )}

    </div>

  </details>

  `;
}


async function manualAnalyze(){

  const symbol=
    $('symbol')
      .value
      .trim();

  if(!symbol){

    $('results').innerHTML=
      '<div class="card red">نام ارز را وارد کن.</div>';

    return;
  }

  $('results').innerHTML=
    '<div class="card">در حال تحلیل...</div>';

  try{

    const category=
      $('category').value;

    const url=
      `/api/analyze?symbol=${
        encodeURIComponent(
          symbol
        )
      }&category=${
        encodeURIComponent(
          category
        )
      }`;

    const r=
      await fetch(
        url,
        {
          cache:'no-store'
        }
      );

    const d=
      await r.json();

    if(!d.ok)
      throw Error(
        d.error ||
        'تحلیل انجام نشد'
      );

    renderAnalysis(d);

  }
  catch(e){

    $('results').innerHTML=
      `<div class="card red">
        ${esc(e.message)}
      </div>`;

  }
}


async function scanNow(){

  if(scanning)
    return;

  scanning=true;

  $('results').innerHTML=
    '<div class="card">در حال اسکن بازار...</div>';

  try{

    const r=
      await fetch(
        `/api/scan?offset=${scanOffset}`,
        {
          cache:'no-store'
        }
      );

    const d=
      await r.json();

    if(!d.ok)
      throw Error(
        d.error ||
        'اسکن انجام نشد'
      );

    scanOffset=
      d.nextOffset ?? 0;

    renderScan(d);

  }
  catch(e){

    $('results').innerHTML=
      `<div class="card red">
        ${esc(e.message)}
      </div>`;

  }
  finally{

    scanning=false;

  }
}


function renderScan(d){

  const rows=
    (d.results||[])
      .map(
        x=>`

        <div class="signal">

          <div class="row">

            <b>
              ${esc(
                x.symbol
              )}
            </b>

            <b class="${cls(
              x.direction
            )}">

              ${dirText(
                x.direction
              )}

            </b>

          </div>


          <div class="row">

            <span>
              امتیاز
            </span>

            <b>
              ${fmt(
                x.score
              )}/100
            </b>

          </div>


          <div class="row">

            <span>
              Long
            </span>

            <b class="green">
              ${fmt(
                x.longScore
              )}
            </b>

          </div>


          <div class="row">

            <span>
              Short
            </span>

            <b class="red">
              ${fmt(
                x.shortScore
              )}
            </b>

          </div>


          <div class="scorebar">

            <div
              style="
                width:${Math.min(
                  100,
                  Number(
                    x.score||0
                  )
                )}%
              "
            ></div>

          </div>

        </div>

        `
      )
      .join('');

  $('results').innerHTML=`

  <div class="card">

    <h3>
      🔎 نتایج اسکن
    </h3>

    <div class="muted">
      ${fmt(
        d.batchSize
      )}
      ارز از
      ${fmt(
        d.totalMarkets
      )}
      بازار بررسی شد.
    </div>

  </div>

  ${
    rows ||
    '<div class="card">سیگنال قابل‌قبولی پیدا نشد.</div>'
  }

  `;

}


health();

</script>

</body>
</html>
