<script>

/* =================================================
   تنظیم Worker
   ================================================= */

const API_BASE = "";


/* =================================================
   فقط 3 تایم فریم
   ================================================= */

const TIMEFRAMES = [
  "1",
  "3",
  "5"
];


/* =================================================
   وزن تأییدها
   ================================================= */

const WEIGHTS = {
  trend:20,
  maSlope:15,
  maTouch:15,
  reaction:10,
  structure:15,
  fvg:10,
  volume:10,
  mtf:5
};


/* =================================================
   ابزارها
   ================================================= */

function number(value){

  if(
    value === null ||
    value === undefined ||
    Number.isNaN(Number(value))
  ){
    return "-";
  }

  return Number(value).toLocaleString(
    "en-US",
    {
      maximumFractionDigits:8
    }
  );
}


function scoreGrade(score){

  if(score >= 85) return "A+";
  if(score >= 75) return "A";
  if(score >= 65) return "B";
  if(score >= 55) return "C";

  return "WAIT";
}


function gradeClass(score){

  if(score >= 75) return "green";
  if(score >= 55) return "yellow";

  return "gray";
}


function sma(data,period){

  if(!data || data.length < period){
    return null;
  }

  const part =
    data.slice(data.length-period);

  return part.reduce(
    (a,b)=>a+b,
    0
  ) / period;
}


/* =================================================
   شیب MA20
   ================================================= */

function calculateSlope(closes){

  if(!closes || closes.length < 25){

    return {
      value:0,
      direction:"FLAT",
      strength:0
    };

  }

  const current =
    sma(closes,20);

  const previous =
    sma(
      closes.slice(0,-1),
      20
    );

  if(
    current === null ||
    previous === null
  ){

    return {
      value:0,
      direction:"FLAT",
      strength:0
    };

  }

  const value =
    ((current-previous)/previous)*100;

  let direction="FLAT";

  if(value > 0.02){
    direction="UP";
  }
  else if(value < -0.02){
    direction="DOWN";
  }

  return {
    value,
    direction,
    strength:Math.min(
      100,
      Math.abs(value)*1000
    )
  };
}


/* =================================================
   MA20 TOUCH
   ================================================= */

function ma20Touch(
  price,
  ma20,
  tolerance=0.004
){

  if(
    price === null ||
    ma20 === null
  ){
    return false;
  }

  return (
    Math.abs(price-ma20)/ma20
  ) <= tolerance;
}


/* =================================================
   واکنش کندل
   ================================================= */

function candleReaction(
  rows,
  direction
){

  if(!rows || rows.length<2){
    return false;
  }

  const last =
    rows[rows.length-1];

  const open =
    Number(last.open);

  const close =
    Number(last.close);

  if(direction==="LONG"){
    return close>open;
  }

  if(direction==="SHORT"){
    return close<open;
  }

  return false;
}


/* =================================================
   ساختار
   ================================================= */

function detectStructure(rows){

  if(!rows || rows.length<10){
    return "NONE";
  }

  const n=rows.length;

  const a =
    Number(rows[n-6].close);

  const b =
    Number(rows[n-3].close);

  const c =
    Number(rows[n-1].close);

  if(c>b && b>a){
    return "BULLISH";
  }

  if(c<b && b<a){
    return "BEARISH";
  }

  return "NONE";
}


/* =================================================
   FVG
   ================================================= */

function detectFVG(rows){

  if(!rows || rows.length<3){

    return {
      type:"NONE",
      bottom:null,
      top:null
    };

  }

  const a =
    rows[rows.length-3];

  const c =
    rows[rows.length-1];

  const aHigh =
    Number(a.high);

  const aLow =
    Number(a.low);

  const cHigh =
    Number(c.high);

  const cLow =
    Number(c.low);


  if(cLow>aHigh){

    return {
      type:"BULLISH",
      bottom:aHigh,
      top:cLow
    };

  }


  if(cHigh<aLow){

    return {
      type:"BEARISH",
      bottom:cHigh,
      top:aLow
    };

  }


  return {
    type:"NONE",
    bottom:null,
    top:null
  };
}


/* =================================================
   Volume
   ================================================= */

function volumeInfo(rows){

  if(!rows || rows.length<20){

    return {
      current:0,
      ma7:0,
      ma20:0,
      spike:false
    };

  }

  const volumes =
    rows.map(
      r=>Number(r.volume)
    );

  const current =
    volumes[volumes.length-1];

  const ma7 =
    sma(volumes,7);

  const ma20 =
    sma(volumes,20);

  return {

    current,
    ma7,
    ma20,

    spike:
      current > ma20*1.5

  };
}


/* =================================================
   تحلیل یک تایم فریم
   ================================================= */

function analyzeTF(rows){

  if(!rows || rows.length<30){
    return null;
  }

  const closes =
    rows.map(
      r=>Number(r.close)
    );

  const price =
    closes[closes.length-1];

  const ma7 =
    sma(closes,7);

  const ma20 =
    sma(closes,20);

  const slope =
    calculateSlope(closes);

  let trend="RANGE";

  if(ma7>ma20){
    trend="BULLISH";
  }
  else if(ma7<ma20){
    trend="BEARISH";
  }

  const structure =
    detectStructure(rows);

  const fvg =
    detectFVG(rows);

  const volume =
    volumeInfo(rows);

  const touch =
    ma20Touch(
      price,
      ma20
    );

  const longReaction =
    candleReaction(
      rows,
      "LONG"
    );

  const shortReaction =
    candleReaction(
      rows,
      "SHORT"
    );

  return {

    price,
    ma7,
    ma20,

    trend,
    slope,
    structure,
    fvg,
    volume,

    touch,

    longReaction,
    shortReaction

  };
}


/* =================================================
   تعیین جهت از بین 1m / 3m / 5m
   ================================================= */

function determineDirection(analyses){

  let longPoints=0;
  let shortPoints=0;

  TIMEFRAMES.forEach(tf=>{

    const x=analyses[tf];

    if(!x) return;

    if(x.trend==="BULLISH"){
      longPoints++;
    }

    if(x.trend==="BEARISH"){
      shortPoints++;
    }

    if(x.slope.direction==="UP"){
      longPoints++;
    }

    if(x.slope.direction==="DOWN"){
      shortPoints++;
    }

    if(x.structure==="BULLISH"){
      longPoints++;
    }

    if(x.structure==="BEARISH"){
      shortPoints++;
    }

    if(x.fvg.type==="BULLISH"){
      longPoints++;
    }

    if(x.fvg.type==="BEARISH"){
      shortPoints++;
    }

  });


  if(longPoints>=3 && longPoints>shortPoints){
    return "LONG";
  }

  if(shortPoints>=3 && shortPoints>longPoints){
    return "SHORT";
  }

  return "WAIT";
}


/* =================================================
   MTF
   ================================================= */

function mtfScore(
  analyses,
  direction
){

  let score=0;

  TIMEFRAMES.forEach(tf=>{

    const x=analyses[tf];

    if(!x) return;

    if(
      direction==="LONG" &&
      x.trend==="BULLISH"
    ){
      score+=2;
    }

    if(
      direction==="SHORT" &&
      x.trend==="BEARISH"
    ){
      score+=2;
    }

  });

  return Math.min(5,score);
}


/* =================================================
   امتیاز
   ================================================= */

function calculateScore(
  x,
  direction,
  mtf
){

  if(
    !x ||
    direction==="WAIT"
  ){

    return {
      score:0,
      confirmations:0,
      total:8
    };

  }

  let score=0;
  let confirmations=0;


  /* روند */

  const goodTrend =
    direction==="LONG"
    ? x.trend==="BULLISH"
    : x.trend==="BEARISH";

  if(goodTrend){

    score+=WEIGHTS.trend;
    confirmations++;

  }


  /* شیب MA20 */

  const goodSlope =
    direction==="LONG"
    ? x.slope.direction==="UP"
    : x.slope.direction==="DOWN";

  if(goodSlope){

    score+=WEIGHTS.maSlope;
    confirmations++;

  }


  /* لمس MA20 */

  if(x.touch){

    score+=WEIGHTS.maTouch;
    confirmations++;

  }


  /* واکنش */

  const reaction =
    direction==="LONG"
    ? x.longReaction
    : x.shortReaction;

  if(reaction){

    score+=WEIGHTS.reaction;
    confirmations++;

  }


  /* ساختار */

  const goodStructure =
    direction==="LONG"
    ? x.structure==="BULLISH"
    : x.structure==="BEARISH";

  if(goodStructure){

    score+=WEIGHTS.structure;
    confirmations++;

  }


  /* FVG */

  const goodFVG =
    direction==="LONG"
    ? x.fvg.type==="BULLISH"
    : x.fvg.type==="BEARISH";

  if(goodFVG){

    score+=WEIGHTS.fvg;
    confirmations++;

  }


  /* Volume */

  if(x.volume.spike){

    score+=WEIGHTS.volume;
    confirmations++;

  }


  /* MTF */

  if(mtf>0){

    score+=WEIGHTS.mtf;
    confirmations++;

  }


  return {

    score:Math.min(
      100,
      Math.round(score)
    ),

    confirmations,

    total:8

  };

}


/* =================================================
   اهداف
   ================================================= */

function calculateTargets(
  x,
  direction
){

  const price=x.price;

  let risk=
    price*0.015;

  let sl;

  if(direction==="LONG"){

    sl=price-risk;

  }
  else{

    sl=price+risk;

  }

  let tp1,tp2,tp3;

  if(direction==="LONG"){

    tp1=price+risk;
    tp2=price+risk*2;
    tp3=price+risk*3;

  }
  else{

    tp1=price-risk;
    tp2=price-risk*2;
    tp3=price-risk*3;

  }

  return {
    entry:price,
    sl,
    tp1,
    tp2,
    tp3,
    rr:"1:3"
  };
}


/* =================================================
   دریافت Kline
   ================================================= */

async function getKlines(
  symbol,
  interval
){

  const url =
    API_BASE+
    "/api/kline"+
    "?symbol="+
    encodeURIComponent(symbol)+
    "&interval="+
    encodeURIComponent(interval)+
    "&limit=60";


  const response =
    await fetch(url);


  const data =
    await response.json();


  if(!data.ok){

    throw new Error(
      data.error ||
      data.detail ||
      "خطای دریافت داده"
    );

  }


  return data.rows||[];
}


/* =================================================
   تحلیل کامل
   فقط 1m / 3m / 5m
   ================================================= */

async function fullAnalyze(symbol){

  const analyses={};


  for(
    const tf of TIMEFRAMES
  ){

    try{

      const rows =
        await getKlines(
          symbol,
          tf
        );

      analyses[tf]=
        analyzeTF(rows);

    }
    catch(error){

      analyses[tf]=null;

    }

  }


  /*
   تایم اصلی = 5 دقیقه
  */

  const main =
    analyses["5"] ||
    analyses["3"] ||
    analyses["1"];


  if(!main){

    throw new Error(
      "اطلاعات کافی برای "+
      symbol+
      " دریافت نشد."
    );

  }


  const direction =
    determineDirection(
      analyses
    );


  const mtf =
    mtfScore(
      analyses,
      direction
    );


  const scoreData =
    calculateScore(
      main,
      direction,
      mtf
    );


  const targets =
    direction==="WAIT"
    ? null
    : calculateTargets(
        main,
        direction
      );


  return {

    symbol,

    main,

    direction,

    score:
      scoreData.score,

    confirmations:
      scoreData.confirmations,

    total:
      scoreData.total,

    mtf,

    targets,

    analyses

  };

}


/* =================================================
   نمایش
   ================================================= */

function renderSignal(result){

  const direction =
    result.direction;

  const score =
    result.score;

  const grade =
    scoreGrade(score);

  const cls =
    direction==="LONG"
    ? "long"
    : direction==="SHORT"
    ? "short"
    : "wait";


  const icon =
    direction==="LONG"
    ? "🟢 LONG"
    : direction==="SHORT"
    ? "🔴 SHORT"
    : "🟡 WAIT";


  const x=result.main;
  const t=result.targets;


  let targetsHTML="";


  if(t){

    targetsHTML=`

    <div class="grid">

      <div class="box">
        <div class="label">Entry</div>
        <div class="value">
          ${number(t.entry)}
        </div>
      </div>

      <div class="box">
        <div class="label">SL</div>
        <div class="value red">
          ${number(t.sl)}
        </div>
      </div>

      <div class="box">
        <div class="label">TP1</div>
        <div class="value green">
          ${number(t.tp1)}
        </div>
      </div>

      <div class="box">
        <div class="label">TP2</div>
        <div class="value green">
          ${number(t.tp2)}
        </div>
      </div>

      <div class="box">
        <div class="label">TP3</div>
        <div class="value green">
          ${number(t.tp3)}
        </div>
      </div>

      <div class="box">
        <div class="label">R:R</div>
        <div class="value">
          ${t.rr}
        </div>
      </div>

    </div>

    `;

  }


  return `

  <div class="signal ${cls}">

    <div class="header">

      <div>

        <div class="title">
          ${icon} ${result.symbol}
        </div>

        <div class="meta">
          تایم‌فریم‌های تحلیل:
          1m / 3m / 5m
        </div>

      </div>

      <div class="score ${gradeClass(score)}">
        ${score}/100
        <small>${grade}</small>
      </div>

    </div>


    ${targetsHTML}


    <div class="confirm">

      <b>تأییدها:</b>
      ${result.confirmations}/${result.total}

      <br>

      MA20 Touch:
      ${x.touch ? "✅":"❌"}

      <br>

      MA20 Slope:
      ${
        x.slope.direction==="UP"
        ? "🟢 صعودی"
        : x.slope.direction==="DOWN"
        ? "🔴 نزولی"
        : "🟡 خنثی"
      }

      <br>

      Structure:
      ${
        x.structure==="BULLISH"
        ? "🟢 BULLISH"
        : x.structure==="BEARISH"
        ? "🔴 BEARISH"
        : "⚪ NONE"
      }

      <br>

      FVG:
      ${
        x.fvg.type==="BULLISH"
        ? "🟢 BULLISH"
        : x.fvg.type==="BEARISH"
        ? "🔴 BEARISH"
        : "⚪ NONE"
      }

      <br>

      Volume:
      ${x.volume.spike ? "🔥 تأیید":"❌"}

      <br>

      تأیید 1m/3m/5m:
      ${result.mtf}/5

    </div>


    <div class="confirm">

      <b>تایم‌فریم‌ها:</b><br>

      ${renderMTF(result.analyses)}

    </div>

  </div>

  `;

}


/* =================================================
   نمایش 3 تایم فریم
   ================================================= */

function renderMTF(analyses){

  const names={
    "1":"1m",
    "3":"3m",
    "5":"5m"
  };

  let html="";


  for(
    const tf of TIMEFRAMES
  ){

    const x=
      analyses[tf];


    if(!x){

      html+=
        `${names[tf]} ⏳<br>`;

      continue;

    }


    const icon=
      x.trend==="BULLISH"
      ? "🟢"
      : x.trend==="BEARISH"
      ? "🔴"
      : "🟡";


    html+=
      `${names[tf]} ${icon} ${x.trend}<br>`;

  }


  return html;
}


/* =================================================
   تحلیل دستی
   ================================================= */

async function analyzeSymbol(){

  const input=
    document.getElementById(
      "symbol"
    );

  const manual=
    document.getElementById(
      "manual"
    );

  const status=
    document.getElementById(
      "status"
    );


  const symbol=
    input.value
      .trim()
      .toUpperCase();


  if(!symbol){

    status.textContent=
      "❌ نماد را وارد کن.";

    return;

  }


  manual.innerHTML=
    `<div class="empty">
      ⏳ تحلیل ${symbol}
      در 1m / 3m / 5m...
    </div>`;


  try{

    const result=
      await fullAnalyze(
        symbol
      );


    manual.innerHTML=
      renderSignal(result);


    status.textContent=
      `✅ ${symbol} تحلیل شد.`;

  }
  catch(error){

    manual.innerHTML=
      `<div class="empty">
        ❌ خطا<br><br>
        ${error.message}
      </div>`;

    status.textContent=
      "❌ تحلیل انجام نشد.";

  }

}


/* =================================================
   اسکن بازار سریع
   ================================================= */

async function scanMarket(){

  const resultsBox=
    document.getElementById(
      "results"
    );

  const status=
    document.getElementById(
      "status"
    );


  resultsBox.innerHTML=
    `<div class="empty">
      ⏳ دریافت لیست فیوچرز...
    </div>`;


  try{

    const response=
      await fetch(
        API_BASE+
        "/api/futures"
      );


    const data=
      await response.json();


    if(!data.ok){

      throw new Error(
        data.error ||
        "دریافت لیست ناموفق بود."
      );

    }


    let symbols=
      data.futures||[];


    symbols=
      symbols.filter(
        s=>
          s.endsWith("USDT") &&
          !s.includes("-")
      );


    /*
     * برای سرعت بیشتر:
     * حداکثر 150 ارز
     *
     * ترتیب لیست Bybit حفظ می‌شود.
     */

    const limited=
      symbols.slice(0,150);


    status.textContent=
      `⏳ بررسی 0 از ${limited.length} ارز...`;


    const results=[];


    /*
     * هر بار 10 ارز
     */

    const batchSize=10;


    for(
      let i=0;
      i<limited.length;
      i+=batchSize
    ){

      const batch=
        limited.slice(
          i,
          i+batchSize
        );


      const batchResults=
        await Promise.all(

          batch.map(
            async symbol=>{

              try{

                return await fullAnalyze(
                  symbol
                );

              }
              catch(error){

                return null;

              }

            }
          )

        );


      batchResults.forEach(
        r=>{

          if(
            r &&
            r.direction!=="WAIT" &&
            r.score>=45
          ){

            results.push(r);

          }

        }
      );


      /*
       * مرتب‌سازی موقت
       */

      results.sort(
        (a,b)=>
          b.score-a.score
      );


      status.textContent=
        `⏳ بررسی ${Math.min(
          i+batchSize,
          limited.length
        )} از ${limited.length}...`;


      /*
       * اگر 10 سیگنال خیلی خوب پیدا شد
       * می‌توانیم زودتر پایان دهیم.
       */

      if(
        results.length>=10 &&
        results[9].score>=80
      ){

        break;

      }

    }


    results.sort(
      (a,b)=>
        b.score-a.score
    );


    const top10=
      results.slice(0,10);


    if(!top10.length){

      resultsBox.innerHTML=
        `<div class="empty">
          🟡 فعلاً سیگنال قوی پیدا نشد.
        </div>`;

    }
    else{

      resultsBox.innerHTML=
        top10
          .map(
            r=>renderSignal(r)
          )
          .join("");

    }


    status.textContent=
      `✅ اسکن تمام شد — ${top10.length} موقعیت برتر از ${limited.length} ارز.`;

  }
  catch(error){

    console.error(error);

    resultsBox.innerHTML=
      `<div class="empty">
        ❌ خطا:<br><br>
        ${error.message}
      </div>`;

    status.textContent=
      "❌ اسکن بازار انجام نشد.";

  }

}

</script>

</body>
</html>
