border-radius:10px;

}

</style>

</head>


<body>

<div class="container">

<h1>
📊 اسکنر فیوچرز Bybit
</h1>


<div class="card">

<div class="row">

<input
id="symbol"
value="BTCUSDT"
placeholder="مثلاً BTCUSDT"
>

<button onclick="analyzeSymbol()">

class="scan"

>
🚨 اسکن ۲۰۰ ارز
</button>

</div>

<span>
۱ دقیقه (1m)
</span>

<span>
۳ دقیقه (3m)
</span>

<span>
۵ دقیقه (5m)
</span>

</div>


<div class="row" style="margin-top:10px">

<button
id="alertButton"
class="alert"
onclick="toggleAlerts()"
>
🔔 هشدار صوتی
</button>

<button
onclick="stopAlert()"
>
🔕 قطع هشدار
</button>

</div>

id="alertStatus"

>
هشدار فعال است.
</div>

id="status"

>

</div>

<div class="top">
🏆 ۱۰ موقعیت برتر
</div>


<div id="results">

<div class="empty">
هنوز اسکن انجام نشده.
</div>

</div>

</div>


<div class="card">

<div class="top">
🔎 نتیجه تحلیل دستی
</div>


<div id="manual">

<div class="empty">
یک ارز وارد کن و تحلیل ارز را بزن.
</div>

</div>

</div>

</div>


<script>


// ============================================================
// SETTINGS
// ============================================================

const API_BASE = "";


// ============================================================
// ALERT STATE
// ============================================================

let alertEnabled =
  localStorage.getItem(
    "bybit_alert_enabled"
  ) !== "false";


let audioContext = null;

let alertTimer = null;

let lastAlertKey =
  localStorage.getItem(
    "bybit_last_alert_key"
  ) || "";


// ============================================================
// AUDIO
// ============================================================

function createAudio(){

  try{

    if(!audioContext){

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    if(
      audioContext.state ===
      "suspended"
    ){

      audioContext.resume();

    }

  }catch(e){

    console.log(
      "Audio error",
      e
    );

  }

}


function beep(){

  if(!alertEnabled)
    return;


  createAudio();


  if(!audioContext)
    return;


  try{

    const osc =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();


    osc.connect(gain);

    gain.connect(
      audioContext.destination
    );


    osc.frequency.value =
      880;

    osc.type =
      "sine";


    gain.gain.setValueAtTime(
      0.0001,
      audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.25,
      audioContext.currentTime + 0.02
    );


    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      audioContext.currentTime + 0.30
    );


    osc.start();

    osc.stop(
      audioContext.currentTime +
      0.32
    );


  }catch(e){

    console.log(e);

  }

}


function playSignalAlert(){

  if(!alertEnabled)
    return;


  stopAlert();


  beep();


  alertTimer =
    setTimeout(
      beep,
      450
    );


  alertTimer =
    setTimeout(
      beep,
      900
    );

}


// ============================================================
// ALERT CONTROL
// ============================================================

function toggleAlerts(){

  alertEnabled =
    !alertEnabled;


  localStorage.setItem(
    "bybit_alert_enabled",
    String(alertEnabled)
  );


  const button =
    document.getElementById(
      "alertButton"
    );


  const status =
    document.getElementById(
      "alertStatus"
    );


  if(alertEnabled){

    button.textContent =
      "🔔 هشدار صوتی: فعال";

    button.classList.remove(
      "off"
    );

    status.textContent =
      "🔔 هشدار فعال است.";

    // برای اجازه مرورگر
    createAudio();

  }else{

    button.textContent =
      "🔕 هشدار صوتی: خاموش";

    button.classList.add(
      "off"
    );

    status.textContent =
      "🔕 هشدار صوتی خاموش است.";

    stopAlert();

  }

}


function stopAlert(){

  if(alertTimer){

    clearTimeout(
      alertTimer
    );

    alertTimer = null;

  }

}


// ============================================================
// INIT ALERT UI
// ============================================================

function initAlerts(){

  const button =
    document.getElementById(
      "alertButton"
    );


  const status =
    document.getElementById(
      "alertStatus"
    );


  if(alertEnabled){

    button.textContent =
      "🔔 هشدار صوتی: فعال";

    button.classList.remove(
      "off"
    );

    status.textContent =
      "🔔 هشدار فعال است.";

  }else{

    button.textContent =
      "🔕 هشدار صوتی: خاموش";

    button.classList.add(
      "off"
    );

    status.textContent =
      "🔕 هشدار صوتی خاموش است.";

  }

}


// ============================================================
// ALERT CHECK
// ============================================================

function checkForAlerts(list){

  if(!alertEnabled)
    return;


  if(!Array.isArray(list))
    return;


  const confirmed =
    list.filter(
      x =>
        x &&
        (
          x.signal ===
            "CONFIRMED LONG" ||
          x.signal ===
            "CONFIRMED SHORT"
        )
    );


  if(!confirmed.length)
    return;


  const best =
    confirmed[0];


  const key =
    [
      best.symbol,
      best.signal,
      Math.floor(
        Number(best.score || 0) /
        5
      )
    ].join("|");


  // ----------------------------------------------------------
  // اگر همان سیگنال قبلاً هشدار داده شده، دوباره زنگ نزن
  // ----------------------------------------------------------

  if(key === lastAlertKey)
    return;


  lastAlertKey =
    key;


  localStorage.setItem(
    "bybit_last_alert_key",
    key
  );


  playSignalAlert();

}


// ============================================================
// NUMBER
// ============================================================

function num(v){

  if(
    v === null ||
    v === undefined ||
    Number.isNaN(Number(v))
  )
    return "-";


  return Number(v)
    .toLocaleString(
      "en-US",
      {
        maximumFractionDigits:8
      }
    );
}


// ============================================================
// PERCENT
// ============================================================

function pct(v){

  if(
    v === null ||
    v === undefined ||
    Number.isNaN(Number(v))
  )
    return "-";


  return Number(v)
    .toFixed(2) +
    "%";
}


// ============================================================
// TRANSLATIONS
// ============================================================

function trendFA(v){

  if(v === "BULLISH")
    return "🟢 صعودی (BULLISH)";

  if(v === "BEARISH")
    return "🔴 نزولی (BEARISH)";

  return "🟡 رنج (RANGE)";
}


function slopeFA(v){

  if(v === "UP")
    return "🟢 صعودی (UP)";

  if(v === "DOWN")
    return "🔴 نزولی (DOWN)";

  return "🟡 خنثی (FLAT)";
}


function structureFA(v){

  if(v === "BULLISH")
    return "🟢 صعودی (BULLISH)";

  if(v === "BEARISH")
    return "🔴 نزولی (BEARISH)";

  return "⚪ بدون ساختار (NONE)";
}


function fvgFA(v){

  if(v === "BULLISH")
    return "🟢 صعودی (BULLISH)";

  if(v === "BEARISH")
    return "🔴 نزولی (BEARISH)";

  return "⚪ ندارد (NONE)";
}


function directionFA(v){

  if(v === "LONG")
    return "🟢 خرید (LONG)";

  if(v === "SHORT")
    return "🔴 فروش (SHORT)";

  return "🟡 انتظار (WAIT)";
}


function scoreClass(score){

  if(score >= 75)
    return "green";

  if(score >= 50)
    return "yellow";

  return "gray";
}


// ============================================================
// FOOTPRINT
// ============================================================

function renderFootprint(fp){

  if(!fp){

    return `
      <div class="empty">
      فوت‌پرینت در اسکن بازار دریافت نشده.
      <br>
      در تحلیل دستی دریافت می‌شود.
      </div>
    `;

  }


  if(fp.error){

    return `
      <div class="empty">
      خطای فوت‌پرینت:
      ${fp.error}
      </div>
    `;

  }


  return `

  <div class="section">
  👣 فوت‌پرینت واقعی
  </div>

  <div class="grid">

  <div class="box">
  <div class="label">
  حجم خرید
  </div>
  <div class="value green">
  ${num(fp.buyVolume)}
  </div>
  </div>

  <div class="box">
  <div class="label">
  حجم فروش
  </div>
  <div class="value red">
  ${num(fp.sellVolume)}
  </div>
  </div>

  <div class="box">
  <div class="label">
  دلتا
  </div>
  <div class="value ${
    fp.delta >= 0
      ? "green"
      : "red"
  }">
  ${num(fp.delta)}
  </div>
  </div>

  <div class="box">
  <div class="label">
  دلتا درصد
  </div>
  <div class="value ${
    fp.deltaPercent >= 0
      ? "green"
      : "red"
  }">
  ${pct(fp.deltaPercent)}
  </div>
  </div>

  <div class="box">
  <div class="label">
  نسبت خرید
  </div>
  <div class="value">
  ${pct(fp.buyRatio)}
  </div>
  </div>

  <div class="box">
  <div class="label">
  نسبت فروش
  </div>
  <div class="value">
  ${pct(fp.sellRatio)}
  </div>
  </div>

  <div class="box">
  <div class="label">
  معاملات
  </div>
  <div class="value">
  ${num(fp.trades)}
  </div>
  </div>

  <div class="box">
  <div class="label">
  معامله بزرگ
  </div>
  <div class="value ${
    fp.largeTrade
      ? "yellow"
      : "gray"
  }">
  ${
    fp.largeTrade
      ? "💥 بله"
      : "❌ خیر"
  }
  </div>
  </div>

  </div>

  <div class="confirm">

  <b>
  نتیجه Footprint:
  </b>

  <br>

  ${
    fp.delta > 0
      ? "🟢 فشار خرید بیشتر است"
      : fp.delta < 0
      ? "🔴 فشار فروش بیشتر است"
      : "🟡 تعادل خرید و فروش"
  }

  <br>

  بزرگ‌ترین معامله:
  ${num(fp.largeTradeNotional)}

  </div>

  `;

}


// ============================================================
// SIGNAL
// ============================================================

function renderSignal(r){

  const cls =
    r.direction === "LONG"
      ? "long"
      : r.direction === "SHORT"
      ? "short"
      : "wait";


  const reasons =
    Array.isArray(r.reasons) &&
    r.reasons.length
      ? `
        <div class="alertbox">
        ⚠️ نکات:
        <br>
        ${r.reasons
          .map(x => "• " + x)
          .join("<br>")}
        </div>
      `
      : "";


  return `

  <div class="signal ${cls}">

  <div class="header">

  <div>

  <div class="title">

  ${directionFA(r.direction)}
  &nbsp;
  ${r.symbol}

  </div>

  <div class="meta">

  تایم‌فریم:
  ۱ دقیقه / ۳ دقیقه / ۵ دقیقه

  </div>

  </div>

  <div class="score ${
    scoreClass(r.score)
  }">

  ${r.score}/100

  </div>

  </div>


  <div class="grid">

  <div class="box">
  <div class="label">
  قیمت فعلی
  </div>
  <div class="value">
  ${num(r.price)}
  </div>
  </div>

  <div class="box">
  <div class="label">
  ورود
  </div>
  <div class="value">
  ${num(r.entry)}
  </div>
  </div>

  <div class="box">
  <div class="label">
  حد ضرر
  </div>
  <div class="value red">
  ${num(r.sl)}
  </div>
  </div>

  <div class="box">
  <div class="label">
  هدف ۱
  </div>
  <div class="value green">
  ${num(r.tp1)}
  </div>
  </div>

  <div class="box">
  <div class="label">
  هدف ۲
  </div>
  <div class="value green">
  ${num(r.tp2)}
  </div>
  </div>

  <div class="box">
  <div class="label">
  هدف ۳
  </div>
  <div class="value green">
  ${num(r.tp3)}
  </div>
  </div>

  </div>


  <div class="confirm">

  <b>
  تأییدها:
  </b>

  ${r.confirmations}

  <br>

  <b>
  تایم‌فریم‌های صعودی:
  </b>

  ${r.bullishTimeframes}/3

  <br>

  <b>
  تایم‌فریم‌های نزولی:
  </b>

  ${r.bearishTimeframes}/3

  </div>


  <div class="confirm">

  <div class="section">
  📈 ۱ دقیقه
  </div>

  ${renderTF(
    r.timeframes?.["1"]
  )}


  <div class="section">
  📈 ۳ دقیقه
  </div>

  ${renderTF(
    r.timeframes?.["3"]
  )}


  <div class="section">
  📈 ۵ دقیقه
  </div>

  ${renderTF(
    r.timeframes?.["5"]
  )}

  </div>


  ${renderFootprint(
    r.footprint
  )}


  ${reasons}

  </div>

  `;

}


// ============================================================
// TIMEFRAME RENDER
// ============================================================

function renderTF(x){

  if(!x){

    return "❌ اطلاعات دریافت نشد.";

  }


  if(x.error){

    return "❌ " + x.error;

  }


  return `

  روند:
  ${trendFA(x.trend)}

  <br>

  شیب MA20:
  ${slopeFA(x.maSlope)}

  <br>

  MA7:
  ${num(x.ma7)}

  <br>

  MA20:
  ${num(x.ma20)}

  <br>

  تماس با MA20:
  ${x.touchMA20 ? "✅ بله" : "❌ خیر"}

  <br>

  ساختار:
  ${structureFA(x.structure)}

  <br>

  FVG:
  ${fvgFA(x.fvg?.type)}

  <br>

  حجم فعلی:
  ${num(x.volume?.current)}

  <br>

  میانگین حجم 7:
  ${num(x.volume?.ma7)}

  <br>

  میانگین حجم 20:
  ${num(x.volume?.ma20)}

  <br>

  جهش حجم:
  ${
    x.volume?.spike
      ? "🔥 بله"
      : "❌ خیر"
  }

  `;

}


// ============================================================
// GET JSON
// ============================================================

async function getJSON(url){

  const response =
    await fetch(url);


  const data =
    await response.json();


  if(!data.ok){

    throw new Error(
      data.error ||
      data.detail ||
      "خطای دریافت اطلاعات"
    );

  }


  return data;

}


// ============================================================
// MANUAL ANALYZE
// ============================================================

async function analyzeSymbol(){

  createAudio();


  const symbol =
    document
      .getElementById("symbol")
      .value
      .trim()
      .toUpperCase();


  const manual =
    document.getElementById(
      "manual"
    );


  const status =
    document.getElementById(
      "status"
    );


  if(!symbol){

    status.textContent =
      "❌ نماد را وارد کن.";

    return;

  }


  manual.innerHTML = `
    <div class="empty">
    ⏳ در حال تحلیل
    ${symbol}...
    </div>
  `;


  status.textContent =
    `⏳ تحلیل ${symbol}...`;


  try{

    const data =
      await getJSON(
        API_BASE +
        "/api/analyze?symbol=" +
        encodeURIComponent(symbol)
      );


    manual.innerHTML =
      renderSignal(data);


    status.textContent =
      `✅ تحلیل ${symbol} کامل شد.`;


  }catch(e){

    manual.innerHTML = `
      <div class="empty">
      ❌ خطا
      <br><br>
      ${e.message}
      </div>
    `;


    status.textContent =
      "❌ تحلیل انجام نشد.";

  }

}


// ============================================================
// MARKET SCAN
// ============================================================

async function scanMarket(){

  createAudio();


  const results =
    document.getElementById(
      "results"
    );


  const status =
    document.getElementById(
      "status"
    );


  results.innerHTML = `
    <div class="empty">
    ⏳ در حال بررسی ۲۰۰ ارز...
    <br>
    ابتدا ۲۰۰ ارز اولویت‌دار Bybit
    انتخاب می‌شوند.
    <br>
    سپس بهترین موقعیت‌ها
    تحلیل عمیق می‌شوند.
    </div>
  `;


  status.textContent =
    "⏳ دریافت ۲۰۰ ارز Bybit...";


  try{

    const data =
      await getJSON(
        API_BASE +
        "/api/scan"
      );


    const list =
      data.results || [];


    if(!list.length){

      results.innerHTML = `
        <div class="empty">

        🟡 فعلاً سیگنال
        تأییدشده‌ای پیدا نشد.

        <br><br>

        ${data.scanned || 0}
        ارز بررسی اولیه شدند.

        <br>

        ${data.deepScanned || 0}
        ارز تحلیل عمیق شدند.

        </div>
      `;

    }else{

      results.innerHTML =
        list
          .map(renderSignal)
          .join("");

    }


    status.textContent =
      `✅ اسکن کامل شد — ${
        data.scanned || 0
      } ارز بررسی شدند و ${
        data.deepScanned || 0
      } ارز تحلیل عمیق شدند.`;


    // بررسی هشدار
    checkForAlerts(list);


  }catch(e){

    results.innerHTML = `
      <div class="empty">

      ❌ خطا

      <br><br>

      ${e.message}

      </div>
    `;


    status.textContent =
      "❌ اسکن بازار انجام نشد.";

  }

}


// ============================================================
// INIT
// ============================================================
