<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

<title>Bybit Smart Money MA Radar V8</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#080c12;
  color:#e9eef5;
  font-family:Tahoma,Arial,sans-serif;
}

button,
input,
select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.container{
  width:min(1400px,100%);
  margin:auto;
  padding:12px;
}

header{
  background:linear-gradient(135deg,#111927,#0b111c);
  border:1px solid #263449;
  border-radius:16px;
  padding:16px;
  margin-bottom:12px;
}

h1{
  margin:0 0 8px;
  font-size:21px;
}

.subtitle{
  color:#8fa2b8;
  font-size:12px;
}

.toolbar{
  display:grid;
  grid-template-columns:1fr auto auto;
  gap:8px;
  margin-top:14px;
}

input,
select{
  width:100%;
  background:#0a1019;
  border:1px solid #2a394d;
  color:#fff;
  border-radius:10px;
  padding:12px;
  outline:none;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  color:white;
  background:#1769aa;
}

button:hover{
  opacity:.9;
}

button.green{
  background:#087f5b;
}

button.red{
  background:#b42318;
}

button.gray{
  background:#263449;
}

.status{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

.badge{
  padding:7px 10px;
  border-radius:999px;
  background:#111c2b;
  border:1px solid #263449;
  font-size:11px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.card{
  background:#0d141f;
  border:1px solid #263449;
  border-radius:14px;
  padding:13px;
  overflow:hidden;
}

.card h2{
  font-size:14px;
  margin:0 0 11px;
}

.card h3{
  font-size:12px;
  color:#9db0c7;
  margin:12px 0 7px;
}

.full{
  grid-column:1/-1;
}

.half{
  grid-column:span 2;
}

.metric{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  border-bottom:1px solid #182536;
  padding:7px 0;
  font-size:12px;
}

.metric:last-child{
  border-bottom:0;
}

.value{
  font-weight:bold;
}

.long{
  color:#27d69b;
}

.short{
  color:#ff6675;
}

.yellow{
  color:#ffd166;
}

.blue{
  color:#62b0ff;
}

.muted{
  color:#8394a8;
}

.bigScore{
  font-size:38px;
  font-weight:bold;
  text-align:center;
  margin:5px 0;
}

.signal{
  text-align:center;
  padding:10px;
  border-radius:10px;
  font-weight:bold;
  margin-bottom:8px;
}

.signal.long{
  background:#063c2d;
  color:#49e6ae;
}

.signal.short{
  background:#4b1119;
  color:#ff7785;
}

.signal.wait{
  background:#30290d;
  color:#ffd166;
}

.sectionTitle{
  margin:18px 0 8px;
  font-size:15px;
  color:#dce8f5;
}

.radarGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.radar{
  border-radius:13px;
  padding:12px;
  border:1px solid #263449;
  background:#0b121c;
}

.radar h3{
  margin:0 0 8px;
}

.radar.pump{
  border-color:#126b51;
}

.radar.dump{
  border-color:#76212c;
}

.radar.reverse{
  border-color:#705e12;
}

.symbol{
  font-weight:bold;
  font-size:16px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:8px;
  padding:5px 0;
  font-size:11px;
}

.progress{
  height:7px;
  background:#182536;
  border-radius:10px;
  overflow:hidden;
  margin-top:5px;
}

.progress > div{
  height:100%;
  width:0%;
  background:#27d69b;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:10px;
}

th,
td{
  padding:7px 5px;
  border-bottom:1px solid #1b293a;
  text-align:center;
  white-space:nowrap;
}

th{
  color:#8ea4bc;
}

.maTable{
  overflow-x:auto;
}

.tfCards{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}

.tf{
  background:#0a111a;
  border:1px solid #233247;
  border-radius:10px;
  padding:9px;
}

.tfTitle{
  font-weight:bold;
  margin-bottom:7px;
  color:#69b5ff;
}

.event{
  padding:8px;
  margin:5px 0;
  border-radius:8px;
  background:#111b28;
  border-right:3px solid #53677e;
  font-size:11px;
}

.event.long{
  border-right-color:#1cc58e;
}

.event.short{
  border-right-color:#ff596d;
}

.reason{
  background:#101a27;
  border-radius:8px;
  padding:8px;
  margin:5px 0;
  font-size:11px;
}

.alert{
  background:#321c05;
  border:1px solid #806015;
  color:#ffd166;
  border-radius:10px;
  padding:10px;
  margin-bottom:8px;
}

.error{
  background:#38131a;
  border:1px solid #76212c;
  color:#ff8995;
  padding:10px;
  border-radius:10px;
}

.empty{
  text-align:center;
  color:#71849a;
  padding:20px;
}

.small{
  font-size:10px;
}

@media(max-width:1000px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .radarGrid{
    grid-template-columns:1fr;
  }

  .tfCards{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:600px){
  .container{
    padding:7px;
  }

  .toolbar{
    grid-template-columns:1fr 1fr;
  }

  .toolbar input{
    grid-column:1/-1;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .half{
    grid-column:1;
  }

  .tfCards{
    grid-template-columns:repeat(2,1fr);
  }

  h1{
    font-size:17px;
  }

  .bigScore{
    font-size:32px;
  }

  table{
    font-size:9px;
  }
}
</style>
</head>

<body>

<div class="container">

<header>

<h1>📊 Bybit Smart Money MA Radar V8</h1>

<div class="subtitle">
اسکنر هوشمند MA + SMC + ICT + Order Flow + Pump/Dump
</div>

<div class="toolbar">

<input
  id="symbolInput"
  placeholder="مثلاً BTCUSDT یا BTC"
/>

<button onclick="manualAnalyze()">
🔎 تحلیل ارز
</button>

<button class="green" onclick="runScan()">
🚨 اسکن
</button>

<select id="category">
<option value="linear">Futures</option>
<option value="spot">Spot</option>
</select>

<button class="gray" onclick="runRadar()">
📡 Radar
</button>

<button class="gray" onclick="health()">
❤️ وضعیت Worker
</button>

</div>

<div class="status">

<div class="badge">
وضعیت:
<span id="connection">آماده</span>
</div>

<div class="badge">
آخرین بروزرسانی:
<span id="lastUpdate">---</span>
</div>

<div class="badge">
Batch:
<span id="batchInfo">---</span>
</div>

</div>

</header>


<div id="alerts"></div>

<div id="dashboard">

<div class="empty">
برای شروع روی «اسکن» یا «تحلیل ارز» بزنید.
</div>

</div>

</div>


<script>

const API="";

let scanOffset=0;
let radarOffset=0;
let currentData=null;


/* =========================================================
   HELPERS
========================================================= */

function el(id){
  return document.getElementById(id);
}

function num(v,d=0){
  const x=Number(v);
  return Number.isFinite(x)?x:d;
}

function fmt(v,d=2){
  if(v===null || v===undefined || Number.isNaN(Number(v)))
    return "---";

  return Number(v).toLocaleString(
    "en-US",
    {
      maximumFractionDigits:d
    }
  );
}

function pct(v){
  return `${num(v).toFixed(2)}%`;
}

function money(v){
  return fmt(v,2);
}

function time(ts){
  if(!ts) return "---";

  return new Date(ts).toLocaleString(
    "fa-IR",
    {
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit"
    }
  );
}

function escapeHtml(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function setStatus(text){
  el("connection").textContent=text;
  el("lastUpdate").textContent=
    new Date().toLocaleTimeString("fa-IR");
}

function signalClass(direction){
  if(direction==="LONG") return "long";
  if(direction==="SHORT") return "short";
  return "wait";
}

function directionText(direction){
  if(direction==="LONG") return "🟢 LONG";
  if(direction==="SHORT") return "🔴 SHORT";
  return "🟡 WAIT";
}

function scoreBar(v){
  return `
    <div class="progress">
      <div style="width:${Math.min(100,num(v))}%"></div>
    </div>
  `;
}


/* =========================================================
   API
========================================================= */

async function api(path){

  const r=await fetch(
    API+path,
    {
      cache:"no-store"
    }
  );

  const d=await r.json();

  if(!r.ok || d.ok===false){
    throw new Error(
      d.error || `HTTP ${r.status}`
    );
  }

  return d;
}


/* =========================================================
   MANUAL ANALYZE
========================================================= */

async function manualAnalyze(){

  const input=
    el("symbolInput").value.trim();

  if(!input){
    alert("نماد ارز را وارد کنید.");
    return;
  }

  const category=
    el("category").value;

  setStatus("در حال تحلیل عمیق...");

  try{

    const d=
      await api(
        `/api/analyze?symbol=${encodeURIComponent(input)}&category=${category}`
      );

    currentData=d;

    renderDashboard(d);

    setStatus("تحلیل کامل شد");

  }catch(e){

    showError(e.message);

    setStatus("خطا");
  }
}


/* =========================================================
   SCAN
========================================================= */

async function runScan(){

  setStatus("در حال اسکن بازار...");

  try{

    const d=
      await api(
        `/api/scan?offset=${scanOffset}`
      );

    scanOffset=d.nextOffset || 0;

    el("batchInfo").textContent=
      `${d.batchSize || 0} / ${d.totalMarkets || 0}`;

    renderScan(d);

    setStatus("اسکن کامل شد");

  }catch(e){

    showError(e.message);

    setStatus("خطا");
  }
}


/* =========================================================
   RADAR
========================================================= */

async function runRadar(){

  setStatus("در حال اجرای Radar...");

  try{

    const d=
      await api(
        `/api/radar?offset=${radarOffset}`
      );

    radarOffset=d.nextOffset || 0;

    renderRadar(d);

    setStatus("Radar کامل شد");

  }catch(e){

    showError(e.message);

    setStatus("خطا");
  }
}


/* =========================================================
   HEALTH
========================================================= */

async function health(){

  setStatus("بررسی Worker...");

  try{

    const d=
      await api("/api/health");

    renderHealth(d);

    setStatus("Worker سالم است");

  }catch(e){

    showError(e.message);

    setStatus("Worker خطا دارد");
  }
}


/* =========================================================
   ERROR
========================================================= */

function showError(message){

  el("alerts").innerHTML=`
    <div class="error">
      ❌ ${escapeHtml(message)}
    </div>
  `;
}


/* =========================================================
   MAIN DASHBOARD
========================================================= */

function renderDashboard(d){

  const m=d.market || {};
  const movement=d.movement || {};
  const reversal=d.reversal || {};
  const styles=d.styles || {};
  const wall=d.walls || {};
  const sr=d.supportResistance || {};
  const fp=d.footprint || {};
  const converted=d.convertedMA1m || {};

  let html="";

  if(reversal.alert && reversal.alert!=="NONE"){

    html+=`
      <div class="alert">
        🚨 هشدار:
        <b>${escapeHtml(alertText(reversal.alert))}</b>
      </div>
    `;
  }

  html+=`

  <div class="grid">

    <div class="card">
      <h2>🎯 سیگنال اصلی</h2>

      <div class="signal ${signalClass(d.direction)}">
        ${directionText(d.direction)}
      </div>

      <div class="bigScore">
        ${fmt(d.score,0)}
      </div>

      <div class="muted" style="text-align:center">
        ${escapeHtml(signalLevel(d.signalLevel))}
      </div>

      <div class="metric">
        <span>Long Score</span>
        <b class="long">${fmt(d.longScore,0)}</b>
      </div>

      <div class="metric">
        <span>Short Score</span>
        <b class="short">${fmt(d.shortScore,0)}</b>
      </div>

    </div>


    <div class="card">
      <h2>💰 قیمت و حرکت</h2>

      <div class="metric">
        <span>Symbol</span>
        <b>${escapeHtml(d.symbol)}</b>
      </div>

      <div class="metric">
        <span>Price</span>
        <b>${money(d.price)}</b>
      </div>

      <div class="metric">
        <span>15m</span>
        <b>${pct(movement.change15m)}</b>
      </div>

      <div class="metric">
        <span>30m</span>
        <b>${pct(movement.change30m)}</b>
      </div>

      <div class="metric">
        <span>Volume Ratio</span>
        <b>${fmt(movement.volumeRatio,2)}x</b>
      </div>

    </div>


    <div class="card">
      <h2>📈 Pump / Dump</h2>

      <div class="metric">
        <span>🚀 Pump</span>
        <b class="long">${fmt(d.pumpScore,0)}</b>
      </div>

      ${scoreBar(d.pumpScore)}

      <div class="metric">
        <span>🔻 Dump</span>
        <b class="short">${fmt(d.dumpScore,0)}</b>
      </div>

      ${scoreBar(d.dumpScore)}

      <div class="metric">
        <span>وضعیت</span>
        <b>${escapeHtml(d.pumpDumpStatus)}</b>
      </div>

    </div>


    <div class="card">
      <h2>🔄 Reversal Radar</h2>

      <div class="metric">
        <span>بعد از Pump</span>
        <b class="short">
          ${fmt(reversal.pumpScore,0)}
        </b>
      </div>

      ${scoreBar(reversal.pumpScore)}

      <div class="metric">
        <span>بعد از Dump</span>
        <b class="long">
          ${fmt(reversal.dumpScore,0)}
        </b>
      </div>

      ${scoreBar(reversal.dumpScore)}

      <div class="small muted">
        ${escapeHtml(alertText(reversal.alert))}
      </div>

    </div>


    <div class="card half">
      <h2>🧠 SMC / ICT / MA / Volume / Order Flow</h2>

      ${styleMetric("SMC",styles.SMC)}
      ${styleMetric("ICT",styles.ICT)}
      ${styleMetric("MA",styles.MA)}
      ${styleMetric("Volume",styles.Volume)}
      ${styleMetric("Candles",styles.Candles)}
      ${styleMetric("Order Flow",styles.OrderFlow)}
      ${styleMetric("Liquidity",styles.Liquidity)}

    </div>


    <div class="card half">
      <h2>💵 OI / Funding</h2>

      <div class="metric">
        <span>Open Interest</span>
        <b>${money(m.openInterest)}</b>
      </div>

      <div class="metric">
        <span>Funding Rate</span>
        <b>${pct(num(m.fundingRate)*100)}</b>
      </div>

      <div class="metric">
        <span>24h Turnover</span>
        <b>${money(m.turnover24h)}</b>
      </div>

      <div class="metric">
        <span>24h Change</span>
        <b>${pct(m.change24h)}</b>
      </div>

      <div class="metric">
        <span>Mark Price</span>
        <b>${money(m.markPrice)}</b>
      </div>

    </div>


    <div class="card half">
      <h2>🧱 Buy Wall / Sell Wall</h2>

      ${wallMetric(
        "🟢 Buy Wall",
        wall.buy,
        "long"
      )}

      ${wallMetric(
        "🔴 Sell Wall",
        wall.sell,
        "short"
      )}

      <div class="metric">
        <span>Buy Liquidity</span>
        <b class="long">${money(wall.buyLiquidity)}</b>
      </div>

      <div class="metric">
        <span>Sell Liquidity</span>
        <b class="short">${money(wall.sellLiquidity)}</b>
      </div>

      <div class="metric">
        <span>Buy Share</span>
        <b>${pct(wall.buyShare)}</b>
      </div>

      <div class="metric">
        <span>Sell Share</span>
        <b>${pct(wall.sellShare)}</b>
      </div>

    </div>


    <div class="card half">
      <h2>📍 حمایت / مقاومت</h2>

      ${levelMetric(
        "نزدیک‌ترین حمایت",
        sr.nearestSupport,
        "long"
      )}

      ${levelMetric(
        "قوی‌ترین حمایت",
        sr.strongestSupport,
        "long"
      )}

      ${levelMetric(
        "نزدیک‌ترین مقاومت",
        sr.nearestResistance,
        "short"
      )}

      ${levelMetric(
        "قوی‌ترین مقاومت",
        sr.strongestResistance,
        "short"
      )}

    </div>


    <div class="card full">
      <h2>⏱ تحلیل تایم‌فریم‌ها</h2>

      <div class="tfCards">

        ${renderTF(
          "1 دقیقه",
          d.timeframes?.["1"]
        )}

        ${renderTF(
          "3 دقیقه",
          d.timeframes?.["3"]
        )}

        ${renderTF(
          "5 دقیقه",
          d.timeframes?.["5"]
        )}

        ${renderTF(
          "15 دقیقه",
          d.timeframes?.["15"]
        )}

        ${renderTF(
          "1 ساعت",
          d.timeframes?.["60"]
        )}

      </div>

    </div>


    <div class="card full">
      <h2>⚡ MAهای تبدیل‌شده به 1 دقیقه</h2>

      ${renderConvertedMA(converted)}

    </div>


    <div class="card half">
      <h2>🕵️ Hunt / Sweep / FVG / BOS / CHoCH / OB</h2>

      ${renderStructure(d.timeframes?.["1"])}

    </div>


    <div class="card half">
      <h2>🕯 تحلیل کندل</h2>

      ${renderCandle(
        d.timeframes?.["1"]
      )}

    </div>


    <div class="card full">
      <h2>📊 Footprint / Recent Trades</h2>

      ${renderFootprint(fp)}

    </div>


    <div class="card half">
      <h2>🟢 Buy Levels</h2>

      ${renderWalls(
        wall.buyLevels,
        "long"
      )}

    </div>


    <div class="card half">
      <h2>🔴 Sell Levels</h2>

      ${renderWalls(
        wall.sellLevels,
        "short"
      )}

    </div>


    <div class="card full">
      <h2>🧩 دلایل سیگنال</h2>

      ${
        (d.reasons || []).length
        ?
        d.reasons.map(
          x=>`
            <div class="reason">
              ${escapeHtml(x)}
            </div>
          `
        ).join("")
        :
        `<div class="empty">هنوز دلیل تأییدشده‌ای وجود ندارد.</div>`
      }

    </div>

  </div>
  `;

  el("alerts").innerHTML="";
  el("dashboard").innerHTML=html;
}


/* =========================================================
   STYLE
========================================================= */

function styleMetric(name,value){

  return `
    <div class="metric">
      <span>${escapeHtml(name)}</span>
      <b>${fmt(value,0)}</b>
    </div>
    ${scoreBar(value)}
  `;
}


/* =========================================================
   TF
========================================================= */

function renderTF(label,x){

  if(!x || x.error){

    return `
      <div class="tf">
        <div class="tfTitle">${label}</div>
        <div class="muted">
          ❌ ${escapeHtml(x?.error || "داده موجود نیست")}
        </div>
      </div>
    `;
  }

  return `
    <div class="tf">

      <div class="tfTitle">
        ${label}
      </div>

      <div class="row">
        <span>Trend</span>
        <b class="${x.trend==="BULLISH"?"long":x.trend==="BEARISH"?"short":""}">
          ${escapeHtml(x.trend)}
        </b>
      </div>

      <div class="row">
        <span>Price</span>
        <b>${money(x.price)}</b>
      </div>

      <div class="row">
        <span>MA7</span>
        <b>${money(x.ma7)}</b>
      </div>

      <div class="row">
        <span>MA20</span>
        <b>${money(x.ma20)}</b>
      </div>

      <div class="row">
        <span>MA Slope</span>
        <b>${escapeHtml(x.maSlope)}</b>
      </div>

      <div class="row">
        <span>Touch MA20</span>
        <b>${x.touchMA20?"🟢 بله":"—"}</b>
      </div>

      <div class="row">
        <span>Touch MA7</span>
        <b>${x.touchMA7?"🟢 بله":"—"}</b>
      </div>

      <div class="row">
        <span>Market</span>
        <b>${escapeHtml(x.market?.state || "---")}</b>
      </div>

      <div class="row">
        <span>ADX</span>
        <b>${fmt(x.market?.adx,1)}</b>
      </div>

    </div>
  `;
}


/* =========================================================
   CONVERTED MA
========================================================= */

function renderConvertedMA(c){

  const events=c?.events || [];

  if(!events.length){
    return `<div class="empty">داده MA تبدیل‌شده موجود نیست.</div>`;
  }

  return `
  <div class="maTable">

  <table>

  <thead>
    <tr>
      <th>منبع</th>
      <th>MA</th>
      <th>MA در 1M</th>
      <th>نوع</th>
      <th>جهت</th>
      <th>شیب</th>
      <th>فاصله</th>
      <th>Volume</th>
      <th>Confirmation</th>
      <th>زمان</th>
    </tr>
  </thead>

  <tbody>

  ${events.map(e=>`

    <tr>

      <td>${escapeHtml(e.source)}</td>

      <td>${escapeHtml(e.ma)}</td>

      <td>
        MA${fmt(e.period1m,0)}
      </td>

      <td>
        ${eventType(e.type)}
      </td>

      <td class="${e.direction==="LONG"?"long":e.direction==="SHORT"?"short":""}">
        ${escapeHtml(e.direction)}
      </td>

      <td>
        ${escapeHtml(e.slope)}
      </td>

      <td>
        ${pct(e.distancePct)}
      </td>

      <td>
        ${e.volumeConfirmed?"🟢":"—"}
      </td>

      <td class="${e.confirmation.includes("LONG")?"long":e.confirmation.includes("SHORT")?"short":""}">
        ${escapeHtml(e.confirmation)}
      </td>

      <td>
        ${time(e.time)}
      </td>

    </tr>

  `).join("")}

  </tbody>

  </table>

  </div>
  `;
}


/* =========================================================
   STRUCTURE

/* =========================================================
   CANDLE

/* =========================================================
   FOOTPRINT
========================================================= */

function renderFootprint(x){

  if(!x || x.error){
    return `
      <div class="error">
        ${escapeHtml(x?.error || "Footprint موجود نیست")}
      </div>
    `;
  }

  const delta=num(x.deltaPercent);

  return `

  <div class="grid">

    <div class="card">
      <div class="metric">
        <span>Buy Volume</span>
        <b class="long">${fmt(x.buyVolume,2)}</b>
      </div>
    </div>

    <div class="card">
      <div class="metric">
        <span>Sell Volume</span>
        <b class="short">${fmt(x.sellVolume,2)}</b>
      </div>
    </div>

    <div class="card">
      <div class="metric">
        <span>Delta</span>
        <b class="${delta>=0?"long":"short"}">
          ${fmt(x.delta,2)}
        </b>
      </div>
    </div>

    <div class="card">
      <div class="metric">
        <span>Delta %</span>
        <b class="${delta>=0?"long":"short"}">
          ${pct(delta)}
        </b>
      </div>
    </div>

  </div>

  <div class="metric">
    <span>Trades</span>
    <b>${fmt(x.trades,0)}</b>
  </div>

  <div class="metric">
    <span>Largest Trade Notional</span>
    <b>${money(x.largeTradeNotional)}</b>
  </div>

  `;
}


/* =========================================================
   WALLS
========================================================= */

function renderWalls(arr,type){

  if(!arr || !arr.length){
    return `<div class="empty">Wall قابل توجه پیدا نشد.</div>`;
  }

  return arr.slice(0,10).map(x=>`

    <div class="event ${type}">

      <div class="row">
        <span>Price</span>
        <b>${money(x.price)}</b>
      </div>

      <div class="row">
        <span>Notional</span>
        <b>${money(x.notional)}</b>
      </div>

      <div class="row">
        <span>Distance</span>
        <b>${pct(x.distancePct)}</b>
      </div>

    </div>

  `).join("");
}


/* =========================================================
   SCAN RESULTS
========================================================= */

function renderScan(d){

  let html=`

  <div class="sectionTitle">
    🔎 نتایج اسکن چرخشی
  </div>

  <div class="status">

    <div class="badge">
      بازارها: ${fmt(d.totalMarkets,0)}
    </div>

    <div class="badge">
      Batch: ${fmt(d.batchSize,0)}
    </div>

    <div class="badge">
      Offset: ${fmt(d.offset,0)}
    </div>

  </div>

  `;

  if(!d.results?.length){

    html+=`
      <div class="empty">
        در این Batch سیگنال عمیقی پیدا نشد.
      </div>
    `;

    el("dashboard").innerHTML=html;
    return;
  }

  html+=`
  <div class="radarGrid" style="margin-top:10px">
  `;

  for(const x of d.results){

    html+=scanCard(x);
  }

  html+=`</div>`;

  el("dashboard").innerHTML=html;
}


function scanCard(x){

  return `

  <div class="radar">

    <div class="symbol">
      ${escapeHtml(x.symbol)}
    </div>

    <div class="signal ${signalClass(x.direction)}">
      ${directionText(x.direction)}
    </div>

    <div class="row">
      <span>Score</span>
      <b>${fmt(x.score,0)}</b>
    </div>

    <div class="row">
      <span>Long</span>
      <b class="long">${fmt(x.longScore,0)}</b>
    </div>

    <div class="row">
      <span>Short</span>
      <b class="short">${fmt(x.shortScore,0)}</b>
    </div>

    <div class="row">
      <span>Pump</span>
      <b class="long">${fmt(x.pumpScore,0)}</b>
    </div>

    <div class="row">
      <span>Dump</span>
      <b class="short">${fmt(x.dumpScore,0)}</b>
    </div>

    <div class="row">
      <span>Reversal</span>
      <b>${Math.max(
        num(x.reversal?.pumpScore),
        num(x.reversal?.dumpScore)
      )}</b>
    </div>

    <button
      class="gray"
      style="width:100%;margin-top:8px"
      onclick="analyzeFromCard('${escapeHtml(x.symbol)}')"
    >
      🔎 تحلیل عمیق
    </button>

  </div>

  `;
}


function analyzeFromCard(symbol){

  el("symbolInput").value=symbol;

  el("category").value="linear";

  manualAnalyze();
}


/* =========================================================
   RADAR RENDER
========================================================= */

function renderRadar(d){

  let html=`

  <div class="sectionTitle">
    📡 Pump / Dump / Reversal Radar
  </div>

  <div class="status">

    <div class="badge">
      بازارها: ${fmt(d.totalMarkets,0)}
    </div>

    <div class="badge">
      Batch Offset: ${fmt(d.offset,0)}
    </div>

  </div>

  `;

  html+=`

  <div class="radarGrid" style="margin-top:10px">

    <div class="radar pump">

      <h3>🚀 Pump Radar</h3>

      ${
        d.pump?.length
        ?
        d.pump.slice(0,5)
          .map(x=>radarItem(x,"pump"))
          .join("")
        :
        `<div class="empty">مورد قوی پیدا نشد.</div>`
      }

    </div>


    <div class="radar dump">

      <h3>🔻 Dump Radar</h3>

      ${
        d.dump?.length
        ?
        d.dump.slice(0,5)
          .map(x=>radarItem(x,"dump"))
          .join("")
        :
        `<div class="empty">مورد قوی پیدا نشد.</div>`
      }

    </div>


    <div class="radar reverse">

      <h3>🔄 Reversal Radar</h3>

      ${
        d.reversal?.length
        ?
        d.reversal.slice(0,5)
          .map(x=>radarItem(x,"reverse"))
          .join("")
        :
        `<div class="empty">مورد قوی پیدا نشد.</div>`
      }

    </div>

  </div>
  `;

  el("dashboard").innerHTML=html;
}


function radarItem(x,type){

  let score=0;

  if(type==="pump"){
    score=x.pumpScore;
  }

  if(type==="dump"){
    score=x.dumpScore;
  }

  if(type==="reverse"){
    score=Math.max(
      num(x.reversal?.pumpScore),
      num(x.reversal?.dumpScore)
    );
  }

  return `

  <div class="event ${type==="pump"?"long":type==="dump"?"short":""}">

    <div class="row">
      <b>${escapeHtml(x.symbol)}</b>
      <b>${fmt(score,0)}</b>
    </div>

    <div class="row">
      <span>Price</span>
      <b>${money(x.price)}</b>
    </div>

    <div class="row">
      <span>15m</span>
      <b>${pct(x.movement?.change15m)}</b>
    </div>

    <div class="row">
      <span>Direction</span>
      <b>${directionText(x.direction)}</b>
    </div>

    <button
      class="gray"
      style="width:100%;margin-top:5px"
      onclick="analyzeFromCard('${escapeHtml(x.symbol)}')"
    >
      تحلیل
    </button>

  </div>

  `;
}

/* =========================================================
   SMALL RENDERERS
========================================================= */

function wallMetric(title,x,cls){

  if(!x){

    return `
      <div class="metric">
        <span>${title}</span>
        <b class="muted">---</b>
      </div>
    `;
  }

  return `
    <div class="metric">
      <span>${title}</span>
      <b class="${cls}">
        ${money(x.price)}
      </b>
    </div>

    <div class="small muted">
      حجم: ${money(x.notional)}
      |
      فاصله: ${pct(x.distancePct)}
    </div>
  `;
}


function levelMetric(title,x,cls){

  if(!x){

    return `
      <div class="metric">
        <span>${title}</span>
        <b>---</b>
      </div>
    `;
  }

  return `
    <div class="metric">
      <span>${title}</span>

      <b class="${cls}">
        ${money(x.price)}
      </b>
    </div>

    <div class="small muted">
      ${escapeHtml(x.type || "")}
      |
      فاصله ${pct(x.distancePct)}
    </div>
  `;
}


function huntText(x){

  if(!x || x.type==="NONE")
    return "NONE";

  if(x.side==="LONG")
    return "🟢 Liquidity Sweep LONG";

  if(x.side==="SHORT")
    return "🔴 Liquidity Sweep SHORT";

  return x.type;
}


function fvgText(x){

  if(!x || x.type==="NONE")
    return "NONE";

  if(x.type==="BULLISH")
    return `🟢 Bullish ${money(x.low)} → ${money(x.high)}`;

  if(x.type==="BEARISH")
    return `🔴 Bearish ${money(x.low)} → ${money(x.high)}`;

  return x.type;
}


function candleText(x){

  const map={
    HAMMER:"🔨 Hammer",
    SHOOTING_STAR:"☄️ Shooting Star",
    BULLISH_ENGULFING:"🟢 Bullish Engulfing",
    BEARISH_ENGULFING:"🔴 Bearish Engulfing",
    DOJI:"➖ Doji",
    NORMAL:"Normal",
    NONE:"None"
  };

  return map[x] || x || "---";
}


function eventType(x){

  const map={
    REJECTION:"↩️ Rejection",
    BREAK:"💥 Break",
    TOUCH:"🎯 Touch",
    NONE:"—"
  };

  return map[x] || x;
}


function signalLevel(x){

  const map={
    VERY_STRONG:"🔥 بسیار قوی",
    CONFIRMED:"✅ تأییدشده",
    WATCH:"👀 تحت نظر",
    NONE:"بدون سیگنال"
  };

  return map[x] || x || "---";
}


function alertText(x){

  const map={
    NONE:"بدون هشدار",
    PUMP_REVERSAL_WATCH:"⚠️ احتمال برگشت بعد از Pump",
    DUMP_REVERSAL_WATCH:"⚠️ احتمال برگشت بعد از Dump",
    PUMP_REVERSAL_CONFIRMED:"🔴 برگشت Pump تأیید شده",
    DUMP_REVERSAL_CONFIRMED:"🟢 برگشت Dump تأیید شده"
  };

  return map[x] || x || "بدون هشدار";
}


/* =========================================================
   AUTO REFRESH
========================================================= */

let autoScan=true;

setInterval(()=>{

  if(
    autoScan &&
    !document.hidden
  ){
    runScan();
  }

},60000);


/* =========================================================
   INITIAL
========================================================= */

window.addEventListener(
  "load",
  ()=>{
    setStatus("آماده");
  }
);

</script>
